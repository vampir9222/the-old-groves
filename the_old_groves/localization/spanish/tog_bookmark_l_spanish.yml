 bm_867_tog_old_groves: "Los Antiguos Bosques"
 bm_867_tog_old_groves_desc: "Los druidas llevan siglos muertos. Solo quedan piedras erguidas, nombres de dioses copiados por monjes y algunos recuerdos deformados. Pero en el 867, entre incursiones vikingas y reinos cristianos, algunos empiezan a hurgar en esas ruinas… y a soñar con despertar lo que duerme."

 bookmark_tog_dubgall: "Dubgall el Apóstata"
 bookmark_tog_dubgall_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_tog_dubgall_desc: "Antes era el hermano Máel Brigte, «siervo de Brígida», y copiaba manuscritos en Iona. Cuando volvieron los vikingos, no huyó a Kells con los demás: se quedó y acabó pasándose a su bando. Los gaélicos lo llaman ahora Dubgall, «el extranjero oscuro».\n\nHa leído las viejas sagas que los monjes copiaron a su pesar. Conoce los nombres de dioses a los que ya nadie reza. Y empieza a preguntarse si podrían volver a vivir.\n\n#weak Consejo: elige el propósito de campamento de los Eruditos.#!"

