l_spanish:
 tog_story_old_groves: "Las Antiguas Arboledas"
 tog_story_old_groves_desc: "Una piedra grabada con signos que nadie sabe leer. Libros copiados por monjes que odiaban lo que escribían. En algún lugar, bajo los relatos, duerme el culto de los antiguos."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Compañeros"
 tog_story_old_groves_destination: "Destino"
 tog_obj_stone: "Ve hasta la piedra, en #V [GetTitleByKey('b_skye').GetNameNoTier]#!, y cópiala."
 tog_obj_wrong: "Sigue a Peredur hasta el viejo, en #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Encuentra al verdadero viejo, en #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Libera al viejo, prisionero de unos bandidos en las colinas de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "a la isla de [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "a [GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "a [GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Estudiar la piedra"
 tog_quest_start_decision_desc: "Se habla de una piedra extraña en la isla de [GetTitleByKey('b_skye').GetNameNoTier], grabada con signos que nadie sabe leer."
 tog_quest_start_decision_tooltip: "Comienza la búsqueda de las Antiguas Arboledas."
 tog_quest_start_decision_confirm: "Partir hacia [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "Comienza la búsqueda de las #V Antiguas Arboledas#!. Puedes seguirla en la ventana de #V Situaciones#!."
 tog_quest_travel_decision: "Viajar [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Emprendes el camino hacia la siguiente etapa de la búsqueda."
 tog_quest_travel_decision_not_there: "Ya estás allí."
 tog_quest_travel_decision_effect_tt: "Partes hacia la siguiente etapa. Si eres aventurero, tu campamento te sigue."
 tog_poi_stone: "La piedra grabada"
 tog_poi_stone_desc: "Una piedra picta volcada entre los brezos, cubierta de signos que nadie sabe leer."
 tog_quest.0001.t: "El apóstata"
 tog_quest.0001.desc: "Antes te llamaban hermano Máel Brigte. Con los monjes de Iona aprendiste a leer, cantaste los salmos y creíste lo que te decían que creyeras. Luego vinieron los nórdicos. Las reliquias no detuvieron ningún barco. Las oraciones no salvaron a ningún hermano. Los abades se pusieron a salvo con los libros. Tú te quedaste.\n\nHoy los gaélicos de las islas te llaman Dubgall, el extranjero oscuro. Alzas el cuerno en los banquetes de los nórdicos sin creer en él. Una pregunta no te abandona: si el dios de los monjes no supo proteger a los suyos, ¿qué queda por creer?\n\nEsta mañana, al subir al páramo para otear las velas, encontraste otra cosa. Entre los brezos, una piedra volcada lleva signos que nunca habías visto: una media luna, una flecha rota, dos círculos unidos. No son letras. Son imágenes, grabadas con demasiado cuidado para ser un simple adorno."
 tog_quest.0001.a: "Debo entender lo que dicen estos signos."
 tog_quest.0001.a.tt: "Comienza la búsqueda de las #V Antiguas Arboledas#!. Puedes seguirla en la ventana de #V Situaciones#!."
 tog_quest.0001.b: "No es más que una piedra vieja."
 tog_quest.0001.b.tt: "Podrás volver a la piedra con la decisión «Estudiar la piedra»."
 tog_quest.0002.t: "Una piedra en las islas"
 tog_quest.0002.desc: "Un mercader de paso te habló de una piedra extraña en el norte, en la isla de [GetTitleByKey('b_skye').GetNameNoTier]. Está tendida entre los brezos, sobre una bahía. Lleva signos que nadie sabe leer, ni gaélicos ni nórdicos. No son letras, dijo, son imágenes: una media luna, una flecha rota, dos círculos unidos.\n\nDesde entonces, no consigues quitarte esos signos de la cabeza."
 tog_quest.0002.a: "Debo ver esa piedra."
 tog_quest.0002.a.tt: "Comienza la búsqueda de las #V Antiguas Arboledas#!. Emprendes el camino hacia #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "La piedra"
 tog_quest.0003.desc: "La piedra yace entre los brezos, sobre la bahía, medio comida por el musgo. Se distingue una media luna atravesada por una flecha rota, dos círculos unidos por una barra y un trazo en zigzag. Alguien la levantó hace muchísimo tiempo. Alguien más la derribó: todavía se ven las marcas de las palancas.\n\nRaspas el liquen con el cuchillo. Luego copias cada signo, trazo a trazo, en una tablilla de cera."
 tog_quest.0003.a: "Copiar la piedra."
 tog_quest.0020.t: "El pastor"
 tog_quest.0020.desc: "Apenas terminas tu copia cuando los brezos se agitan detrás de ti. Aparece un joven sin aliento, con una cuerda en la mano.\n\n«¿No habréis visto una cabra?»\n\nSe llama Peredur. Cuida el ganado de la aldea, cuando lo encuentra. Escucha con mucha atención y lo retiene todo, salvo lo que significa. Ve la piedra y se olvida de la cabra. Rodea los signos para verlos al revés, luego al derecho, y otra vez al revés, por si acaso.\n\n«Eso son cosas de viejos. Hay que ver al viejo. El del otro lado del agua, a la izquierda saliendo de la bahía. Pero ojo: según hacia dónde se mire, ¡cambia todo! Mi padre dice que el viejo es puro esoterismo.»\n\nSonríes: «El esoterismo es un saber reservado a unos pocos iniciados. Se oculta a quienes no están preparados para recibirlo.»\n\nPeredur asiente largamente, con aire muy pensativo.\n\n«Ya, no es falso. ¿Os llevo a ver al viejo? Es a la izquierda. Bueno, creo.»"
 tog_quest.0020.a: "Enséñamelo, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! se adelanta, hacia #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!. Por la izquierda."
 tog_quest.0021.t: "El viejo equivocado"
 tog_quest.0021.desc: "El viejo de Peredur existe de verdad. Vive en una cabaña junto al agua, en [GetTitleByKey('b_gairloch').GetNameNoTier]. Tiene ochenta años y tres dientes. No ha visto una piedra grabada en su vida. En cambio, te habla largo y tendido del arenque, de las focas y de la mujer con la que estuvo a punto de casarse hace tiempo.\n\nPeredur se rasca la cabeza.\n\n«Ah. A lo mejor era a la derecha.»\n\nEl viejo pescador, en cambio, ha entendido de quién habláis: «¿El que habla con las piedras? Vive al sur, al otro lado del agua, en [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Todo el mundo lo sabe.»"
 tog_quest.0021.a: "Esta vez, elijo yo la dirección."
 tog_quest.0021.a.tt: "Emprendes el camino hacia #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, a casa del verdadero viejo."
 tog_quest.0022.t: "La casa vacía"
 tog_quest.0022.desc: "Por fin encuentras la casa del viejo, al fondo de un valle adonde los nórdicos no van: no hay nada que llevarse. La puerta está hundida. Dentro, todo está revuelto: el arcón reventado, el jergón desgarrado, un bastón partido en dos en el umbral.\n\nAl final, una vecina sale de su casa. Hace tres días vinieron unos bandidos, hombres de las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Según ellos, el viejo escondía oro. Dicen que su familia desciende de Myrddin, el bardo loco, y un hombre así tiene que tener un tesoro. No encontraron nada. Así que se llevaron al viejo.\n\n«Se llama Lailoken», añade. «Tiene sesenta y ocho años.»"
 tog_quest.0022.a: "Iremos a buscarlo."
 tog_quest.0022.a.tt: "Emprendes el camino hacia el campamento de los bandidos, en las colinas de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "El campamento de los bandidos"
 tog_quest.0023.desc: "El campamento está escondido en un pliegue de las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Hay una docena de chozas, una hoguera, caballos robados y una veintena de hombres de aspecto peligroso. En medio, atado a un poste, un viejo flaco te ve acercarte sin decir nada.\n\nSu jefe se adelanta. Quiere oro. Siempre quiere oro."
 tog_quest.0023.a: "Atacar el campamento."
 tog_quest.0023.b: "Convencerlos de que lo suelten."
 tog_quest.0023.b.good: "Los convences de que el viejo no vale nada, y de que nadie maltrata impunemente a un descendiente de Myrddin. Lo sueltan."
 tog_quest.0023.c: "Pagar el rescate."
 tog_quest.0023.c.tt: "Los bandidos cogen el oro y sueltan al viejo."
 tog_quest.0050.t: "Un texto de los dioses"
 tog_quest.0050.a: "Ven, Lailoken."
 tog_quest.0010.t: "La tablilla de cera"
 tog_quest.0010.desc: "Una noche de vivac, dejaste la tablilla demasiado cerca del fuego. Cuando vuelves a cogerla, la cera se ha derretido. La flecha rota ya no es más que una huella blanda, y ya no sabes si se inclinaba a la izquierda o a la derecha. Peredur, en cambio, está seguro de que se inclinaba a la izquierda."
 tog_quest.0010.a: "Rehacer los trazos de memoria."
 tog_quest.0010.a.good: "Tu memoria es firme: la copia está a salvo."
 tog_quest.0010.a.bad: "Dudas de cada trazo y pasas la noche reprochándotelo."
 tog_quest.0010.b: "Confiar en adelante la tablilla a Peredur."
 tog_quest.0010.b.tt: "Peredur la guardará como un tesoro. Del revés, seguramente."
 tog_quest.0012.t: "El sueño"
 tog_quest.0012.desc: "Una noche de vivac, la media luna grabada vuelve en tu sueño. Se alza en el cielo como una luna. Bajo ella, los dos círculos arden como dos hogueras.\n\nDespiertas con la certeza de haber comprendido algo, sin saber qué."
 tog_quest.0012.a: "Anotar el sueño antes de que se borre."
 tog_quest.0012.a.good: "El sueño te abre una pista. Te sientes más cerca de los antiguos dioses."
 tog_quest.0012.a.bad: "El sueño te extravía. Despiertas más turbado que antes."
 tog_quest.0012.b: "No es más que un sueño."
 tog_quest.0023.a.good: "Tus hombres barren el campamento. Los bandidos huyen a las colinas y abandonan su botín."
 tog_quest.0023.a.bad: "El asalto sale mal. Escapas por los pelos, pero herido."
 tog_quest.0023.b.bad: "Se ríen de tus discursos y te echan del campamento."
 tog_quest.0024.t: "Por los pelos"
 tog_quest.0024.desc: "El asalto acabó en desastre. Los bandidos conocían cada roca de esas colinas, y vosotros estabais al descubierto. Escapaste por los pelos, con una herida en el costado. Peredur te llevó medio a cuestas. Juraba conocer un paso por la izquierda y, por una vez, tenía razón.\n\nEl viejo sigue allí arriba, atado a su poste. El asalto ha fracasado: quedan otros medios para sacarlo de allí."
 tog_quest.0024.a: "Pensar en lo que queda por intentar."
 tog_quest.0024.a.tt: "Eliges otro medio para liberar al viejo."
 tog_quest.0025.t: "Despachado"
 tog_quest.0050.desc: "El viejo se frota las muñecas y te mira largo rato, sin una palabra de agradecimiento.\n\n«¿Por qué? Nadie viene a buscar a un viejo loco al fondo de las colinas. ¿Qué quieres de mí?»\n\nPor toda respuesta, Peredur le tiende tu tablilla de cera. El viejo la pone al derecho. Pasa el dedo por la media luna grabada y después por los dos círculos.\n\n«Es un texto.»\n\n«¿Un texto? Son imágenes.»\n\n«Para ti. Para quienes las grabaron, era un texto. Un texto de los dioses. Los monjes expulsaron a quienes sabían leerlo, y sus hijos aprendieron a callar. Yo solo sé que no hay que arar alrededor.»\n\nTe devuelve la tablilla.\n\n«Pero los monjes lo escribían todo. Incluso lo que odiaban. Sobre todo lo que odiaban. Si quieres saber quiénes eran esos dioses, busca en sus libros: en Jarrow, en Whithorn, en Mynyw, en Dunkeld, en Applecross.»\n\nCalla un momento y luego añade, más bajo:\n\n«Me has salvado la vida. Entre los nuestros, una deuda así no se paga con palabras: te seguiré. Además, me he pasado la vida vigilando que nadie arara alrededor de las piedras. Antes de morir, me gustaría ver qué vas a hacer con esta.»"
 tog_dest_camp: "al campamento de los bandidos"
 tog_quest.0025.desc: "Los bandidos te escucharon hasta el final. Luego su jefe estalló en carcajadas y sus hombres empezaron a abuchearte. El viejo, todavía atado a su poste, no dijo palabra.\n\nCon hombres así, los discursos ya no servirán de nada. Queda la fuerza, o el oro."
 tog_quest.0025.c: "Marcharse."
 tog_quest.0025.c.tt: "Podrás volver con la decisión «Viajar al campamento de los bandidos»."
 tog_travel_desc_stone: "Una piedra grabada con signos que nadie sabe leer te espera en la isla de [GetTitleByKey('b_skye').GetNameNoTier]. Hay que verla con tus propios ojos y copiarla."
 tog_travel_desc_wrong: "Peredur jura que conoce el camino hasta el viejo: a la izquierda saliendo de la bahía, por el lado de [GetTitleByKey('b_gairloch').GetNameNoTier]. Está casi seguro."
 tog_travel_desc_house: "Según el viejo pescador, el que habla con las piedras vive al sur, al otro lado del agua, en [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Esta vez, eres tú quien elige el camino."
 tog_travel_desc_camp: "Unos bandidos se han llevado al viejo Lailoken a las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Si nadie va a buscarlo, nadie volverá a verlo."
 tog_travel_desc_camp_return: "El viejo Lailoken sigue prisionero de los bandidos, en las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Es hora de volver."
 tog_quest_travel_decision_confirm: "Partir"
 tog_quest.0050.a.tt: "#V Lailoken#! camina ahora a tu lado. Los libros de los monjes te esperan en cinco monasterios: usa la decisión «Viajar a un monasterio»."
 tog_story_old_groves_monasteries: "Monasterios por visitar"
 tog_obj_books: "Recuperar los libros de los monjes copistas y después leerlos. Los libros se leen solos, uno a uno, en el orden en que los recuperaste."
 tog_obj_step3: "Los libros han hablado: ahora hay que ir allí donde se rezaba a los antiguos dioses."
 tog_dest_monastery: "a un monasterio"
 tog_travel_desc_monastery: "Los libros de los monjes copistas te esperan en Jarrow, Whithorn, Mynyw, Dunkeld y Applecross. Elige adónde ir."
 tog_m.talk: "Convencer al monje."
 tog_m.talk_tt: "Tus posibilidades dependen de tu diplomacia. Si fracasas, el monje ya no te escuchará."
 tog_m.pay: "Pagar al monje para que saque el libro."
 tog_m.steal: "Robar el libro, de noche."
 tog_m.force: "Forzar las puertas con mis hombres."
 tog_m.leave: "Marcharse."
 tog_m.leave_tt: "Podrás volver con la decisión «Viajar a un monasterio»."
 tog_m.pay_good: "El monje saca el libro bajo su hábito."
 tog_m.pay_refused: "El monje se niega, asustado: ya no querrá tu dinero."
 tog_m.pay_kept: "El monje coge el dinero y desaparece."
 tog_m.force_good: "Las puertas ceden: te llevas el libro y algunos objetos preciosos. El señor del lugar no te lo perdonará, y los demás monasterios estarán en guardia."
 tog_m.force_bad: "Los monjes y sus criados resisten: os rechazan. Los demás monasterios estarán en guardia."
 tog_m.talk_good: "El monje te confía el libro."
 tog_m.talk_bad: "El monje se cierra: ya no te hablará."
 tog_m.book_tt: "El libro es tuyo. Lo leerás en los próximos meses."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "La casa donde el Venerable Beda escribió toda su vida se alza a orillas del Tyne, tras un muro bajo. Los nórdicos ya han pasado por aquí: un ala sigue ennegrecida por el fuego. Al borde del camino, un monje joven clasifica manzanas. Te ve acercarte con curiosidad.\n\n«¿Buscáis algo, forastero? La biblioteca está detrás del claustro. Dicen que contiene todo lo que leyó Beda, y Beda lo había leído todo.»"
 tog_quest.0121.t: "La Historia eclesiástica de Beda"
 tog_quest.0121.desc: "#italic Libro traído de Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]).#!\n\nLees a Beda. Cuenta cómo los pictos vinieron de Escitia en largos navíos y cómo elegían a sus reyes por línea femenina. Cuenta también cómo Colum Cille fue a «bautizarlos». En la vida del santo, lees que en la corte del rey de los pictos se enfrentó a magos que mandaban sobre el viento y las brumas.\n\nEn un margen, un hermano que había viajado al norte anotó: «los pictos grababan en las piedras signos que ya nadie lee»."
 tog_quest.0121.a: "Mi piedra tenía sacerdotes."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "La vieja casa blanca de san Niniano domina el puerto. Los monjes son pocos y rara vez salen de la capilla. La biblioteca da a un huerto cuyo muro se derrumba por partes.\n\nEn la taberna del puerto, un hermano lego bebe demasiado. Se queja a quien quiera oírlo de que no le pagan bastante."
 tog_quest.0122.t: "El florilegio de Sedulio"
 tog_quest.0122.desc: "#italic Libro traído de Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]).#!\n\nEs un florilegio venido de Francia. Un irlandés de la corte del emperador copió en él páginas de los autores antiguos. Un romano, Plinio, cuenta que los sacerdotes de los galos se llamaban druidas. Nada era más sagrado para ellos que el muérdago y el roble que lo sostiene. Lo cortaban el sexto día de la luna, vestidos de blanco, con una hoz de oro.\n\nOtro autor dice que juzgaban los pleitos y que aprendían de memoria, durante veinte años, una cantidad inmensa de versos. Enseñaban que las almas no mueren: tras la muerte, pasan a otros cuerpos.\n\nEn las vidas de santos, el druida no es más que un brujo ridículo. Aquí, es un sacerdote."
 tog_quest.0122.a: "Los druidas eran un clero."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "En el extremo de Gales, frente al mar, la casa de san David está rodeada de buenas murallas. Los monjes de Mynyw han visto llegar velas extranjeras demasiadas veces. Te ven acercarte desde el adarve, y sus criados no sueltan los bastones."
 tog_quest.0123.t: "La Historia de los britanos"
 tog_quest.0123.desc: "#italic Libro traído de Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]).#!\n\nEl libro cuenta la historia de los britanos. Habla de Vortigern, que había llamado a los sajones, y de la torre que se derrumbaba cada noche. Dos dragones, uno rojo y otro blanco, luchaban en sus cimientos, y un niño sin padre lo había adivinado. Habla también de un caudillo llamado Arturo, vencedor de doce batallas.\n\nHéroes, no dioses. Pero los britanos también han guardado el recuerdo de sus antiguos."
 tog_quest.0123.a: "Los britanos aún esperan a sus antiguos."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "En el corazón del antiguo país picto, Dunkeld guarda parte de las reliquias de Colum Cille. Las trajeron aquí para ponerlas a salvo de los nórdicos. Unos guardias velan día y noche sobre el relicario. Nadie vela sobre la biblioteca, una sala baja al fondo del claustro.\n\nUn perro duerme atravesado ante su puerta."
 tog_quest.0124.t: "El libro raspado"
 tog_quest.0124.desc: "#italic Libro traído de Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]).#!\n\nEs un libro feo, un florilegio de varias manos sobre una vitela mala. Rasparon varias páginas a cuchillo para escribir salmos encima. Al ponerlas a contraluz, todavía adivinas las líneas que quisieron borrar.\n\nUn monje copió en él, sin comentarlas, frases que sus maestros habían dejado pasar. Brigit era una diosa venerada por los poetas. Ana había sido la madre de los dioses de Irlanda. En Beltaine, los druidas encendían dos hogueras con grandes encantamientos y hacían pasar el ganado entre ellas, contra las enfermedades. Antaño se juraba por esos dioses, y no por Cristo.\n\nLos reyes de los tiempos antiguos no habían sido reyes."
 tog_quest.0124.a: "Se les había rezado."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Frente a las islas, la casa de san Máel Rubai es pequeña y pobre. Un monje muy viejo, casi ciego, guarda la biblioteca. Dicen que se sabe cada libro de memoria y que no deja salir a nadie con la menor hoja."
 tog_quest.0125.t: "El Dindshenchas"
 tog_quest.0125.desc: "#italic Libro traído de Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]).#!\n\nEs una colección de lugares. Cada colina, cada fuente y cada piedra de los tiempos antiguos tiene en él su historia, que explica su nombre. Está la gran casa hueca del Dagda, en el Boyne. Está la colina de Uisneach, en el centro de Irlanda, donde había muerto Lug. Está la piedra de Mabon, en el estuario del Solway…\n\nLos libros dicen que esos dioses existieron. No dicen quiénes eran."
 tog_quest.0125.a: "Iré allí donde se les rezaba."
 tog_quest.0130.t: "Un culto robado"
 tog_quest.0130.desc: "Relees los cinco libros uno junto a otro. Los nombres los conocías desde niño: Lug, el Dagda, Brigit, Balor, los Tuatha Dé Danann, la tribu de Dana. Según quién contara, eran reyes, antepasados o demonios. Ahora entiendes que son las ruinas de un culto. Un culto verdadero, con sus dioses, sus lugares y sus sacerdotes. Y os lo robaron.\n\nLos monjes construyeron sus iglesias en las colinas donde antes de ellos se rezaba. Plantaron sus cruces sobre las piedras y dieron a sus santas el nombre de las diosas. Lo que no pudieron destruir, lo bautizaron. Lo que no pudieron bautizar, lo dejaron morir. Y lo que pusieron en su lugar sirve sobre todo para hacer agachar la cabeza: obedecer al señor, pagar el diezmo, rezar en una lengua que nadie entiende.\n\nLos antiguos dioses, en cambio, eran de aquí. Os los quitaron. Tú vas a recuperarlos.\n\nLa colección de Applecross te ha dado los lugares: la casa del Dagda en el Boyne, la colina de Uisneach, la piedra de Mabon a orillas del Solway. Allí se les rezaba. Por ahí empezarás."
 tog_quest.0130.a: "Voy a recuperar lo que nos robaron."
 tog_quest.0130.a.tt: "Los libros han dado nombres de lugares. Siguiente etapa: visitar los lugares sagrados, #V Brú na Bóinne#!, #V Uisneach#! y después la #V piedra de Mabon#!. Usa la decisión «Viajar a un lugar sagrado»."
 tog_quest.0140.t: "¿A qué monasterio?"
 tog_quest.0140.desc: "Los libros de los monjes copistas te esperan en varios monasterios. ¿Cuál quieres visitar?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_jarrow').GetValue|0] km"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_whithorn').GetValue|0] km"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_mynyw').GetValue|0] km"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_dunkeld').GetValue|0] km"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_applecross').GetValue|0] km"
 tog_quest.0140.stay: "Ahora no."
 tog_quest.0161.t: "Una puerta cerrada"
 tog_quest.0161.desc: "El monje te escuchó hasta el final. Luego negó con la cabeza, sin enfado, como quien niega la limosna a un hombre que no la necesita.\n\n«Rezaré por vos.» Volvió a su labor y no te miró más. No será él quien te dé el libro."
 tog_quest.0161.a: "Habrá que encontrar otro medio."
 tog_quest.0162.t: "Un monje asustado"
 tog_quest.0162.desc: "Al ver tu bolsa, el monje palideció. Retrocedió un paso, se santiguó y se fue casi corriendo hacia la capilla.\n\nTu dinero no te abrirá esta biblioteca."
 tog_quest.0162.a: "Habrá que encontrar otro medio."
 tog_quest.0163.t: "Un monje deshonesto"
 tog_quest.0163.desc: "El monje cogió el dinero. Prometió volver después de completas, con el libro bajo el hábito. Esperaste toda la noche detrás del muro.\n\nPor la mañana te dijeron que se había ido de peregrinación. Nadie sabe cuándo volverá."
 tog_quest.0163.a: "Habrá que encontrar otro medio."
 tog_quest.0165.t: "Rechazados"
 tog_quest.0165.desc: "Los monjes tocaron la campana antes incluso de que tus hombres llegaran a la puerta. Criados, campesinos de la finca y algunos hombres de armas acudieron de todas partes, con horcas, bastones y piedras.\n\nTuvisteis que retroceder. De este día se hablará en todos los monasterios del país."
 tog_quest.0165.a: "Habrá que encontrar otro medio."
 tog_quest.0153.t: "La fuente de las cintas"
 tog_quest.0153.desc: "Al fondo de una vaguada, una fuente brota entre las raíces de un viejo fresno. Sus ramas están cubiertas de cintas, jirones de tela y mechones de pelo. A su lado han plantado una cruz nuevecita. Sin embargo, las cintas también son recientes.\n\nUna anciana moja un paño en la fuente y lo anuda a una rama, murmurando."
 tog_quest.0153.a: "Preguntarle qué hace."
 tog_quest.0153.a.good: "Te dice unas palabras que le enseñó su abuela. Reconoces en ellas el nombre de una diosa."
 tog_quest.0153.a.bad: "Se asusta y se marcha sin decir nada."
 tog_quest.0153.b: "Anudar una cinta, yo también."
 tog_quest.0154.t: "El sacerdote y la piedra"
 tog_quest.0154.desc: "En la plaza de una aldea, un sacerdote manda derribar una piedra erguida a golpes de mazo. Los aldeanos miran sin decir nada. Una mujer había dejado leche al pie de la piedra. La han atado a un poste, y el sacerdote anuncia que será azotada por idolatría."
 tog_quest.0154.a: "Intervenir, espada en mano."
 tog_quest.0154.a.good: "Los hombres del sacerdote huyen. La mujer queda libre, y toda la aldea lo ha visto."
 tog_quest.0154.a.bad: "La mujer queda libre, pero te has llevado algunos golpes."
 tog_quest.0154.b: "Intervenir con palabras."
 tog_quest.0154.b.good: "El sacerdote cede ante la aldea y desata a la mujer."
 tog_quest.0154.b.bad: "El sacerdote te humilla delante de todos."
 tog_quest.0154.c: "Quedarse escondido y seguir su camino."
 tog_quest.0155.t: "El atajo de [tog_peredur.GetFirstName]"
 tog_quest.0155.desc: "«Conozco un atajo», dijo [tog_peredur.GetFirstName] esta mañana. Ahora es mediodía, ha caído la niebla y estáis en medio de una turbera que nadie ha visto jamás.\n\n«Es por ahí. Creo. Bueno, antes era por ahí.»"
 tog_quest.0155.a: "Confiar en [tog_peredur.GetFirstName]."
 tog_quest.0155.a.good: "Contra todo pronóstico, encuentra el camino."
 tog_quest.0155.a.bad: "Dais vueltas en círculo hasta la noche."
 tog_quest.0155.b: "Buscar a alguien de la zona."
 tog_quest.0155.b.good: "Un pastor os devuelve al camino."
 tog_quest.0155.b.bad: "El pastor se burla de vosotros y no dice nada útil."
 tog_quest.0171.t: "El libro confiado"
 tog_quest.0171.desc: "El monje te miró largo rato. Luego fue a la biblioteca sin decir palabra. Volvió con un libro envuelto en un paño.\n\n«Devolvedlo cuando lo hayáis leído. Y no digáis a nadie que fui yo.»"
 tog_quest.0171.a: "Lo leeré con cuidado."
 tog_quest.0172.t: "El precio de un libro"
 tog_quest.0172.desc: "El monje contó las monedas dos veces y las hizo desaparecer en su manga. Luego te citó detrás del muro, después de completas.\n\nEsta vez vino. El libro estaba bajo su hábito."
 tog_quest.0172.a: "Todo se compra, incluso entre monjes."
 tog_quest.0173.t: "Un libro menos"
 tog_quest.0173.desc: "Nadie vigilaba, la puerta no estaba cerrada y el arcón solo a medias. Saliste antes del alba, con el libro bajo la camisa.\n\nCuando los monjes se den cuenta, estarás lejos."
 tog_quest.0173.a: "Nadie me ha visto."
 tog_quest.0174.t: "Las puertas cedieron"
 tog_quest.0174.desc: "La puerta cedió al tercer golpe. Los monjes se refugiaron en la capilla cantando salmos. Nadie se atrevió a interponerse.\n\nTus hombres se llevaron lo que brillaba. Tú te llevaste el libro. De este día se hablará mucho tiempo, y no para bien."
 tog_quest.0174.a: "El libro es mío."
 tog_quest.0158.t: "El viejo y la piedra"
 tog_quest.0158.desc: "Al despertar, la manta de Lailoken está vacía. Lo buscáis toda la mañana. Al final Peredur lo encuentra en lo alto de una colina, sentado contra una piedra erguida. Le habla en voz baja, como a un viejo conocido.\n\n«No pongas esa cara. No me contesta, no estoy loco. Pero cuando uno habla con una piedra, acaba oyendo lo que de verdad piensa.» Da unas palmaditas al granito. «Tus monjes lo escribían todo porque tenían miedo de olvidar. Los antiguos no escribían nada: confiaban en la memoria. No encontrarás a los dioses en los libros, muchacho. Los libros solo te dirán dónde buscar.»"
 tog_quest.0158.a: "«Sigue, te escucho.»"
 tog_quest.0158.b: "«¡Te hemos buscado toda la mañana!»"
 tog_quest.0159.t: "Pocos inviernos"
 tog_quest.0159.desc: "Desde hace tres días, Lailoken camina cada vez más despacio. Esta mañana se ha caído en el barro y ha tardado mucho en levantarse. Rechaza cualquier ayuda.\n\n«No te pares por mí. Me quedan pocos inviernos, y prefiero pasarlos en el camino que junto al fuego.» Tose largo rato. «Pero si pudieras andar un poco menos deprisa, no diría que no.»"
 tog_quest.0159.a: "Aflojar el paso por él."
 tog_quest.0159.a.tt: "Te tomas el tiempo necesario. Lailoken no lo olvidará."
 tog_quest.0159.b: "Seguir al mismo paso."
 tog_story_old_groves_books: "Libros leídos"
 tog_story_old_groves_books_min: "0"
 tog_story_old_groves_books_max: "5"
 tog_quest.0181.t: "La cuenta es buena"
 tog_quest.0181.desc: "En el puente, el portazguero exige tres dineros por cabeza y cuenta once para un grupo de ocho. Antes de que hayas abierto la boca, [tog_peredur.GetFirstName] se adelanta.\n\n«Ocho. Y tú tienes cuarenta y dos dineros en la bolsa, seis gallinas detrás de tu casa y te faltan cuatro dientes. Tres arriba, uno abajo.»\n\nEl portazguero cierra la boca muy deprisa."
 tog_quest.0181.a: "«Ya has oído a [tog_peredur.GetFirstName].»"
 tog_quest.0181.b: "Pagar sin discutir."
 tog_quest.0182.t: "[tog_peredur.GetFirstName] lee"
 tog_quest.0182.desc: "Por la noche, junto al fuego, [tog_peredur.GetFirstName] ha cogido uno de los libros. Lo sostiene del revés, muy serio, frunciendo el ceño.\n\n«No sé qué dice. Pero en esta página hay mil doscientas cuarenta y siete letras, y demasiadas «e». Debe de ser un libro triste.»"
 tog_quest.0182.a: "Enseñarle algunas letras."
 tog_quest.0182.b: "Echarse a reír."
 trait_tog_dagda_cauldron: "Caldero del Dagda"
 trait_tog_dagda_cauldron_desc: "En la oscuridad del túmulo, el Dagda le mostró su caldero, aquel del que nadie se marcha con hambre."
 trait_tog_dagda_club: "Maza del Dagda"
 trait_tog_dagda_club_desc: "En la oscuridad del túmulo, el Dagda le mostró su maza: un extremo mata, el otro devuelve la vida."
 trait_tog_dagda_harp: "Arpa del Dagda"
 trait_tog_dagda_harp_desc: "En la oscuridad del túmulo, el Dagda le mostró su arpa, la que pone en orden las estaciones."
 tog_story_old_groves_places: "Lugares sagrados por visitar"
 tog_obj_places: "Visitar los lugares sagrados de los que hablan los libros: Brú na Bóinne, Uisneach y la piedra de Mabon."
 tog_dest_place: "a un lugar sagrado"
 tog_travel_desc_places: "Los libros hablan de lugares donde se rezaba a los antiguos dioses: la casa del Dagda en el Boyne, la colina de Uisneach, la piedra de Mabon. Elige adónde ir."
 tog_p.leave_tt: "Podrás volver con la decisión «Viajar a un lugar sagrado»."
 tog_quest.0240.t: "¿A qué lugar sagrado?"
 tog_quest.0240.desc: "Los libros te han dado nombres de lugares. ¿Cuál quieres ver?"
 tog_quest.0240.bru: "Brú na Bóinne, la casa del Dagda ([GetTitleByKey('b_drogheda').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_bru').GetValue|0] km"
 tog_quest.0240.uisneach: "La colina de Uisneach ([GetTitleByKey('b_uisneach').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_uisneach').GetValue|0] km"
 tog_quest.0240.mabon: "La piedra de Mabon ([GetTitleByKey('b_dumfries').GetNameNoTier]), unos [ROOT.Char.MakeScope.Var('tog_km_mabon').GetValue|0] km"
 tog_quest.0240.mabon_locked: "Primero hay que haber visto Brú na Bóinne y Uisneach"
 tog_quest.0201.t: "La casa del Dagda"
 tog_quest.0201.desc: "El túmulo es más grande que nada que hayas visto construir a los hombres. Es una colina redonda, rodeada de grandes piedras cubiertas de espirales. Los nórdicos de Dublín han pasado por aquí: todavía se ven las zanjas que cavaron buscando oro.\n\nUn pastor, Eógan, cuida sus ovejas al pie de la colina. Conoce las viejas historias de su abuelo. El sacerdote le ha prohibido contarlas, y de todos modos nadie se las pide. Tú se las pides. Así que cuenta. Aquí vivía el Dagda, el dios bueno, con su caldero, su maza y su arpa. Su hijo Óengus le quitó la casa con una astucia: se la pidió para «un día y una noche», y esas palabras querían decir «para siempre».\n\n«Los que dormían dentro, antaño, salían con visiones. Nadie lo ha hecho desde los tiempos de mi abuelo.»"
 tog_quest.0201.a: "Pasar la noche en el túmulo."
 tog_quest.0202.t: "La noche en el túmulo"
 tog_quest.0202.desc: "Eógan te enseñó la entrada y luego se sentó fuera, contra una piedra. El pasadizo es estrecho, tan bajo que hay que avanzar encorvado. Al fondo, la oscuridad es total.\n\nEl frío sube del suelo. Al cabo de un rato, ya no sabes si tienes los ojos abiertos o cerrados. Oyes ruidos: agua que gotea, quizá, o alguien que respira."
 tog_quest.0202.a: "Aguantar hasta la mañana."
 tog_quest.0202.good: "Mantienes la cabeza clara y comprendes lo que estás viviendo."
 tog_quest.0202.bad: "El miedo te atenaza toda la noche."
 tog_quest.0203.t: "La visión"
 tog_quest.0203.desc: "Hacia el final de la noche, alguien está contigo en la cámara. Es un hombre inmenso, barrigón, con una túnica demasiado corta, que ríe suavemente en la oscuridad. Pone ante ti tres cosas: un caldero que nunca se vacía, una maza con un extremo que mata y otro que devuelve la vida, un arpa que pone en orden las estaciones.\n\n«Coge una. Solo una.»"
 tog_quest.0203.a: "El caldero."
 tog_quest.0203.b: "La maza."
 tog_quest.0203.c: "El arpa."
 tog_quest.0204.t: "La mañana"
 tog_quest.0204.desc: "Cuando sales, la luz te hace daño en los ojos. Eógan sigue allí, contra su piedra, con el manto sobre los hombros. No ha dormido.\n\nTe mira largo rato. «Has visto algo. Se nota.» Se levanta y recoge su bastón. «Toda mi vida he contado estas historias sin saber si me las creía. Quiero ver qué viene después. Y además, si vas a escribirlas, alguien tendrá que contártelas todas.»"
 tog_quest.0204.a: "«Ven.»"
 tog_quest.0204.a.tt: "#V Eógan#! coge su bastón y te sigue."
 tog_quest.0211.t: "La colina de Uisneach"
 tog_quest.0211.desc: "Antaño se decía que desde lo alto de esta colina se veía Irlanda entera. Sin embargo, no es alta. El viento tumba la hierba. No hay nadie, solo ovejas y, aquí y allá, cosas que los hombres dejaron: una gran piedra hendida, una tierra ennegrecida, un viejo pozo.\n\nLos libros decían que era el centro de Irlanda, y que Lug había muerto aquí. Pero no decían cómo leer lo que uno encuentra allí."
 tog_quest.0211.a: "Examinar los signos."
 tog_quest.0212.t: "La piedra hendida"
 tog_quest.0212.desc: "Es un enorme bloque de caliza, hendido en varios pedazos, como si algo lo hubiera roto desde dentro. La gente del lugar la llama la piedra de las divisiones. ¿Qué quiere decir?"
 tog_quest.0212.a: "El centro: aquí se juntan las provincias, y aquí está enterrado Lug."
 tog_quest.0212.b: "El rayo del Dios cristiano, que rompió un ídolo."
 tog_quest.0212.c: "Un mojón entre dos granjas."
 tog_quest.0213.t: "La tierra ennegrecida"
 tog_quest.0213.desc: "En una amplia superficie, la tierra es negra. Está mezclada con huesos quemados y carbón, capa tras capa, como si allí se hubieran encendido grandes hogueras durante siglos. ¿Por qué?"
 tog_quest.0213.a: "Una aldea quemada por los nórdicos."
 tog_quest.0213.b: "El fuego de un santo, como el de Patricio en Slane."
 tog_quest.0213.c: "Las hogueras de Beltaine, entre las que se hacía pasar el ganado."
 tog_quest.0214.t: "El pozo"
 tog_quest.0214.desc: "Es un viejo pozo, casi cegado, rodeado de piedras planas gastadas por las rodillas. Han arrojado en él alfileres, monedas y huesecillos. ¿Qué se buscaba en el fondo?"
 tog_quest.0214.a: "Un pozo bendecido por un santo, para curar."
 tog_quest.0214.b: "Una puerta al Otro Mundo, por donde pasan las almas."
 tog_quest.0214.c: "Una simple reserva de agua para las ovejas."
 tog_u.wrong_tt: "Una mala lectura es una falta contra el dios del lugar. Hay que empezar de nuevo desde el primer signo."
 tog_quest.0215.t: "Una pista falsa"
 tog_quest.0215.desc: "Le das vueltas a la idea, y no se sostiene. Nada en los libros apunta en ese sentido. Has mirado este lugar con ojos de monje, no con los de los antiguos. Todo lo que creías haber entendido se derrumba.\n\nEl viento sopla más fuerte, como un reproche. Hay que empezar de nuevo desde el principio."
 tog_quest.0215.a: "Empezar de nuevo desde la piedra hendida."
 tog_quest.0216.t: "Lug de las mil artes"
 tog_quest.0216.desc: "Sentado al pie de la piedra hendida, reúnes lo que has entendido.\n\nLa colección de lugares de Applecross lo decía: Uisneach es el centro de Irlanda, donde se juntan las provincias, y allí murió Lug. La gente del lugar dice que la piedra hendida marca su tumba. Lug es el rey que reúne.\n\nEl libro raspado de Dunkeld lo decía: en Beltaine, los druidas encendían dos grandes hogueras y hacían pasar el ganado entre ellas, contra las enfermedades. Aquí se encendieron durante siglos. Lug es la luz que protege.\n\nEl florilegio de Whithorn lo decía: las almas no mueren, pasan. El pozo es una puerta, y lo que se arrojaba en él era para los del otro lado. Lug va y viene entre los mundos.\n\nSon tres rostros de un mismo dios. La gente del lugar cuenta que un día pidió entrar en Tara. Se presentó como carpintero, herrero, arpista, guerrero, poeta y médico. Lo dejaron entrar, porque nadie más sabía hacerlo todo. Es el dios de todas las artes. El más grande de todos, quizá."
 tog_quest.0216.a: "Lug es el más grande."
 tog_quest.0220.t: "El último lugar"
 tog_quest.0220.desc: "Esa noche, relees la colección de Applecross a la luz del fuego. La casa del Dagda te mostró sus tesoros, la colina de Uisneach te mostró a Lug. Queda un nombre: la piedra de Mabon, a orillas del Solway, al otro lado del mar. El libro solo dice que allí se vertía leche, y que el dios del lugar era joven."
 tog_quest.0220.a: "«Rumbo al Solway.»"
 tog_quest.0220.a.tt: "La #V piedra de Mabon#! te espera. Usa la decisión «Viajar a un lugar sagrado»."
 tog_quest.0221.t: "La piedra de Mabon"
 tog_quest.0221.desc: "Por fin estás a orillas del Solway, en la aldea donde, según los libros, se alza la piedra de Mabon. En la plaza, unas cuantas casas bajas rodean un pozo. Unas mujeres lavan ropa, unos niños corren tras una oca. Todo el mundo se calla cuando pasas.\n\nDesde la plaza se ve la piedra. Se alza sola en un campo, al final de la aldea, más alta que un hombre. Cuando preguntas su nombre, los aldeanos dicen que no tiene, que es una piedra como cualquier otra, y apartan la mirada. Sin embargo, hay leche fresca en el hueco a su pie.\n\nAl fondo del campo, un hombre del señor mide la tierra con una cuerda. Una anciana te susurra, sin mirarte: «Quiere quitarnos el campo por una deuda. El campo de la piedra.»"
 tog_quest.0221.a: "Ofrecer mi ayuda."
 tog_quest.0222.t: "La deuda"
 tog_quest.0222.desc: "La deuda es antigua, hinchada por los intereses. El administrador del señor cristiano no oculta que lo que le interesa es la piedra: su amo quiere derribarla y construir una capilla en su lugar.\n\nSi se pierde el campo, también la piedra."
 tog_quest.0222.a: "Pagar la deuda."
 tog_quest.0222.b: "Negociar con el administrador."
 tog_quest.0222.c: "Falsificar el reconocimiento de deuda."
 tog_quest.0223.t: "El delator"
 tog_quest.0223.desc: "El campo está salvado. Esa misma noche, los aldeanos vienen a buscarte. Te invitan al rito de la próxima luna, al pie de la piedra, y te dicen que el guardián quiere verte.\n\nPero la víspera del rito, sorprendes a Aedán, un joven de la aldea, ensillando un caballo al caer la noche. Va a ver al sacerdote. Dice que lo que hacéis es pecado y que no quiere arder con vosotros. Los aldeanos te miran: esperan a ver qué vas a hacer."
 tog_quest.0223.a: "Convencerlo de que se quede."
 tog_quest.0223.b: "Comprar su silencio."
 tog_quest.0223.c: "Asustarlo."
 tog_quest.0223.d: "Hacerlo desaparecer."
 tog_quest.0223.d.tt: "Aedán no hablará con nadie. Los aldeanos no lo olvidarán."
 tog_quest.0222.d: "Intimidar al administrador."
 tog_quest.0224.t: "El guardián"
 tog_quest.0224.desc: "En la luna nueva, son una veintena alrededor de la piedra, con linternas veladas. Un hombre se adelanta: Gwion, el guardián. Su padre guardaba la piedra antes que él, y el padre de su padre antes que ellos. Vierte la leche y dice palabras en una lengua que ya nadie entiende. Por primera vez, oyes pronunciar el nombre del dios del lugar: Mabon, el hijo divino, el joven cazador.\n\nDespués del rito, quieres hablarle. Te da la espalda. «Salvaste el campo, y te lo agradezco. Pero no hablo de los dioses con extraños. El último extraño que vino aquí fue el sacerdote.»\n\nLa anciana te lleva aparte. El sacerdote se llevó a la hija de Gwion, Eluned, al convento del valle, para salvarla del paganismo de su padre. Desde entonces, Gwion apenas habla con nadie. Eluned es su única hija. Era a ella a quien debía enseñar las oraciones."
 tog_quest.0224.a: "Sacar a Eluned del convento."
 tog_quest.0224.a.tt: "Comienza una intriga para liberar a #V Eluned#!. Cuando la consideres lista, usa el botón «Ejecutar» de la intriga."
 tog_free_daughter: "Liberar a Eluned"
 tog_free_daughter_action: "Liberar"
 tog_free_daughter_desc: "Voy a sacar a [SCHEME.GetTargetCharacter.GetShortUIName] del convento donde el sacerdote la encerró, para devolverla a su padre."
 tog_free_daughter_desc_general: "Sacar a la hija de Gwion del convento donde el sacerdote la encerró."
 TOG_FREE_DAUGHTER_SUCCESS_DESC: "Eluned volverá con su padre, y Gwion aceptará hablar."
 tog_obj_daughter: "Sacar del convento a Eluned, la hija de Gwion."
 tog_obj_learning: "Aprender de Gwion lo que sus antepasados han guardado."
 tog_quest.0230.t: "Un intento fallido"
 tog_quest.0230.desc: "Todo estaba listo: la cuerda, el caballo, la hermana portera comprada. Pero esa noche la abadesa veló hasta tarde en la capilla, y hubo que renunciar.\n\nLas hermanas desconfían un poco más. Habrá que volver a intentarlo."
 tog_quest.0230.a: "La próxima vez."
 tog_quest.0230.a.tt: "La intriga continúa: podrás volver a intentarlo con el botón «Ejecutar»."
 tog_quest.0232.t: "Eluned"
 tog_quest.0232.desc: "Eluned saltó el muro del convento a la hora de maitines, con un manto demasiado grande. Por la mañana está en la aldea. Gwion la estrecha contra sí sin decir nada, durante un largo rato.\n\nPor la noche, viene a sentarse junto a tu fuego. «Salvaste el campo. Me devolviste a mi hija. Un extraño no hace eso por nada. ¿Qué buscas?»\n\nAsí que se lo cuentas todo: la piedra de los signos entre los brezos de [GetTitleByKey('b_skye').GetNameNoTier], los libros tomados a los monjes, la noche en la casa del Dagda, los signos de Uisneach. Los dioses cuyo nombre guardaban sus antepasados tuvieron sacerdotes, fiestas y lugares, y os los quitaron. Quieres saber quiénes eran de verdad.\n\nGwion te escucha sin interrumpirte. Luego dice, despacio: «Te vi en sueños, antes de que vinieras. Un hombre venía del oeste con libros bajo el brazo. No sabía qué quería decir.» Mira las casas de la aldea. «En tiempos de mi abuelo eran cien. Son veinte. Cuando yo muera, no quedará nadie para decir las oraciones, salvo Eluned, y el sacerdote se la volverá a llevar. Mis antepasados guardaron la piedra esperando algo. Creo que eres tú. Tú tienes los libros, yo tengo las palabras que se decían a los dioses. Llévanos contigo, a mi hija y a mí, y te enseñaré todo lo que sé.»"
 tog_quest.0232.a: "«Tus oraciones no morirán contigo.»"
 tog_quest.0232.a.tt: "#V Gwion#! y su hija #V Eluned#! parten contigo. En los próximos meses, Gwion te enseñará lo que sabe."
 tog_quest.0233.t: "El hijo de la Madre"
 tog_quest.0233.desc: "Por la noche, Gwion empieza por el dios de su piedra. Mabon es el hijo de Modron, la Madre. Se lo arrebataron a su madre cuando tenía tres noches, y nadie sabía dónde estaba. Luego los animales más viejos del mundo, el mirlo, el ciervo, el búho, el águila y el salmón, guiaron a quienes lo buscaban hasta su prisión.\n\n«Es el dios joven, el que se libera. Los propios romanos le rezaron, a lo largo de su muralla. Lo llamaban Apolo, porque querían que todos los dioses fueran suyos.»"
 tog_quest.0233.lailoken: "\n\nLailoken, que se ha acercado al fuego, pregunta cuál de los cinco animales era el más viejo. «El salmón», responde Gwion. El viejo asiente, satisfecho, como si ya lo supiera."
 tog_quest.0233.a: "El dios al que se libera."
 tog_quest.0234.t: "Las cuatro puertas"
 tog_quest.0234.desc: "«El año tiene cuatro puertas», dice Gwion. Samain, cuando muere el verano y los muertos vuelven a sentarse junto al fuego: se les deja un sitio y algo de comer. Imbolc, cuando las ovejas dan leche: es la fiesta de Brigit. Beltaine, con sus dos hogueras entre las que se hace pasar a las bestias. Lugnasad, en la cosecha: es la fiesta de Lug, con juegos y matrimonios por un año y un día.\n\n«Los monjes conservaron las fechas. Solo cambiaron los nombres.»"
 tog_quest.0234.lailoken: "\n\nLailoken ríe por lo bajo. En su valle, dice, todavía se apagan todos los fuegos la víspera de Samain, y ya nadie sabe por qué. Gwion se lo explica. El viejo se queda largo rato en silencio."
 tog_quest.0234.a: "Los monjes cambiaron los nombres."
 tog_quest.0235.t: "Los juramentos y las piedras"
 tog_quest.0235.desc: "Gwion te enseña cómo se juraba antaño: por los dioses del propio pueblo, con la mano sobre la piedra, ante testigos. Quien faltaba a su juramento ya no tenía derecho a asistir a los sacrificios. Nadie le hablaba, nadie comía con él. Era peor que la muerte.\n\nY las piedras erguidas no son tumbas, o no solo. «Se venía a ellas para hablar con los de abajo. Tu piedra de los brezos, la de los signos, hablaba. Solo hay que volver a aprender a oírla.»"
 tog_quest.0235.lailoken: "\n\nLailoken pone la mano en la rodilla de Gwion. «Eso es lo que le dije el día que me liberó: que su piedra era un texto.» Gwion lo mira con respeto, por primera vez."
 tog_quest.0235.a: "Volver a aprender a oírla."
 tog_quest.0236.t: "Las oraciones"
 tog_quest.0236.desc: "Durante semanas, Gwion te dice las oraciones, una a una, en la lengua que ya nadie entiende. Te las hace repetir hasta que te las sabes. «No son las palabras lo que cuenta. Es que se sigan diciendo.»\n\nLa última noche, te habla de algo que contaba su abuelo. Mucho antes de los monjes, los romanos vencieron a los pueblos del continente en una gran batalla, en una colina donde, dicen, los dioses de los galos perdieron. Pero una aldea, a orillas del mar, les resistió mucho más tiempo que las demás. «Nadie sabe dónde estaba la colina. La aldea, dicen, está en Armórica. Si algo queda de los antiguos, está allí.»"
 tog_quest.0236.lailoken: "\n\nLailoken aprendió las oraciones a la vez que tú. Las masculla mientras camina. Se equivoca a menudo, pero nunca se detiene."
 tog_quest.0236.a: "Habrá que ir a ver."
 trait_tog_awen: "Awen"
 trait_tog_awen_desc: "El don: la inspiración de los poetas y los profetas. Algunos de sus sueños se cumplen."
 TOG_COMPANION_HELPS: "Compañero de la búsqueda: ayuda sin contrapartida"
 tog_quest.0231.t: "Una noche sin luna"
 tog_quest.0231.desc: "Todo está listo: la cuerda, el caballo escondido en el bosque, tus compañeros en sus puestos alrededor del convento. La noche es negra. Las hermanas pronto se levantarán para maitines.\n\nQuizá sea el momento. O quizá no."
 tog_quest.0231.a: "Probar suerte."
 tog_quest.0231.b: "Usar una ventaja."
 tog_quest.0231.b.tt: "Gasta 1 ventaja: +20 % de probabilidad en este intento."
 tog_quest.0231.c: "Usar dos ventajas."
 tog_quest.0231.c.tt: "Gasta 2 ventajas: +40 % de probabilidad en este intento."
 tog_quest.0231.d: "Esperar una noche mejor."
 tog_quest.0231.d.tt: "No actúas esta noche. La intriga continúa: podrás volver con el botón «Ejecutar»."
 tog_quest.0251.t: "La hermana portera"
 tog_quest.0251.desc: "La hermana portera es vieja y pobre, y no quiere a la abadesa. Lailoken pedía limosna en la puerta. Ella le dio a entender que una puerta puede quedar mal cerrada una noche o dos, si se paga el precio. O si se sabe hablarle."
 tog_quest.0251.a: "Deslizarle unas monedas."
 tog_quest.0251.b: "Ganarse su confianza."
 tog_quest.0251.c: "Demasiado arriesgado."
 tog_quest.0252.t: "La abadesa desconfía"
 tog_quest.0252.desc: "La abadesa ha visto extraños alrededor del convento. Ha mandado poner una cerradura nueva en la puerta del dormitorio de las novicias, y ahora una hermana vela toda la noche."
 tog_quest.0252.a: "Despistar."
 tog_quest.0252.a.tt: "Gasta 1 ventaja: la desconfianza de la abadesa se disipa."
 tog_quest.0252.b: "Nos apañaremos."
 tog_quest.0253.t: "Un mensaje de Eluned"
 tog_quest.0253.desc: "En el mercado, una novicia jovencita te deslizó un trozo de pergamino en la mano, sin mirarte. Es de Eluned. Sabe que vienen a buscarla. Dice qué ventana no cierra y a qué hora se duerme la hermana que vela."
 tog_quest.0253.a: "Está lista."
 tog_quest.0254.t: "[tog_peredur.GetFirstName] cuenta"
 tog_quest.0254.desc: "Enviaste a [tog_peredur.GetFirstName] a reconocer el lugar, con discreción. Ha vuelto encantado. «Cuarenta y tres ventanas, siete puertas, doscientas doce piedras en el muro del huerto.» Hace una pausa. «Conté en voz alta. Había una hermana. Me preguntó por qué.»"
 tog_quest.0254.a: "Dejar que Lailoken lo arregle."
 tog_quest.0254.a.tt: "Lailoken va a ver a la hermana. Le explica que el muchacho es corto de entendederas y que lo cuenta todo, hasta las estrellas. Es casi verdad. Nadie sospecha."
 tog_quest.0254.b: "Demasiado tarde."
 tog_portress_bought_modifier: "Hermana portera cómplice"
 tog_abbess_wary_modifier: "Abadesa en guardia"
 tog_eluned_message_modifier: "Mensaje de Eluned"
 tog_peredur_blunder_modifier: "Peredur contó en voz alta"
 tog_monks_wary_modifier: "Monjes en guardia"
 tog_librarian_talks_modifier: "Bibliotecario charlatán"
 tog_peredur_map_modifier: "Las cuentas de Peredur"
 tog_porter_wary_modifier: "Portero en guardia"
 tog_story_old_groves_lessons: "Enseñanzas de Gwion"
 tog_story_old_groves_lessons_max: "4"
 trait_tog_awen_protected: "Awen"
 trait_tog_awen_protected_desc: "El don: la inspiración de los poetas y los profetas. Algunos de sus sueños se cumplen."
 trait_tog_novice: "Novicia"
 trait_tog_novice_desc: "Encerrada en el convento por el sacerdote, para salvarla del paganismo de su padre."
 tog_free.success_tt: "sacar a #V Eluned#! del convento (si fracasa, la intriga continúa)"
 tog_quest.0229.t: "Todo por rehacer"
 tog_quest.0229.desc: "El plan para sacar a Eluned ha fracasado. Gwion sigue esperando a su hija, y no te hablará mientras ella esté en el convento."
 tog_quest.0229.a: "Retomar la intriga."
 tog_quest.0236.a.tt: "Gwion te ha enseñado todo lo que sabe. El camino lleva ahora a Armórica."
 tog_obj_village: "Cruzar el mar hasta Armórica y encontrar la aldea que resistió a los romanos, al final de un cabo cerca de #V [GetTitleByKey('b_saint_brieuc').GetNameNoTier]#!."
 tog_obj_heric: "Encontrar dónde estaba la colina de la gran batalla, allí donde perdieron los dioses de los galos. Dicen que un monje de Auxerre, #V [GetTitleByKey('b_auxerre').GetNameNoTier]#!, ha leído todos los libros de los autores antiguos."
 tog_dest_village: "a la aldea de Armórica"
 tog_dest_heric: "a Auxerre"
 tog_travel_desc_village: "Una aldea a orillas del mar resistió a los romanos más tiempo que todas las demás. Gofraid sabe dónde: en Armórica, al final de un cabo."
 tog_travel_desc_heric: "Nadie en la Galia sabe dónde estaba la colina de la gran batalla. Nadie, salvo quizá un monje de Auxerre que ha leído todos los libros de los autores antiguos."
 tog_quest.0311.t: "La aldea del cabo"
 tog_quest.0311.desc: "Gofraid conocía el lugar: al final de un cabo de la costa norte, azotado por el viento. Atravesando la base del cabo, una enorme muralla de tierra medio derrumbada corta el páramo de un mar a otro. La gente del lugar la llama el foso de César, aunque es mucho más antigua que César. Detrás, en la meseta, de la aldea solo quedan círculos de piedras donde estaban las casas y montones de ceniza invadidos por la hierba.\n\n¿Dónde cavar?"
 tog_quest.0311.a: "Al pie de la muralla."
 tog_quest.0311.b: "En los montones de ceniza."
 tog_quest.0311.c: "En los círculos de las casas."
 tog_quest.0311.d: "Bajo el hogar de la casa más grande."
 tog_quest.0312.t: "Aquí no hay nada"
 tog_quest.0312.desc: "Caváis hasta la noche. Tiestos, huesos de jabalí, guijarros. Nada que valga la pena. A [tog_gwion.GetFirstName] le parece un culto muy raro, eso de escarbar la tierra como un cerdo."
 tog_quest.0312.a: "Cavar en otro sitio."
 tog_quest.0313.t: "La hoz de oro"
 tog_quest.0313.desc: "Bajo la piedra del hogar de la casa más grande hay una hoja de oro. Es una media luna delgada, ancha como una mano en el centro y afilada en las puntas, grabada con finos chevrones. Es tan vieja que sus bordes están gastados.\n\nLa sostienes largo rato a la luz. Piensas en la página de Plinio: «con una hoz de oro». Sabes que una hoja de oro tan fina no corta nada. Sabes también que tienes en la mano la misma media luna que la grabada en tu piedra, en las islas, encima de los dos círculos.\n\nGofraid mira la muralla y las cenizas. «Los de aquí nunca se doblegaron», dice. «Ni ante los romanos ni ante los francos. Unos irreductibles. Espero que tampoco se doblen ante los nórdicos.»"
 tog_quest.0313.a: "La media luna de mi piedra."
 tog_quest.0313.a.tt: "Te llevas la #V hoz de oro#!. El camino lleva ahora a Auxerre."
 tog_golden_sickle_name: "La hoz de oro"
 tog_golden_sickle_description: "Una delgada media luna de oro grabada con chevrones, hallada bajo el hogar de una aldea de Armórica que había resistido a los romanos. Plinio decía que los druidas cortaban el muérdago con una hoz de oro."
 tog_quest.0321.t: "El que sabe"
 tog_quest.0321.desc: "El portero acabó cediendo. Una noche, el monje sale por la puertecilla del huerto. Se llama Héric. Tiene unos treinta años, los ojos cansados de quienes leen de noche y una curiosidad que ninguna regla retiene. Sentados en un murete, habláis largo rato, en latín.\n\nHéric conoce el asedio. César lo contó: Alesia, la ciudad sobre la colina, cercada por dos líneas de murallas, y Vercingétorix arrojando sus armas a los pies del procónsul. Y Héric cree saber dónde fue: a dos días de aquí, encima de la aldea de Alise. En nueve siglos, el nombre apenas ha cambiado. Lo escribe en sus versos.\n\n«Buscas a los dioses de los galos», dice al despedirse. «No los encontrarás allí. Encontrarás el lugar donde perdieron.»"
 tog_quest.0321.a: "«Ya es mucho.»"
 tog_quest.0321.a.tt: "Partes enseguida hacia Alise, a dos días de camino."
 tog_quest.0331.t: "Donde perdieron"
 tog_quest.0331.desc: "Dos días después, estás al pie de la colina. El monte Auxois tiene la cima plana, cubierta de campos y viñas. Abajo, en la llanura, un campesino ara. Le preguntas si encuentra cosas en la tierra. Señala un montón de chatarra al borde del campo: puntas de flecha, clavos, trozos de bronce. Y en medio, una cabeza de jabalí de bronce, con las fauces abiertas, montada sobre un tubo largo y retorcido. Una trompa de guerra.\n\nEl campesino se llama Ursin. Toda su vida ha sacado esos restos de su campo maldiciéndolos, porque le mellaban la reja del arado. Te ve levantar su chatarra como un sacerdote levanta una reliquia. Pregunta si puede soplar dentro. Solo sale un estertor, pero hay en sus ojos algo que no estaba allí por la mañana.\n\nAl día siguiente, ha dejado su campo a su hermano. Camina detrás de vosotros, con la trompa al hombro."
 tog_quest.0331.a: "«Es mía, pero serás tú quien la toque.»"
 tog_carnyx_name: "Carnyx galo"
 tog_carnyx_description: "Una trompa de guerra gala, un carnyx, con cabeza de jabalí de bronce, sacada de un campo al pie de la colina donde los galos se rindieron a los romanos."
 tog_golden_sickle_modifier: "Hoz de oro"
 tog_carnyx_modifier: "Carnyx galo"
 tog_obj_guide: "Encontrar un guía que conozca bien la Galia, antes de partir en busca de la aldea y la colina de las que hablaba Gwion."
 tog_find_guide_decision: "Buscar un guía"
 tog_find_guide_decision_desc: "Nadie a tu alrededor conoce la Galia. Necesitas un hombre que conozca sus caminos, sus puertos y sus lenguas, y que sepa dónde más vale no detenerse."
 tog_find_guide_decision_tooltip: "Haces saber que buscas un guía para la Galia."
 tog_find_guide_decision_confirm: "Buscar"
 tog_find_guide_decision_effect_tt: "Pronto, en los puertos y los mercados, se sabrá que buscas un guía."
 tog_quest.0300.t: "Buscar un guía"
 tog_quest.0300.desc: "Necesitas un hombre que conozca la Galia. Los hay en los puertos y los mercados, pero hay que encontrarlo, y que acepte seguir a un desconocido en una empresa extraña. Puedes pagar para que corra la voz, o contar con tu nombre para que vengan a ti."
 tog_quest.0300.a: "Pagar para que corra la voz."
 tog_quest.0300.b: "Hacer valer mi nombre."
 tog_quest.0300.tt: "Alguien se presentará en los próximos días."
 tog_quest.0301.t: "El explorador"
 tog_quest.0301.desc: "Una noche se presenta un hombre, con un saco al hombro. Se llama Gofraid, medio nórdico, medio gaélico. Empezó de mercader y acabó de vagabundo. Ha remontado el Loira y el Sena, vendido pieles en Ruan y pasado un invierno en Tours. Ha aprendido el romance de los francos y el bretón de Armórica. Conoce los caminos de la Galia como otros conocen su campo.\n\nTe escucha contar lo que buscas mientras se escarba los dientes con un cuchillo. «¿Una aldea que resistió a los romanos más que las demás, y una colina donde perdieron los dioses?» Sonríe. «La aldea, sé dónde está. La colina, no. He visto muchas cosas por allí, pero nunca a nadie que buscara eso. Voy contigo.»"
 tog_quest.0301.a: "«Bienvenido, Gofraid.»"
 tog_quest.0301.join_tt: "#V Gofraid#! coge su saco. El camino de Armórica está abierto."
 tog_quest.0331.a.tt: "El #V carnyx galo#! es tuyo, y #V Ursin#! lo lleva. Es hora de volver y releer la piedra."
 tog_obj_read_stone: "Volver y releer la piedra, a partir de la tablilla de cera del primer día. Con todo lo que has aprendido, por fin debería hablar."
 tog_obj_mon: "Celebrar el primer rito de los antiguos en Ynys Môn, #V [GetTitleByKey('b_yns_mon').GetNameNoTier]#!, la isla donde los romanos masacraron a los últimos druidas."
 tog_dest_mon: "a Ynys Môn"
 tog_travel_desc_mon: "La piedra dice que con la hoz de oro se corta el muérdago. Plinio decía cómo: de un roble, vestido de blanco. Y solo hay un lugar adecuado: Môn, donde hicieron callar a los dioses."
 tog_read_stone_decision: "Leer la piedra"
 tog_read_stone_decision_desc: "Todavía tienes la tablilla de cera del primer día. Entonces no entendías nada. Ahora tienes los libros, los dioses de los lugares sagrados, las oraciones de Gwion y la hoz de oro."
 tog_read_stone_decision_tooltip: "Relees la piedra con todo lo que has aprendido."
 tog_read_stone_decision_confirm: "Leer"
 tog_read_stone_decision_effect_tt: "Pones la tablilla ante ti."
 tog_quest.0401.t: "La piedra leída"
 tog_quest.0411.t: "La isla de los sabios"
 tog_quest.0411.desc: "El florilegio de Whithorn hablaba de ella. Un romano contaba que Môn era la isla de los sabios, y que las legiones habían masacrado allí a los últimos druidas y talado sus bosques sagrados. Ya no quedan bosques. Donde quedaba un poco, los monjes acabaron el trabajo: en la colina de la gran arboleda hay ahora una iglesia.\n\nEl muérdago crece en muchos árboles, pero casi nunca en el roble, y Plinio lo sabía. Nunca lo habrías encontrado sin una mujer del lugar, Nest. Cuando era pequeña, su abuela le enseñó una hondonada que la gente evita sin saber por qué. Al fondo hay un viejo roble hueco y, en sus ramas altas, una bola de muérdago."
 tog_quest.0411.a: "Celebrar el rito."
 tog_quest.0412.t: "El primer rito"
 tog_quest.0412.a: "Guardar el muérdago, envuelto en lino blanco."
 tog_quest.0412.tt: "El muérdago se trenza en corona. Te llevas la #V corona de muérdago de Môn#!, y #V Nest#! parte contigo."
 tog_mistletoe_name: "La corona de muérdago de Môn"
 tog_mistletoe_description: "Una corona trenzada con el muérdago cortado de un viejo roble hueco de Ynys Môn, recogido en un manto blanco en el primer rito de los antiguos desde que los druidas callaron."
 tog_mistletoe_modifier: "Corona de muérdago de Môn"
 tog_quest.0184.t: "Los hijos de Lir"
 tog_quest.0184.desc: "Por la noche, junto al fuego, [tog_eogan.GetFirstName] empieza una historia. Es la de los cuatro hijos del rey Lir. Su madrastra celosa los convirtió en cisnes, condenados a vagar novecientos años por las aguas frías, hasta el día en que se oyera sonar una campana.\n\nLa cuenta bien. Los demás se han callado, incluso [tog_gofraid.GetFirstName]. Pero la noche avanza, y el camino de mañana es largo."
 tog_quest.0184.a: "«Sigue, te escuchamos.»"
 tog_quest.0184.b: "«El final, mañana. Partimos al alba.»"
 tog_quest.0185.t: "El sueño de [tog_gwion.GetFirstName]"
 tog_quest.0185.desc: "Al despertar, [tog_gwion.GetFirstName] está pálido. Ha soñado con el camino de esta mañana: un vado, unos sauces y hombres escondidos entre los sauces. «Algunos de mis sueños se cumplen», dice. «No todos. Pero este lo he tenido dos veces.»\n\nEl vado está a una hora de camino. Rodearlo hace perder un día."
 tog_quest.0185.a: "Rodear el vado."
 tog_quest.0185.a.tt: "Un día perdido. Nunca sabréis si había alguien entre los sauces."
 tog_quest.0185.b: "«Los sueños, sueños son.»"
 tog_quest.0185.b.good: "No hay nadie en el vado."
 tog_quest.0185.b.bad: "Había hombres entre los sauces."
 tog_quest.0186.t: "El posadero"
 tog_quest.0186.desc: "El posadero anuncia su precio por la noche, la comida y el heno de las bestias. [tog_gofraid.GetFirstName] se echa a reír. «Cuentas el heno dos veces, amigo, y tu vino es sobre todo agua.» Se vuelve hacia ti. «Déjame a mí. A esta clase de gente la conozco del Loira al Sena.»"
 tog_quest.0186.a: "«Adelante.»"
 tog_quest.0186.b: "Pagar el precio pedido."
 tog_quest.0187.t: "El carnyx de medianoche"
 tog_quest.0187.desc: "En mitad de la noche, un estertor espantoso despierta a todo el campamento. Los caballos cocean, [tog_peredur.GetFirstName] busca su espada y Lailoken jura en una lengua que nadie conoce. Es [tog_ursin.GetFirstName], apartado, con la trompa en la boca. Está practicando. Está muy orgulloso: esta vez casi se ha oído una nota."
 tog_quest.0187.a: "«¡Otra vez, [tog_ursin.GetFirstName]!»"
 tog_quest.0187.b: "«De noche no.»"
 tog_quest.0401.desc: "Pones sobre la mesa la tablilla de cera del primer día, cuando no sabías nada. Entonces solo eran trazos. Esta noche, pones la hoz de oro al lado, y miras.\n\nLa media luna de arriba es la hoz. La tienes en la mano: las mismas puntas afiladas, la misma curva. La flecha rota que la atraviesa es la rama que se corta, el muérdago que cae del roble, como en Plinio. Los dos círculos unidos son las dos hogueras de Beltaine de las que hablaba el libro raspado de Dunkeld, las que se encendieron durante siglos en la colina de Uisneach. Y el zigzag que los atraviesa es el camino de las almas. El florilegio de Whithorn las decía inmortales: pasan de un mundo a otro por el pozo de Uisneach, por la casa del Dagda.\n\nPieza a pieza, todo lo que has reunido durante años viene a posarse sobre la piedra, y todo encaja. Ya no es un dibujo. Es una oración."
 tog_quest.0401.lailoken: "\n\nLailoken se ha acercado sin ruido. Pone su viejo dedo sobre la media luna, como el día en que te dijo que era un texto. «Hace cuarenta años que miro estas piedras», dice. «Sabía que hablaban. No sabía que decían eso.»"
 tog_quest.0401.end: "\n\nCoges una tablilla nueva y escribes, con una mano que no tiembla: #italic Con la hoz de oro, se corta el muérdago del roble. Por las dos hogueras, las almas pasan y vuelven.#! Son las primeras palabras del culto. Ya no existían en ninguna parte. Ahora existen.\n\nQueda hacer lo que dice."
 tog_quest.0401.a: "«Queda hacer lo que dice.»"
 tog_quest.0401.a.tt: "La piedra ha hablado. Ahora hay que cortar el muérdago, en Ynys Môn."
 tog_quest.0413.t: "Los hombres de la colina"
 tog_quest.0413.intro: "Vuelves a la hondonada vestido de blanco, como decía Plinio, con tus compañeros a tu alrededor.\n\nEs [tog_nest.GetFirstName] quien sostiene el manto blanco bajo el árbol. Nadie lo decidió: se adelantó por sí misma. Las mujeres de su familia guardaron este roble durante generaciones. Le toca a ella recibir lo que da.\n\nEstás a media altura del roble cuando [tog_nest.GetFirstName] grita. Al borde de la hondonada, una veintena de hombres bajan entre los árboles. Hay campesinos con bastones y horcas, dos hombres armados del señor y, delante de ellos, un monje de hábito negro, con una cruz en alto. Alguien le ha avisado. «¡Talad ese árbol! ¡Arrancad al diablo de sus ramas!»\n\nNo tienes tiempo de bajar. No te hace falta. Abajo, sin una palabra, tus compañeros se han colocado entre el roble y la colina."
 tog_quest.0413.peredur: " [tog_peredur.GetFirstName] ha desenvainado la espada."
 tog_quest.0413.gofraid: " [tog_gofraid.GetFirstName] ha sacado el cuchillo."
 tog_quest.0413.eogan: " [tog_eogan.GetFirstName] ha empuñado su cayado de pastor."
 tog_quest.0413.lailoken: " Incluso el viejo Lailoken se ha levantado, apoyado en su bastón."
 tog_quest.0413.gwion: " [tog_gwion.GetFirstName] no se mueve: mira al monje directamente a los ojos."
 tog_quest.0413.together: " Nadie se vuelve hacia ti. Te dejan hacer."
 tog_quest.0413.carnyx: "\n\nEntonces [tog_ursin.GetFirstName] alza el carnyx.\n\nEl sonido rueda por la hondonada como el rugido de una bestia, ronco, enorme. Nadie aquí ha oído ese sonido desde hace mil años. La cabeza de jabalí de bronce parece aullar. Los campesinos se paran en seco. Uno de ellos suelta la horca. El monje alza la cruz más alto, pero detrás de él los hombres ya retroceden, y luego corren."
 tog_quest.0413.nocarnyx: "\n\nLos campesinos miran a esos hombres armados que no retroceden ni un paso. Dudan y se miran entre sí. Luego, uno tras otro, retroceden, y echan a correr."
 tog_quest.0413.end: "\n\nEl monje se queda solo un momento al borde de la hondonada. Luego se marcha él también."
 tog_quest.0413.a: "«Que se vayan.»"
 tog_quest.0413.b: "«¡Atrapad al monje!»"
 tog_quest.0413.tt: "Tus compañeros han tomado las armas por ti. No lo olvidarán."
 tog_quest.0412.desc: "Cuando la hondonada vuelve a quedar en silencio, alzas la hoz de oro hacia la rama. No corta, claro. Cortas el muérdago con tu cuchillo y lo dejas caer en el manto que Nest sostiene debajo.\n\nNo pasa nada. El viento agita las hojas. Canta un mirlo.\n\nPero por primera vez en generaciones, alguien ha celebrado un rito de los antiguos. No sabes si lo has hecho como debía hacerse. Pero está hecho, y en adelante sabrás escribirlo.\n\nCuando bajas del árbol, Nest no se ha movido. Sigue apretando contra sí el manto doblado, con el muérdago en el hueco del lino. Mira el roble como si lo viera por primera vez.\n\n«Mi abuela me hizo jurar que nunca cortaría leña aquí», dice al fin. «Cien veces le pregunté por qué. Me respondía que no lo sabía, que su madre también se lo había hecho jurar. Murió sin saberlo.» Te tiende el manto. «Tú lo sabes. Has encontrado lo que ellas guardaban sin saberlo. No voy a volver a casa y fingir que no lo sé. Si escribes lo que se hace bajo este roble, quiero estar allí.»"
 tog_obj_step7: "El primer rito se ha cumplido. Lo que se ha reunido no debe volver a perderse jamás: hay que escribirlo."
 tog_obj_verses: "Escribir el Libro de los Druidas: todo lo que has reunido, para que se pueda enseñar, copiar, y que nadie pueda borrarlo nunca más."
 tog_obj_founded: "El culto de los antiguos vuelve a tener fieles."
 tog_story_old_groves_verses: "Libro de los Druidas: +[Story.MakeScope.Var('tog_verses_rate').GetValue|V0] % al mes"
 tog_story_old_groves_verses_max: "100"
 tog_write_verses_decision: "Escribir el Libro de los Druidas"
 tog_write_verses_decision_desc: "Si la Iglesia ganó, fue porque tenía un libro: el mismo en todas partes, que los sacerdotes copiaban de un extremo a otro del mundo. Los antiguos dioses solo tenían la memoria de los druidas, y cuando los druidas murieron, todo murió con ellos. Tú no cometerás el mismo error."
 tog_write_verses_decision_tooltip: "Empiezas un libro que reúne todo lo que fue el culto de los antiguos."
 tog_write_verses_decision_confirm: "Empezar a escribir"
 tog_write_verses_decision_effect_tt: "La escritura comienza. Avanza cada mes según tu erudición, y tus compañeros participarán en ella."
 tog_verses.up: "La escritura avanza."
 tog_verses.up_big: "La escritura avanza mucho."
 tog_verses.up_small: "La escritura avanza un poco."
 tog_verses.same: "La escritura no avanza."
 tog_verses.down: "Hay que rehacer páginas: la escritura retrocede."
 tog_quest.0511.t: "Dos maneras de contar"
 tog_quest.0511.desc: "[tog_gwion.GetFirstName] y [tog_eogan.GetFirstName] discuten por encima de tu página, sobre la casa del Dagda y la astucia de Óengus. [tog_eogan.GetFirstName] la cuenta como su abuelo, con los detalles que hacen reír y los silencios que dan miedo. [tog_gwion.GetFirstName] dice que no es un cuento de velada. Son palabras que se decían a los dioses, y no se cambian para hacer reír.\n\nLos dos se vuelven hacia ti."
 tog_quest.0511.a: "«[tog_gwion.GetFirstName] tiene razón: son palabras sagradas.»"
 tog_quest.0511.b: "«[tog_eogan.GetFirstName] tiene razón: así es como lo recuerda el pueblo.»"
 tog_quest.0511.c: "«Escribiré las dos, una al lado de la otra.»"
 tog_quest.0512.t: "Un recuerdo de Lailoken"
 tog_quest.0512.desc: "Lailoken dormitaba junto al fuego. Se incorpora de golpe. «¡Esto lo cantaba mi madre!» Es una cancioncilla de su infancia, sobre una mujer que salía de un lago con una copa en la mano. Recupera tres versos, luego cinco. Luego duda, vuelve a empezar, los mezcla.\n\nQuizá sea un fragmento muy antiguo. Quizá una canción de mercado."
 tog_quest.0512.a: "Escribirlo tal como lo recuerda."
 tog_quest.0512.a.bad: "Al día siguiente, lo recuerda de otra manera: hay que rehacer páginas."
 tog_quest.0512.b: "«Tu memoria te engaña, viejo.»"
 tog_quest.0513.t: "Lo que hacían las mujeres"
 tog_quest.0513.desc: "[tog_nest.GetFirstName] lee por encima de tu hombro y frunce el ceño. «En tu libro solo hay hombres. Druidas, reyes, guerreros.» Te cuenta lo que hacía su abuela: la leche vertida en la fuente el primer día de mayo, la brasa guardada toda la noche de Imbolc, las palabras que se dicen a una mujer que da a luz. «Nadie las escribió nunca, porque nunca nadie se las preguntó a las mujeres.»"
 tog_quest.0513.a: "«Tendrán su capítulo.»"
 tog_quest.0513.b: "«El libro habla de los dioses, no del hogar.»"
 tog_quest.0514.t: "[tog_peredur.GetFirstName] cuenta las páginas"
 tog_quest.0514.desc: "[tog_peredur.GetFirstName] se ha pasado la velada contando las páginas. «Hay ciento ochenta y siete. Y hay once en las que has escrito Lug con dos g.» Propone numerarlas todas, para que nunca se mezclen. Parece muy orgulloso de su idea."
 tog_quest.0514.a: "«Numéralas, [tog_peredur.GetFirstName].»"
 tog_quest.0514.a.good: "Las páginas quedan numeradas, en perfecto orden. Se habla de ello hasta en la aldea."
 tog_quest.0514.b: "«Deja las páginas en paz, [tog_peredur.GetFirstName].»"
 tog_quest.0515.t: "El sueño de la página"
 tog_quest.0515.desc: "[tog_gwion.GetFirstName] viene a buscarte antes del alba. Ha soñado con una página del libro, una página que aún no has escrito: la oración que se dice al encender las hogueras de Beltaine. La ha visto palabra por palabra. Quiere que la escribas enseguida, antes de que el sueño se borre."
 tog_quest.0515.a: "Escribir lo que ha soñado."
 tog_quest.0515.a.bad: "Al releerla, [tog_gwion.GetFirstName] ya no está seguro de nada: hay que rehacerla."
 tog_quest.0515.b: "«Un sueño no es un libro.»"
 tog_quest.0516.t: "La vitela de [tog_gofraid.GetFirstName]"
 tog_quest.0516.desc: "[tog_gofraid.GetFirstName] vuelve del mercado con un fardo bajo el brazo. «Vitela de Tours. La mejor. La conseguí a mitad de precio de un mercader que no sabía lo que vendía.» La deja sobre la mesa guiñando un ojo. «Bueno, mitad de precio sigue siendo un precio.»"
 tog_quest.0516.a: "«Me la quedo a tu precio.»"
 tog_quest.0516.b: "Regatear con dureza."
 tog_quest.0519.t: "Una noche de escritura"
 tog_quest.0519.desc: "La lámpara humea, la tinta se espesa y el pasaje que escribes no sale. Podrías seguir hasta el alba. También podrías irte a dormir y volver a ello mañana."
 tog_quest.0519.a: "Escribir toda la noche."
 tog_quest.0519.b: "Releerlo todo desde el principio."
 tog_quest.0501.t: "El juramento"
 tog_quest.0501.desc: "El libro está terminado. Lo llamas el Libro de los Druidas.\n\nSabes que no es perfecto. Hay huecos que llenaste como pudiste, y cosas que tuviste que elegir a falta de saber. Pero por primera vez desde hace muchísimo tiempo, el culto de los antiguos existe en otro sitio que en los márgenes de los monjes.\n\nEl día de Beltaine, subes a la colina con quienes te siguieron, encontrados uno a uno por el camino. Les lees el Libro de principio a fin, en voz alta, bajo el cielo. [tog_gwion.GetFirstName] vierte la leche en la hoguera de Beltaine. Por primera vez en su vida, no mira a su alrededor para comprobar que nadie lo ve. Luego cada uno, por turno, jura por Lug y por el Dagda, como se juraba antes del bautismo.\n\nEsa noche, el culto de los antiguos vuelve a tener fieles.\n\nPero un puñado de fieles alrededor de una hoguera no hace un culto. Habrá que convencer a los señores, y que el pueblo oiga el Libro."
 tog_quest.0501.a: "«Por Lug y por el Dagda.»"
 tog_quest.0501.a.tt: "El culto de los antiguos renace: tú, tu corte y tus compañeros prestáis juramento, y el #V Libro de los Druidas#! se une a tu tesoro. Si tu linaje sigue el rito gaélico, toma el nombre legendario de #V Lugaid#!. Si eres aventurero, los fieles levantan en tu campamento una #V tienda de las ofrendas#!.\n\nSiguiente etapa: las decisiones #V Enviar a los compañeros a predicar#! y #V Buscar un bardo#!."
 tog_verses_book_name: "El Libro de los Druidas"
 tog_verses_book_description: "El libro que reúne todo lo que fue el culto de los antiguos: la piedra, los libros de los monjes, los dioses de los lugares sagrados, las oraciones del guardián, el primer rito. Escrito para que nadie pueda borrarlo nunca más."
 tog_verses_book_modifier: "Libro de los Druidas"
 tog_house_lugaid: "Lugaid"
 tog_quest.0603.t: "El relevo"
 tog_quest.0603.desc: "[tog_dead_companion.GetFirstName] os ha dejado. Su sitio junto al fuego queda vacío toda la velada.\n\nAl día siguiente, [tog_heir_companion.GetFirstName] viene a buscarte, con los ojos enrojecidos. «Me hablaba de lo que buscabais. Quiero seguir en su lugar.»"
 tog_quest.0603.a: "«Tu sitio está con nosotros.»"
 tog_quest.0603.a.tt: "#V [tog_heir_companion.GetFirstName]#! ocupa el sitio de [tog_dead_companion.GetFirstName] junto al fuego."
 tog_quest.0601.t: "Lo que deja"
 tog_quest.0601.desc: "Te han traído sus cosas: la tablilla de cera de la piedra, sus notas, tablillas cubiertas de una escritura apretada. Todavía eres demasiado joven para entender todo lo que buscaba. Pero sus compañeros se han quedado, y te miran como se mira a alguien a quien se espera."
 tog_quest.0601.a: "«Algún día lo entenderé.»"
 tog_quest.0601.a.tt: "La búsqueda se reanudará cuando cumplas 16 años."
 tog_quest.0602.t: "La herencia"
 tog_quest.0602.desc: "Has recogido sus notas, su tablilla de la piedra, todo lo que había reunido. Sus compañeros vinieron a verte uno a uno. No pidieron nada: solo querían saber si continuarías.\n\nAbriste sus notas por la página donde se había detenido."
 tog_quest.0602.a: "«Continúo.»"
 tog_quest.0602.a.tt: "Retomas el camino donde él lo dejó."
 tog_quest.0514.b.bad: "[tog_peredur.GetFirstName] se enfurruña en un rincón y cuenta en voz alta las vigas del techo. Imposible concentrarse."
 tog_quest.0519.b.good: "Al releer, el pasaje que faltaba te viene solo."
 tog_quest.0516.b.good: "[tog_gofraid.GetFirstName] refunfuña, pero suelta el fardo por casi nada. Todo el mundo ha oído la escena."
 tog_quest.0513.b.bad: "[tog_nest.GetFirstName] ya no te dirige la palabra. Ese capítulo no se escribirá."
 tog_quest.0516.c: "«Me lo quedo todo y pago con ello a un copista de Tours.»"
 tog_quest.0519.c: "Pagar a copistas para ir más rápido."
 tog_quest.0520.t: "Una página que no se sostiene"
 tog_quest.0520.desc: "Relees la página de ayer, y no se sostiene. Cada palabra está bien por separado, pero juntas no dicen nada. No es así como se hablaba a los dioses."
 tog_quest.0520.a: "Romperla y empezar de nuevo."
 tog_quest.0520.b: "Dejarla y volver a ella más tarde."
 tog_quest.0521.t: "Un visitante curioso"
 tog_quest.0521.desc: "Un mercader de paso, recibido a tu mesa, ha visto los pliegos sobre tu atril. Pregunta educadamente qué escribes tan importante. Tiene pinta de hombre que cuenta todo lo que ve al primer sacerdote que encuentra."
 tog_quest.0521.a: "Enseñarle una página inofensiva."
 tog_quest.0521.a.good: "Se aburre a las tres líneas y habla de otra cosa."
 tog_quest.0521.a.bad: "Ha leído el nombre de un dios por encima de tu hombro. En la aldea corren rumores sobre ti."
 tog_quest.0521.b: "Ofrecerle algo para que olvide lo que ha visto."
 tog_quest.0522.t: "Falta tinta"
 tog_quest.0522.desc: "El último tintero está vacío. En la ciudad se encuentra tinta buena, a buen precio. Si no, [tog_gwion.GetFirstName] dice que antaño se hacía con agallas de roble y hierro. Quizá sabría recordarlo."
 tog_quest.0522.a: "Comprar tinta buena en la ciudad."
 tog_quest.0522.b: "Hacerla uno mismo, con agallas de roble."
 tog_quest.0522.b.good: "La tinta es negra y aguanta bien. Hasta huele a bosque."
 tog_quest.0522.b.bad: "La tinta palidece al secarse: hay que repasar páginas enteras."
 tog_quest.0513.a.great: "[tog_nest.GetFirstName] hace venir a mujeres de la zona. Hablan toda la noche, y tú lo escribes todo."
 tog_quest.0512.a.great: "Los versos de Lailoken hacen eco de un pasaje de los libros. No era una canción de mercado."
 tog_quest.0512.b.bad: "Lailoken se enfurruña junto al fuego. La velada está perdida."
 tog_quest.0511.b.great: "[tog_eogan.GetFirstName] cuenta, tú escribes y las páginas se llenan. El relato ya se repite en la aldea."
 tog_quest.0511.a.great: "Escritas como [tog_gwion.GetFirstName] las dice, las palabras suenan como una oración."
 tog_quest.0515.a.great: "La oración de [tog_gwion.GetFirstName] fluye sola. Al leerla en voz alta, tienes la impresión de haberla sabido siempre."
 tog_find_bard_decision_desc: "Un culto se difunde más por los poetas que por los sacerdotes. Los bardos van de corte en corte, y los reyes los escuchan. Hace falta uno que cante el Libro."
 tog_find_bard_decision: "Buscar un bardo"
 tog_find_bard_decision_effect_tt: "Se presentarán tres bardos; elegirás al que se une a tu corte."
 tog_find_bard_decision_confirm: "Buscar"
 tog_send_companions_decision: "Enviar a los compañeros a predicar"
 tog_obj_faithful: "Difundir el culto: enviar a tus compañeros a ganar fieles entre los señores, y encontrar un bardo que cante el Libro.[Story.Custom('TogMissionLine_tog_eogan')][Story.Custom('TogMissionLine_tog_nest')][Story.Custom('TogMissionLine_tog_gofraid')][Story.Custom('TogMissionLine_tog_ursin')][Story.Custom('TogMissionLine_tog_gwion')][Story.Custom('TogMissionLine_tog_peredur')][Story.Custom('TogMissionLine_tog_lailoken')]"
 tog_quest.0730.t: "La primera velada"
 tog_send_companions_decision_confirm: "Enviarlos"
 tog_find_bard_decision_tooltip: "Haces saber que buscas un bardo."
 tog_quest.0730.desc: "Todos han vuelto. Esta noche, por primera vez, la gran sala está llena: tus compañeros, cubiertos del polvo de sus caminos, la gente de tu casa, y algunas caras que no conoces, que han venido porque han oído hablar de ti.\n\n[tog_bard.GetFirstName] coge su arpa. No canta una canción: canta el Libro, desde la primera palabra. La media luna y el muérdago, las dos hogueras, el Dagda en su casa del Boyne, Lug yendo y viniendo entre los mundos. Nadie habla. Hasta los criados se han detenido al fondo de la sala.\n\n"
 tog_quest.0721.tt: "El bardo se instala en tu corte. Mientras se quede, su talento te sirve."
 tog_send_companions_decision_tooltip: "Envías a tus compañeros ante los señores de sus tierras."
 tog_send_companions_decision_desc: "El Libro está escrito. Ahora hay que hacerlo oír. Tus compañeros vienen cada uno de una tierra distinta: que vuelvan allí y ganen para la fe a los señores que quieran escucharlos."
 tog_quest.0721.a: "El fili de Irlanda, [tog_bard_1.GetFirstName]: el saber de los antiguos."
 tog_quest.0712.lost: "#N [tog_mission_target.GetTitledFirstName] no se ha convertido.#!\n\nUn mensajero llega con la noticia: [tog_mission_target.GetTitledFirstName] escuchó educadamente y luego despidió a [tog_missionary.GetFirstName] con una comida y nada más. El camino de vuelta será largo."
 tog_quest.0712.won: "#P [tog_mission_target.GetTitledFirstName] se ha unido al culto de los antiguos.#!\n\nUn mensajero llega con la noticia: [tog_mission_target.GetTitledFirstName] escuchó largo rato y luego pidió que le leyeran el Libro una segunda vez. Juró por Lug y por el Dagda.\n\nEl culto de los antiguos tiene un señor más."
 tog_quest.0721.b: "El bardo galés, [tog_bard_2.GetFirstName]: la gloria en las cortes de los reyes."
 tog_quest.0721.desc: "Se han presentado tres. Un fili de Irlanda, que recita sin titubear la genealogía de veinte reyes. Un bardo galés de voz clara, que ha cantado en la corte de Gwynedd. Y un cantor de Armórica, de más edad, que habla poco pero conoce canciones que ya nadie sabe.\n\nSolo uno se quedará."
 tog_quest.0721.c: "El cantor de Armórica, [tog_bard_3.GetFirstName]: los viejos cantos que sosiegan."
 tog_quest.0712.t: "Noticias de [tog_missionary.GetFirstName]"
 tog_quest.0730.a: "«Esto no es más que el principio.»"
 tog_send_companions_decision_effect_tt: "Cada compañero parte hacia su tierra e intenta ganar a un conde para el culto de los antiguos. Cuanto más te aprecie, más posibilidades tendrá. Volverán dentro de unos meses."
 tog_quest.0730.a.tt: "La palabra del Libro se extiende. El culto de los antiguos crece."
 tog_quest.0721.t: "Los bardos"
 tog_quest.0712.other: "[tog_missionary.GetFirstName] llevó el Libro a [tog_mission_target.GetTitledFirstName].\n\n"
 tog_quest.0712.peredur: "[tog_missionary.GetFirstName] partió hacia el norte. En casa de [tog_mission_target.GetTitledFirstName], recitó el Libro de memoria, sin olvidar una línea, contando las estrofas con los dedos. Confundió la izquierda y la derecha al indicar el camino de la colina sagrada, pero nadie se dio cuenta.\n\n"
 tog_quest.0712.triumph: "#P [tog_mission_target.GetTitledFirstName] se ha unido al culto de los antiguos.#!\n\nUn mensajero llega con la noticia: [tog_mission_target.GetTitledFirstName] juró por Lug y por el Dagda delante de toda su gente. Desde entonces, sus bardos cantan tu nombre en su gran sala.\n\nEl culto de los antiguos tiene un señor más, y un aliado."
 tog_quest.0712.lailoken: "Lailoken quiso ir, pese a su edad. Llegó a casa de [tog_mission_target.GetTitledFirstName] apoyado en su bastón. Habló como hablan los viejos, largo rato, de cosas que ya nadie recuerda.\n\n"
 tog_quest.0712.nest: "[tog_missionary.GetFirstName] volvió a Gales. Al principio no habló de dioses: habló del viejo roble de Môn, de su abuela, de las mujeres que guardaban el árbol sin saber por qué. [tog_mission_target.GetTitledFirstName] la dejó hablar.\n\n"
 tog_quest.0712.gofraid: "[tog_missionary.GetFirstName] desembarcó en las islas con un fardo de mercancías y ganas de hablar. En casa de [tog_mission_target.GetTitledFirstName], vendió sus pieles, bebió más de la cuenta y habló de Lug como de un viejo amigo.\n\n"
 tog_quest.0712.chased: "#N [tog_mission_target.GetTitledFirstName] no se ha convertido.#!\n\nUn mensajero llega con la noticia: [tog_mission_target.GetTitledFirstName] hizo echar a [tog_missionary.GetFirstName] a palos, entre los gritos de su capellán. En esa corte se habla de ti, y no para bien."
 tog_quest.0712.gwion: "[tog_missionary.GetFirstName] volvió al Solway, donde los suyos rezaban en secreto desde siempre. Pidió ver a [tog_mission_target.GetTitledFirstName] y le dijo las oraciones en la vieja lengua, sin explicar nada.\n\n"
 tog_quest.0712.eogan: "[tog_missionary.GetFirstName] llegó a Irlanda con su cayado de pastor y sus historias. Se sentó a la mesa de [tog_mission_target.GetTitledFirstName] y contó, como él sabe hacerlo, la casa del Dagda y la astucia de Óengus.\n\n"
 tog_quest.0712.wounded: "#N [tog_mission_target.GetTitledFirstName] no se ha convertido.#!\n\nUn mensajero llega con la noticia: los hombres del sacerdote de [tog_mission_target.GetTitledFirstName] esperaron a [tog_missionary.GetFirstName] en un recodo del camino. Le dieron una paliza y lo dejaron en una cuneta. [tog_missionary.GetFirstName] vuelve, con las marcas de los golpes."
 tog_quest.0712.ursin: "[tog_missionary.GetFirstName] volvió a partir hacia Borgoña, con el carnyx al hombro. Ante el castillo de [tog_mission_target.GetTitledFirstName], sopló la trompa hasta que alguien salió a preguntarle qué quería.\n\n"
 trait_tog_blood_of_myrddin: "Sangre de Myrddin"
 trait_tog_blood_of_myrddin_desc: "Dice descender de Myrddin, el loco de los bosques que veía el porvenir y del que se decía que era hijo de un demonio. Nadie sabe si es verdad, pero el viejo se niega obstinadamente a morir, y ve venir lo que los demás no ven."
 tog_second_sight_modifier: "Segunda vista de Lailoken"
 tog_second_sight_modifier_desc: "Lailoken ve lo que se trama antes de que se trame: las intrigas contra ti son más difíciles de ocultar."
 tog_bard_welsh_modifier: "Bardo de los antiguos"
 tog_bard_fili_modifier_desc: "Un fili de Irlanda recita el Libro y las genealogías: piedad y saber."
 tog_bard_welsh_modifier_desc: "Un bardo galés canta el Libro de corte en corte: prestigio y favor de los vasallos."
 tog_bard_breton_modifier: "Cantor de los antiguos"
 tog_bard_breton_modifier_desc: "Un cantor de Armórica conoce cantos que ya nadie sabe: sosiegan el corazón."
 tog_bard_fili_modifier: "Fili de los antiguos"
 tog_mission_res_wounded: "resultó herido"
 tog_mission_res_pending: "en camino"
