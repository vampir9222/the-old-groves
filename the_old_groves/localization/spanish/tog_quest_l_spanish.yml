 tog_quest.0721.county_tt: "Dentro de dos meses, sus cantos habrán ganado para el culto de los antiguos el condado donde reside tu corte."
 tog_quest.0722.t: "Los cantos del bardo"
 tog_quest.0722.desc: "Desde hace dos meses, [tog_bard.GetFirstName] canta el Libro en los mercados, en las veladas, en las bodas, dondequiera que lo quieran escuchar. Los niños se saben los cantos de memoria antes que sus oraciones. Los viejos asienten: eran las historias de sus abuelos.\n\nUna mañana, el sacerdote dice misa en una iglesia casi vacía. Todo [tog_bard_county.GetName] canta el Libro."
 tog_quest.0722.a: "«Canta otra vez.»"
 tog_quest.0712.yes: "Un señor más para los antiguos dioses."
 tog_quest.0712.no: "Será en otra ocasión."
 tog_quest.0730.nolords: "Cuando calla, nadie aplaude. Se quedan sentados mucho rato, como uno se queda después de una oración. Esta vez, tus compañeros no han ganado a ningún señor. Pero en las aldeas por las que pasaron, ya se tararean pasajes del Libro sin saber de dónde vienen.\n\nLos señores vendrán más tarde. Los cantos ya están en camino."
 tog_quest.0730.lords: "Cuando calla, llaman a la puerta. Llega un mensajero, luego otro. Señores a los que nunca has conocido, ganados por tus compañeros, te envían su saludo. Preguntan cuándo podrán venir a oír el Libro a su vez.\n\nHace años, solo tenías una piedra que nadie sabía leer. Esta noche, el culto de los antiguos tiene sus señores, su bardo y sus cantos."
 tog_obj_step10: "La palabra del Libro se extiende por las aldeas. El culto de los antiguos crece."
 tog_obj_plague: "Una peste del ganado asola un ducado vecino. Ve allí a encender las hogueras de Beltaine."
 tog_obj_fires: "Encender las hogueras de Beltaine en el corazón del ducado afectado."
 tog_story_old_groves_plague: "Ducado azotado por la peste"
 tog_cattle_plague_modifier: "Peste del ganado"
 tog_cattle_plague_modifier_desc: "Las bestias mueren en los establos y en los campos. Las reliquias y las bendiciones no sirven de nada."
 nick_tog_voice_of_lug: "la Voz de Lug"
 nick_tog_voice_of_lug_desc: "Encendió las hogueras de Beltaine, y Lug habló por su boca."
 fervor_gain_tog_miracle: "Milagro de las hogueras de Beltaine"
 tog_beltaine_fires_decision: "Encender las hogueras de Beltaine"
 tog_beltaine_fires_decision_desc: "El libro raspado de Dunkeld lo decía: en Beltaine, se hacía pasar a las bestias entre dos hogueras, contra las enfermedades. Los monjes no pudieron hacer nada contra la peste. Los antiguos dioses, quizá."
 tog_beltaine_fires_decision_tooltip: "Partes hacia el ducado azotado por la peste."
 tog_beltaine_fires_decision_confirm: "En marcha"
 tog_beltaine_fires_decision_effect_tt: "Emprendes el camino hacia el ducado afectado."
 tog_quest.0900.t: "La peste del ganado"
 tog_quest.0900.desc: "Un mercader de paso cuenta lo que ha visto en el ducado de [tog_plague_duchy.GetNameNoTier]. Vacas tendidas en los campos que ya no se levantan. Se queman los establos con los animales dentro. Hay familias que se comen la simiente. Los obispos han sacado las reliquias, los monjes han bendecido los rebaños. Nada sirve.\n\nRecuerdas una página del libro raspado de Dunkeld: en Beltaine, se encendían dos hogueras y se hacía pasar a las bestias entre las llamas, «contra las enfermedades»."
 tog_quest.0900.a: "«Hay que ir.»"
 tog_quest.0900.a.tt: "Ahora puedes tomar la decisión #V Encender las hogueras de Beltaine#!."
 tog_quest.0901.t: "La multitud"
 tog_quest.0901.desc: "La noticia te ha precedido. Cuando llegas, ya están allí. Son cientos, venidos de todo [tog_plague_duchy.GetNameNoTier] con las bestias que les quedan: vacas flacas, ovejas que tosen, una cabra que un niño sujeta con una cuerda. No saben quién eres. Solo saben que las oraciones de los monjes no cambiaron nada, y que dicen que tú conoces otras oraciones.\n\nTus compañeros han preparado la leña: dos piras de roble, una a cada lado del camino. El sol se pone. Nadie habla."
 tog_quest.0901.a: "«Encended las hogueras.»"
 tog_quest.0902.t: "La Voz de Lug"
 tog_quest.0902.desc: "Toda la noche, las bestias pasan entre las llamas, una tras otra, y tú dices las palabras del Libro. Hacia el alba, el viento cae de golpe. Las dos hogueras se inclinan la una hacia la otra y se unen por encima del camino, en arco. Tres cuervos dan tres vueltas por encima y luego se van hacia el oeste.\n\nPor la mañana, las bestias se levantan. Comen.\n\nTe subes a la piedra al borde del camino. La multitud calla. Y las palabras que salen de tu boca no son tuyas: «No morí en Uisneach. Esperaba que volvieran a encender mi fuego.»\n\nLos antiguos dioses vuelven a tener sacerdotes, fieles y un milagro. Pero los cristianos aún tienen las tierras donde se les rezaba. Los bosques sagrados de la isla de Britania y de Irlanda no serán libres hasta que esas tierras sean devueltas a los antiguos dioses."
 tog_quest.0902.a: "«Lug ha vuelto.»"
 tog_quest.0902.a.tt: "La peste desaparece. El ducado de [tog_plague_duchy.GetNameNoTier] se une al culto de los antiguos, y también algunos de sus señores. A partir de ahora te llaman #V la Voz de Lug#!, y un ejército de #V fieles de Lug#! se alza por ti; vendrán más con el tiempo.\n\nTu dinastía obtiene el casus belli #V Devolver la tierra a los antiguos dioses#!: un ducado de Britania o de Irlanda en manos cristianas para un señor, un condado para un aventurero."
 tog_expel_saxons_cb: "Devolver la tierra a los antiguos dioses"
 tog_expel_saxons_cb_desc: "Recuperar un ducado de Britania o de Irlanda de manos de los cristianos."
 TOG_EXPEL_SAXONS_CB_NAME: "Devolver [TITLE.GetBaseNameNoTier] a los antiguos dioses"
 TOG_EXPEL_SAXONS_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Guerra para devolver [TITLE.GetBaseNameNoTier] a los antiguos dioses"
 TOG_EXPEL_SAXONS_WAR_NAME_BASE: "Guerra para devolver la tierra a los antiguos dioses"
 tog_expel_saxons_victory_desc: "El atacante obtiene los condados del ducado que tienen el defensor y sus vasallos."
 tog_expel_saxons_white_peace_desc: "Ningún territorio cambia de manos."
 tog_expel_saxons_defeat_desc: "El atacante paga reparaciones y pierde prestigio."
 tog_expel_saxons_adventurer_cb: "Devolver la tierra a los antiguos dioses"
 tog_expel_saxons_adventurer_cb_desc: "Recuperar un condado de Britania o de Irlanda de manos de los cristianos, e instalarse en él."
 tog_expel_saxons_adventurer_victory_desc: "El atacante toma el condado y se convierte en su señor."
 trait_tog_voice_of_lug: "La Voz de Lug"
 trait_tog_voice_of_lug_desc: "Refundó el culto de los antiguos dioses. En el milagro de las hogueras de Beltaine, Lug habló por su boca. De vez en cuando, algunos fieles toman las armas para unirse a su causa."
 tog_lug_host_name: "Fieles de Lug"
 tog_quest.0910.t: "Los fieles de Lug"
 tog_quest.0910.desc: "Llegan una mañana, doscientos o trescientos, con guadañas, hachas y lanzas talladas en fresno. Son hijos de campesinos, segundones sin tierra, algunos viejos soldados. Han oído hablar de las hogueras de Beltaine y de la palabra de Lug. Se arrodillan ante ti y juran sobre el Libro seguirte adondequiera que vayas."
 tog_quest.0910.a: "«Levantaos. Lug necesita brazos.»"
 tog_spear_of_lug_decision: "Forjar la lanza de Lug"
 tog_spear_of_lug_decision_desc: "Los Tuatha Dé tenían cuatro tesoros: la piedra de Fál, la espada de Nuada, el caldero del Dagda y la lanza de Lug, que nunca erraba el blanco. La guerra va a comenzar. Quienes luchen por los antiguos dioses necesitan una señal."
 tog_spear_of_lug_decision_tooltip: "Mandas forjar la lanza de Lug."
 tog_spear_of_lug_decision_confirm: "Que enciendan la fragua"
 tog_spear_of_lug_decision_effect_tt: "La #V lanza de Lug#! se une a tu tesoro. Solo existe una."
 tog_quest.0920.t: "La lanza de Lug"
 tog_quest.0920.desc: "El herrero trabajó nueve días y nueve noches. Con cada martillazo, invocaba a Goibniu, el herrero de los dioses. Cuando te tiende la lanza, la punta aún está tibia. Le han grabado la media luna, los dos círculos y el trisquel.\n\nLa alzas ante tus fieles. Nadie dice nada. Todos saben lo que significa: la guerra va a comenzar."
 tog_quest.0920.a: "«Hasta el mar.»"
 tog_spear_of_lug_name: "Lanza de Lug"
 tog_spear_of_lug_description: "Forjada por un fiel que invocaba a Goibniu, grabada con la media luna, los dos círculos y el trisquel. Como la de los Tuatha Dé, dicen que nunca yerra el blanco."
 tog_spear_of_lug_modifier: "Lanza de Lug"
 tog_quest.0188.t: "La despensa de [tog_peredur.GetFirstName]"
 tog_quest.0188.desc: "[tog_peredur.GetFirstName] vuelve al campamento al caer la noche, encorvado bajo dos sacos. Los deja delante de ti y empieza a desembalar, contando en voz alta: «Cuarenta y tres huevos. Dos quesos, uno grande y uno pequeño. Un jamón. Once manzanas, una picada. Un saco de cebada.»\n\nLe preguntas de dónde sale todo eso. Se lo piensa. «Tres dineros, una canción, y ayudé a una vieja a encontrar su cabra.» Una pausa. «A lo mejor no era su cabra.»"
 tog_quest.0188.a: "«No quiero saberlo.»"
 tog_quest.0189.t: "La caza"
 tog_quest.0189.desc: "Las provisiones menguan. [tog_hunter.GetFirstName] desaparece antes del alba, sin decir palabra, con un arco y una lanza. Por la noche, [tog_hunter.GetFirstName] vuelve con un corzo a hombros y dos salmones al cinto. Esta noche, el campamento come hasta saciarse."
 tog_quest.0189.a: "«Que lo asen.»"
 tog_m.talk_closed: "Los monjes de aquí ya no te escuchan"
 tog_m.pay_closed: "Ningún monje de aquí aceptará ya tu dinero"
 tog_m.steal_tt: "Comienza la intriga #V Sustraer el libro#!. Intentarás el robo cuando quieras, con el botón «Ejecutar»."
 tog_m.steal_scheming: "Ya se está preparando un robo"
 tog_steal_book: "Sustraer el libro"
 tog_steal_book_action: "Sustraer"
 tog_steal_book_desc: "Voy a coger el libro de la biblioteca que custodia [SCHEME.GetTargetCharacter.GetShortUIName]."
 tog_steal_book_desc_general: "Sustraer un libro de la biblioteca de un monasterio."
 TOG_STEAL_BOOK_SUCCESS_DESC: "El libro será tuyo, y nadie sabrá quién lo cogió."
 tog_steal.success_tt: "Si la intriga tiene éxito, el libro es tuyo. Si no, los monjes desconfían un poco más, pero podrás volver a intentarlo."
 tog_quest.0260.t: "Una noche en el claustro"
 tog_quest.0260.desc: "Ahora conoces el camino: el muro del huerto, la puerta de la cocina, la escalera que cruje en el séptimo peldaño. El hermano bibliotecario duerme junto a sus libros. Los monjes pronto se levantarán para maitines.\n\nQuizá sea esta noche."
 tog_quest.0260.d: "Esperar una noche mejor."
 tog_quest.0261.t: "El hermano bibliotecario"
 tog_quest.0261.desc: "Al hermano bibliotecario le gusta hablar, y le gusta el vino. En el mercado, ante una jarra, te lo cuenta todo. Te dice qué libros guarda y cuáles no presta a nadie. Te dice también que el arcón del fondo cierra mal desde el invierno pasado."
 tog_quest.0261.a: "«¿Otra jarra, hermano?»"
 tog_quest.0261.b: "Escuchar, sin más."
 tog_quest.0262.t: "[tog_peredur.GetFirstName] ha contado"
 tog_quest.0262.desc: "[tog_peredur.GetFirstName] vuelve del monasterio, adonde fue a vender huevos. Extiende ante ti un pergamino cubierto de rayas. «Catorce monjes. Nueve escalones hasta la biblioteca. Tres ventanas, una sin postigo. El portero duerme de la segunda a la cuarta oración. Y hay cuarenta y dos libros.»"
 tog_quest.0262.a: "«Eres un tesoro, [tog_peredur.GetFirstName].»"
 tog_quest.0263.t: "Una ronda nocturna"
 tog_quest.0263.desc: "Tenías la mano en el arcón cuando se alzó una linterna al fondo del pasillo. Escapaste por una ventana, con las manos vacías. Nadie te reconoció, pero los monjes han doblado la guardia."
 tog_quest.0263.a: "«La próxima vez.»"
 tog_quest.0263.a.tt: "La intriga continúa, con algo menos de probabilidades. Podrás volver a intentarlo con el botón «Ejecutar»."
 tog_reach_heric: "Encontrar a Héric"
 tog_reach_heric_action: "Entrar"
 tog_reach_heric_desc: "Voy a convencer al portero de Saint-Germain para que me deje hablar con [SCHEME.GetTargetCharacter.GetShortUIName]."
 tog_reach_heric_desc_general: "Convencer al portero de una abadía para que te deje hablar con un monje."
 TOG_REACH_HERIC_SUCCESS_DESC: "Héric saldrá a hablar contigo."
 tog_heric.success_tt: "Si la intriga tiene éxito, Héric acepta recibirte. Si no, el portero desconfía un poco más, pero podrás volver a intentarlo."
 tog_quest.0320.t: "La puerta de Saint-Germain"
 tog_quest.0320.desc: "Saint-Germain de Auxerre está cerrada a los extraños. El portero te escucha a través del ventanillo y repite siempre lo mismo: los hermanos no reciben a nadie. Sin embargo, el monje que buscas está tras esos muros. Se llama Héric, y dicen que conoce a César mejor que nadie.\n\nHabrá que ganarse al portero, o a alguien a quien escuche."
 tog_quest.0320.a: "«Volveré.»"
 tog_quest.0320.a.tt: "Comienza la intriga #V Encontrar a Héric#!. Probarás suerte cuando quieras, con el botón «Ejecutar»."
 tog_quest.0325.t: "En el ventanillo"
 tog_quest.0325.desc: "El portero ya te conoce. Ha aceptado tus regalos y escuchado tus historias de la isla de Britania. Esta noche duda, con la mano en el pestillo."
 tog_quest.0325.a: "Hablarle un poco más."
 tog_quest.0325.d: "Volver otro día."
 tog_quest.0326.t: "El ventanillo se cierra"
 tog_quest.0326.desc: "El portero iba a abrir. Entonces sonó un paso en el claustro, y el ventanillo se cerró de golpe. Al día siguiente, otro hermano guarda la puerta, y no sonríe."
 tog_quest.0326.a: "«Habrá otras noches.»"
 trait_tog_cloistered: "Enclaustrado"
 trait_tog_cloistered_desc: "No sale de su monasterio."
 tog_obj_after: "Los antiguos dioses vuelven a tener sacerdotes, fieles y un milagro. Queda recuperar de los cristianos las tierras donde se les rezaba, en la isla de Britania y en Irlanda, con el casus belli #V Devolver la tierra a los antiguos dioses#!. Tu dinastía también puede mandar forjar la #V lanza de Lug#!."
 tog_quest.0511.c.tt: "Las dos versiones una al lado de la otra: cuesta más escribirlo, pero nadie se ofende."
 tog_quest.0521.b.tt: "Se marcha con su moneda y no dirá nada."
 tog_verses.d_p20: "Libro de los Druidas: #P +20#!"
 tog_verses.d_p15: "Libro de los Druidas: #P +15#!"
 tog_verses.d_p10: "Libro de los Druidas: #P +10#!"
 tog_verses.d_p5: "Libro de los Druidas: #P +5#!"
 tog_verses.d_0: "Libro de los Druidas: #V +0#!"
 tog_verses.d_m5: "Libro de los Druidas: #N -5#!"
 tog_verses.d_m10: "Libro de los Druidas: #N -10#!"
 tog_offerings_tent_domicile_building: "Tienda de las ofrendas"
 tog_offerings_tent_domicile_building_desc: "Dondequiera que se detenga el campamento, los fieles de los antiguos dioses vienen a dejar sus ofrendas: unas monedas, grano, un queso, un cordero. Se marchan con una bendición.\n\nCada mes, los fieles aportan #P 100#! provisiones."
 tog_offerings_tent.tt.quest: "Ofrecida por los fieles en la fundación del culto de los antiguos"
 tog_offerings_tent_02_domicile_building: "Gran tienda de las ofrendas"
 tog_offerings_tent_02_domicile_building_desc: "Desde el milagro de las hogueras de Beltaine, los fieles de los antiguos dioses vienen de lejos a dejar sus ofrendas en el campamento. La tienda ha tenido que crecer para recibirlos.\n\nCada mes, los fieles aportan #P 150#! provisiones."
 tog_offerings_tent_02.tt.quest: "Ampliada por los fieles tras el milagro de las hogueras de Beltaine"
 tog_offerings_02_modifier: "Grandes ofrendas de los fieles"
 tog_offerings_02_modifier_desc: "Desde el milagro de las hogueras de Beltaine, los fieles de los antiguos dioses vienen de lejos a traer sus ofrendas a su señor."
 tog_mabon.tried: "Este método ya ha fracasado"
 tog_quest.0222.b.good: "El administrador acepta esperar a la próxima cosecha: el campo está salvado."
 tog_quest.0222.b.bad: "El administrador no quiere oír nada. Habrá que encontrar otra cosa."
 tog_quest.0222.d.good: "El administrador palidece y rompe él mismo el reconocimiento de deuda."
 tog_quest.0222.d.bad: "El administrador llama a sus hombres y tienes que retirarte. Habrá que encontrar otra cosa."
 tog_quest.0222.c.good: "El nuevo reconocimiento pasa por auténtico: la deuda queda saldada."
 tog_quest.0222.c.bad: "El administrador nota que la tinta está demasiado fresca. Habrá que encontrar otra cosa."
 tog_quest.0223.a.good: "Aedán desensilla su caballo. Se queda."
 tog_quest.0223.a.bad: "Aedán no te escucha. Habrá que encontrar otra cosa antes de que se vaya."
 tog_quest.0223.c.good: "Aedán tiene demasiado miedo para montar a caballo. No dirá nada."
 tog_quest.0223.c.bad: "Aedán te planta cara. Habrá que encontrar otra cosa antes de que se vaya."
 tog_offerings_modifier: "Ofrendas de los fieles"
 tog_offerings_modifier_desc: "Los fieles de los antiguos dioses traen sus ofrendas a su señor: unas monedas, grano, un cordero y mucho respeto."
 tog_druid_heritage_decision: "Recoger la herencia de las arboledas"
 tog_druid_heritage_decision_desc: "Los antiguos dioses tienen fieles, pero todavía no un ejército. Para que tu casa lleve su nombre en combate, los druidas y los bardos deben reconocerla como guardiana de las arboledas. Eso no se compra con oro."
 tog_druid_heritage_decision_tooltip: "Tu dinastía recoge la herencia de las arboledas."
 tog_druid_heritage_decision_confirm: "Que las arboledas nos reconozcan"
 tog_druid_heritage_decision_effect_tt: "Tu dinastía obtiene el casus belli #V Devolver la tierra a los antiguos dioses#!: un ducado de Britania o de Irlanda en manos cristianas para un señor, un condado para un aventurero.\n\nTambién puede mandar forjar la #V lanza de Lug#!."
 tog_relic.0001.t: "El guardián"
 tog_relic.0001.desc.mistletoe: "A orillas del estrecho, una anciana te espera delante de su casa como si supiera que vendrías. Te hace entrar y abre un arcón. Dentro, sobre un manto blanco, hay una corona de muérdago trenzada. Las hojas deberían estar secas desde hace mucho. Están verdes.\n\n«Mi madre la guardaba», dice, «y su madre antes que ella. Los romanos quemaron los robles, no todo el muérdago.»"
 tog_relic.0001.desc.sickle: "En un bosque, a media jornada de Chartres, un carbonero te hace señas para que lo sigas. Se detiene ante un viejo roble y saca de entre sus raíces un fardo de cuero. Dentro hay una delgada media luna de oro, grabada con chevrones.\n\n«Un buhonero de Armórica se la dejó a mi abuelo», dice. «Decía que era aquí donde había que devolverla, entre los carnutos, donde se reunían los druidas de toda la Galia.»"
 tog_relic.0001.desc.carnyx: "Al pie de la colina de Alise, un campesino te ve pasar con tus compañeros. Deja su pico y va a buscar algo bajo un montón de piedras, al borde de su campo: una cabeza de jabalí de bronce, con las fauces abiertas, montada sobre un tubo largo y retorcido. Una trompa de guerra.\n\n«Esto sale de la tierra desde siempre», dice. «Mi padre decía que eran las trompas de los antiguos. Tienes pinta de saber qué hacer con ella.»"
 tog_relic.0001.desc.cauldron: "En la colina de Tara, cerca de la piedra de Fál, un viejo cuida ovejas. Te lleva hasta su cabaña. En un rincón, bajo unas pieles, hay un gran caldero de bronce ennegrecido, cercado de hierro, lo bastante grande para cocer un ternero.\n\n«El caldero del Dagda», dice. «Nadie se marchaba de él sin haberse saciado. Mi familia lo guarda desde que los reyes ya no vienen aquí.»"
 tog_relic.0001.desc.branch: "En la playa, lejos del monasterio, una mujer recoge algas. Cuando ve a tus compañeros, saca de su cesta una rama de plata de la que cuelgan tres manzanitas de plata. El viento la mece, y tintinea suavemente.\n\n«La rama de Manannán», dice. «Quien la oye olvida sus penas. Si los monjes la encontraran, la fundirían para hacer un cáliz.»"
 tog_relic.0001.desc.torc: "En la roca de Peñalba, donde aún se lee el nombre de Lugus grabado en la piedra, te espera un pastor. Abre la mano. Dentro hay un torques de oro trenzado, rematado por dos cabezas de serpiente.\n\n«Los antiguos lo llevaban al cuello y se lo ofrecían al dios», dice. «Lo encontraron en una grieta de la roca. Aquí ya nadie sabe a quién pertenece.»"
 tog_relic.0001.desc.outro: "\n\nEl guardián no lo dará por nada. Es viejo, y el invierno se acerca."
 tog_relic.0001.a: "Pagar lo que pide."
 tog_relic.0001.b: "Regatear."
 tog_relic.0001.b.success: "El guardián acepta un precio más bajo"
 tog_relic.0001.b.failure: "El guardián vuelve a guardar la reliquia"
 tog_relic.0001.c: "«Guárdalo. Su sitio está aquí.»"
 tog_relic.0001.lost.tt: "La reliquia vuelve a su escondite. Quizá reaparezca en otra peregrinación."
 tog_cauldron_name: "El caldero del Dagda"
 tog_cauldron_description: "Un gran caldero de bronce ennegrecido, cercado de hierro, guardado cerca de la piedra de Fál, en Tara. Era uno de los cuatro tesoros de los Tuatha Dé: nadie se marchaba de él sin haberse saciado."
 tog_cauldron_modifier: "Caldero del Dagda"
 tog_silver_branch_name: "La rama de plata"
 tog_silver_branch_description: "Una rama de plata de la que cuelgan tres manzanas de plata, escondida en la isla de Iona. Se dice que viene del país de Manannán, bajo el mar, y que quien la oye tintinear olvida sus penas."
 tog_silver_branch_modifier: "Rama de plata"
 tog_torc_name: "El torques de Lugus"
 tog_torc_description: "Un torques de oro trenzado, rematado por dos cabezas de serpiente, hallado en una grieta de la roca de Peñalba, donde los celtíberos grababan el nombre de Lugus."
 tog_torc_modifier: "Torques de Lugus"
 tog_convert_old_faith_decision: "Volver a los antiguos dioses"
 tog_convert_old_faith_decision_desc: "Los santos no detuvieron a los sajones, ni a los nórdicos. Los bardos, en cambio, todavía cantan a los Hijos de Dôn, y las viejas piedras siguen en pie en los páramos. Es hora de devolver a esos dioses lo que tus antepasados les debían."
 tog_convert_old_faith_decision_tooltip: "Reniegas de la fe de los monjes por los antiguos dioses."
 tog_convert_old_faith_decision_confirm: "Que los monjes digan lo que quieran"
 tog_convert_old_faith_decision_effect_tt: "Como en toda conversión, tu familia cercana y el condado de tu capital pueden seguirte, y tus vasallos se enterarán."
