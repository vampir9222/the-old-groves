 tog_quest.0161.t: "Una puerta cerrada"
 tog_quest.0161.desc: "El monje te escuchó hasta el final. Luego negó con la cabeza, sin enfado, como quien niega una limosna a un hombre que no la necesita.\n\n«Rezaré por vos.» Volvió a su trabajo y no te miró más. No será él quien te dé el libro."
 tog_quest.0161.a: "Tendré que encontrar otro modo."
 tog_quest.0162.t: "Un monje asustado"
 tog_quest.0162.desc: "Al ver tu bolsa, el monje palideció. Retrocedió un paso, se santiguó y se marchó casi corriendo hacia la capilla.\n\nTu dinero no te abrirá esta biblioteca."
 tog_quest.0162.a: "Tendré que encontrar otro modo."
 tog_quest.0163.t: "Un monje deshonesto"
 tog_quest.0163.desc: "El monje tomó el dinero y prometió volver después de completas con el libro bajo el hábito. Esperaste toda la noche detrás del muro.\n\nPor la mañana te dijeron que se había ido de peregrinación. Nadie sabe cuándo volverá."
 tog_quest.0163.a: "Tendré que encontrar otro modo."
 tog_quest.0164.t: "Pillado in fraganti"
 tog_quest.0164.desc: "Habías encontrado la biblioteca, incluso el arcón correcto. Entonces se alzó una linterna en el claustro y una voz gritó: ¡al ladrón!\n\nSaltaste el muro por los pelos, con las manos vacías. A partir de ahora, los monjes cerrarán su puerta a cal y canto y vigilarán cada noche."
 tog_quest.0164.a: "Tendré que encontrar otro modo."
 tog_quest.0165.t: "Rechazados"
 tog_quest.0165.desc: "Los monjes tocaron la campana antes de que tus hombres llegaran siquiera a la puerta. Sirvientes, campesinos de la finca y algunos hombres de armas acudieron de todas partes, con horcas, palos y piedras.\n\nTuvisteis que retroceder. De este día se hablará en todos los monasterios del país."
 tog_quest.0165.a: "Tendré que encontrar otro modo."
 tog_quest.0151.t: "Velas en la costa"
 tog_quest.0151.desc: "Tras una bahía, tres naves están varadas en la playa de guijarros. Nórdicos. Te han visto antes que tú a ellos, y una docena de hombres ya sube por la playa hacia ti, hacha en mano."
 tog_quest.0151.a: "Luchar."
 tog_quest.0151.a.good: "Los nórdicos retroceden hacia sus naves; recoges lo que han abandonado."
 tog_quest.0151.a.bad: "Escapas, pero herido y con la bolsa más ligera."
 tog_quest.0151.b: "Hablarles en su lengua."
 tog_quest.0151.b.good: "Su jefe se ríe de tu acento y te deja pasar."
 tog_quest.0151.b.bad: "Te dejan pasar, a cambio de un peaje."
 tog_quest.0152.t: "Un monje errante"
 tog_quest.0152.desc: "Un monje irlandés recorre el mismo camino que tú, descalzo, bastón en mano. Es hablador, y pronto adivina que no vas a rezar.\n\n«Buscáis cosas viejas, amigo mío. ¿Sabíais que Cristo venció a todos los dioses de los gaélicos? Hablemos de ello, el camino es largo.»"
 tog_quest.0152.a: "Debatir con él."
 tog_quest.0152.a.good: "El monje acaba por callarse, pensativo. Has aprendido de sus argumentos."
 tog_quest.0152.a.bad: "Tiene respuesta para todo, y lo cuenta en el siguiente pueblo."
 tog_quest.0152.b: "Callar y dejarle hablar."
 tog_quest.0153.t: "La fuente de las cintas"
 tog_quest.0153.desc: "En el fondo de una cañada, una fuente brota entre las raíces de un viejo fresno. Las ramas están cubiertas de cintas, trozos de tela y mechones de pelo. Al lado han plantado una cruz nueva, pero las cintas también son recientes.\n\nUna anciana moja un paño en el agua y lo ata a una rama, murmurando."
 tog_quest.0153.a: "Preguntarle qué hace."
 tog_quest.0153.a.good: "Te dice palabras que le enseñó su abuela. Reconoces el nombre de una diosa."
 tog_quest.0153.a.bad: "Se asusta y se va sin decir nada."
 tog_quest.0153.b: "Atar también una cinta."
 tog_quest.0154.t: "El sacerdote y la piedra"
 tog_quest.0154.desc: "En la plaza de un pueblo, un sacerdote manda derribar a mazazos una piedra erguida. Los aldeanos miran en silencio. Una mujer que había dejado leche al pie de la piedra está atada a un poste; el sacerdote anuncia que será azotada por idolatría."
 tog_quest.0154.a: "Intervenir, espada en mano."
 tog_quest.0154.a.good: "Los hombres del sacerdote huyen. La mujer queda libre, y el pueblo lo ha visto."
 tog_quest.0154.a.bad: "La mujer queda libre, pero has recibido golpes."
 tog_quest.0154.b: "Intervenir con palabras."
 tog_quest.0154.b.good: "El sacerdote cede ante el pueblo y desata a la mujer."
 tog_quest.0154.b.bad: "El sacerdote te humilla delante de todos."
 tog_quest.0154.c: "Quedarse escondido y seguir el camino."
 tog_quest.0155.t: "El atajo de Peredur"
 tog_quest.0155.desc: "«Conozco un atajo», dijo Peredur esta mañana. Ahora es mediodía, ha caído la niebla y estáis en medio de una turbera que nadie ha visto nunca.\n\n«Es por aquí. Creo. Bueno, antes era por aquí.»"
 tog_quest.0155.a: "Confiar en Peredur."
 tog_quest.0155.a.good: "Contra todo pronóstico, encuentra el camino."
 tog_quest.0155.a.bad: "Dais vueltas en círculo hasta la noche."
 tog_quest.0155.b: "Buscar a alguien de la zona."
 tog_quest.0155.b.good: "Un pastor os devuelve al camino."
 tog_quest.0155.b.bad: "El pastor se burla de vosotros y no dice nada útil."
 tog_quest.0156.t: "Un ladrón en la noche"
 tog_quest.0156.desc: "Te despiertas en mitad de la noche. Una sombra está inclinada sobre tus cosas, y tu bolsa ya está en su mano."
 tog_quest.0156.a: "Sorprenderle en silencio."
 tog_quest.0156.a.good: "Le agarras del cuello antes de que entienda nada; huye sin nada."
 tog_quest.0156.a.bad: "Te oye llegar y desaparece con tu bolsa."
 tog_quest.0156.b: "Saltar sobre él."
 tog_quest.0156.b.good: "Lo suelta todo y huye."
 tog_quest.0156.b.bad: "Tiene un cuchillo. Estás herido, y se ha ido con tu bolsa."
 tog_quest.0157.t: "El peregrino enfermo"
 tog_quest.0157.desc: "Junto al camino, un peregrino yace bajo su manto, ardiendo de fiebre. Va a Iona, dice, pero no llegará más lejos sin ayuda."
 tog_quest.0157.a: "Ayudarle."
 tog_quest.0157.a.tt: "Le cuidas y le llevas hasta el siguiente pueblo. Por el camino, te habla de los santos y las fuentes de su tierra."
 tog_quest.0157.b: "Seguir el camino."
 tog_m.steal_wait: "Los monjes aún están en guardia: hay que esperar unos meses antes de volver a intentarlo."
