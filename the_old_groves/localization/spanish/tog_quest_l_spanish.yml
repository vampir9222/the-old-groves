l_spanish:
 tog_story_old_groves: "Las Antiguas Arboledas"
 tog_story_old_groves_desc: "Una piedra grabada con signos que nadie sabe leer. Libros copiados por monjes que odiaban lo que escribían. En algún lugar, bajo los relatos, duerme el culto de los antiguos."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Compañeros"
 tog_story_old_groves_destination: "Destino"
 tog_obj_stone: "Objetivo: ir a la piedra, en #V [GetTitleByKey('b_skye').GetNameNoTier]#!, y copiar sus signos."
 tog_obj_wrong: "Objetivo: seguir a Peredur hasta el viejo, en #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Objetivo: encontrar al verdadero viejo, en #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Objetivo: liberar al viejo, prisionero de los bandidos en las colinas de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "a la isla de [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "a [GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "a [GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Estudiar la piedra"
 tog_quest_start_decision_desc: "Se habla de una piedra extraña en la isla de [GetTitleByKey('b_skye').GetNameNoTier], grabada con signos que nadie sabe leer."
 tog_quest_start_decision_tooltip: "Comienza la misión de las Antiguas Arboledas."
 tog_quest_start_decision_confirm: "Partir hacia [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "Comienza la misión de las #V Antiguas Arboledas#!. Sigue su progreso en la ventana de #V Situaciones#!."
 tog_quest_travel_decision: "Viajar [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Abre el viaje hacia el destino actual de la misión."
 tog_quest_travel_decision_not_there: "Ya estás allí."
 tog_quest_travel_decision_effect_tt: "Partes hacia el destino de la misión. Un aventurero traslada allí su campamento."
 tog_poi_stone: "La piedra grabada"
 tog_poi_stone_desc: "Una piedra picta caída entre los brezos, cubierta de signos que nadie sabe leer."
 tog_quest.0001.t: "El Apóstata"
 tog_quest.0001.desc: "Antes te llamaban hermano Máel Brigte. Aprendiste a leer con los monjes de Iona, cantaste los salmos, creíste lo que te dijeron que creyeras. Luego llegaron los nórdicos. Las reliquias no detuvieron ningún barco, las oraciones no salvaron a ningún hermano, y los abades huyeron a ponerse a salvo con los libros. Tú te quedaste.\n\nHoy los gaélicos de las islas te llaman Dubgall, el Extranjero Oscuro. Alzas el cuerno en las fiestas de los nórdicos sin creer en ello, y una pregunta ya no te abandona: si el dios de los monjes no supo proteger a los suyos, ¿en qué queda creer?\n\nEsta mañana, al subir al páramo para vigilar las velas, encontraste otra cosa: una piedra caída entre los brezos, grabada con signos que nunca habías visto. Una media luna, una flecha rota, dos círculos unidos. No son letras. Son imágenes, puestas con demasiado cuidado para ser simples adornos."
 tog_quest.0001.a: "Debo entender lo que dicen estos signos."
 tog_quest.0001.a.tt: "Comienza la misión de las #V Antiguas Arboledas#!. Sigue su progreso en la ventana de #V Situaciones#!."
 tog_quest.0001.b: "No es más que una piedra vieja."
 tog_quest.0001.b.tt: "Podrás volver a la piedra más tarde, mediante una decisión."
 tog_quest.0002.t: "Una piedra en las islas"
 tog_quest.0002.desc: "Un mercader de paso te habló de una piedra extraña en la isla de [GetTitleByKey('b_skye').GetNameNoTier], en el norte: tendida entre los brezos sobre una bahía, grabada con signos que nadie, ni gaélico ni nórdico, sabe leer. Imágenes, dijo, no letras. Una media luna, una flecha rota, dos círculos unidos.\n\nDesde entonces, no consigues quitarte esos signos de la cabeza."
 tog_quest.0002.a: "Debo ver esa piedra."
 tog_quest.0002.a.tt: "Comienza la misión de las #V Antiguas Arboledas#!. Partes hacia #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "La piedra"
 tog_quest.0003.desc: "La piedra yace entre los brezos sobre la bahía, medio devorada por el musgo: una media luna atravesada por una flecha rota, dos círculos unidos por una barra, una línea en zigzag. Alguien la alzó hace mucho tiempo, y alguien la derribó: aún se ven las marcas de las palancas.\n\nRaspas el liquen con el cuchillo y copias cada signo, trazo a trazo, en una tablilla de cera."
 tog_quest.0003.a: "Copiar la piedra."
 tog_quest.0020.t: "El pastor"
 tog_quest.0020.desc: "Apenas terminas tu copia cuando los brezos se agitan detrás de ti. Aparece un joven sin aliento, con una cuerda en la mano.\n\n«¿No habréis visto una cabra?»\n\nSe llama Peredur. Cuida el ganado de la aldea, cuando lo encuentra, y escucha con mucha atención sin retener nada. Ve la piedra, se olvida de la cabra y rodea los signos para verlos al revés, luego al derecho, y otra vez al revés, por si acaso.\n\n«Eso son cosas de viejos. Hay que ver al viejo. El del otro lado del agua. A la izquierda saliendo de la bahía. Pero ojo: según hacia dónde se mire, ¡cambia todo! Mi padre dice que el viejo es puro esoterismo.»\n\nSonríes: «El esoterismo es un saber reservado a unos pocos iniciados, que se oculta a quienes no están preparados para recibirlo.»\n\nPeredur asiente largamente, con aire muy pensativo.\n\n«Ya, no es falso. ¿Os llevo a ver al viejo? Es a la izquierda. Bueno, creo.»"
 tog_quest.0020.a: "Enséñamelo, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! se une a ti y te lleva hasta el viejo, en #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_quest.0021.t: "El viejo equivocado"
 tog_quest.0021.desc: "El viejo de Peredur existe de verdad. Vive en una choza junto al agua, en [GetTitleByKey('b_gairloch').GetNameNoTier]. Tiene ochenta años, tres dientes, y no ha visto una piedra grabada en su vida. Te habla largo y tendido del arenque, de las focas y de la mujer con la que estuvo a punto de casarse hace mucho.\n\nPeredur se rasca la cabeza.\n\n«Ah. Quizá era a la derecha.»\n\nEl viejo pescador, en cambio, ha entendido de quién habláis: «¿El que habla con las piedras? Vive al sur, al otro lado del agua, en [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Todo el mundo lo sabe.»"
 tog_quest.0021.a: "Esta vez, elijo yo el camino."
 tog_quest.0021.a.tt: "Partes hacia #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, a casa del verdadero viejo."
 tog_quest.0022.t: "La casa vacía"
 tog_quest.0022.desc: "Por fin encuentras la casa del viejo, al fondo de un valle donde los nórdicos no van porque no hay nada que llevarse. La puerta está reventada. Dentro, todo está revuelto: el arcón forzado, el jergón desgarrado, un bastón partido en dos en el umbral.\n\nUna vecina acaba por salir. Hace tres días vinieron bandidos, hombres de las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Buscaban el oro que, según ellos, escondía el viejo: dicen que su familia desciende de Myrddin, el bardo loco, y un hombre así tiene que tener un tesoro. No encontraron nada. Así que se llevaron al viejo.\n\n«Se llama Lailoken», añade. «Tiene sesenta y ocho años.»"
 tog_quest.0022.a: "Iremos a buscarlo."
 tog_quest.0022.a.tt: "Partes hacia el campamento de los bandidos, en las colinas de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "El campamento de los bandidos"
 tog_quest.0023.desc: "El campamento está escondido en un repliegue de las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]: una docena de chozas, un fuego, caballos robados y una veintena de hombres de aspecto poco amistoso. En medio, atado a un poste, un anciano flaco te ve llegar sin decir nada.\n\nSu jefe se adelanta. Quiere oro. Siempre quiere oro."
 tog_quest.0023.a: "Atacar el campamento."
 tog_quest.0023.b: "Convencerlos de que lo suelten."
 tog_quest.0023.b.good: "Los convences de que el viejo no vale nada, y de que nadie maltrata impunemente a un descendiente de Myrddin. Lo sueltan."
 tog_quest.0023.c: "Pagar el rescate."
 tog_quest.0023.c.tt: "Los bandidos toman el oro y sueltan al viejo."
 tog_quest.0050.t: "Un texto de los dioses"
 tog_quest.0050.a: "Ven, Lailoken."
 tog_quest.0010.t: "La tablilla de cera"
 tog_quest.0010.desc: "Una noche de acampada, dejaste la tablilla demasiado cerca del fuego. Cuando la recuperas, la cera se ha derretido: la flecha rota ya no es más que una huella blanda, y ya no sabes si se inclinaba a la izquierda o a la derecha. Peredur, por su parte, está seguro de que se inclinaba a la izquierda."
 tog_quest.0010.a: "Rehacer los trazos de memoria."
 tog_quest.0010.a.good: "Tu memoria no falla: la copia está a salvo."
 tog_quest.0010.a.bad: "Dudas de cada trazo, y pasas la noche reprochándotelo."
 tog_quest.0010.b: "Confiar a partir de ahora la tablilla a Peredur."
 tog_quest.0010.b.tt: "Peredur la guardará con mimo. Al revés, sin duda."
 tog_quest.0011.t: "El mercader"
 tog_quest.0011.desc: "En el camino, os cruzáis con un mercader que sube hacia las Órcadas. Al ver tu copia, frunce el ceño: ha visto signos parecidos más al este, en otras piedras erguidas, en la antigua tierra de los pictos. Allí tampoco nadie sabe lo que significan."
 tog_quest.0011.a: "Interrogarlo largamente."
 tog_quest.0011.a.good: "Te describe las otras piedras con detalle: entiendes mejor la tuya."
 tog_quest.0011.a.bad: "Cuenta sobre todo fábulas, y pierdes el día desenredándolas."
 tog_quest.0011.b: "Comprarle su dibujo."
 tog_quest.0012.t: "El sueño"
 tog_quest.0012.desc: "Una noche de acampada, la media luna grabada vuelve en tu sueño. Se alza en el cielo como una luna, y los dos círculos arden bajo ella como dos fuegos.\n\nDespiertas con la certeza de haber comprendido algo, sin saber qué."
 tog_quest.0012.a: "Anotar el sueño antes de que se borre."
 tog_quest.0012.a.good: "El sueño te abre una pista, y te sientes más cerca de los antiguos dioses."
 tog_quest.0012.a.bad: "El sueño te extravía, y despiertas más turbado que antes."
 tog_quest.0012.b: "No es más que un sueño."
 tog_quest.0023.a.good: "Tus hombres barren el campamento: los bandidos huyen a las colinas abandonando su botín."
 tog_quest.0023.a.bad: "El asalto sale mal: escapas por los pelos, pero herido."
 tog_quest.0023.b.bad: "Se ríen de tus discursos y te echan del campamento."
 tog_quest.0024.t: "Por los pelos"
 tog_quest.0024.desc: "El asalto acabó en desastre. Los bandidos conocían cada roca de esas colinas, y vosotros estabais al descubierto. Escapaste por los pelos, con una herida en el costado, medio a cuestas de Peredur, que juraba conocer un paso por la izquierda y que, por una vez, tenía razón.\n\nEl viejo sigue allí arriba, atado a su poste. Habrá que volver, cuando te tengas en pie."
 tog_quest.0024.a: "Curar mis heridas y volver."
 tog_quest.0024.a.tt: "Volverás al campamento dentro de unos días."
 tog_quest.0025.t: "Despachado"
 tog_quest.0050.desc: "El viejo se frota las muñecas y te mira largo rato, sin una palabra de agradecimiento.\n\n«¿Por qué? Nadie viene a buscar a un viejo loco al fondo de las colinas. ¿Qué quieres de mí?»\n\nPor toda respuesta, Peredur le tiende tu tablilla de cera. El viejo la pone al derecho y pasa el dedo por la media luna grabada, y después por los dos círculos.\n\n«Es un texto.»\n\n«¿Un texto? Son imágenes.»\n\n«Para ti. Para quienes las grabaron, era un texto. Un texto de los dioses. A los que sabían leerlo, los monjes los expulsaron, y sus hijos aprendieron a callar. Yo solo sé que no hay que arar alrededor.»\n\nTe devuelve la tablilla.\n\n«Pero los monjes lo escribían todo. Incluso lo que odiaban. Sobre todo lo que odiaban. Si quieres saber quiénes eran esos dioses, busca en sus libros: en Jarrow, en Whithorn, en Mynyw, en Dunkeld, en Applecross.»\n\nCalla un momento y luego añade, más bajo:\n\n«Me has salvado la vida. Entre los nuestros, una deuda así no se paga con palabras: te seguiré. Y he pasado mi vida vigilando que nadie arara alrededor de las piedras. Antes de morir, quisiera ver lo que vas a hacer con esa.»"
 tog_dest_camp: "al campamento de los bandidos"
 tog_quest.0025.desc: "Los bandidos te escucharon hasta el final, luego estallaron en carcajadas entre los abucheos de sus compañeros. El viejo, todavía atado a su poste, no dijo nada.\n\nCon esos hombres las palabras ya no servirán de nada. Quedan la fuerza o el oro."
 tog_quest.0025.c: "Marcharse."
 tog_quest.0025.c.tt: "Abandonas el campamento. Vuelve cuando tengas suficiente oro o fuerza, con la decisión «Viajar al campamento de los bandidos»."
 tog_travel_desc_stone: "Una piedra grabada con signos que nadie sabe leer te espera en la isla de [GetTitleByKey('b_skye').GetNameNoTier]. Debes verla con tus propios ojos y copiarla."
 tog_travel_desc_wrong: "Peredur jura que conoce el camino hasta el viejo: a la izquierda saliendo de la bahía, hacia [GetTitleByKey('b_gairloch').GetNameNoTier]. Está casi seguro."
 tog_travel_desc_house: "Según el viejo pescador, el que habla con las piedras vive al sur, al otro lado del agua, en [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Esta vez, eliges tú el camino."
 tog_travel_desc_camp: "Unos bandidos se han llevado al viejo Lailoken a las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Si nadie va a buscarlo, nadie volverá a verlo."
 tog_travel_desc_camp_return: "El viejo Lailoken sigue prisionero de los bandidos en las colinas de [GetTitleByKey('b_glencoe').GetNameNoTier]. Oro suficiente para el rescate u hombres suficientes para el asalto: es hora de volver."
 tog_quest_travel_decision_confirm: "Partir"
 tog_quest.0050.a.tt: "#V Lailoken#! se une a ti. Los libros de los monjes copistas te esperan en cinco monasterios (decisión «Viajar a un monasterio»)."
 tog_story_old_groves_monasteries: "Monasterios por visitar"
 tog_obj_books: "Objetivo: recuperar los libros de los monjes copistas y después leerlos. Los monasterios restantes están en la lista de abajo; visítalos en el orden que quieras (decisión «Viajar a un monasterio»).\n\nLa lectura es automática: los libros se leen uno a uno, en el orden en que los recuperaste, y cada uno lleva unos meses."
 tog_obj_step3: "Los libros han hablado: ahora hay que ir allí donde se rezaba a los antiguos dioses.\n(La continuación llegará en una próxima versión.)"
 tog_dest_monastery: "a un monasterio"
 tog_travel_desc_monastery: "Los libros de los monjes copistas te esperan en Jarrow, Whithorn, Mynyw, Dunkeld y Applecross. Elige adónde ir."
 tog_m.talk: "Convencer al monje."
 tog_m.talk_tt: "Tus posibilidades dependen de tu diplomacia. Si fracasas, el monje ya no querrá escucharte."
 tog_m.pay: "Pagar al monje para que saque el libro."
 tog_m.steal: "Robar el libro, de noche."
 tog_m.force: "Forzar las puertas con mis hombres."
 tog_m.leave: "Marcharse."
 tog_m.leave_tt: "Podrás volver más tarde, con la decisión «Viajar a un monasterio»."
 tog_m.pay_good: "El monje saca el libro bajo su hábito."
 tog_m.pay_refused: "El monje se niega, asustado: ya no aceptará tu dinero."
 tog_m.pay_kept: "El monje toma el dinero y desaparece."
 tog_m.steal_good: "Sales antes del alba, con el libro bajo la camisa."
 tog_m.steal_bad: "¡Pillado in fraganti! Escapas por los pelos; el monasterio desconfiará a partir de ahora."
 tog_m.force_good: "Las puertas ceden: te llevas el libro y algunos objetos preciosos. El señor del lugar no te lo perdonará, y los demás monasterios estarán en guardia."
 tog_m.force_bad: "Los monjes y sus sirvientes resisten: os rechazan. Los demás monasterios estarán en guardia."
 tog_m.talk_good: "El monje te confía el libro."
 tog_m.talk_bad: "El monje se cierra: ya no te hablará."
 tog_m.book_tt: "Obtienes el libro. Lo leerás en los próximos meses."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "La casa donde el venerable Beda escribió toda su vida se alza a orillas del Tyne, tras un muro bajo. Los nórdicos ya han pasado por aquí: un ala sigue ennegrecida por el fuego. Junto al camino, un joven monje clasifica manzanas y te ve llegar con curiosidad.\n\n«¿Buscáis algo, forastero? La biblioteca está detrás del claustro. Dicen que guarda todo lo que Beda leyó, y Beda lo leyó todo.»"
 tog_quest.0121.t: "Los pictos de Beda"
 tog_quest.0121.desc: "Lees a Beda. Cuenta cómo los pictos vinieron de Escitia en largas naves, cómo elegían a sus reyes por línea femenina y cómo Colum Cille fue a bautizarlos. En la vida del santo lees también que en la corte del rey picto se enfrentó a magos que mandaban sobre el viento y las brumas.\n\nY en un margen, un hermano que había viajado al norte anotó: «los pictos grababan en las piedras signos que ya nadie lee».\n\nTu piedra tenía sacerdotes."
 tog_quest.0121.a: "Mi piedra tenía sacerdotes."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "La vieja casa blanca de san Niniano domina el puerto. Los monjes son pocos y apenas salen de la capilla; la biblioteca da a un huerto cuyo muro se derrumba en algunos puntos.\n\nEn la taberna del puerto, un hermano lego bebe más de la cuenta y se queja a quien quiera oírlo de que no le pagan lo suficiente."
 tog_quest.0122.t: "Los druidas de Plinio"
 tog_quest.0122.desc: "Es un florilegio venido de Francia, en el que un irlandés de la corte del emperador copió páginas de los Antiguos. Un romano, Plinio, cuenta que los sacerdotes de los galos, llamados druidas, no tenían nada por más sagrado que el muérdago y el roble que lo lleva; que lo recogían el sexto día de la luna, vestidos de blanco, con una hoz de oro. Otro dice que juzgaban los pleitos, que aprendían de memoria durante veinte años un inmenso número de versos, y que enseñaban que las almas no mueren, sino que pasan tras la muerte a otros cuerpos.\n\nEl druida, ese brujo ridículo de las vidas de santos, había sido un clero."
 tog_quest.0122.a: "Los druidas eran un clero."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "En el extremo de Gales, frente al mar, la casa de san David está rodeada de buenos muros. Los monjes de Mynyw han visto llegar velas extranjeras demasiadas veces: te ven acercarte desde el adarve, y sus sirvientes no sueltan sus bastones."
 tog_quest.0123.t: "Los héroes de los britanos"
 tog_quest.0123.desc: "El libro cuenta la historia de los britanos: Vortigern, que había llamado a los sajones; la torre que se derrumbaba cada noche porque dos dragones, uno rojo y uno blanco, luchaban en sus cimientos; el niño sin padre que lo adivinó; y un caudillo llamado Arturo, vencedor de doce batallas.\n\nHéroes, no dioses. Pero los britanos también han guardado a sus antiguos, y aún los esperan."
 tog_quest.0123.a: "Los britanos aún esperan a sus antiguos."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "En el corazón de la antigua tierra picta, Dún Chaillenn guarda parte de las reliquias de Colum Cille, traídas aquí para ponerlas a salvo de los nórdicos. Los guardias vigilan el relicario día y noche; nadie vigila la biblioteca, que no es más que una sala baja al fondo del claustro.\n\nUn perro duerme atravesado ante su puerta."
 tog_quest.0124.t: "Los ritos olvidados"
 tog_quest.0124.desc: "Es un libro feo, un florilegio de muchas manos en un pergamino malo. Varias páginas han sido raspadas a cuchillo para escribir salmos encima; al ponerlas a contraluz, aún adivinas las líneas que quisieron borrar.\n\nUn monje copió en él, sin comentarlas, frases que sus maestros habían dejado pasar: Brígida era una diosa venerada por los poetas; Ana había sido la madre de los dioses de Irlanda; en Beltaine los druidas encendían dos fuegos con grandes conjuros y hacían pasar el ganado entre ellos contra las enfermedades; antaño se juraba por ellos, y no por Cristo.\n\nLos reyes de antaño no habían sido reyes. Se les había rezado."
 tog_quest.0124.a: "Se les había rezado."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Frente a las islas, la casa de san Máel Rubai es pequeña y pobre. Un monje muy viejo, casi ciego, guarda la biblioteca: dicen que se sabe cada libro de memoria y que no deja salir a nadie ni con una sola hoja."
 tog_quest.0125.t: "El libro de los lugares"
 tog_quest.0125.desc: "Es un libro de lugares: cada colina, cada fuente, cada piedra de antaño, con la historia que explica su nombre. La gran casa hueca del Dagda junto al Boyne; la colina de Uisneach, en el corazón de Irlanda, donde murió Lug; la piedra de Maponos, en el estuario del Solway…\n\nLos libros dicen que esos dioses existieron. Para saber quiénes eran de verdad, habrá que ir allí donde se les rezaba."
 tog_quest.0125.a: "Habrá que ir a esos lugares."
 tog_quest.0130.t: "Un culto robado"
 tog_quest.0130.desc: "Relees los cinco libros uno junto a otro. Los nombres los conocías desde la infancia: Lug, el Dagda, Brígida, Balor, los Tuatha Dé Danann, la tribu de Dana. Reyes, antepasados, demonios, según quién lo contara. Descubres que son las ruinas de un culto. Uno verdadero, con sus dioses, sus lugares, sus sacerdotes. Y os lo robaron.\n\nLos monjes construyeron sus iglesias en las colinas donde se rezaba antes que ellos, clavaron sus cruces en las piedras, dieron a sus santas el nombre de las diosas. Lo que no pudieron destruir, lo bautizaron; lo que no pudieron bautizar, lo dejaron morir. Y lo que pusieron en su lugar sirve sobre todo para hacer bajar la cabeza: obedecer al señor, pagar el diezmo, rezar en una lengua que nadie entiende.\n\nLos antiguos dioses eran de aquí. Os los quitaron. Vas a recuperarlos."
 tog_quest.0130.a: "Recuperaré lo que nos robaron."
 tog_quest.0130.a.tt: "Fin de la segunda etapa de la misión. La continuación (los lugares sagrados) llegará en una próxima versión."
 tog_quest.0140.t: "¿A qué monasterio?"
 tog_quest.0140.desc: "Los libros de los monjes copistas te esperan en varios monasterios. ¿Cuál quieres visitar?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier])"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier])"
