l_spanish:
 # Religion
 tog_celtic_religion: "Celta"
 tog_celtic_religion_adj: "celta"
 tog_celtic_religion_adherent: "Celta"
 tog_celtic_religion_adherent_plural: "Celtas"
 tog_celtic_religion_desc: "Las antiguas creencias de los pueblos celtas, de Irlanda a la Galia y hasta Hispania. Solo sobreviven en los relatos que guardaron los monjes y en las piedras erguidas, a la espera de que alguien las despierte."

 # Faith
 tog_druidism: "Druidismo"
 tog_druidism_adj: "druídico"
 tog_druidism_adherent: "druidista"
 tog_druidism_adherent_plural: "druidistas"
 tog_druidism_desc: "Una fe nueva que reclama a los druidas como propios. Reconstruida a partir de sagas conservadas por monjes, de ruinas mal comprendidas y de lo que sus fieles saben del paganismo nórdico, reivindica un pasado que en realidad no restaura."

 # Rites
 tog_gaelic_rite: "Rito gaélico"
 tog_gaelic_rite_adj: "gaélico"
 tog_gaelic_rite_adherent: "gaélico"
 tog_gaelic_rite_adherent_plural: "gaélicos"
 tog_gaelic_rite_desc: "La tradición de los gaélicos de Irlanda, Dál Riata y Man. Honra a Lug y a los Tuatha Dé, celebra Samain y Beltaine y guarda la memoria de los antepasados en las genealogías de los poetas."

 # Custom doctrine
 tog_doctrine_clerical_function_judges_name: "Jueces y árbitros"
 tog_doctrine_clerical_function_judges_descriptive_name: "Clero judicial"
 tog_doctrine_clerical_function_judges_desc: "Nuestros [ROOT.Faith.PriestNeuterPlural] juzgan los crímenes, las herencias y las disputas de lindes, y se interponen entre ejércitos a punto de enfrentarse. Un castigo dictado por ellos no es el capricho de un solo hombre."

