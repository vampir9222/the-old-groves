 # Other rites
 tog_brythonic_rite: "Plant Dôn"
 tog_brythonic_rite_adj: "druídico britónico"
 tog_brythonic_rite_adherent: "druidista britónico"
 tog_brythonic_rite_adherent_plural: "druidistas britónicos"
 tog_brythonic_rite_desc: "La tradición de los britones de la isla y de sus primos de Armórica: Gales, Cornualles, Cumbria y Pictavia. Honra a Lleu y a los Hijos de Dôn, venera las piedras erguidas y los bosques sagrados, y abre su sacerdocio y sus tronos a mujeres y hombres por igual."
 tog_gaulish_rite: "Gutuatrismo"
 tog_gaulish_rite_adj: "druídico galo"
 tog_gaulish_rite_adherent: "druidista galo"
 tog_gaulish_rite_adherent_plural: "druidistas galos"
 tog_gaulish_rite_desc: "La tradición del continente, reconstruida a partir de inscripciones y de los relatos de griegos y romanos. Honra a Lugus y a Sucellos, lee las estrellas como los druidas de César, quema a sus muertos y conserva las cabezas de sus enemigos."
 tog_celtiberian_rite: "Lugovismo"
 tog_celtiberian_rite_adj: "druídico celtíbero"
 tog_celtiberian_rite_adherent: "druidista celtíbero"
 tog_celtiberian_rite_adherent_plural: "druidistas celtíberos"
 tog_celtiberian_rite_desc: "La tradición de los celtas de Hispania, de la Meseta a Gallaecia. Honra a Lugus, sella la hospitalidad con pactos grabados en bronce y entrega a sus guerreros caídos a los buitres que se llevan sus almas."

