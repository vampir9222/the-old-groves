 tog_rite_generated_gaelic_desc: "Una rama nacida entre los gaélicos, en torno a un linaje de poetas o a un santuario de los túmulos. Reivindica la misma tradición que el Druídecht, pero sigue a sus propios maestros y su propia lectura de las sagas."
 tog_rite_generated_brythonic_desc: "Una rama nacida entre los britanos de la isla, nutrida por los cantos de los bardos y los relatos de los Hijos de Dôn y de Llŷr. Comparte la tradición del Plant Dôn, pero sigue a sus propios maestros."
 tog_rite_generated_gaulish_desc: "Una rama nacida en el continente, en torno a un dios cuyo nombre solo sobrevivió en la piedra de las inscripciones. Reivindica a los druidas de César, pero pone a ese dios por encima de los demás."
 tog_rite_generated_common_desc: "Una rama nacida lejos de las tierras celtas, entre conversos que recibieron la fe de los druidas de segunda mano. Mezcla los relatos de las sagas con las costumbres de su propio pueblo."
