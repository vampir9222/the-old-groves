l_german:
 bm_867_tog_old_groves: "Die Alten Haine"
 bm_867_tog_old_groves_desc: "Die Druiden sind seit Jahrhunderten tot. Von ihnen bleiben nur aufrechte Steine, Götternamen, die Mönche abgeschrieben haben, und ein paar entstellte Erinnerungen. Doch 867, inmitten nordischer Raubzüge und christlicher Königreiche, beginnen einige, in diesen Ruinen zu graben… und davon zu träumen, zu wecken, was schläft."
 bm_867_tog_dubgall: "Dubgall der Abtrünnige"
 bm_867_tog_dubgall_desc: "867. Die Hebriden. Ein Mönch aus Iona hat seiner Taufe abgeschworen und segelt mit den Nordmännern. Er kann die alten Erzählungen lesen, die die Mönche abgeschrieben haben, und er beginnt sich zu fragen, ob die vergessenen Götter wieder aufleben könnten."

 bookmark_tog_dubgall: "Dubgall der Abtrünnige"
 bookmark_tog_dubgall_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_tog_dubgall_desc: "Er hieß Bruder Máel Brigte, „der Diener der Brigit“, und schrieb auf Iona Handschriften ab. Als die Nordmänner zurückkamen, floh er nicht mit den anderen nach Kells. Er blieb, und am Ende lief er zu ihnen über. Die Gälen nennen ihn nun Dubgall, „der dunkle Fremde“.\n\nEr hat die alten Sagen gelesen, die die Mönche wider Willen abgeschrieben haben. Er kennt die Namen von Göttern, zu denen niemand mehr betet. Und er beginnt sich zu fragen, ob sie wieder aufleben könnten."
 bookmark_tog_rhodri: "Fürst Rhodri"
 bookmark_tog_rhodri_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_rhodri_desc: "Rhodri ap Merfyn hält Gwynedd und die Insel Môn, wo die Römer die letzten Druiden niedermetzelten. Die Nordmänner verwüsten seine Küsten, die Sachsen drängen im Osten, und die Heiligen beschützen ihn kaum. Seine Barden aber besingen noch die Kinder der Dôn.\n\n#weak Tipp: Eine Entscheidung erlaubt dir, zu den alten Göttern zurückzukehren.#!"
 bookmark_tog_dumnarth: "Kleinkönig Dumnarth"
 bookmark_tog_dumnarth_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_dumnarth_desc: "Dumnarth herrscht über Cornwall, das letzte Königreich der südlichen Briten. Jedes Jahr rückt Wessex ein Stück weiter nach Westen vor. Die Mönche beten für ihn, doch Gebete halten die Sachsen nicht auf. Draußen im Moor warten die aufrechten Steine noch immer.\n\n#weak Tipp: Eine Entscheidung erlaubt dir, zu den alten Göttern zurückzukehren.#!"
 bookmark_tog_salomon: "König Salomon"
 bookmark_tog_salomon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_salomon_desc: "Salomon hat den Thron der Bretagne bestiegen, indem er seinen Vetter Erispoë am Fuß eines Altars tötete. Seitdem hat er den Franken einen Teil des Anjou entrissen, und er fürchtet weder König Karl noch den Erzbischof von Tours. Er ist fast sechzig: Will er mehr hinterlassen als ein Königreich, bleibt ihm wenig Zeit. Unter den Kapellen der Armorica schlafen die alten Götter Galliens noch.\n\n#weak Tipp: Eine Entscheidung erlaubt dir, zu den alten Göttern zurückzukehren.#!"

