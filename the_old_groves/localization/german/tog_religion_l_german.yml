l_german:
 # Religion
 tog_celtic_religion: "Keltisch"
 tog_celtic_religion_adj: "keltisch"
 tog_celtic_religion_adherent: "Kelte"
 tog_celtic_religion_adherent_plural: "Kelten"
 tog_celtic_religion_desc: "Der alte Glaube der keltischen Völker, von Irland bis Gallien und bis nach Hispanien. Er überlebt nur noch in den Erzählungen der Mönche und in den stehenden Steinen und wartet darauf, dass jemand ihn erweckt."

 # Faith
 tog_druidism: "Druidentum"
 tog_druidism_adj: "druidisch"
 tog_druidism_adherent: "Druidist"
 tog_druidism_adherent_plural: "Druidisten"
 tog_druidism_desc: "Ein neuer Glaube, der sich auf die Druiden beruft. Neu errichtet aus von Mönchen bewahrten Sagas, aus halb verstandenen Ruinen und aus dem, was seine Anhänger vom nordischen Heidentum wissen, beansprucht er eine Vergangenheit, die er nicht wirklich wiederherstellt."

 # Rites
 tog_gaelic_rite: "Gälischer Ritus"
 tog_gaelic_rite_adj: "gälisch"
 tog_gaelic_rite_adherent: "Gäle"
 tog_gaelic_rite_adherent_plural: "Gälen"
 tog_gaelic_rite_desc: "Die Tradition der Gälen Irlands, Dál Riatas und Mans. Sie ehrt Lug und die Tuatha Dé, feiert Samain und Beltaine und bewahrt das Andenken der Ahnen in den Genealogien der Dichter."

 # Custom doctrine
 tog_doctrine_clerical_function_judges_name: "Richter und Schlichter"
 tog_doctrine_clerical_function_judges_descriptive_name: "Richterlicher Klerus"
 tog_doctrine_clerical_function_judges_desc: "Unsere [ROOT.Faith.PriestNeuterPlural] richten über Verbrechen, Erbschaften und Grenzstreitigkeiten und treten zwischen Heere, die aufeinander losgehen wollen. Eine von ihnen verhängte Strafe ist nicht die Willkür eines einzelnen Mannes."

