 # Other rites
 tog_brythonic_rite: "Plant Dôn"
 tog_brythonic_rite_adj: "brythonisch-druidisch"
 tog_brythonic_rite_adherent: "Brythonischer Druidist"
 tog_brythonic_rite_adherent_plural: "Brythonische Druidisten"
 tog_brythonic_rite_desc: "Die Tradition der Inselbriten und ihrer armorikanischen Vettern: Wales, Cornwall, Cumbria und Piktland. Sie ehrt Lleu und die Kinder Dôns, verehrt stehende Steine und heilige Haine und öffnet ihre Priesterschaft und ihre Throne Frauen wie Männern."
 tog_gaulish_rite: "Gutuatrismus"
 tog_gaulish_rite_adj: "gallisch-druidisch"
 tog_gaulish_rite_adherent: "Gallischer Druidist"
 tog_gaulish_rite_adherent_plural: "Gallische Druidisten"
 tog_gaulish_rite_desc: "Die Tradition des Festlands, neu errichtet aus Inschriften und den Berichten von Griechen und Römern. Sie ehrt Lugus und Sucellos, liest die Sterne wie Caesars Druiden, verbrennt ihre Toten und bewahrt die Köpfe ihrer Feinde."
 tog_celtiberian_rite: "Lugovismus"
 tog_celtiberian_rite_adj: "keltiberisch-druidisch"
 tog_celtiberian_rite_adherent: "Keltiberischer Druidist"
 tog_celtiberian_rite_adherent_plural: "Keltiberische Druidisten"
 tog_celtiberian_rite_desc: "Die Tradition der Kelten Hispaniens, von der Meseta bis Gallaecia. Sie ehrt Lugus, besiegelt Gastfreundschaft mit in Bronze gravierten Pakten und überlässt ihre gefallenen Krieger den Geiern, die ihre Seelen davontragen."

