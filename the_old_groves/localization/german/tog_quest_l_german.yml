 trait_tog_awen_protected: "Awen"
 trait_tog_awen_protected_desc: "Die Gabe: die Inspiration der Dichter und Propheten. Manche Träume dieses Charakters werden wahr."
 trait_tog_novice: "Novizin"
 trait_tog_novice_desc: "Vom Priester ins Kloster gesperrt, um sie vor dem Heidentum ihres Vaters zu retten."
 tog_free.success_tt: "#V Eluned#! aus dem Kloster holen (bei einem Fehlschlag geht die Intrige weiter)"
 tog_quest.0229.t: "Alles von vorn"
 tog_quest.0229.desc: "Der Plan, Eluned herauszuholen, ist gescheitert. Gwion wartet noch immer auf seine Tochter, und er wird nicht mit dir sprechen, solange sie im Kloster ist."
 tog_quest.0229.a: "Die Intrige wieder aufnehmen."
 tog_quest.0236.a.tt: "Gwion hat dich alles gelehrt, was er weiß. Der Weg führt nun in die Armorica."
 tog_obj_village: "Über das Meer in die Armorica fahren und das Dorf finden, das den Römern standhielt, am Ende eines Kaps bei #V [GetTitleByKey('b_saint_brieuc').GetNameNoTier]#!."
 tog_obj_heric: "Herausfinden, wo der Hügel der großen Schlacht lag, auf dem die Götter der Gallier verloren. Man sagt, ein Mönch aus Auxerre, #V [GetTitleByKey('b_auxerre').GetNameNoTier]#!, habe alle Bücher der antiken Autoren gelesen."
 tog_dest_village: "zum Dorf in der Armorica"
 tog_dest_heric: "nach Auxerre"
 tog_travel_desc_village: "Ein Dorf am Meer hielt den Römern länger stand als alle anderen. Gofraid weiß, wo: in der Armorica, am Ende eines Kaps."
 tog_travel_desc_heric: "Niemand in Gallien weiß, wo der Hügel der großen Schlacht lag. Niemand, außer vielleicht ein Mönch aus Auxerre, der alle Bücher der antiken Autoren gelesen hat."
 tog_quest.0311.t: "Das Dorf auf dem Kap"
 tog_quest.0311.desc: "Gofraid kannte den Ort: am Ende eines Kaps an der Nordküste, vom Wind gepeitscht. Quer über den Ansatz des Kaps schneidet ein gewaltiger, halb eingestürzter Erdwall die Heide von einem Meer zum anderen. Die Leute hier nennen ihn den Graben des Caesar, obwohl er viel älter ist als Caesar. Dahinter, auf dem Plateau, sind vom Dorf nur Steinkreise geblieben, wo die Häuser standen, und von Gras überwucherte Aschehaufen.\n\nWo graben?"
 tog_quest.0311.a: "Am Fuß des Walls."
 tog_quest.0311.b: "In den Aschehaufen."
 tog_quest.0311.c: "In den Kreisen der Häuser."
 tog_quest.0311.d: "Unter der Feuerstelle des größten Hauses."
 tog_quest.0312.t: "Nichts hier"
 tog_quest.0312.desc: "Ihr grabt bis zum Abend. Scherben, Wildschweinknochen, Kiesel. Nichts, was der Mühe wert wäre. [tog_gwion.GetFirstName] findet, das sei ein seltsamer Kult, wie ein Schwein in der Erde zu wühlen."
 tog_quest.0312.a: "Woanders graben."
 tog_quest.0313.t: "Die goldene Sichel"
 tog_quest.0313.desc: "Unter dem Herdstein des größten Hauses liegt eine Klinge aus Gold. Eine schmale Sichel, in der Mitte handbreit und an den Spitzen ausgezogen, mit feinen Winkeln verziert. Sie ist so alt, dass ihre Ränder abgenutzt sind.\n\nDu hältst sie lange ins Licht. Du denkst an die Seite des Plinius: „mit einer goldenen Sichel“. Du weißt, dass eine so dünne Goldklinge nichts schneidet. Du weißt auch, dass du dieselbe Sichel in der Hand hältst wie die auf deinem Stein, auf den Inseln, über den beiden Kreisen.\n\nGofraid betrachtet den Wall und die Asche. „Die Leute hier haben sich nie gebeugt“, sagt er. „Weder vor den Römern noch vor den Franken. Unbeugsam. Ich hoffe doch, dass sie sich auch vor den Nordmännern nicht beugen.“"
 tog_quest.0313.a: "Die Sichel meines Steins."
 tog_quest.0313.a.tt: "Du nimmst die #V goldene Sichel#! mit. Der Weg führt nun nach Auxerre."
 tog_golden_sickle_name: "Die goldene Sichel"
 tog_golden_sickle_description: "Eine schmale, mit Winkeln verzierte Goldsichel, gefunden unter der Feuerstelle eines Dorfes in der Armorica, das den Römern standgehalten hatte. Plinius sagte, die Druiden schnitten die Mistel mit einer goldenen Sichel."
 tog_quest.0321.t: "Der Wissende"
 tog_quest.0321.desc: "Der Pförtner hat schließlich nachgegeben. Eines Abends kommt der Mönch durch die kleine Gartenpforte heraus. Er heißt Héric. Er ist um die dreißig, hat die müden Augen derer, die nachts lesen, und eine Neugier, die keine Regel zügelt. Auf einer niedrigen Mauer sitzend, sprecht ihr lange, auf Latein.\n\nHéric kennt die Belagerung. Caesar hat sie beschrieben: Alesia, die Stadt auf dem Hügel, von zwei Wallringen umschlossen, und Vercingetorix, der dem Prokonsul seine Waffen vor die Füße wirft. Und Héric glaubt zu wissen, wo das war: zwei Tagesreisen von hier, über dem Dorf Alise. In neun Jahrhunderten hat sich der Name kaum verändert. Er schreibt ihn in seine Verse.\n\n„Du suchst die Götter der Gallier“, sagt er zum Abschied. „Dort wirst du sie nicht finden. Du wirst den Ort finden, an dem sie verloren haben.“"
 tog_quest.0321.a: "„Das ist schon viel.“"
 tog_quest.0321.a.tt: "Du brichst sofort nach Alise auf, zwei Tagesreisen entfernt."
 tog_quest.0331.t: "Wo sie verloren"
 tog_quest.0331.desc: "Zwei Tage später stehst du am Fuß des Hügels. Der Mont Auxois hat einen flachen Gipfel, bedeckt mit Feldern und Reben. Unten in der Ebene pflügt ein Bauer. Du fragst ihn, ob er Dinge in der Erde findet. Er zeigt auf einen Haufen Altmetall am Feldrand: Pfeilspitzen, Nägel, Bronzestücke. Und mitten darin ein bronzener Eberkopf mit offenem Maul, auf einem langen, verbogenen Rohr. Ein Kriegshorn.\n\nDer Bauer heißt Ursin. Sein Leben lang hat er diese Trümmer aus seinem Feld gezogen und verflucht, weil sie die Pflugschar anschlugen. Er sieht zu, wie du sein Altmetall hochhebst wie ein Priester eine Reliquie. Er fragt, ob er hineinblasen darf. Es kommt nur ein Röcheln heraus, aber in seinen Augen liegt etwas, das am Morgen noch nicht da war.\n\nAm nächsten Tag hat er sein Feld seinem Bruder überlassen. Er geht hinter euch her, das Horn auf der Schulter."
 tog_quest.0331.a: "„Es gehört mir, aber spielen wirst du es.“"
 tog_carnyx_name: "Gallische Carnyx"
 tog_carnyx_description: "Ein gallisches Kriegshorn, eine Carnyx, mit bronzenem Eberkopf, aus einem Feld am Fuß des Hügels geborgen, auf dem sich die Gallier den Römern ergaben."
 tog_golden_sickle_modifier: "Goldene Sichel"
 tog_carnyx_modifier: "Gallische Carnyx"
 tog_test_skip_step4_decision: "TEST: Bei Schritt 5 beginnen"
 tog_test_skip_step4_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: überspringt bei Bedarf die vorherigen Schritte und öffnet direkt Schritt 5 (das Festland)."
 tog_obj_guide: "Einen Führer finden, der Gallien gut kennt, bevor du das Dorf und den Hügel suchst, von denen Gwion sprach."
 tog_find_guide_decision: "Einen Führer suchen"
 tog_find_guide_decision_desc: "Niemand in deiner Umgebung kennt Gallien. Du brauchst einen Mann, der seine Straßen, Häfen und Sprachen kennt und weiß, wo man besser nicht anhält."
 tog_find_guide_decision_tooltip: "Du lässt verbreiten, dass du einen Führer für Gallien suchst."
 tog_find_guide_decision_confirm: "Suchen"
 tog_find_guide_decision_effect_tt: "Bald wird man in den Häfen und auf den Märkten wissen, dass du einen Führer suchst."
 tog_quest.0300.t: "Auf der Suche nach einem Führer"
 tog_quest.0300.desc: "Du brauchst einen Mann, der Gallien kennt. Man findet solche in den Häfen und auf den Märkten, aber man muss einen finden, und er muss bereit sein, einem Unbekannten in ein seltsames Unterfangen zu folgen. Du kannst zahlen, damit sich die Nachricht verbreitet, oder auf deinen Namen setzen, damit man zu dir kommt."
 tog_quest.0300.a: "Zahlen, damit sich die Nachricht verbreitet."
 tog_quest.0300.b: "Auf meinen Namen setzen."
 tog_quest.0300.tt: "In den nächsten Tagen wird sich jemand melden."
 tog_quest.0301.t: "Der Kundschafter"
 tog_quest.0301.desc: "Eines Abends taucht ein Mann auf, einen Sack über der Schulter. Er heißt Gofraid, halb Nordmann, halb Gäle. Er hat als Händler angefangen und als Herumtreiber geendet. Er ist die Loire und die Seine hinaufgefahren, hat in Rouen Felle verkauft und einen Winter in Tours verbracht. Er hat das Romanische der Franken und das Bretonische der Armorica gelernt. Er kennt die Straßen Galliens wie andere ihr Feld.\n\nEr hört dir zu, während er sich mit einem Messer die Zähne stochert. „Ein Dorf, das den Römern länger standhielt als die anderen, und ein Hügel, auf dem die Götter verloren haben?“ Er lächelt. „Das Dorf, da weiß ich, wo es ist. Den Hügel nicht. Ich habe dort viel gesehen, aber nie jemanden, der so etwas sucht. Ich komme mit.“"
 tog_quest.0301.a: "„Willkommen, Gofraid.“"
 tog_quest.0301.join_tt: "#V Gofraid#! nimmt seinen Sack. Der Weg in die Armorica ist offen."
 tog_quest.0331.a.tt: "Die #V gallische Carnyx#! gehört dir, und #V Ursin#! trägt sie. Es ist Zeit, heimzukehren und den Stein erneut zu lesen."
 tog_obj_read_stone: "Heimkehren und den Stein anhand der Wachstafel vom ersten Tag erneut lesen. Mit allem, was du gelernt hast, sollte er endlich sprechen."
 tog_obj_mon: "Den ersten Ritus der Alten auf Ynys Môn vollziehen, #V [GetTitleByKey('b_yns_mon').GetNameNoTier]#!, der Insel, auf der die Römer die letzten Druiden niedermetzelten."
 tog_dest_mon: "nach Ynys Môn"
 tog_travel_desc_mon: "Der Stein sagt, dass man mit der goldenen Sichel die Mistel schneidet. Plinius sagte, wie: von einer Eiche, in Weiß gekleidet. Und es gibt nur einen passenden Ort: Môn, wo man die Götter zum Schweigen brachte."
 tog_read_stone_decision: "Den Stein lesen"
 tog_read_stone_decision_desc: "Du hast noch die Wachstafel vom ersten Tag. Damals hast du nichts davon verstanden. Jetzt hast du die Bücher, die Götter der heiligen Orte, Gwions Gebete und die goldene Sichel."
 tog_read_stone_decision_tooltip: "Du liest den Stein mit allem, was du gelernt hast, erneut."
 tog_read_stone_decision_confirm: "Lesen"
 tog_read_stone_decision_effect_tt: "Du legst die Tafel vor dich hin."
 tog_quest.0401.t: "Der gelesene Stein"
 tog_quest.0411.t: "Die Insel der Weisen"
 tog_quest.0411.desc: "Das Florilegium aus Whithorn sprach davon. Ein Römer schrieb dort, Môn sei die Insel der Weisen, und die Legionen hätten dort die letzten Druiden niedergemetzelt und ihre heiligen Haine gefällt. Wälder gibt es keine mehr. Wo noch ein wenig übrig war, haben die Mönche das Werk vollendet: Auf dem Hügel des großen Hains steht nun eine Kirche.\n\nDie Mistel wächst auf vielen Bäumen, aber fast nie auf der Eiche, und Plinius wusste das. Du hättest sie nie gefunden ohne eine Frau aus der Gegend, Nest. Als sie klein war, zeigte ihr ihre Großmutter eine Senke, die die Leute meiden, ohne zu wissen warum. Auf ihrem Grund steht eine alte hohle Eiche und in ihren hohen Ästen ein Mistelbusch."
 tog_quest.0411.a: "Den Ritus vollziehen."
 tog_quest.0412.t: "Der erste Ritus"
 tog_quest.0412.a: "Die Mistel behalten, in weißes Leinen gehüllt."
 tog_quest.0412.tt: "Die Mistel wird zu einem Kranz geflochten. Du nimmst den #V Mistelkranz von Môn#! mit, und #V Nest#! zieht mit dir."
 tog_mistletoe_name: "Der Mistelkranz von Môn"
 tog_mistletoe_description: "Ein Kranz, geflochten aus der Mistel einer alten hohlen Eiche auf Ynys Môn, aufgefangen in einem weißen Mantel beim ersten Ritus der Alten, seit die Druiden verstummten."
 tog_mistletoe_modifier: "Mistelkranz von Môn"
 tog_test_skip_step5_decision: "TEST: Bei Schritt 6 beginnen"
 tog_test_skip_step5_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: überspringt bei Bedarf die vorherigen Schritte, gibt die goldene Sichel und öffnet direkt Schritt 6 (den Stein lesen)."
 tog_quest.0184.t: "Die Kinder des Lir"
 tog_quest.0184.desc: "Abends am Feuer beginnt [tog_eogan.GetFirstName] eine Geschichte. Es ist die von den vier Kindern des Königs Lir. Ihre eifersüchtige Stiefmutter verwandelte sie in Schwäne, verdammt, neunhundert Jahre auf den kalten Wassern umherzuirren, bis zu dem Tag, an dem man eine Glocke läuten hören würde.\n\nEr erzählt gut. Die anderen sind verstummt, sogar [tog_gofraid.GetFirstName]. Aber die Nacht schreitet voran, und der Weg morgen ist lang."
 tog_quest.0184.a: "„Erzähl weiter, wir hören zu.“"
 tog_quest.0184.b: "„Das Ende morgen. Wir brechen im Morgengrauen auf.“"
 tog_quest.0185.t: "[tog_gwion.GetFirstName]s Traum"
 tog_quest.0185.desc: "Beim Aufwachen ist [tog_gwion.GetFirstName] bleich. Er hat vom Weg dieses Morgens geträumt: eine Furt, Weiden und Männer, die sich in den Weiden verstecken. „Manche meiner Träume werden wahr“, sagt er. „Nicht alle. Aber diesen hatte ich zweimal.“\n\nDie Furt ist eine Stunde Fußmarsch entfernt. Sie zu umgehen kostet einen Tag."
 tog_quest.0185.a: "Die Furt umgehen."
 tog_quest.0185.a.tt: "Ein Tag verloren. Ihr werdet nie erfahren, ob jemand in den Weiden war."
 tog_quest.0185.b: "„Träume sind Träume.“"
 tog_quest.0185.b.good: "An der Furt ist niemand."
 tog_quest.0185.b.bad: "In den Weiden waren Männer."
 tog_quest.0186.t: "Der Wirt"
 tog_quest.0186.desc: "Der Wirt nennt seinen Preis für die Nacht, das Essen und das Heu für die Tiere. [tog_gofraid.GetFirstName] bricht in Gelächter aus. „Du rechnest das Heu doppelt, Freund, und dein Wein ist vor allem Wasser.“ Er wendet sich an dich. „Lass mich machen. Diese Sorte kenne ich von der Loire bis zur Seine.“"
 tog_quest.0186.a: "„Mach nur.“"
 tog_quest.0186.b: "Den geforderten Preis zahlen."
 tog_quest.0187.t: "Die Carnyx um Mitternacht"
 tog_quest.0187.desc: "Mitten in der Nacht weckt ein entsetzliches Röcheln das ganze Lager. Die Pferde schlagen aus, [tog_peredur.GetFirstName] tastet nach seinem Schwert, und Lailoken flucht in einer Sprache, die niemand kennt. Es ist [tog_ursin.GetFirstName], etwas abseits, das Horn am Mund. Er übt. Er ist sehr stolz: Diesmal hat man fast einen Ton gehört."
 tog_quest.0187.a: "„Noch einmal, [tog_ursin.GetFirstName]!“"
 tog_quest.0187.b: "„Nicht nachts.“"
 tog_quest.0401.desc: "Du legst die Wachstafel vom ersten Tag auf den Tisch, als du noch nichts wusstest. Damals waren es nur Striche. Heute Abend legst du die goldene Sichel daneben und schaust.\n\nDie Mondsichel oben, das ist die Sichel. Du hältst sie in der Hand: dieselben spitzen Enden, dieselbe Krümmung. Der gebrochene Pfeil, der sie durchquert, ist der Zweig, den man schneidet, die Mistel, die von der Eiche fällt, wie bei Plinius. Die beiden verbundenen Kreise sind die zwei Feuer von Beltaine, von denen das abgeschabte Buch aus Dunkeld sprach, die jahrhundertelang auf dem Hügel von Uisneach entzündet wurden. Und die Zickzacklinie, die sie durchzieht, ist der Weg der Seelen. Das Florilegium aus Whithorn nannte sie unsterblich: Sie gehen von einer Welt in die andere, durch den Brunnen von Uisneach, durch das Haus des Dagda.\n\nStück für Stück legt sich alles, was du in all den Jahren gesammelt hast, auf den Stein, und alles fügt sich zusammen. Es ist keine Zeichnung mehr. Es ist ein Gebet."
 tog_quest.0401.lailoken: "\n\nLailoken ist lautlos nähergekommen. Er legt seinen alten Finger auf die Mondsichel, wie an dem Tag, als er dir sagte, das sei ein Text. „Seit vierzig Jahren schaue ich mir diese Steine an“, sagt er. „Ich wusste, dass sie sprechen. Ich wusste nicht, dass sie das sagen.“"
 tog_quest.0401.end: "\n\nDu nimmst eine neue Tafel und schreibst mit einer Hand, die nicht zittert: #italic Mit der goldenen Sichel schneidet man die Mistel von der Eiche. Durch die zwei Feuer gehen die Seelen hinüber und kehren zurück.#! Das sind die ersten Worte des Kultes. Es gab sie nirgends mehr. Jetzt gibt es sie.\n\nEs bleibt zu tun, was er sagt."
 tog_quest.0401.a: "„Es bleibt zu tun, was er sagt.“"
 tog_quest.0401.a.tt: "Der Stein hat gesprochen. Nun muss die Mistel geschnitten werden, auf Ynys Môn."
 tog_quest.0413.t: "Die Männer vom Hügel"
 tog_quest.0413.intro: "Du kehrst in Weiß gekleidet in die Senke zurück, wie Plinius es sagte, deine Gefährten um dich.\n\n[tog_nest.GetFirstName] hält den weißen Mantel unter den Baum. Niemand hat es bestimmt: Sie ist von selbst vorgetreten. Die Frauen ihrer Familie haben diese Eiche über Generationen gehütet. Es steht ihr zu, zu empfangen, was sie gibt.\n\nDu bist auf halber Höhe der Eiche, als [tog_nest.GetFirstName] aufschreit. Am Rand der Senke kommen etwa zwanzig Männer zwischen den Bäumen herab. Bauern mit Stöcken und Mistgabeln, zwei bewaffnete Männer des Herrn und vor ihnen ein Mönch in schwarzer Kutte, das Kreuz erhoben. Jemand hat ihn gewarnt. „Fällt diesen Baum! Reißt den Teufel aus seinen Ästen!“\n\nDu hast keine Zeit herunterzuklettern. Das brauchst du auch nicht. Unten haben sich deine Gefährten wortlos zwischen die Eiche und den Hügel gestellt."
 tog_quest.0413.peredur: " [tog_peredur.GetFirstName] hat sein Schwert gezogen."
 tog_quest.0413.gofraid: " [tog_gofraid.GetFirstName] hat sein Messer gezückt."
 tog_quest.0413.eogan: " [tog_eogan.GetFirstName] hat seinen Hirtenstab ergriffen."
 tog_quest.0413.lailoken: " Sogar der alte Lailoken ist aufgestanden, auf seinen Stab gestützt."
 tog_quest.0413.gwion: " [tog_gwion.GetFirstName] rührt sich nicht: Er sieht dem Mönch direkt in die Augen."
 tog_quest.0413.together: " Niemand dreht sich zu dir um. Sie lassen dich machen."
 tog_quest.0413.carnyx: "\n\nDa hebt [tog_ursin.GetFirstName] die Carnyx.\n\nDer Klang rollt durch die Senke wie das Brüllen eines Tieres, rau, gewaltig. Niemand hier hat diesen Klang seit tausend Jahren gehört. Der bronzene Eberkopf scheint zu heulen. Die Bauern bleiben wie angewurzelt stehen. Einer lässt seine Mistgabel fallen. Der Mönch hebt sein Kreuz höher, aber hinter ihm weichen die Männer schon zurück, dann rennen sie."
 tog_quest.0413.nocarnyx: "\n\nDie Bauern sehen diese bewaffneten Männer an, die keinen Schritt zurückweichen. Sie zögern und sehen einander an. Dann weichen sie einer nach dem anderen zurück und beginnen zu rennen."
 tog_quest.0413.end: "\n\nDer Mönch bleibt einen Moment allein am Rand der Senke stehen. Dann geht auch er."
 tog_quest.0413.a: "„Lasst sie gehen.“"
 tog_quest.0413.b: "„Fangt den Mönch!“"
 tog_quest.0413.tt: "Deine Gefährten haben für dich zu den Waffen gegriffen. Sie werden es nicht vergessen."
 tog_quest.0412.desc: "Als es in der Senke wieder still ist, hebst du die goldene Sichel zum Ast. Sie schneidet natürlich nicht. Du trennst die Mistel mit deinem Messer ab und lässt sie in den Mantel fallen, den Nest darunter aufhält.\n\nNichts geschieht. Der Wind bewegt die Blätter. Eine Amsel singt.\n\nAber zum ersten Mal seit Generationen hat jemand einen Ritus der Alten vollzogen. Du weißt nicht, ob du es richtig gemacht hast. Aber es ist getan, und von nun an wirst du es aufschreiben können.\n\nAls du vom Baum herabsteigst, hat Nest sich nicht gerührt. Sie hält den gefalteten Mantel noch immer an sich gedrückt, die Mistel in der Mulde des Leinens. Sie betrachtet die Eiche, als sähe sie sie zum ersten Mal.\n\n„Meine Großmutter ließ mich schwören, hier nie Holz zu schlagen“, sagt sie schließlich. „Hundertmal habe ich sie gefragt, warum. Sie antwortete, sie wisse es nicht, ihre Mutter habe sie auch schwören lassen. Sie ist gestorben, ohne es zu wissen.“ Sie reicht dir den Mantel. „Du weißt es. Du hast gefunden, was sie hüteten, ohne es zu wissen. Ich werde nicht nach Hause gehen und so tun, als wüsste ich es nicht. Wenn du aufschreibst, was man unter dieser Eiche tut, will ich dabei sein.“"
 tog_obj_step7: "Der erste Ritus ist vollzogen. Was gesammelt wurde, darf nie wieder verloren gehen: Es muss aufgeschrieben werden."
 tog_obj_verses: "Das Buch der Druiden schreiben: alles, was du gesammelt hast, damit man es lehren und abschreiben kann und niemand es je wieder auslöschen kann."
 tog_obj_founded: "Der Kult der Alten hat wieder Anhänger."
 tog_story_old_groves_verses: "Buch der Druiden: +[Story.MakeScope.Var('tog_verses_rate').GetValue|V0] % pro Monat"
 tog_story_old_groves_verses_max: "100"
 tog_write_verses_decision: "Das Buch der Druiden schreiben"
 tog_write_verses_decision_desc: "Wenn die Kirche gesiegt hat, dann weil sie ein Buch hatte: überall dasselbe, das die Priester von einem Ende der Welt zum anderen abschrieben. Die alten Götter hatten nur das Gedächtnis der Druiden, und als die Druiden starben, starb alles mit ihnen. Du wirst nicht denselben Fehler machen."
 tog_write_verses_decision_tooltip: "Du beginnst ein Buch, das alles versammelt, was der Kult der Alten einmal war."
 tog_write_verses_decision_confirm: "Mit dem Schreiben beginnen"
 tog_write_verses_decision_effect_tt: "Das Schreiben beginnt. Es schreitet jeden Monat je nach deiner Gelehrsamkeit voran, und deine Gefährten werden daran teilhaben."
 tog_verses.up: "Das Schreiben kommt voran."
 tog_verses.up_big: "Das Schreiben kommt gut voran."
 tog_verses.up_small: "Das Schreiben kommt ein wenig voran."
 tog_verses.same: "Das Schreiben kommt nicht voran."
 tog_verses.down: "Seiten müssen neu geschrieben werden: Das Schreiben fällt zurück."
 tog_quest.0511.t: "Zwei Arten zu erzählen"
 tog_quest.0511.desc: "[tog_gwion.GetFirstName] und [tog_eogan.GetFirstName] streiten über deiner Seite um das Haus des Dagda und die List des Óengus. [tog_eogan.GetFirstName] erzählt es wie sein Großvater, mit den Einzelheiten, die zum Lachen bringen, und den Pausen, die Angst machen. [tog_gwion.GetFirstName] sagt, das sei keine Geschichte für Spinnstuben. Es seien Worte, die man zu den Göttern sprach, und die ändert man nicht, um zum Lachen zu bringen.\n\nBeide wenden sich dir zu."
 tog_quest.0511.a: "„[tog_gwion.GetFirstName] hat recht: Das sind heilige Worte.“"
 tog_quest.0511.b: "„[tog_eogan.GetFirstName] hat recht: So erinnert sich das Volk daran.“"
 tog_quest.0511.c: "„Ich schreibe beides auf, nebeneinander.“"
 tog_quest.0512.t: "Eine Erinnerung Lailokens"
 tog_quest.0512.desc: "Lailoken döste am Feuer. Plötzlich richtet er sich auf. „Das hat meine Mutter gesungen!“ Es ist ein Kinderlied aus seiner Kindheit, über eine Frau, die mit einem Becher in der Hand aus einem See stieg. Er erinnert sich an drei Zeilen, dann an fünf. Dann zögert er, beginnt von vorn, bringt alles durcheinander.\n\nVielleicht ist es ein sehr altes Bruchstück. Vielleicht ein Marktlied."
 tog_quest.0512.a: "Es so aufschreiben, wie er sich erinnert."
 tog_quest.0512.a.bad: "Am nächsten Tag erinnert er sich anders: Seiten müssen neu geschrieben werden."
 tog_quest.0512.b: "„Dein Gedächtnis täuscht dich, alter Mann.“"
 tog_quest.0513.t: "Was die Frauen taten"
 tog_quest.0513.desc: "[tog_nest.GetFirstName] liest über deine Schulter mit und runzelt die Stirn. „In deinem Buch gibt es nur Männer. Druiden, Könige, Krieger.“ Sie erzählt dir, was ihre Großmutter tat: die Milch, die man am ersten Maitag in die Quelle goss, die Glut, die man die ganze Nacht von Imbolc hütete, die Worte, die man einer Gebärenden sagt. „Niemand hat sie je aufgeschrieben, weil niemand je die Frauen danach gefragt hat.“"
 tog_quest.0513.a: "„Sie bekommen ihr eigenes Kapitel.“"
 tog_quest.0513.b: "„Das Buch spricht von den Göttern, nicht vom Herd.“"
 tog_quest.0514.t: "[tog_peredur.GetFirstName] zählt die Seiten"
 tog_quest.0514.desc: "[tog_peredur.GetFirstName] hat den Abend damit verbracht, die Seiten zu zählen. „Es sind hundertsiebenundachtzig. Und auf elf davon hast du Lug mit zwei g geschrieben.“ Er schlägt vor, sie alle zu nummerieren, damit man sie nie durcheinanderbringt. Er sieht sehr stolz auf seine Idee aus."
 tog_quest.0514.a: "„Nummeriere sie, [tog_peredur.GetFirstName].“"
 tog_quest.0514.a.good: "Die Seiten sind nummeriert, in perfekter Ordnung. Bis ins Dorf spricht man davon."
 tog_quest.0514.b: "„Lass die Seiten in Ruhe, [tog_peredur.GetFirstName].“"
 tog_quest.0515.t: "Der Traum von der Seite"
 tog_quest.0515.desc: "[tog_gwion.GetFirstName] kommt vor der Morgendämmerung zu dir. Er hat von einer Seite des Buches geträumt, einer Seite, die du noch nicht geschrieben hast: dem Gebet, das man spricht, wenn man die Feuer von Beltaine entzündet. Er hat sie Wort für Wort gesehen. Er will, dass du sie sofort aufschreibst, bevor der Traum verblasst."
 tog_quest.0515.a: "Aufschreiben, was er geträumt hat."
 tog_quest.0515.a.bad: "Beim Wiederlesen ist sich [tog_gwion.GetFirstName] keiner Sache mehr sicher: Es muss neu geschrieben werden."
 tog_quest.0515.b: "„Ein Traum ist kein Buch.“"
 tog_quest.0516.t: "[tog_gofraid.GetFirstName]s Pergament"
 tog_quest.0516.desc: "[tog_gofraid.GetFirstName] kommt mit einem Bündel unter dem Arm vom Markt zurück. „Pergament aus Tours. Das beste. Ich habe es zum halben Preis von einem Händler, der nicht wusste, was er verkaufte.“ Er legt es mit einem Augenzwinkern auf den Tisch. „Na ja, der halbe Preis ist immer noch ein Preis.“"
 tog_quest.0516.a: "„Ich nehme es zu deinem Preis.“"
 tog_quest.0516.b: "Hart feilschen."
 tog_quest.0519.t: "Eine Nacht des Schreibens"
 tog_quest.0519.desc: "Die Lampe rußt, die Tinte wird dick, und die Stelle, die du schreibst, will nicht kommen. Du könntest bis zum Morgengrauen weitermachen. Du könntest auch schlafen gehen und morgen weitermachen."
 tog_quest.0519.a: "Die ganze Nacht schreiben."
 tog_quest.0519.b: "Alles von Anfang an noch einmal lesen."
 tog_quest.0501.t: "Der Eid"
 tog_quest.0501.desc: "Das Buch ist fertig. Du nennst es das Buch der Druiden.\n\nDu weißt, dass es nicht vollkommen ist. Es hat Lücken, die du gefüllt hast, so gut du konntest, und Dinge, die du entscheiden musstest, weil du es nicht wusstest. Aber zum ersten Mal seit sehr langer Zeit existiert der Kult der Alten anderswo als an den Rändern der Mönche.\n\nAm Tag von Beltaine steigst du mit denen auf den Hügel, die dir gefolgt sind, einer nach dem anderen unterwegs gefunden. Du liest ihnen das Buch von Anfang bis Ende vor, laut, unter dem Himmel. [tog_gwion.GetFirstName] gießt die Milch ins Feuer von Beltaine. Zum ersten Mal in seinem Leben sieht er sich nicht um, ob ihn auch niemand sieht. Dann schwört einer nach dem anderen bei Lug und beim Dagda, wie man vor der Taufe schwor.\n\nAn diesem Abend hat der Kult der Alten wieder Anhänger.\n\nDoch eine Handvoll Gläubiger um ein Feuer macht noch keinen Kult. Man wird die Herren überzeugen müssen, und das Volk muss das Buch hören."
 tog_quest.0501.a: "„Bei Lug und beim Dagda.“"
 tog_quest.0501.a.tt: "Der Kult der Alten wird wiedergeboren: Du, dein Hof und deine Gefährten legt den Eid ab, und das #V Buch der Druiden#! kommt in deine Schatzkammer. Folgt deine Linie dem gälischen Ritus, nimmt sie den legendären Namen #V Lugaid#! an. Bist du Abenteurer, errichten die Gläubigen in deinem Lager ein #V Zelt der Opfergaben#!.\n\nNächster Schritt: die Entscheidungen #V Die Gefährten zum Predigen aussenden#! und #V Einen Barden suchen#!."
 tog_verses_book_name: "Das Buch der Druiden"
 tog_verses_book_description: "Das Buch, das alles versammelt, was der Kult der Alten einmal war: der Stein, die Bücher der Mönche, die Götter der heiligen Orte, die Gebete des Hüters, der erste Ritus. Geschrieben, damit niemand es je wieder auslöschen kann."
 tog_verses_book_modifier: "Buch der Druiden"
 tog_house_lugaid: "Lugaid"
 tog_test_skip_step6_decision: "TEST: Bei Schritt 7 beginnen"
 tog_test_skip_step6_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: richtet die Gefährten und Artefakte der vorherigen Schritte ein und öffnet direkt Schritt 7 (das Buch der Druiden)."
 tog_quest.0603.t: "Die Nachfolge"
 tog_quest.0603.desc: "[tog_dead_companion.GetFirstName] hat euch verlassen. Der Platz am Feuer bleibt den ganzen Abend leer.\n\nAm nächsten Tag kommt [tog_heir_companion.GetFirstName] mit geröteten Augen zu dir. „[tog_dead_companion.GetSheHe|U] hat mir von dem erzählt, was ihr sucht. Ich will an dieser Stelle weitermachen.“"
 tog_quest.0603.a: "„Dein Platz ist bei uns.“"
 tog_quest.0603.a.tt: "#V [tog_heir_companion.GetFirstName]#! nimmt den Platz von [tog_dead_companion.GetFirstName] am Feuer ein."
 tog_quest.0601.t: "Was er hinterlässt"
 tog_quest.0601.desc: "Man hat dir seine Sachen gebracht: die Wachstafel des Steins, seine Notizen, Tafeln voller enger Schrift. Du bist noch zu jung, um alles zu verstehen, was er suchte. Aber seine Gefährten sind geblieben, und sie sehen dich an, wie man jemanden ansieht, auf den man wartet."
 tog_quest.0601.a: "„Eines Tages werde ich verstehen.“"
 tog_quest.0601.a.tt: "Die Suche geht weiter, wenn du 16 bist."
 tog_quest.0602.t: "Das Erbe"
 tog_quest.0602.desc: "Du hast seine Notizen übernommen, seine Tafel des Steins, alles, was er gesammelt hatte. Seine Gefährten sind einer nach dem anderen zu dir gekommen. Sie haben nichts verlangt: Sie wollten nur wissen, ob du weitermachst.\n\nDu hast seine Notizen an der Stelle aufgeschlagen, an der er aufgehört hatte."
 tog_quest.0602.a: "„Ich mache weiter.“"
 tog_quest.0602.a.tt: "Du nimmst den Weg dort wieder auf, wo er aufgehört hatte."
 tog_quest.0514.b.bad: "[tog_peredur.GetFirstName] schmollt in einer Ecke und zählt laut die Deckenbalken. Unmöglich, sich zu konzentrieren."
 tog_quest.0519.b.good: "Beim Wiederlesen fällt dir die fehlende Stelle von selbst ein."
 tog_quest.0516.b.good: "[tog_gofraid.GetFirstName] murrt, überlässt dir das Bündel aber für fast nichts. Alle haben die Szene gehört."
 tog_quest.0513.b.bad: "[tog_nest.GetFirstName] spricht nicht mehr mit dir. Dieses Kapitel wird nicht geschrieben."
 tog_quest.0516.c: "„Ich nehme alles und bezahle damit einen Kopisten aus Tours.“"
 tog_quest.0519.c: "Kopisten bezahlen, um schneller voranzukommen."
 tog_quest.0520.t: "Eine Seite, die nicht trägt"
 tog_quest.0520.desc: "Du liest die Seite von gestern noch einmal, und sie trägt nicht. Jedes Wort für sich stimmt, aber zusammen sagen sie nichts. So sprach man nicht zu den Göttern."
 tog_quest.0520.a: "Sie zerreißen und neu beginnen."
 tog_quest.0520.b: "Sie liegen lassen und später darauf zurückkommen."
 tog_quest.0521.t: "Ein neugieriger Besucher"
 tog_quest.0521.desc: "Ein durchreisender Händler, den du an deinem Tisch bewirtet hast, hat die Blätter auf deinem Pult gesehen. Er fragt höflich, was du so Wichtiges schreibst. Er sieht aus wie ein Mann, der alles, was er sieht, dem erstbesten Priester erzählt."
 tog_quest.0521.a: "Ihm eine harmlose Seite zeigen."
 tog_quest.0521.a.good: "Nach drei Zeilen langweilt er sich und spricht über etwas anderes."
 tog_quest.0521.a.bad: "Er hat über deine Schulter den Namen eines Gottes gelesen. Im Dorf gehen Gerüchte über dich um."
 tog_quest.0521.b: "Ihm etwas anbieten, damit er vergisst, was er gesehen hat."
 tog_quest.0522.t: "Die Tinte geht aus"
 tog_quest.0522.desc: "Der letzte Tintentopf ist leer. In der Stadt gibt es gute Tinte zu einem guten Preis. Ansonsten sagt [tog_gwion.GetFirstName], früher habe man sie aus Eichengallen und Eisen gemacht. Vielleicht erinnert er sich noch daran."
 tog_quest.0522.a: "In der Stadt gute Tinte kaufen."
 tog_quest.0522.b: "Sie selbst herstellen, mit Eichengallen."
 tog_quest.0522.b.good: "Die Tinte ist schwarz und hält gut. Sie riecht sogar nach Wald."
 tog_quest.0522.b.bad: "Die Tinte verblasst beim Trocknen: Ganze Seiten müssen nachgezogen werden."
 tog_quest.0513.a.great: "[tog_nest.GetFirstName] holt Frauen aus der Gegend herbei. Sie reden die ganze Nacht, und du schreibst alles auf."
 tog_quest.0512.a.great: "Lailokens Verse hallen in einer Stelle der Bücher wider. Es war kein Marktlied."
 tog_quest.0512.b.bad: "Lailoken schmollt am Feuer. Der Abend ist verloren."
 tog_quest.0511.b.great: "[tog_eogan.GetFirstName] erzählt, du schreibst, und die Seiten füllen sich. Im Dorf erzählt man die Geschichte schon weiter."
 tog_quest.0511.a.great: "So geschrieben, wie [tog_gwion.GetFirstName] sie spricht, klingen die Worte wie ein Gebet."
 tog_quest.0515.a.great: "[tog_gwion.GetFirstName]s Gebet fließt von selbst. Als du es laut liest, hast du das Gefühl, es schon immer gekannt zu haben."
 tog_find_bard_decision_desc: "Ein Kult verbreitet sich mehr durch Dichter als durch Priester. Barden ziehen von Hof zu Hof, und Könige hören ihnen zu. Es braucht einen, der das Buch singt."
 tog_find_bard_decision: "Einen Barden suchen"
 tog_test_skip_step7_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: richtet die Gefährten und Artefakte ein, gründet den Kult und öffnet direkt Schritt 8 (die Gläubigen)."
 tog_find_bard_decision_effect_tt: "Drei Barden werden sich melden; du wählst den, der sich deinem Hof anschließt."
 tog_find_bard_decision_confirm: "Suchen"
 tog_send_companions_decision: "Die Gefährten zum Predigen aussenden"
 tog_obj_faithful: "Den Kult verbreiten: deine Gefährten aussenden, um unter den Herren Anhänger zu gewinnen, und einen Barden finden, der das Buch singt.[Story.Custom('TogMissionLine_tog_eogan')][Story.Custom('TogMissionLine_tog_nest')][Story.Custom('TogMissionLine_tog_gofraid')][Story.Custom('TogMissionLine_tog_ursin')][Story.Custom('TogMissionLine_tog_gwion')][Story.Custom('TogMissionLine_tog_peredur')][Story.Custom('TogMissionLine_tog_lailoken')]"
 tog_quest.0730.t: "Der erste Abend"
 tog_send_companions_decision_confirm: "Sie aussenden"
 tog_find_bard_decision_tooltip: "Du lässt verbreiten, dass du einen Barden suchst."
 tog_quest.0730.desc: "Sie sind alle zurückgekehrt. Heute Abend ist die große Halle zum ersten Mal voll: deine Gefährten, staubig von ihren Wegen, die Leute deines Hauses und einige Gesichter, die du nicht kennst, gekommen, weil sie von dir gehört haben.\n\n[tog_bard.GetFirstName] nimmt seine Harfe. Er singt kein Lied: Er singt das Buch, vom ersten Wort an. Die Sichel und die Mistel, die zwei Feuer, der Dagda in seinem Haus am Boyne, Lug, der zwischen den Welten hin und her geht. Niemand spricht. Selbst die Diener sind hinten in der Halle stehen geblieben.\n\n"
 tog_quest.0721.tt: "Der Barde lässt sich an deinem Hof nieder. Solange er bleibt, dient dir sein Talent."
 tog_send_companions_decision_tooltip: "Du sendest deine Gefährten zu den Herren ihrer Heimatländer."
 tog_send_companions_decision_desc: "Das Buch ist geschrieben. Nun muss man es hören. Deine Gefährten stammen jeweils aus einem anderen Land: Sollen sie dorthin zurückkehren und die Herren für den Glauben gewinnen, die zuhören wollen."
 tog_quest.0721.a: "Der Fili aus Irland, [tog_bard_1.GetFirstName]: das Wissen der Alten."
 tog_quest.0712.lost: "#N [tog_mission_target.GetTitledFirstName] wurde nicht bekehrt.#!\n\nEin Bote bringt die Nachricht: [tog_mission_target.GetTitledFirstName] hat höflich zugehört und [tog_missionary.GetFirstName] dann mit einer Mahlzeit und sonst nichts fortgeschickt. Der Heimweg wird lang."
 tog_quest.0712.won: "#P [tog_mission_target.GetTitledFirstName] hat sich dem Kult der Alten angeschlossen.#!\n\nEin Bote bringt die Nachricht: [tog_mission_target.GetTitledFirstName] hat lange zugehört und dann darum gebeten, das Buch ein zweites Mal vorgelesen zu bekommen. Geschworen wurde bei Lug und beim Dagda.\n\nDer Kult der Alten hat einen Herrn mehr."
 tog_quest.0721.b: "Der walisische Barde, [tog_bard_2.GetFirstName]: Ruhm an den Höfen der Könige."
 tog_quest.0721.desc: "Drei haben sich gemeldet. Ein Fili aus Irland, der ohne Zögern die Abstammung von zwanzig Königen hersagt. Ein walisischer Barde mit klarer Stimme, der am Hof von Gwynedd gesungen hat. Und ein älterer Sänger aus der Armorica, der wenig spricht, aber Lieder kennt, die niemand mehr weiß.\n\nNur einer wird bleiben."
 tog_quest.0721.c: "Der Sänger aus der Armorica, [tog_bard_3.GetFirstName]: die alten Lieder, die besänftigen."
 tog_quest.0712.t: "Nachricht von [tog_missionary.GetFirstName]"
 tog_quest.0730.a: "„Das ist erst der Anfang.“"
 tog_send_companions_decision_effect_tt: "Jeder Gefährte reist in seine Heimat und versucht, einen Grafen für den Kult der Alten zu gewinnen. Je mehr er dich schätzt, desto besser seine Chancen. Sie kehren in einigen Monaten zurück."
 tog_quest.0730.a.tt: "Das Wort des Buches verbreitet sich. Der Kult der Alten wächst."
 tog_test_skip_step7_decision: "TEST: Bei Schritt 8 beginnen"
 tog_quest.0721.t: "Die Barden"
 tog_quest.0712.other: "[tog_missionary.GetFirstName] hat das Buch zu [tog_mission_target.GetTitledFirstName] gebracht.\n\n"
 tog_quest.0712.peredur: "[tog_missionary.GetFirstName] ist nach Norden gezogen. Bei [tog_mission_target.GetTitledFirstName] hat er das Buch aus dem Gedächtnis aufgesagt, ohne eine Zeile auszulassen, und dabei die Strophen an den Fingern abgezählt. Beim Weg zum heiligen Hügel hat er links und rechts verwechselt, aber niemand hat es bemerkt.\n\n"
 tog_quest.0712.triumph: "#P [tog_mission_target.GetTitledFirstName] hat sich dem Kult der Alten angeschlossen.#!\n\nEin Bote bringt die Nachricht: [tog_mission_target.GetTitledFirstName] hat vor allen Leuten bei Lug und beim Dagda geschworen. Seitdem singen die Barden dort deinen Namen in der großen Halle.\n\nDer Kult der Alten hat einen Herrn mehr, und einen Verbündeten."
 tog_quest.0712.lailoken: "Lailoken wollte trotz seines Alters gehen. Er kam bei [tog_mission_target.GetTitledFirstName] an, auf seinen Stab gestützt. Er sprach, wie alte Leute sprechen, lange, von Dingen, an die sich niemand mehr erinnert.\n\n"
 tog_quest.0712.nest: "[tog_missionary.GetFirstName] ist nach Wales zurückgekehrt. Zuerst sprach sie nicht von Göttern: Sie sprach von der alten Eiche von Môn, von ihrer Großmutter, von den Frauen, die den Baum hüteten, ohne zu wissen warum. [tog_mission_target.GetTitledFirstName] ließ sie reden.\n\n"
 tog_quest.0712.gofraid: "[tog_missionary.GetFirstName] ist mit einem Bündel Waren und großer Lust zu reden auf den Inseln gelandet. Bei [tog_mission_target.GetTitledFirstName] hat er seine Felle verkauft, mehr getrunken als vernünftig und von Lug wie von einem alten Freund gesprochen.\n\n"
 tog_quest.0712.chased: "#N [tog_mission_target.GetTitledFirstName] wurde nicht bekehrt.#!\n\nEin Bote bringt die Nachricht: [tog_mission_target.GetTitledFirstName] ließ [tog_missionary.GetFirstName] unter dem Geschrei des Kaplans mit Stockschlägen davonjagen. An diesem Hof spricht man von dir, und nicht im Guten."
 tog_quest.0712.gwion: "[tog_missionary.GetFirstName] ist an den Solway zurückgekehrt, wo die Seinen seit jeher heimlich beteten. Er bat, [tog_mission_target.GetTitledFirstName] zu sehen, und sprach die Gebete in der alten Sprache, ohne etwas zu erklären.\n\n"
 tog_quest.0712.eogan: "[tog_missionary.GetFirstName] kam mit seinem Hirtenstab und seinen Geschichten nach Irland. Er setzte sich an den Tisch von [tog_mission_target.GetTitledFirstName] und erzählte, wie nur er es kann, vom Haus des Dagda und der List des Óengus.\n\n"
 tog_quest.0712.wounded: "#N [tog_mission_target.GetTitledFirstName] wurde nicht bekehrt.#!\n\nEin Bote bringt die Nachricht: Die Männer des Priesters von [tog_mission_target.GetTitledFirstName] haben [tog_missionary.GetFirstName] an einer Wegbiegung aufgelauert, zusammengeschlagen und in einem Graben liegen lassen. [tog_missionary.GetFirstName] kehrt zurück, mit den Spuren der Schläge."
 tog_quest.0712.ursin: "[tog_missionary.GetFirstName] ist wieder nach Burgund aufgebrochen, die Carnyx auf der Schulter. Vor der Burg von [tog_mission_target.GetTitledFirstName] blies er so lange ins Horn, bis jemand herauskam und fragte, was er wolle.\n\n"
 tog_test_random_opinions_decision: "TEST: Zufällige Meinungen der Gefährten"
 tog_test_random_opinions_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: gibt jedem Gefährten eine zufällige Meinung von dir (+80, +40, −20 oder −60), um die Missionen zu testen."
 trait_tog_blood_of_myrddin: "Blut des Myrddin"
 trait_tog_blood_of_myrddin_desc: "Er behauptet, von Myrddin abzustammen, dem Wilden der Wälder, der die Zukunft sah und der Sohn eines Dämons gewesen sein soll. Niemand weiß, ob das stimmt, aber der alte Mann weigert sich hartnäckig zu sterben, und er sieht kommen, was andere nicht sehen."
 tog_second_sight_modifier: "Lailokens zweites Gesicht"
 tog_second_sight_modifier_desc: "Lailoken sieht, was ausgeheckt wird, bevor es ausgeheckt wird: Intrigen gegen dich sind schwerer zu verbergen."
 tog_bard_welsh_modifier: "Barde der Alten"
 tog_bard_fili_modifier_desc: "Ein Fili aus Irland sagt das Buch und die Stammbäume auf: Frömmigkeit und Wissen."
 tog_bard_welsh_modifier_desc: "Ein walisischer Barde singt das Buch von Hof zu Hof: Prestige und die Gunst der Vasallen."
 tog_bard_breton_modifier: "Sänger der Alten"
 tog_bard_breton_modifier_desc: "Ein Sänger aus der Armorica kennt Lieder, die niemand mehr weiß: Sie besänftigen das Herz."
 tog_bard_fili_modifier: "Fili der Alten"
 tog_mission_res_wounded: "wurde verwundet"
 tog_mission_res_pending: "unterwegs"
 tog_empty: ""
 tog_mission_res_lost: "hat niemanden überzeugt"
 tog_mission_res_chased: "wurde verjagt"
 tog_mission_res_triumph: "hat einen Grafen bekehrt, der dein Lob singt"
 tog_mission_res_won: "hat einen Grafen bekehrt"
 tog_mission_line_tog_eogan: "\n• [Story.MakeScope.Var('tog_eogan').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_eogan')]"
 tog_mission_line_tog_nest: "\n• [Story.MakeScope.Var('tog_nest').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_nest')]"
 tog_mission_line_tog_gofraid: "\n• [Story.MakeScope.Var('tog_gofraid').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_gofraid')]"
 tog_mission_line_tog_ursin: "\n• [Story.MakeScope.Var('tog_ursin').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_ursin')]"
 tog_mission_line_tog_gwion: "\n• [Story.MakeScope.Var('tog_gwion').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_gwion')]"
 tog_mission_line_tog_peredur: "\n• [Story.MakeScope.Var('tog_peredur').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_peredur')]"
 tog_mission_line_tog_lailoken: "\n• [Story.MakeScope.Var('tog_lailoken').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_lailoken')]"
 tog_quest.0721.county_tt: "In zwei Monaten werden seine Lieder die Grafschaft, in der dein Hof residiert, für den Kult der Alten gewonnen haben."
 tog_quest.0722.t: "Die Lieder des Barden"
 tog_quest.0722.desc: "Seit zwei Monaten singt [tog_bard.GetFirstName] das Buch auf den Märkten, bei Abendrunden, auf Hochzeiten, überall, wo man ihm zuhören will. Die Kinder können die Lieder vor ihren Gebeten auswendig. Die Alten nicken: Das waren die Geschichten ihrer Großeltern.\n\nEines Morgens liest der Priester die Messe in einer fast leeren Kirche. Ganz [tog_bard_county.GetName] singt das Buch."
 tog_quest.0722.a: "„Sing weiter.“"
 tog_quest.0712.yes: "Ein Herr mehr für die alten Götter."
 tog_quest.0712.no: "Dann ein andermal."
 tog_quest.0730.nolords: "Als er verstummt, applaudiert niemand. Sie bleiben lange sitzen, wie man nach einem Gebet sitzen bleibt. Diesmal haben deine Gefährten keinen Herrn gewonnen. Aber in den Dörfern, durch die sie gezogen sind, summt man schon Stellen aus dem Buch, ohne zu wissen, woher sie kommen.\n\nDie Herren kommen später. Die Lieder sind schon unterwegs."
 tog_quest.0730.lords: "Als er verstummt, klopft es an der Tür. Ein Bote kommt, dann noch einer. Herren, denen du nie begegnet bist, von deinen Gefährten gewonnen, senden dir ihre Grüße. Sie fragen, wann sie ihrerseits kommen dürfen, um das Buch zu hören.\n\nVor Jahren hattest du nur einen Stein, den niemand lesen konnte. Heute Abend hat der Kult der Alten seine Herren, seinen Barden und seine Lieder."
 tog_obj_step10: "Das Wort des Buches verbreitet sich in den Dörfern. Der Kult der Alten wächst."
 tog_test_skip_step8_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: richtet die Gefährten ein, gründet bei Bedarf den Kult und öffnet Schritt 10; die Seuche bricht im folgenden Monat aus."
 tog_test_skip_step8_decision: "TEST: Bei Schritt 10 beginnen"
 tog_obj_plague: "Eine Viehseuche verwüstet ein benachbartes Herzogtum. Geh hin und entzünde dort die Feuer von Beltaine."
 tog_obj_fires: "Die Feuer von Beltaine im Herzen des heimgesuchten Herzogtums entzünden."
 tog_story_old_groves_plague: "Von der Seuche heimgesuchtes Herzogtum"
 tog_cattle_plague_modifier: "Viehseuche"
 tog_cattle_plague_modifier_desc: "Das Vieh stirbt in den Ställen und auf den Feldern. Reliquien und Segnungen helfen nicht."
 nick_tog_voice_of_lug: "die Stimme des Lug"
 nick_tog_voice_of_lug_desc: "Hat die Feuer von Beltaine entzündet, und Lug sprach durch diesen Mund."
 fervor_gain_tog_miracle: "Wunder der Beltaine-Feuer"
 tog_beltaine_fires_decision: "Die Feuer von Beltaine entzünden"
 tog_beltaine_fires_decision_desc: "Das abgeschabte Buch aus Dunkeld sagte es: An Beltaine trieb man das Vieh zwischen zwei Feuern hindurch, gegen Krankheiten. Die Mönche konnten nichts gegen die Seuche tun. Die alten Götter vielleicht."
 tog_beltaine_fires_decision_tooltip: "Du brichst in das von der Seuche heimgesuchte Herzogtum auf."
 tog_beltaine_fires_decision_confirm: "Auf den Weg"
 tog_beltaine_fires_decision_effect_tt: "Du machst dich auf den Weg in das heimgesuchte Herzogtum."
 tog_quest.0900.t: "Die Viehseuche"
 tog_quest.0900.desc: "Ein durchreisender Händler erzählt, was er im Herzogtum [tog_plague_duchy.GetNameNoTier] gesehen hat. Kühe, die auf den Feldern liegen, stehen nicht mehr auf. Man verbrennt die Ställe mit den Tieren darin. Familien essen ihr Saatgut. Die Bischöfe haben die Reliquien hervorgeholt, die Mönche haben die Herden gesegnet. Nichts hilft.\n\nDu erinnerst dich an eine Seite des abgeschabten Buches aus Dunkeld: An Beltaine entzündete man zwei Feuer und trieb das Vieh zwischen den Flammen hindurch, „gegen Krankheiten“."
 tog_quest.0900.a: "„Wir müssen dorthin.“"
 tog_quest.0900.a.tt: "Du kannst nun die Entscheidung #V Die Feuer von Beltaine entzünden#! treffen."
 tog_quest.0901.t: "Die Menge"
 tog_quest.0901.desc: "Die Nachricht ist dir vorausgeeilt. Als du ankommst, sind sie schon da. Hunderte, aus ganz [tog_plague_duchy.GetNameNoTier] gekommen mit dem Vieh, das ihnen geblieben ist: magere Kühe, hustende Schafe, eine Ziege, die ein Kind am Strick hält. Sie wissen nicht, wer du bist. Sie wissen nur, dass die Gebete der Mönche nichts geändert haben und dass man sagt, du kennst andere Gebete.\n\nDeine Gefährten haben das Holz bereitgelegt: zwei Scheiterhaufen aus Eiche, zu beiden Seiten des Weges. Die Sonne geht unter. Niemand spricht."
 tog_quest.0901.a: "„Entzündet die Feuer.“"
 tog_quest.0902.t: "Die Stimme des Lug"
 tog_quest.0902.desc: "Die ganze Nacht ziehen die Tiere zwischen den Flammen hindurch, eines nach dem anderen, und du sprichst die Worte des Buches. Gegen Morgen legt sich der Wind mit einem Schlag. Die beiden Feuer neigen sich einander zu und vereinen sich über dem Weg zu einem Bogen. Drei Raben kreisen dreimal darüber und fliegen dann nach Westen davon.\n\nAm Morgen stehen die Tiere auf. Sie fressen.\n\nDu steigst auf den Stein am Wegrand. Die Menge verstummt. Und die Worte, die aus deinem Mund kommen, sind nicht deine: „Ich bin nicht in Uisneach gestorben. Ich habe gewartet, dass man mein Feuer wieder entzündet.“\n\nDie alten Götter haben wieder Priester, Anhänger und ein Wunder. Doch die Christen halten noch die Länder, in denen man sie anbetete. Die heiligen Haine der Insel Britannien und Irlands werden erst frei sein, wenn diese Länder den alten Göttern zurückgegeben sind."
 tog_quest.0902.a: "„Lug ist zurückgekehrt.“"
 tog_quest.0902.a.tt: "Die Seuche verschwindet. Das Herzogtum [tog_plague_duchy.GetNameNoTier] schließt sich dem Kult der Alten an, und einige seiner Herren ebenfalls. Man nennt dich von nun an #V die Stimme des Lug#!, und ein Heer von #V Getreuen des Lug#! erhebt sich für dich; mit der Zeit werden weitere kommen.\n\nDeine Dynastie erhält den Kriegsgrund #V Das Land den alten Göttern zurückgeben#!: ein Herzogtum in Britannien oder Irland in christlicher Hand für einen Herrscher, eine Grafschaft für einen Abenteurer."
 tog_expel_saxons_cb: "Das Land den alten Göttern zurückgeben"
 tog_expel_saxons_cb_desc: "Den Christen ein Herzogtum in Britannien oder Irland wieder abnehmen."
 TOG_EXPEL_SAXONS_CB_NAME: "[TITLE.GetBaseNameNoTier] den alten Göttern zurückgeben"
 TOG_EXPEL_SAXONS_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Krieg, um [TITLE.GetBaseNameNoTier] den alten Göttern zurückzugeben"
 TOG_EXPEL_SAXONS_WAR_NAME_BASE: "Krieg, um das Land den alten Göttern zurückzugeben"
 tog_expel_saxons_victory_desc: "Der Angreifer erhält die Grafschaften des Herzogtums, die der Verteidiger und seine Vasallen halten."
 tog_expel_saxons_white_peace_desc: "Kein Gebiet wechselt den Besitzer."
 tog_expel_saxons_defeat_desc: "Der Angreifer zahlt Reparationen und verliert Prestige."
 tog_expel_saxons_adventurer_cb: "Das Land den alten Göttern zurückgeben"
 tog_expel_saxons_adventurer_cb_desc: "Den Christen eine Grafschaft in Britannien oder Irland wieder abnehmen und sich dort niederlassen."
 tog_expel_saxons_adventurer_victory_desc: "Der Angreifer nimmt die Grafschaft und wird ihr Herr."
 trait_tog_voice_of_lug: "Die Stimme des Lug"
 trait_tog_voice_of_lug_desc: "Hat den Kult der alten Götter neu gegründet. Beim Wunder der Beltaine-Feuer sprach Lug durch den Mund dieses Charakters. Von Zeit zu Zeit greifen Anhänger zu den Waffen, um sich ihm anzuschließen."
 tog_lug_host_name: "Getreue des Lug"
 tog_quest.0910.t: "Die Getreuen des Lug"
 tog_quest.0910.desc: "Eines Morgens kommen sie, zwei- oder dreihundert, mit Sensen, Äxten und aus Esche geschnitzten Speeren. Bauernsöhne, landlose Nachgeborene, ein paar alte Soldaten. Sie haben von den Feuern von Beltaine und vom Wort des Lug gehört. Sie knien vor dir nieder und schwören auf das Buch, dir überallhin zu folgen."
 tog_quest.0910.a: "„Steht auf. Lug braucht starke Arme.“"
 tog_test_saxons_cb_decision: "TEST: „Das Land den alten Göttern zurückgeben“ erhalten"
 tog_test_saxons_cb_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: schaltet den Kriegsgrund „Das Land den alten Göttern zurückgeben“ für deine Dynastie frei (und bekehrt dich bei Bedarf zum Glauben der Alten)."
 tog_spear_of_lug_decision: "Den Speer des Lug schmieden"
 tog_spear_of_lug_decision_desc: "Die Tuatha Dé hatten vier Schätze: den Stein von Fál, das Schwert des Nuada, den Kessel des Dagda und den Speer des Lug, der sein Ziel nie verfehlte. Der Krieg steht bevor. Die für die alten Götter kämpfen werden, brauchen ein Zeichen."
 tog_spear_of_lug_decision_tooltip: "Du lässt den Speer des Lug schmieden."
 tog_spear_of_lug_decision_confirm: "Man entzünde die Schmiede"
 tog_spear_of_lug_decision_effect_tt: "Der #V Speer des Lug#! kommt in deine Schatzkammer. Es gibt nur einen."
 tog_quest.0920.t: "Der Speer des Lug"
 tog_quest.0920.desc: "Der Schmied hat neun Tage und neun Nächte gearbeitet. Bei jedem Hammerschlag rief er Goibniu an, den Schmied der Götter. Als er dir den Speer reicht, ist die Spitze noch warm. Man hat die Sichel, die beiden Kreise und das Triskel darauf eingraviert.\n\nDu hebst ihn vor deinen Getreuen. Niemand sagt etwas. Alle wissen, was das bedeutet: Der Krieg beginnt."
 tog_quest.0920.a: "„Bis ans Meer.“"
 tog_spear_of_lug_name: "Speer des Lug"
 tog_spear_of_lug_description: "Geschmiedet von einem Getreuen, der Goibniu anrief, graviert mit der Sichel, den beiden Kreisen und dem Triskel. Wie der der Tuatha Dé soll er sein Ziel nie verfehlen."
 tog_spear_of_lug_modifier: "Speer des Lug"
 tog_quest.0188.t: "[tog_peredur.GetFirstName]s Speisekammer"
 tog_quest.0188.desc: "[tog_peredur.GetFirstName] kommt bei Einbruch der Nacht ins Lager zurück, gebeugt unter zwei Säcken. Er stellt sie vor dir ab und beginnt auszupacken, laut zählend: „Dreiundvierzig Eier. Zwei Käse, ein großer, ein kleiner. Ein Schinken. Elf Äpfel, einer davon angeschlagen. Ein Sack Gerste.“\n\nDu fragst ihn, woher das alles kommt. Er denkt nach. „Drei Pfennige, ein Lied, und ich habe einer Alten geholfen, ihre Ziege wiederzufinden.“ Eine Pause. „War vielleicht nicht ihre Ziege.“"
 tog_quest.0188.a: "„Ich will es nicht wissen.“"
 tog_quest.0189.t: "Die Jagd"
 tog_quest.0189.desc: "Die Vorräte gehen zur Neige. [tog_hunter.GetFirstName] verschwindet vor der Morgendämmerung, wortlos, mit Bogen und Speer. Am Abend kommt [tog_hunter.GetFirstName] mit einem Reh auf den Schultern und zwei Lachsen am Gürtel zurück. Heute Abend isst das Lager sich satt."
 tog_quest.0189.a: "„Man brate es.“"
 tog_test_provisions_decision: "TEST: 500 Vorräte"
 tog_test_provisions_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: fügt dem Lager 500 Vorräte hinzu."
 tog_m.talk_closed: "Die Mönche hier hören dir nicht mehr zu"
 tog_m.pay_closed: "Kein Mönch hier nimmt mehr dein Geld an"
 tog_m.steal_tt: "Die Intrige #V Das Buch entwenden#! beginnt. Du versuchst den Diebstahl, wann du willst, mit der Schaltfläche „Ausführen“."
 tog_m.steal_scheming: "Ein Diebstahl ist bereits in Vorbereitung"
 tog_steal_book: "Das Buch entwenden"
 tog_steal_book_action: "Entwenden"
 tog_steal_book_desc: "Ich werde das Buch aus der Bibliothek nehmen, die [SCHEME.GetTargetCharacter.GetShortUIName] hütet."
 tog_steal_book_desc_general: "Ein Buch aus der Bibliothek eines Klosters entwenden."
 TOG_STEAL_BOOK_SUCCESS_DESC: "Das Buch wird dir gehören, und niemand wird wissen, wer es genommen hat."
 tog_steal.success_tt: "Gelingt die Intrige, gehört das Buch dir. Andernfalls werden die Mönche etwas misstrauischer, aber du kannst es erneut versuchen."
 tog_quest.0260.t: "Eine Nacht im Kreuzgang"
 tog_quest.0260.desc: "Du kennst jetzt den Weg: die Gartenmauer, die Küchentür, die Treppe, die auf der siebten Stufe knarrt. Der Bruder Bibliothekar schläft bei seinen Büchern. Bald stehen die Mönche zur Matutin auf.\n\nVielleicht ist es heute Nacht."
 tog_quest.0260.d: "Auf eine bessere Nacht warten."
 tog_quest.0261.t: "Der Bruder Bibliothekar"
 tog_quest.0261.desc: "Der Bruder Bibliothekar redet gern, und er mag Wein. Auf dem Markt, bei einem Krug, erzählt er dir alles. Er sagt dir, welche Bücher er hütet und welche er niemandem leiht. Er sagt dir auch, dass die hintere Truhe seit dem letzten Winter schlecht schließt."
 tog_quest.0261.a: "„Noch einen Krug, Bruder?“"
 tog_quest.0261.b: "Nur zuhören."
 tog_quest.0262.t: "[tog_peredur.GetFirstName] hat gezählt"
 tog_quest.0262.desc: "[tog_peredur.GetFirstName] kommt vom Kloster zurück, wo er Eier verkaufen war. Er breitet vor dir ein mit Strichen bedecktes Pergament aus. „Vierzehn Mönche. Neun Stufen bis zur Bibliothek. Drei Fenster, eines ohne Laden. Der Pförtner schläft vom zweiten bis zum vierten Gebet. Und es gibt zweiundvierzig Bücher.“"
 tog_quest.0262.a: "„Du bist ein Schatz, [tog_peredur.GetFirstName].“"
 tog_quest.0263.t: "Ein nächtlicher Rundgang"
 tog_quest.0263.desc: "Du hattest die Hand schon an der Truhe, als sich am Ende des Gangs eine Laterne hob. Du bist mit leeren Händen durch ein Fenster entwischt. Niemand hat dich erkannt, aber die Mönche haben die Wache verdoppelt."
 tog_quest.0263.a: "„Beim nächsten Mal.“"
 tog_quest.0263.a.tt: "Die Intrige geht weiter, mit etwas geringeren Chancen. Mit der Schaltfläche „Ausführen“ kannst du es erneut versuchen."
 tog_reach_heric: "Héric treffen"
 tog_reach_heric_action: "Eintreten"
 tog_reach_heric_desc: "Ich werde den Pförtner von Saint-Germain überzeugen, mich mit [SCHEME.GetTargetCharacter.GetShortUIName] sprechen zu lassen."
 tog_reach_heric_desc_general: "Den Pförtner einer Abtei überzeugen, dich mit einem Mönch sprechen zu lassen."
 TOG_REACH_HERIC_SUCCESS_DESC: "Héric wird herauskommen, um mit dir zu sprechen."
 tog_heric.success_tt: "Gelingt die Intrige, ist Héric bereit, dich zu empfangen. Andernfalls wird der Pförtner etwas misstrauischer, aber du kannst es erneut versuchen."
 tog_quest.0320.t: "Das Tor von Saint-Germain"
 tog_quest.0320.desc: "Saint-Germain d'Auxerre ist für Fremde verschlossen. Der Pförtner hört dir durch die Klappe zu und wiederholt immer dasselbe: Die Brüder empfangen niemanden. Doch der Mönch, den du suchst, ist hinter diesen Mauern. Er heißt Héric, und man sagt, er kenne Caesar besser als jeder andere.\n\nDu musst den Pförtner gewinnen, oder jemanden, auf den er hört."
 tog_quest.0320.a: "„Ich komme wieder.“"
 tog_quest.0320.a.tt: "Die Intrige #V Héric treffen#! beginnt. Du versuchst dein Glück, wann du willst, mit der Schaltfläche „Ausführen“."
 tog_quest.0325.t: "An der Klappe"
 tog_quest.0325.desc: "Der Pförtner kennt dich jetzt. Er hat deine Geschenke angenommen und deinen Geschichten von der Insel Britannien gelauscht. Heute Abend zögert er, die Hand am Riegel."
 tog_quest.0325.a: "Weiter mit ihm reden."
 tog_quest.0325.d: "An einem anderen Tag wiederkommen."
 tog_quest.0326.t: "Die Klappe schließt sich"
 tog_quest.0326.desc: "Der Pförtner wollte gerade öffnen. Dann hallte ein Schritt im Kreuzgang, und die Klappe schlug zu. Am nächsten Tag hütet ein anderer Bruder das Tor, und er lächelt nicht."
 tog_quest.0326.a: "„Es wird andere Abende geben.“"
 trait_tog_cloistered: "Klausuriert"
 trait_tog_cloistered_desc: "Verlässt das Kloster nie."
 tog_obj_after: "Die alten Götter haben wieder Priester, Anhänger und ein Wunder. Es bleibt, den Christen die Länder wieder abzunehmen, in denen man sie anbetete, auf der Insel Britannien und in Irland, mit dem Kriegsgrund #V Das Land den alten Göttern zurückgeben#!. Deine Dynastie kann auch den #V Speer des Lug#! schmieden lassen."
 tog_quest.0511.c.tt: "Beide Fassungen nebeneinander: Das dauert länger, aber niemand ist gekränkt."
 tog_quest.0521.b.tt: "Er geht mit seiner Münze und wird nichts sagen."
 tog_verses.d_p20: "Buch der Druiden: #P +20#!"
 tog_verses.d_p15: "Buch der Druiden: #P +15#!"
 tog_verses.d_p10: "Buch der Druiden: #P +10#!"
 tog_verses.d_p5: "Buch der Druiden: #P +5#!"
 tog_verses.d_0: "Buch der Druiden: #V +0#!"
 tog_verses.d_m5: "Buch der Druiden: #N -5#!"
 tog_verses.d_m10: "Buch der Druiden: #N -10#!"
 tog_offerings_tent_domicile_building: "Zelt der Opfergaben"
 tog_offerings_tent_domicile_building_desc: "Wo immer das Lager haltmacht, kommen die Anhänger der alten Götter und bringen ihre Gaben: ein paar Münzen, Getreide, einen Käse, ein Lamm. Sie gehen mit einem Segen.\n\nJeden Monat bringen die Gläubigen #P 100#! Vorräte."
 tog_offerings_tent.tt.quest: "Von den Gläubigen bei der Gründung des Kults der Alten geschenkt"
 tog_offerings_tent_02_domicile_building: "Großes Zelt der Opfergaben"
 tog_offerings_tent_02_domicile_building_desc: "Seit dem Wunder der Beltaine-Feuer kommen die Anhänger der alten Götter von weit her, um ihre Gaben im Lager abzulegen. Das Zelt musste wachsen, um sie zu empfangen.\n\nJeden Monat bringen die Gläubigen #P 150#! Vorräte."
 tog_offerings_tent_02.tt.quest: "Von den Gläubigen nach dem Wunder der Beltaine-Feuer vergrößert"
 tog_offerings_02_modifier: "Große Gaben der Gläubigen"
 tog_offerings_02_modifier_desc: "Seit dem Wunder der Beltaine-Feuer kommen die Anhänger der alten Götter von weit her, um ihrem Herrn ihre Gaben zu bringen."
 tog_test_gold_decision: "TEST: 50 Gold"
 tog_test_gold_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: fügt 50 Gold hinzu."
 tog_test_reform_decision: "TEST: Voraussetzungen der Reform"
 tog_test_reform_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: gibt 5000 Frömmigkeit und alle Grafschaften der heiligen Stätten des Glaubens, bekehrt."
 tog_mabon.tried: "Dieser Weg ist bereits gescheitert"
 tog_quest.0222.b.good: "Der Verwalter willigt ein, bis zur nächsten Ernte zu warten: Das Feld ist gerettet."
 tog_quest.0222.b.bad: "Der Verwalter will nichts davon hören. Du musst etwas anderes finden."
 tog_quest.0222.d.good: "Der Verwalter erbleicht und zerreißt den Schuldschein selbst."
 tog_quest.0222.d.bad: "Der Verwalter ruft seine Männer, und du musst dich zurückziehen. Du musst etwas anderes finden."
 tog_quest.0222.c.good: "Der neue Schuldschein geht als echt durch: Die Schuld ist beglichen."
 tog_quest.0222.c.bad: "Der Verwalter bemerkt, dass die Tinte zu frisch ist. Du musst etwas anderes finden."
 tog_quest.0223.a.good: "Aedán sattelt sein Pferd ab. Er bleibt."
 tog_quest.0223.a.bad: "Aedán hört nicht auf dich. Du musst etwas anderes finden, bevor er aufbricht."
 tog_quest.0223.c.good: "Aedán hat zu viel Angst, um aufs Pferd zu steigen. Er wird nichts sagen."
 tog_quest.0223.c.bad: "Aedán bietet dir die Stirn. Du musst etwas anderes finden, bevor er aufbricht."
 tog_offerings_modifier: "Gaben der Gläubigen"
 tog_offerings_modifier_desc: "Die Anhänger der alten Götter bringen ihrem Herrn ihre Gaben: ein paar Münzen, Getreide, ein Lamm und viel Respekt."
 tog_druid_heritage_decision: "Das Erbe der Haine antreten"
 tog_druid_heritage_decision_desc: "Die alten Götter haben Anhänger, aber noch kein Heer. Damit dein Haus ihren Namen in die Schlacht trägt, müssen die Druiden und Barden es als Hüter der Haine anerkennen. Das kann man nicht mit Gold kaufen."
 tog_druid_heritage_decision_tooltip: "Deine Dynastie tritt das Erbe der Haine an."
 tog_druid_heritage_decision_confirm: "Mögen die Haine uns anerkennen"
 tog_druid_heritage_decision_effect_tt: "Deine Dynastie erhält den Kriegsgrund #V Das Land den alten Göttern zurückgeben#!: ein Herzogtum in Britannien oder Irland in christlicher Hand für einen Herrscher, eine Grafschaft für einen Abenteurer.\n\nSie kann auch den #V Speer des Lug#! schmieden lassen."
 tog_relic.0001.t: "Der Hüter"
 tog_relic.0001.desc.mistletoe: "Am Ufer der Meerenge erwartet dich eine alte Frau vor ihrem Haus, als hätte sie gewusst, dass du kommst. Sie lässt dich ein und öffnet eine Truhe. Darin liegt auf einem weißen Mantel ein geflochtener Mistelkranz. Die Blätter müssten längst vertrocknet sein. Sie sind grün.\n\n„Meine Mutter hat ihn gehütet“, sagt sie, „und ihre Mutter vor ihr. Die Römer haben die Eichen verbrannt, nicht alle Misteln.“"
 tog_relic.0001.desc.sickle: "In einem Wald, einen halben Tag von Chartres entfernt, winkt dir ein Köhler, ihm zu folgen. Er bleibt vor einer alten Eiche stehen und zieht unter ihren Wurzeln ein Lederbündel hervor. Darin liegt eine schmale, mit Winkeln verzierte Goldsichel.\n\n„Ein Hausierer aus der Armorica hat sie meinem Großvater dagelassen“, sagt er. „Er sagte, hierher müsse man sie zurückbringen, zu den Carnuten, wo sich die Druiden ganz Galliens versammelten.“"
 tog_relic.0001.desc.carnyx: "Am Fuß des Hügels von Alise sieht dir ein Bauer nach, wie du mit deinen Gefährten vorbeiziehst. Er legt seine Hacke ab und holt etwas unter einem Steinhaufen am Feldrand hervor: einen bronzenen Eberkopf mit offenem Maul, auf einem langen, verbogenen Rohr. Ein Kriegshorn.\n\n„So etwas kommt hier seit jeher aus der Erde“, sagt er. „Mein Vater sagte, das seien die Hörner der Alten. Du siehst aus wie jemand, der weiß, was man damit anfängt.“"
 tog_relic.0001.desc.cauldron: "Auf dem Hügel von Tara, nahe dem Stein von Fál, hütet ein alter Mann Schafe. Er führt dich zu seiner Hütte. In einer Ecke steht unter Fellen ein großer, geschwärzter Bronzekessel mit Eisenreifen, groß genug, um ein Kalb darin zu kochen.\n\n„Der Kessel des Dagda“, sagt er. „Niemand ging je ungesättigt von ihm fort. Meine Familie hütet ihn, seit die Könige nicht mehr hierherkommen.“"
 tog_relic.0001.desc.branch: "Am Strand, weit vom Kloster entfernt, sammelt eine Frau Seetang. Als sie deine Gefährten sieht, holt sie aus ihrem Korb einen silbernen Zweig, an dem drei kleine silberne Äpfel hängen. Der Wind bewegt ihn, und er klingt leise.\n\n„Der Zweig des Manannán“, sagt sie. „Wer ihn hört, vergisst seinen Kummer. Fänden ihn die Mönche, würden sie ihn zu einem Kelch einschmelzen.“"
 tog_relic.0001.desc.torc: "Auf dem Felsen von Peñalba, wo man noch den Namen des Lugus im Stein lesen kann, erwartet dich ein Hirte. Er öffnet die Hand. Darin liegt ein gedrehter goldener Torques, der in zwei Schlangenköpfen endet.\n\n„Die Alten trugen ihn am Hals und weihten ihn dem Gott“, sagt er. „Man hat ihn in einer Felsspalte gefunden. Niemand hier weiß mehr, wem er gehört.“"
 tog_relic.0001.desc.outro: "\n\nDer Hüter wird es nicht umsonst hergeben. Er ist alt, und der Winter naht."
 tog_relic.0001.a: "Zahlen, was verlangt wird."
 tog_relic.0001.b: "Feilschen."
 tog_relic.0001.b.success: "Der Hüter akzeptiert einen niedrigeren Preis"
 tog_relic.0001.b.failure: "Der Hüter packt die Reliquie wieder ein"
 tog_relic.0001.c: "„Behalte es. Es gehört hierher.“"
 tog_relic.0001.lost.tt: "Die Reliquie kehrt in ihr Versteck zurück. Vielleicht taucht sie bei einer anderen Pilgerfahrt wieder auf."
 tog_cauldron_name: "Der Kessel des Dagda"
 tog_cauldron_description: "Ein großer, geschwärzter Bronzekessel mit Eisenreifen, aufbewahrt nahe dem Stein von Fál in Tara. Er war einer der vier Schätze der Tuatha Dé: Niemand ging ungesättigt von ihm fort."
 tog_cauldron_modifier: "Kessel des Dagda"
 tog_silver_branch_name: "Der silberne Zweig"
 tog_silver_branch_description: "Ein silberner Zweig, an dem drei silberne Äpfel hängen, versteckt auf der Insel Iona. Man sagt, er komme aus dem Land des Manannán unter dem Meer, und wer ihn klingen hört, vergesse seinen Kummer."
 tog_silver_branch_modifier: "Silberner Zweig"
 tog_torc_name: "Der Torques des Lugus"
 tog_torc_description: "Ein gedrehter goldener Torques, der in zwei Schlangenköpfen endet, gefunden in einer Spalte des Felsens von Peñalba, wo die Keltiberer den Namen des Lugus einmeißelten."
 tog_torc_modifier: "Torques des Lugus"
 tog_convert_old_faith_decision: "Den Bund mit den alten Göttern erneuern"
 tog_convert_old_faith_decision_desc: "Die Heiligen haben weder die Sachsen noch die Nordmänner aufgehalten. Die Barden aber besingen noch die Kinder der Dôn, und die alten Steine stehen noch immer im Moor. Es ist Zeit, diesen Göttern zurückzugeben, was deine Ahnen ihnen schuldeten."
 tog_convert_old_faith_decision_tooltip: "Du sagst dich vom Glauben der Mönche los und wendest dich den alten Göttern zu."
 tog_convert_old_faith_decision_confirm: "Sollen die Mönche sagen, was sie wollen"
 tog_convert_old_faith_decision_effect_tt: "Wie bei jeder Bekehrung können dir deine nahe Familie und die Grafschaft deiner Hauptstadt folgen, und deine Vasallen erfahren davon."
