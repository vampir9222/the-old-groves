l_german:
 tog_story_old_groves: "Die Alten Haine"
 tog_story_old_groves_desc: "Ein Stein mit Zeichen, die niemand lesen kann. Bücher, abgeschrieben von Mönchen, die hassten, was sie schrieben. Irgendwo unter den Erzählungen schläft der Kult der Alten."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Gefährten"
 tog_story_old_groves_destination: "Ziel"
 tog_obj_stone: "Begib dich zum Stein auf #V [GetTitleByKey('b_skye').GetNameNoTier]#! und schreib ihn ab."
 tog_obj_wrong: "Folge Peredur zum Alten nach #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Finde den richtigen Alten in #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Befreie den Alten, den Banditen in den Hügeln von #V [GetTitleByKey('b_glencoe').GetNameNoTier]#! gefangen halten."
 tog_dest_stone: "zur Insel [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "nach [GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "nach [GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Den Stein untersuchen"
 tog_quest_start_decision_desc: "Man erzählt von einem seltsamen Stein auf der Insel [GetTitleByKey('b_skye').GetNameNoTier], mit Zeichen, die niemand lesen kann."
 tog_quest_start_decision_tooltip: "Die Suche nach den Alten Hainen beginnt."
 tog_quest_start_decision_confirm: "Nach [GetTitleByKey('b_skye').GetNameNoTier] aufbrechen"
 tog_quest_start_decision_effect_tt: "Die Suche nach den #V Alten Hainen#! beginnt. Du kannst sie im Fenster #V Situationen#! verfolgen."
 tog_quest_travel_decision: "Reisen [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Du machst dich auf den Weg zur nächsten Etappe der Suche."
 tog_quest_travel_decision_not_there: "Du bist bereits dort."
 tog_quest_travel_decision_effect_tt: "Du brichst zur nächsten Etappe auf. Bist du Abenteurer, folgt dir dein Lager."
 tog_poi_stone: "Der behauene Stein"
 tog_poi_stone_desc: "Ein umgestürzter piktischer Stein im Heidekraut, bedeckt mit Zeichen, die niemand lesen kann."
 tog_quest.0001.t: "Der Abtrünnige"
 tog_quest.0001.desc: "Früher nannte man dich Bruder Máel Brigte. Bei den Mönchen von Iona hast du lesen gelernt, die Psalmen gesungen und geglaubt, was man dich zu glauben hieß. Dann kamen die Nordmänner. Die Reliquien haben kein Schiff aufgehalten. Die Gebete haben keinen Bruder gerettet. Die Äbte sind mit den Büchern in Sicherheit gegangen. Du bist geblieben.\n\nHeute nennen dich die Gälen der Inseln Dubgall, den dunklen Fremden. Du hebst bei den Festen der Nordmänner das Horn, ohne daran zu glauben. Eine Frage lässt dich nicht mehr los: Wenn der Gott der Mönche die Seinen nicht schützen konnte, woran soll man dann noch glauben?\n\nHeute Morgen, als du auf die Heide stiegst, um nach Segeln Ausschau zu halten, hast du etwas anderes gefunden. Im Heidekraut trägt ein umgestürzter Stein Zeichen, die du nie gesehen hast: eine Mondsichel, einen gebrochenen Pfeil, zwei verbundene Kreise. Das sind keine Buchstaben. Es sind Bilder, mit zu viel Sorgfalt eingemeißelt, um bloßer Schmuck zu sein."
 tog_quest.0001.a: "Ich muss verstehen, was diese Zeichen sagen."
 tog_quest.0001.a.tt: "Die Suche nach den #V Alten Hainen#! beginnt. Du kannst sie im Fenster #V Situationen#! verfolgen."
 tog_quest.0001.b: "Das ist nur ein alter Stein."
 tog_quest.0001.b.tt: "Mit der Entscheidung „Den Stein untersuchen“ kannst du zum Stein zurückkehren."
 tog_quest.0002.t: "Ein Stein auf den Inseln"
 tog_quest.0002.desc: "Ein durchreisender Händler hat dir von einem seltsamen Stein im Norden erzählt, auf der Insel [GetTitleByKey('b_skye').GetNameNoTier]. Er liegt im Heidekraut über einer Bucht. Er trägt Zeichen, die niemand lesen kann, weder Gäle noch Nordmann. Das seien keine Buchstaben, sagte er, sondern Bilder: eine Mondsichel, ein gebrochener Pfeil, zwei verbundene Kreise.\n\nSeitdem gehen dir diese Zeichen nicht mehr aus dem Kopf."
 tog_quest.0002.a: "Ich muss diesen Stein sehen."
 tog_quest.0002.a.tt: "Die Suche nach den #V Alten Hainen#! beginnt. Du machst dich auf den Weg nach #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "Der Stein"
 tog_quest.0003.desc: "Der Stein liegt im Heidekraut über der Bucht, halb vom Moos zerfressen. Man erkennt eine Mondsichel, durchbohrt von einem gebrochenen Pfeil, zwei durch einen Balken verbundene Kreise und eine Zickzacklinie. Jemand hat ihn vor sehr langer Zeit aufgerichtet. Jemand anderes hat ihn umgestürzt: Man sieht noch die Spuren der Hebel.\n\nDu kratzt die Flechten mit dem Messer ab. Dann zeichnest du jedes Zeichen Strich für Strich auf einer Wachstafel nach."
 tog_quest.0003.a: "Den Stein abschreiben."
 tog_quest.0020.t: "Der Hirte"
 tog_quest.0020.desc: "Kaum hast du deine Abschrift beendet, raschelt hinter dir das Heidekraut. Ein junger Mann taucht auf, außer Atem, ein Seil in der Hand.\n\n„Habt Ihr keine Ziege gesehen?“\n\nEr heißt Peredur. Er hütet das Vieh des Weilers, wenn er es findet. Er hört mit großer Aufmerksamkeit zu und merkt sich alles, nur nicht, was es bedeutet. Er erblickt den Stein und vergisst die Ziege. Er geht um die Zeichen herum, um sie verkehrt herum zu sehen, dann richtig herum, dann sicherheitshalber noch einmal verkehrt herum.\n\n„Das ist Zeug für Alte. Ihr müsst zum Alten. Dem auf der anderen Seite des Wassers, links, wenn man aus der Bucht kommt. Aber Vorsicht: Je nachdem, wie man steht, ändert das alles! Mein Vater sagt, der Alte, das ist Esoterik.“\n\nDu lächelst: „Esoterik ist ein Wissen, das wenigen Eingeweihten vorbehalten ist. Man verbirgt es vor denen, die nicht bereit sind, es zu empfangen.“\n\nPeredur nickt lange, mit tiefsinniger Miene.\n\n„Joa, ist nicht falsch. Soll ich Euch zum Alten bringen? Es ist links. Na ja, glaube ich.“"
 tog_quest.0020.a: "Zeig es mir, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! geht voraus, Richtung #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!. Links herum."
 tog_quest.0021.t: "Der falsche Alte"
 tog_quest.0021.desc: "Peredurs Alter gibt es wirklich. Er lebt in einer Hütte am Wasser, in [GetTitleByKey('b_gairloch').GetNameNoTier]. Er ist achtzig Jahre alt und hat drei Zähne. Einen behauenen Stein hat er in seinem Leben nie gesehen. Dafür erzählt er dir lang und breit vom Hering, von den Robben und von der Frau, die er einst beinahe geheiratet hätte.\n\nPeredur kratzt sich am Kopf.\n\n„Ah. Vielleicht war's rechts.“\n\nDer alte Fischer dagegen hat verstanden, von wem ihr sprecht: „Der mit den Steinen redet? Der wohnt im Süden, auf der anderen Seite des Wassers, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Das weiß doch jeder.“"
 tog_quest.0021.a: "Diesmal wähle ich die Richtung."
 tog_quest.0021.a.tt: "Du machst dich auf den Weg nach #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, zum richtigen Alten."
 tog_quest.0022.t: "Das leere Haus"
 tog_quest.0022.desc: "Endlich findest du das Haus des Alten, tief in einem Tal, in das die Nordmänner nie kommen: Hier gibt es nichts zu holen. Die Tür ist eingeschlagen. Drinnen ist alles durchwühlt: die Truhe aufgebrochen, der Strohsack zerrissen, ein Stab auf der Schwelle entzweigebrochen.\n\nSchließlich kommt eine Nachbarin aus ihrem Haus. Vor drei Tagen kamen Banditen, Männer aus den Hügeln von [GetTitleByKey('b_glencoe').GetNameNoTier]. Sie behaupteten, der Alte verstecke Gold. Man sagt, seine Familie stamme von Myrddin ab, dem wahnsinnigen Barden, und so einer hat bestimmt einen Schatz. Sie fanden nichts. Also nahmen sie den Alten mit.\n\n„Er heißt Lailoken“, fügt sie hinzu. „Er ist achtundsechzig.“"
 tog_quest.0022.a: "Wir holen ihn."
 tog_quest.0022.a.tt: "Du machst dich auf den Weg zum Lager der Banditen in den Hügeln von #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "Das Lager der Banditen"
 tog_quest.0023.desc: "Das Lager liegt versteckt in einer Falte der Hügel von [GetTitleByKey('b_glencoe').GetNameNoTier]. Ein Dutzend Hütten, ein Feuer, gestohlene Pferde und etwa zwanzig gefährlich aussehende Männer. In der Mitte, an einen Pfahl gebunden, sieht dir ein magerer alter Mann wortlos entgegen.\n\nIhr Anführer tritt vor. Er will Gold. Er will immer Gold."
 tog_quest.0023.a: "Das Lager angreifen."
 tog_quest.0023.b: "Sie überreden, ihn freizulassen."
 tog_quest.0023.b.good: "Du überzeugst sie, dass der Alte nichts wert ist und dass man einen Nachfahren Myrddins nicht ungestraft misshandelt. Sie lassen ihn frei."
 tog_quest.0023.c: "Das Lösegeld zahlen."
 tog_quest.0023.c.tt: "Die Banditen nehmen das Gold und lassen den Alten frei."
 tog_quest.0050.t: "Ein Text der Götter"
 tog_quest.0050.a: "Komm, Lailoken."
 tog_quest.0010.t: "Die Wachstafel"
 tog_quest.0010.desc: "Eines Abends im Lager hast du die Tafel zu nah ans Feuer gelegt. Als du sie wieder aufnimmst, ist das Wachs zerlaufen. Der gebrochene Pfeil ist nur noch eine weiche Spur, und du weißt nicht mehr, ob er nach links oder nach rechts geneigt war. Peredur dagegen ist sicher, dass er nach links zeigte."
 tog_quest.0010.a: "Die Striche aus dem Gedächtnis nachziehen."
 tog_quest.0010.a.good: "Dein Gedächtnis ist zuverlässig: Die Abschrift ist gerettet."
 tog_quest.0010.a.bad: "Du zweifelst an jedem Strich und machst dir die ganze Nacht Vorwürfe."
 tog_quest.0010.b: "Die Tafel von nun an Peredur anvertrauen."
 tog_quest.0010.b.tt: "Peredur wird sie sorgfältig hüten. Verkehrt herum, vermutlich."
 tog_quest.0012.t: "Der Traum"
 tog_quest.0012.desc: "In einer Nacht im Lager kehrt die eingemeißelte Mondsichel in deinen Schlaf zurück. Sie steigt wie ein Mond am Himmel auf. Unter ihr brennen die beiden Kreise wie zwei Feuer.\n\nDu wachst auf mit der Gewissheit, etwas verstanden zu haben, ohne zu wissen, was."
 tog_quest.0012.a: "Den Traum aufschreiben, bevor er verblasst."
 tog_quest.0012.a.good: "Der Traum öffnet dir eine Spur. Du fühlst dich den alten Göttern näher."
 tog_quest.0012.a.bad: "Der Traum führt dich in die Irre. Du wachst verstörter auf als zuvor."
 tog_quest.0012.b: "Es ist nur ein Traum."
 tog_quest.0023.a.good: "Deine Männer fegen durch das Lager. Die Banditen fliehen in die Hügel und lassen ihre Beute zurück."
 tog_quest.0023.a.bad: "Der Angriff geht schief. Du kommst knapp davon, aber verwundet."
 tog_quest.0023.b.bad: "Sie lachen über deine Reden und jagen dich aus dem Lager."
 tog_quest.0024.t: "Knapp entkommen"
 tog_quest.0024.desc: "Der Angriff wurde zum Desaster. Die Banditen kannten jeden Felsen dieser Hügel, und ihr wart ohne Deckung. Du bist knapp davongekommen, mit einer Wunde in der Seite. Peredur hat dich halb getragen. Er schwor, einen Weg links herum zu kennen, und ausnahmsweise hatte er recht.\n\nDer Alte ist noch immer dort oben, an seinen Pfahl gebunden. Der Angriff ist gescheitert: Es gibt andere Wege, ihn dort herauszuholen."
 tog_quest.0024.a: "Überlegen, was noch zu versuchen bleibt."
 tog_quest.0024.a.tt: "Du wählst einen anderen Weg, den Alten zu befreien."
 tog_quest.0025.t: "Abgewiesen"
 tog_quest.0050.desc: "Der Alte reibt sich die Handgelenke und sieht dich lange an, ohne ein Wort des Dankes.\n\n„Warum? Niemand holt einen verrückten Alten tief aus den Hügeln. Was willst du von mir?“\n\nStatt einer Antwort reicht Peredur ihm deine Wachstafel. Der Alte dreht sie richtig herum. Er fährt mit dem Finger über die eingeritzte Mondsichel, dann über die beiden Kreise.\n\n„Das ist ein Text.“\n\n„Ein Text? Das sind Bilder.“\n\n„Für dich. Für die, die sie eingemeißelt haben, war es ein Text. Ein Text der Götter. Die Mönche haben die vertrieben, die ihn lesen konnten, und ihre Kinder haben gelernt zu schweigen. Ich weiß nur, dass man rundherum nicht pflügen darf.“\n\nEr gibt dir die Tafel zurück.\n\n„Aber die Mönche haben alles aufgeschrieben. Sogar, was sie hassten. Vor allem, was sie hassten. Willst du wissen, wer diese Götter waren, dann such in ihren Büchern: in Jarrow, in Whithorn, in Mynyw, in Dunkeld, in Applecross.“\n\nEr schweigt einen Moment, dann fügt er leiser hinzu:\n\n„Du hast mir das Leben gerettet. Bei uns zahlt man eine solche Schuld nicht mit Worten zurück: Ich folge dir. Außerdem habe ich mein Leben lang darauf geachtet, dass niemand um die Steine herum pflügt. Bevor ich sterbe, möchte ich sehen, was du mit diesem hier machst.“"
 tog_dest_camp: "zum Lager der Banditen"
 tog_quest.0025.desc: "Die Banditen haben dich bis zum Ende angehört. Dann brach ihr Anführer in Gelächter aus, und seine Männer begannen, dich auszubuhen. Der Alte, noch immer an seinen Pfahl gebunden, sagte kein Wort.\n\nBei solchen Männern nützen Reden nichts mehr. Bleiben Gewalt oder Gold."
 tog_quest.0025.c: "Gehen."
 tog_quest.0025.c.tt: "Mit der Entscheidung „Reisen zum Lager der Banditen“ kannst du zurückkehren."
 tog_travel_desc_stone: "Ein Stein mit Zeichen, die niemand lesen kann, erwartet dich auf der Insel [GetTitleByKey('b_skye').GetNameNoTier]. Du musst ihn mit eigenen Augen sehen und abschreiben."
 tog_travel_desc_wrong: "Peredur schwört, er kenne den Weg zum Alten: links, wenn man aus der Bucht kommt, Richtung [GetTitleByKey('b_gairloch').GetNameNoTier]. Er ist sich fast sicher."
 tog_travel_desc_house: "Laut dem alten Fischer wohnt der, der mit den Steinen redet, im Süden, auf der anderen Seite des Wassers, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Diesmal wählst du den Weg."
 tog_travel_desc_camp: "Banditen haben den alten Lailoken in die Hügel von [GetTitleByKey('b_glencoe').GetNameNoTier] verschleppt. Wenn ihn niemand holt, wird ihn niemand wiedersehen."
 tog_travel_desc_camp_return: "Der alte Lailoken ist noch immer Gefangener der Banditen in den Hügeln von [GetTitleByKey('b_glencoe').GetNameNoTier]. Es ist Zeit, zurückzukehren."
 tog_quest_travel_decision_confirm: "Aufbrechen"
 tog_quest.0050.a.tt: "#V Lailoken#! geht nun an deiner Seite. Die Bücher der Mönche erwarten dich in fünf Klöstern: Nutze die Entscheidung „Reisen zu einem Kloster“."
 tog_story_old_groves_monasteries: "Zu besuchende Klöster"
 tog_obj_books: "Die Bücher der Kopistenmönche beschaffen und dann lesen. Die Bücher werden von selbst gelesen, eines nach dem anderen, in der Reihenfolge, in der du sie beschafft hast."
 tog_obj_step3: "Die Bücher haben gesprochen: Nun musst du dorthin gehen, wo man einst die alten Götter verehrte."
 tog_dest_monastery: "zu einem Kloster"
 tog_travel_desc_monastery: "Die Bücher der Kopistenmönche erwarten dich in Jarrow, Whithorn, Mynyw, Dunkeld und Applecross. Wähle, wohin du gehst."
 tog_m.talk: "Den Mönch überzeugen."
 tog_m.talk_tt: "Deine Chancen hängen von deiner Diplomatie ab. Scheiterst du, hört dir der Mönch nicht mehr zu."
 tog_m.pay: "Den Mönch bezahlen, damit er das Buch herausschmuggelt."
 tog_m.steal: "Das Buch nachts stehlen."
 tog_m.force: "Mit meinen Männern die Tore aufbrechen."
 tog_m.leave: "Gehen."
 tog_m.leave_tt: "Mit der Entscheidung „Reisen zu einem Kloster“ kannst du zurückkehren."
 tog_m.pay_good: "Der Mönch bringt das Buch unter seiner Kutte heraus."
 tog_m.pay_refused: "Der Mönch lehnt verängstigt ab: Er wird dein Geld nicht mehr annehmen."
 tog_m.pay_kept: "Der Mönch nimmt das Geld und verschwindet."
 tog_m.force_good: "Die Tore geben nach: Du nimmst das Buch und einige Kostbarkeiten mit. Der örtliche Herr wird dir das nicht verzeihen, und die anderen Klöster werden auf der Hut sein."
 tog_m.force_bad: "Die Mönche und ihre Diener halten stand: Ihr werdet zurückgeschlagen. Die anderen Klöster werden auf der Hut sein."
 tog_m.talk_good: "Der Mönch vertraut dir das Buch an."
 tog_m.talk_bad: "Der Mönch verschließt sich: Er wird nicht mehr mit dir sprechen."
 tog_m.book_tt: "Das Buch gehört dir. Du wirst es in den kommenden Monaten lesen."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "Das Haus, in dem der ehrwürdige Beda sein ganzes Leben lang schrieb, steht am Ufer des Tyne hinter einer niedrigen Mauer. Die Nordmänner sind schon hier gewesen: Ein Flügel ist noch vom Feuer geschwärzt. Am Wegrand sortiert ein junger Mönch Äpfel. Er sieht dich neugierig näherkommen.\n\n„Sucht Ihr etwas, Fremder? Die Bibliothek liegt hinter dem Kreuzgang. Man sagt, sie enthalte alles, was Beda gelesen hat, und Beda hatte alles gelesen.“"
 tog_quest.0121.t: "Bedas Kirchengeschichte"
 tog_quest.0121.desc: "#italic Buch aus Jarrow mitgebracht ([GetTitleByKey('b_durham').GetNameNoTier]).#!\n\nDu liest Beda. Er erzählt, wie die Pikten auf langen Schiffen aus Skythien kamen und wie sie ihre Könige über die weibliche Linie wählten. Er erzählt auch, wie Colum Cille zu ihnen ging, um sie zu „taufen“. In der Vita des Heiligen liest du, dass er am Hof des Piktenkönigs Magiern gegenübertrat, die Wind und Nebel geboten.\n\nAm Rand hat ein Bruder, der in den Norden gereist war, notiert: „Die Pikten meißelten Zeichen in die Steine, die niemand mehr liest.“"
 tog_quest.0121.a: "Mein Stein hatte Priester."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "Das alte weiße Haus des heiligen Ninian überragt den Hafen. Die Mönche sind wenige und verlassen die Kapelle selten. Die Bibliothek geht auf einen Garten hinaus, dessen Mauer stellenweise einstürzt.\n\nIn der Hafenschänke trinkt ein Laienbruder zu viel. Er beklagt sich bei jedem, der es hören will, dass man ihn nicht genug bezahlt."
 tog_quest.0122.t: "Das Florilegium des Sedulius"
 tog_quest.0122.desc: "#italic Buch aus Whithorn mitgebracht ([GetTitleByKey('b_wigtown').GetNameNoTier]).#!\n\nEs ist ein Florilegium aus dem Frankenreich. Ein Ire am Hof des Kaisers hat darin Seiten der antiken Autoren abgeschrieben. Ein Römer, Plinius, berichtet, dass die Priester der Gallier Druiden hießen. Nichts war ihnen heiliger als die Mistel und die Eiche, die sie trägt. Sie schnitten sie am sechsten Tag des Mondes, weiß gekleidet, mit einer goldenen Sichel.\n\nEin anderer Autor sagt, dass sie Rechtsstreite entschieden und zwanzig Jahre lang eine riesige Zahl von Versen auswendig lernten. Sie lehrten, dass die Seelen nicht sterben: Nach dem Tod gehen sie in andere Körper über.\n\nIn den Heiligenviten ist der Druide nur ein lächerlicher Zauberer. Hier ist er ein Priester."
 tog_quest.0122.a: "Die Druiden waren ein Klerus."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "Am äußersten Ende von Wales, dem Meer zugewandt, ist das Haus des heiligen David von guten Mauern umgeben. Die Mönche von Mynyw haben zu oft fremde Segel kommen sehen. Sie beobachten dich vom Wehrgang aus, und ihre Diener behalten die Stöcke in der Hand."
 tog_quest.0123.t: "Die Geschichte der Briten"
 tog_quest.0123.desc: "#italic Buch aus Mynyw mitgebracht ([GetTitleByKey('b_st_davids').GetNameNoTier]).#!\n\nDas Buch erzählt die Geschichte der Briten. Es spricht von Vortigern, der die Sachsen gerufen hatte, und von dem Turm, der jede Nacht einstürzte. Zwei Drachen, ein roter und ein weißer, kämpften in seinen Fundamenten, und ein vaterloses Kind hatte es erraten. Es spricht auch von einem Kriegsführer namens Arthur, Sieger in zwölf Schlachten.\n\nHelden, keine Götter. Aber auch die Briten haben die Erinnerung an ihre Alten bewahrt."
 tog_quest.0123.a: "Die Briten warten noch auf ihre Alten."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "Im Herzen des alten Piktenlandes bewahrt Dunkeld einen Teil der Reliquien von Colum Cille. Man hat sie hierhergebracht, um sie vor den Nordmännern in Sicherheit zu bringen. Wachen hüten den Schrein Tag und Nacht. Niemand hütet die Bibliothek, einen niedrigen Raum am Ende des Kreuzgangs.\n\nEin Hund schläft quer vor ihrer Tür."
 tog_quest.0124.t: "Das abgeschabte Buch"
 tog_quest.0124.desc: "#italic Buch aus Dunkeld mitgebracht ([GetTitleByKey('b_dunkeld').GetNameNoTier]).#!\n\nEs ist ein hässliches Buch, ein Florilegium von mehreren Händen auf schlechtem Pergament. Mehrere Seiten wurden mit dem Messer abgeschabt, um Psalmen darüberzuschreiben. Hältst du sie gegen das Licht, erahnst du noch die Zeilen, die man tilgen wollte.\n\nEin Mönch hat darin ohne Kommentar Sätze abgeschrieben, die seine Lehrer hatten durchgehen lassen. Brigit war eine Göttin, die von den Dichtern verehrt wurde. Ana war die Mutter der Götter Irlands gewesen. An Beltaine entzündeten die Druiden unter großen Beschwörungen zwei Feuer und trieben das Vieh hindurch, gegen Krankheiten. Einst schwor man bei diesen Göttern und nicht bei Christus.\n\nDie Könige der alten Zeit waren keine Könige gewesen."
 tog_quest.0124.a: "Man hatte sie angebetet."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Gegenüber den Inseln ist das Haus des heiligen Máel Rubai klein und arm. Ein sehr alter, fast blinder Mönch hütet die Bibliothek. Man sagt, er kenne jedes Buch auswendig und lasse niemanden auch nur mit einem einzigen Blatt hinaus."
 tog_quest.0125.t: "Das Dindshenchas"
 tog_quest.0125.desc: "#italic Buch aus Applecross mitgebracht ([GetTitleByKey('b_applecross').GetNameNoTier]).#!\n\nEs ist eine Sammlung von Orten. Jeder Hügel, jede Quelle und jeder Stein der alten Zeit hat darin seine Geschichte, die seinen Namen erklärt. Da ist das große hohle Haus des Dagda am Boyne. Da ist der Hügel von Uisneach in der Mitte Irlands, wo Lug gestorben war. Da ist der Stein des Mabon an der Mündung des Solway…\n\nDie Bücher sagen, dass diese Götter existiert haben. Sie sagen nicht, wer sie waren."
 tog_quest.0125.a: "Ich werde dorthin gehen, wo man sie anbetete."
 tog_quest.0130.t: "Ein gestohlener Kult"
 tog_quest.0130.desc: "Du liest die fünf Bücher nebeneinander noch einmal. Die Namen kanntest du seit deiner Kindheit: Lug, der Dagda, Brigit, Balor, die Tuatha Dé Danann, der Stamm der Dana. Je nachdem, wer erzählte, waren es Könige, Ahnen oder Dämonen. Jetzt verstehst du, dass es die Ruinen eines Kultes sind. Eines echten Kultes, mit seinen Göttern, seinen Orten und seinen Priestern. Und man hat ihn euch gestohlen.\n\nDie Mönche haben ihre Kirchen auf die Hügel gebaut, auf denen man vor ihnen betete. Sie haben ihre Kreuze auf die Steine gepflanzt und ihren Heiligen die Namen der Göttinnen gegeben. Was sie nicht zerstören konnten, haben sie getauft. Was sie nicht taufen konnten, haben sie sterben lassen. Und was sie an seine Stelle gesetzt haben, dient vor allem dazu, die Köpfe zu beugen: dem Herrn gehorchen, den Zehnten zahlen, in einer Sprache beten, die niemand versteht.\n\nDie alten Götter dagegen waren von hier. Man hat sie euch genommen. Du wirst sie zurückholen.\n\nDie Ortssammlung aus Applecross hat dir die Orte genannt: das Haus des Dagda am Boyne, den Hügel von Uisneach, den Stein des Mabon am Ufer des Solway. Dort betete man sie an. Dort wirst du beginnen."
 tog_quest.0130.a: "Ich hole zurück, was man uns gestohlen hat."
 tog_quest.0130.a.tt: "Die Bücher haben Ortsnamen genannt. Nächster Schritt: die heiligen Orte besuchen, #V Brú na Bóinne#!, #V Uisneach#! und dann den #V Stein des Mabon#!. Nutze die Entscheidung „Reisen zu einem heiligen Ort“."
 tog_quest.0140.t: "Zu welchem Kloster?"
 tog_quest.0140.desc: "Die Bücher der Kopistenmönche erwarten dich in mehreren Klöstern. Welches willst du besuchen?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_jarrow').GetValue|0] km"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_whithorn').GetValue|0] km"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_mynyw').GetValue|0] km"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_dunkeld').GetValue|0] km"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_applecross').GetValue|0] km"
 tog_quest.0140.stay: "Nicht jetzt."
 tog_test_skip_step1_decision: "TEST: zu Schritt 2 springen"
 tog_test_skip_step1_decision_desc: "Testentscheidung: startet die Suche falls nötig, fügt Peredur und Lailoken hinzu und öffnet Schritt 2 (die Klöster)."
 tog_test_skip_step1_decision_confirm: "Zu Schritt 2 springen"
 tog_quest.0161.t: "Eine verschlossene Tür"
 tog_quest.0161.desc: "Der Mönch hat dich bis zum Ende angehört. Dann schüttelte er ohne Zorn den Kopf, so wie man einem Mann ein Almosen verweigert, der keines braucht.\n\n„Ich werde für Euch beten.“ Er nahm seine Arbeit wieder auf und sah dich nicht mehr an. Von ihm bekommst du das Buch nicht."
 tog_quest.0161.a: "Ich muss einen anderen Weg finden."
 tog_quest.0162.t: "Ein verängstigter Mönch"
 tog_quest.0162.desc: "Beim Anblick deiner Börse erbleichte der Mönch. Er wich einen Schritt zurück, bekreuzigte sich und lief fast zur Kapelle davon.\n\nDein Geld wird dir diese Bibliothek nicht öffnen."
 tog_quest.0162.a: "Ich muss einen anderen Weg finden."
 tog_quest.0163.t: "Ein unehrlicher Mönch"
 tog_quest.0163.desc: "Der Mönch hat das Geld genommen. Er versprach, nach der Komplet wiederzukommen, das Buch unter der Kutte. Du hast die ganze Nacht hinter der Mauer gewartet.\n\nAm Morgen sagte man dir, er sei auf Pilgerfahrt gegangen. Niemand weiß, wann er zurückkehrt."
 tog_quest.0163.a: "Ich muss einen anderen Weg finden."
 tog_quest.0165.t: "Zurückgeschlagen"
 tog_quest.0165.desc: "Die Mönche läuteten die Glocke, noch bevor deine Männer das Tor erreichten. Diener, Bauern des Gutes und einige Bewaffnete strömten von überall herbei, mit Mistgabeln, Stöcken und Steinen.\n\nIhr musstet zurückweichen. Von diesem Tag wird man in allen Klöstern des Landes sprechen."
 tog_quest.0165.a: "Ich muss einen anderen Weg finden."
 tog_quest.0153.t: "Die Bänderquelle"
 tog_quest.0153.desc: "Am Grund eines kleinen Tals entspringt eine Quelle zwischen den Wurzeln einer alten Esche. Ihre Zweige sind mit Bändern, Stoffresten und Haarsträhnen behängt. Daneben hat man ein ganz neues Kreuz aufgestellt. Doch auch die Bänder sind frisch.\n\nEine alte Frau taucht ein Tuch in die Quelle und knotet es murmelnd an einen Zweig."
 tog_quest.0153.a: "Sie fragen, was sie da tut."
 tog_quest.0153.a.good: "Sie sagt dir Worte, die ihre Großmutter sie gelehrt hat. Darin erkennst du den Namen einer Göttin."
 tog_quest.0153.a.bad: "Sie bekommt Angst und geht wortlos davon."
 tog_quest.0153.b: "Selbst ein Band knoten."
 tog_quest.0154.t: "Der Priester und der Stein"
 tog_quest.0154.desc: "Auf dem Platz eines Dorfes lässt ein Priester einen Menhir mit Vorschlaghämmern zerschlagen. Die Dorfbewohner sehen wortlos zu. Eine Frau hatte am Fuß des Steins Milch abgestellt. Man hat sie an einen Pfahl gebunden, und der Priester verkündet, dass sie wegen Götzendienstes ausgepeitscht wird."
 tog_quest.0154.a: "Mit dem Schwert in der Hand eingreifen."
 tog_quest.0154.a.good: "Die Männer des Priesters fliehen. Die Frau ist frei, und das ganze Dorf hat es gesehen."
 tog_quest.0154.a.bad: "Die Frau ist befreit, aber du hast Schläge eingesteckt."
 tog_quest.0154.b: "Mit Worten eingreifen."
 tog_quest.0154.b.good: "Der Priester gibt vor dem Dorf nach und bindet die Frau los."
 tog_quest.0154.b.bad: "Der Priester demütigt dich vor allen."
 tog_quest.0154.c: "Versteckt bleiben und weiterziehen."
 tog_quest.0155.t: "[tog_peredur.GetFirstName]s Abkürzung"
 tog_quest.0155.desc: "„Ich kenne eine Abkürzung“, hat [tog_peredur.GetFirstName] heute Morgen gesagt. Jetzt ist es Mittag, der Nebel ist gefallen, und ihr steht mitten in einem Moor, das noch niemand je gesehen hat.\n\n„Da lang. Glaube ich. Na ja, früher war's da lang.“"
 tog_quest.0155.a: "[tog_peredur.GetFirstName] vertrauen."
 tog_quest.0155.a.good: "Wider Erwarten findet er den Weg."
 tog_quest.0155.a.bad: "Ihr lauft bis zum Abend im Kreis."
 tog_quest.0155.b: "Jemanden aus der Gegend suchen."
 tog_quest.0155.b.good: "Ein Hirte bringt euch wieder auf den Weg."
 tog_quest.0155.b.bad: "Der Hirte macht sich über euch lustig und sagt nichts Brauchbares."
 tog_quest.0171.t: "Das anvertraute Buch"
 tog_quest.0171.desc: "Der Mönch hat dich lange angesehen. Dann ging er wortlos zur Bibliothek. Er kam mit einem in ein Tuch gewickelten Buch zurück.\n\n„Bringt es zurück, wenn Ihr es gelesen habt. Und sagt niemandem, dass ich es war.“"
 tog_quest.0171.a: "Ich werde es sorgfältig lesen."
 tog_quest.0172.t: "Der Preis eines Buches"
 tog_quest.0172.desc: "Der Mönch zählte die Münzen zweimal und ließ sie in seinem Ärmel verschwinden. Dann bestellte er dich hinter die Mauer, nach der Komplet.\n\nDiesmal kam er. Das Buch war unter seiner Kutte."
 tog_quest.0172.a: "Alles ist käuflich, sogar bei Mönchen."
 tog_quest.0173.t: "Ein Buch weniger"
 tog_quest.0173.desc: "Niemand hielt Wache, die Tür war nicht verschlossen und die Truhe nur halb. Du bist vor der Morgendämmerung hinausgeschlüpft, das Buch unter dem Hemd.\n\nWenn die Mönche es bemerken, bist du längst weit weg."
 tog_quest.0173.a: "Niemand hat mich gesehen."
 tog_quest.0174.t: "Die Tore gaben nach"
 tog_quest.0174.desc: "Die Tür gab beim dritten Schlag nach. Die Mönche flüchteten psalmensingend in die Kapelle. Niemand wagte, sich in den Weg zu stellen.\n\nDeine Männer nahmen, was glänzte. Du hast das Buch genommen. Man wird lange von diesem Tag sprechen, und nicht im Guten."
 tog_quest.0174.a: "Das Buch gehört mir."
 tog_quest.0158.t: "Der Alte und der Stein"
 tog_quest.0158.desc: "Beim Aufwachen ist Lailokens Decke leer. Ihr sucht ihn den ganzen Vormittag. Schließlich findet Peredur ihn oben auf einem Hügel, an einen aufrechten Stein gelehnt. Er spricht leise mit ihm, wie mit einem alten Bekannten.\n\n„Mach nicht so ein Gesicht. Er antwortet mir nicht, ich bin nicht verrückt. Aber wenn man mit einem Stein redet, hört man am Ende, was man wirklich denkt.“ Er klopft auf den Granit. „Deine Mönche haben alles aufgeschrieben, weil sie Angst hatten zu vergessen. Die Alten haben nichts aufgeschrieben: Sie vertrauten dem Gedächtnis. Die Götter findest du nicht in Büchern, Kleiner. Die Bücher sagen dir nur, wo du suchen musst.“"
 tog_quest.0158.a: "„Sprich weiter, ich höre dir zu.“"
 tog_quest.0158.b: "„Wir haben dich den ganzen Vormittag gesucht!“"
 tog_quest.0159.t: "Wenige Winter"
 tog_quest.0159.desc: "Seit drei Tagen geht Lailoken immer langsamer. Heute Morgen ist er in den Schlamm gefallen und hat lange gebraucht, um wieder aufzustehen. Er lehnt jede Hilfe ab.\n\n„Halt nicht meinetwegen an. Mir bleiben nur wenige Winter, und die verbringe ich lieber auf der Straße als am Feuer.“ Er hustet lange. „Aber wenn du etwas langsamer gehen könntest, würde ich nicht Nein sagen.“"
 tog_quest.0159.a: "Für ihn langsamer gehen."
 tog_quest.0159.a.tt: "Du nimmst dir die Zeit, die es braucht. Lailoken wird es nicht vergessen."
 tog_quest.0159.b: "Im gleichen Schritt weitergehen."
 tog_story_old_groves_books: "Gelesene Bücher"
 tog_story_old_groves_books_min: "0"
 tog_story_old_groves_books_max: "5"
 tog_quest.0181.t: "Die Rechnung stimmt"
 tog_quest.0181.desc: "An der Brücke verlangt der Zöllner drei Pfennige pro Kopf und zählt elf für eine Gruppe von acht. Bevor du den Mund aufmachen kannst, tritt [tog_peredur.GetFirstName] vor.\n\n„Acht. Und du hast zweiundvierzig Pfennige in deiner Börse, sechs Hühner hinter deinem Haus, und dir fehlen vier Zähne. Drei oben, einer unten.“\n\nDer Zöllner macht den Mund sehr schnell wieder zu."
 tog_quest.0181.a: "„Du hast [tog_peredur.GetFirstName] gehört.“"
 tog_quest.0181.b: "Ohne Widerrede zahlen."
 tog_quest.0182.t: "[tog_peredur.GetFirstName] liest"
 tog_quest.0182.desc: "Abends am Feuer hat [tog_peredur.GetFirstName] eines der Bücher genommen. Er hält es verkehrt herum, sehr ernst, mit gerunzelter Stirn.\n\n„Ich weiß nicht, was da steht. Aber auf dieser Seite sind tausendzweihundertsiebenundvierzig Buchstaben, und viel zu viele ‚e‘. Das muss ein trauriges Buch sein.“"
 tog_quest.0182.a: "Ihm ein paar Buchstaben beibringen."
 tog_quest.0182.b: "In Gelächter ausbrechen."
 trait_tog_dagda_cauldron: "Kessel des Dagda"
 trait_tog_dagda_cauldron_desc: "Im Dunkel des Grabhügels hat der Dagda diesem Charakter seinen Kessel gezeigt, den, von dem niemand hungrig fortgeht."
 trait_tog_dagda_club: "Keule des Dagda"
 trait_tog_dagda_club_desc: "Im Dunkel des Grabhügels hat der Dagda diesem Charakter seine Keule gezeigt: Ein Ende tötet, das andere erweckt zum Leben."
 trait_tog_dagda_harp: "Harfe des Dagda"
 trait_tog_dagda_harp_desc: "Im Dunkel des Grabhügels hat der Dagda diesem Charakter seine Harfe gezeigt, die die Jahreszeiten in Ordnung bringt."
 tog_story_old_groves_places: "Zu besuchende heilige Orte"
 tog_obj_places: "Die heiligen Orte besuchen, von denen die Bücher sprechen: Brú na Bóinne, Uisneach und den Stein des Mabon."
 tog_dest_place: "zu einem heiligen Ort"
 tog_travel_desc_places: "Die Bücher sprechen von Orten, an denen man die alten Götter verehrte: das Haus des Dagda am Boyne, der Hügel von Uisneach, der Stein des Mabon. Wähle, wohin du gehst."
 tog_p.leave_tt: "Mit der Entscheidung „Reisen zu einem heiligen Ort“ kannst du zurückkehren."
 tog_test_skip_step2_decision: "TEST: Bei Schritt 3 beginnen"
 tog_test_skip_step2_decision_desc: "Testentscheidung, vor der Veröffentlichung zu entfernen: überspringt bei Bedarf die Schritte 1 und 2 und öffnet direkt Schritt 3."
 tog_quest.0240.t: "Zu welchem heiligen Ort?"
 tog_quest.0240.desc: "Die Bücher haben dir Ortsnamen genannt. Welchen willst du sehen?"
 tog_quest.0240.bru: "Brú na Bóinne, das Haus des Dagda ([GetTitleByKey('b_drogheda').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_bru').GetValue|0] km"
 tog_quest.0240.uisneach: "Der Hügel von Uisneach ([GetTitleByKey('b_uisneach').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_uisneach').GetValue|0] km"
 tog_quest.0240.mabon: "Der Stein des Mabon ([GetTitleByKey('b_dumfries').GetNameNoTier]), etwa [ROOT.Char.MakeScope.Var('tog_km_mabon').GetValue|0] km"
 tog_quest.0240.mabon_locked: "Du musst zuerst Brú na Bóinne und Uisneach gesehen haben"
 tog_quest.0201.t: "Das Haus des Dagda"
 tog_quest.0201.desc: "Der Grabhügel ist größer als alles, was du je von Menschen gebaut gesehen hast. Ein runder Hügel, umringt von großen, mit Spiralen bedeckten Steinen. Die Nordmänner aus Dublin sind hier gewesen: Man sieht noch die Gräben, die sie auf der Suche nach Gold gezogen haben.\n\nEin Hirte, Eógan, weidet seine Schafe am Fuß des Hügels. Er kennt die alten Geschichten seines Großvaters. Der Priester hat ihm verboten, sie zu erzählen, und ohnehin fragt ihn niemand danach. Du fragst. Also erzählt er. Hier wohnte der Dagda, der gute Gott, mit seinem Kessel, seiner Keule und seiner Harfe. Sein Sohn Óengus nahm ihm das Haus durch eine List: Er erbat es für „einen Tag und eine Nacht“, und diese Worte bedeuteten „für immer“.\n\n„Wer früher darin schlief, kam mit Visionen heraus. Seit der Zeit meines Großvaters hat das niemand mehr getan.“"
 tog_quest.0201.a: "Die Nacht im Grabhügel verbringen."
 tog_quest.0202.t: "Die Nacht im Grabhügel"
 tog_quest.0202.desc: "Eógan hat dir den Eingang gezeigt und sich dann draußen an einen Stein gesetzt. Der Gang ist eng, so niedrig, dass man gebückt gehen muss. Am Ende ist es völlig dunkel.\n\nKälte steigt aus dem Boden. Nach einer Weile weißt du nicht mehr, ob deine Augen offen oder geschlossen sind. Du hörst Geräusche: tropfendes Wasser vielleicht, oder jemanden, der atmet."
 tog_quest.0202.a: "Bis zum Morgen durchhalten."
 tog_quest.0202.good: "Du behältst einen klaren Kopf und verstehst, was du erlebst."
 tog_quest.0202.bad: "Die Angst hält dich die ganze Nacht gefangen."
 tog_quest.0203.t: "Die Vision"
 tog_quest.0203.desc: "Gegen Ende der Nacht ist jemand bei dir in der Kammer. Ein riesiger, dickbäuchiger Mann in einer zu kurzen Tunika, der im Dunkeln leise lacht. Er legt dir drei Dinge hin: einen Kessel, der nie leer wird, eine Keule, deren eines Ende tötet und deren anderes zum Leben erweckt, eine Harfe, die die Jahreszeiten in Ordnung bringt.\n\n„Nimm eines. Nur eines.“"
 tog_quest.0203.a: "Der Kessel."
 tog_quest.0203.b: "Die Keule."
 tog_quest.0203.c: "Die Harfe."
 tog_quest.0204.t: "Der Morgen"
 tog_quest.0204.desc: "Als du herauskommst, schmerzt das Licht in deinen Augen. Eógan ist noch da, an seinen Stein gelehnt, den Mantel über den Schultern. Er hat nicht geschlafen.\n\nEr sieht dich lange an. „Du hast etwas gesehen. Das sieht man.“ Er steht auf und hebt seinen Stab auf. „Mein Leben lang habe ich diese Geschichten erzählt, ohne zu wissen, ob ich daran glaube. Ich will sehen, wie es weitergeht. Und wenn du sie aufschreiben willst, braucht es ja jemanden, der sie dir alle erzählt.“"
 tog_quest.0204.a: "„Komm.“"
 tog_quest.0204.a.tt: "#V Eógan#! nimmt seinen Stab und folgt dir."
 tog_quest.0211.t: "Der Hügel von Uisneach"
 tog_quest.0211.desc: "Früher hieß es, vom Gipfel dieses Hügels aus sehe man ganz Irland. Dabei ist er nicht hoch. Der Wind legt das Gras flach. Niemand ist da, nur Schafe und hier und da Dinge, die Menschen zurückgelassen haben: ein großer gespaltener Stein, geschwärzte Erde, ein alter Brunnen.\n\nDie Bücher sagten, dies sei die Mitte Irlands und Lug sei hier gestorben. Aber sie sagten nicht, wie man liest, was man vor Ort findet."
 tog_quest.0211.a: "Die Zeichen untersuchen."
 tog_quest.0212.t: "Der gespaltene Stein"
 tog_quest.0212.desc: "Es ist ein gewaltiger Kalksteinblock, in mehrere Stücke gespalten, als hätte ihn etwas von innen zerbrochen. Die Leute hier nennen ihn den Stein der Teilungen. Was bedeutet er?"
 tog_quest.0212.a: "Die Mitte: Hier treffen sich die Provinzen, und hier ist Lug begraben."
 tog_quest.0212.b: "Der Blitz des christlichen Gottes, der ein Götzenbild zerschmettert hat."
 tog_quest.0212.c: "Ein Grenzstein zwischen zwei Höfen."
 tog_quest.0213.t: "Die geschwärzte Erde"
 tog_quest.0213.desc: "Auf einer großen Fläche ist die Erde schwarz. Sie ist mit verbrannten Knochen und Holzkohle durchsetzt, Schicht um Schicht, als hätte man hier jahrhundertelang große Feuer entzündet. Warum?"
 tog_quest.0213.a: "Ein von den Nordmännern niedergebranntes Dorf."
 tog_quest.0213.b: "Das Feuer eines Heiligen, wie das des Patrick in Slane."
 tog_quest.0213.c: "Die Feuer von Beltaine, zwischen denen man das Vieh hindurchtrieb."
 tog_quest.0214.t: "Der Brunnen"
 tog_quest.0214.desc: "Es ist ein alter, fast zugeschütteter Brunnen, umgeben von flachen, von Knien abgewetzten Steinen. Man hat Nadeln, Münzen und kleine Knochen hineingeworfen. Was suchte man auf seinem Grund?"
 tog_quest.0214.a: "Ein von einem Heiligen gesegneter Brunnen, zum Heilen."
 tog_quest.0214.b: "Ein Tor zur Anderswelt, durch das die Seelen gehen."
 tog_quest.0214.c: "Ein einfacher Wasservorrat für die Schafe."
 tog_u.wrong_tt: "Eine falsche Deutung ist ein Vergehen gegen den Gott des Ortes. Man muss beim ersten Zeichen neu beginnen."
 tog_quest.0215.t: "Eine falsche Spur"
 tog_quest.0215.desc: "Du wälzt den Gedanken hin und her, und er hält nicht. Nichts in den Büchern weist in diese Richtung. Du hast diesen Ort mit den Augen eines Mönchs betrachtet, nicht mit denen der Alten. Alles, was du verstanden zu haben glaubtest, bricht zusammen.\n\nDer Wind bläst stärker, wie ein Vorwurf. Du musst von vorn beginnen."
 tog_quest.0215.a: "Beim gespaltenen Stein neu beginnen."
 tog_quest.0216.t: "Lug der vielen Künste"
 tog_quest.0216.desc: "Am Fuß des gespaltenen Steins sitzend, fügst du zusammen, was du verstanden hast.\n\nDie Ortssammlung aus Applecross sagte es: Uisneach ist die Mitte Irlands, wo sich die Provinzen treffen, und Lug ist dort gestorben. Die Leute hier sagen, der gespaltene Stein markiere sein Grab. Lug ist der König, der vereint.\n\nDas abgeschabte Buch aus Dunkeld sagte es: An Beltaine entzündeten die Druiden zwei große Feuer und trieben das Vieh hindurch, gegen Krankheiten. Hier hat man sie jahrhundertelang entzündet. Lug ist das Licht, das schützt.\n\nDas Florilegium aus Whithorn sagte es: Die Seelen sterben nicht, sie gehen hinüber. Der Brunnen ist ein Tor, und was man hineinwarf, war für die auf der anderen Seite. Lug geht zwischen den Welten hin und her.\n\nDas sind drei Gesichter eines einzigen Gottes. Die Leute hier erzählen, dass er eines Tages Einlass in Tara verlangte. Er stellte sich als Zimmermann, Schmied, Harfner, Krieger, Dichter und Arzt vor. Man ließ ihn ein, weil niemand sonst alles konnte. Er ist der Gott aller Künste. Vielleicht der größte von allen."
 tog_quest.0216.a: "Lug ist der Größte."
 tog_quest.0220.t: "Der letzte Ort"
 tog_quest.0220.desc: "An diesem Abend liest du im Feuerschein noch einmal die Ortssammlung aus Applecross. Das Haus des Dagda hat dir seine Schätze gezeigt, der Hügel von Uisneach hat dir Lug gezeigt. Ein Name bleibt: der Stein des Mabon am Ufer des Solway, jenseits des Meeres. Das Buch sagt nur, dass man dort Milch ausgoss und dass der Gott des Ortes jung war."
 tog_quest.0220.a: "„Auf zum Solway.“"
 tog_quest.0220.a.tt: "Der #V Stein des Mabon#! erwartet dich. Nutze die Entscheidung „Reisen zu einem heiligen Ort“."
 tog_quest.0221.t: "Der Stein des Mabon"
 tog_quest.0221.desc: "Endlich bist du am Ufer des Solway, in dem Dorf, in dem den Büchern zufolge der Stein des Mabon steht. Auf dem Platz umgeben ein paar niedrige Häuser einen Brunnen. Frauen waschen Wäsche, Kinder jagen einer Gans hinterher. Alle verstummen, wenn du vorbeigehst.\n\nVom Platz aus sieht man den Stein. Er steht allein auf einem Feld am Ende des Dorfes, höher als ein Mann. Als du nach seinem Namen fragst, sagen die Dorfbewohner, er habe keinen, er sei ein Stein wie jeder andere, und sie schauen weg. Doch in der Mulde zu seinen Füßen steht frische Milch.\n\nAm Ende des Feldes vermisst ein Mann des Herrn das Land mit einem Seil. Eine alte Frau flüstert dir zu, ohne dich anzusehen: „Er will uns das Feld wegen einer Schuld nehmen. Das Feld des Steins.“"
 tog_quest.0221.a: "Meine Hilfe anbieten."
 tog_quest.0222.t: "Die Schuld"
 tog_quest.0222.desc: "Die Schuld ist alt, von Zinsen aufgebläht. Der Verwalter des christlichen Herrn macht keinen Hehl daraus, dass es ihm um den Stein geht: Sein Herr will ihn niederreißen und an seiner Stelle eine Kapelle bauen.\n\nIst das Feld verloren, dann auch der Stein."
 tog_quest.0222.a: "Die Schuld bezahlen."
 tog_quest.0222.b: "Mit dem Verwalter verhandeln."
 tog_quest.0222.c: "Den Schuldschein fälschen."
 tog_quest.0223.t: "Der Verräter"
 tog_quest.0223.desc: "Das Feld ist gerettet. Noch am selben Abend kommen die Dorfbewohner zu dir. Sie laden dich zum Ritus des nächsten Mondes am Fuß des Steins ein und sagen dir, dass der Hüter dich sehen will.\n\nDoch am Vorabend des Ritus ertappst du Aedán, einen jungen Mann aus dem Dorf, wie er bei Einbruch der Nacht ein Pferd sattelt. Er will zum Priester. Er sagt, was ihr tut, sei Sünde, und er wolle nicht mit euch brennen. Die Dorfbewohner sehen dich an: Sie warten, was du tun wirst."
 tog_quest.0223.a: "Ihn überreden zu bleiben."
 tog_quest.0223.b: "Sein Schweigen erkaufen."
 tog_quest.0223.c: "Ihn einschüchtern."
 tog_quest.0223.d: "Ihn verschwinden lassen."
 tog_quest.0223.d.tt: "Aedán wird mit niemandem sprechen. Die Dorfbewohner werden es nicht vergessen."
 tog_quest.0222.d: "Den Verwalter einschüchtern."
 tog_quest.0224.t: "Der Hüter"
 tog_quest.0224.desc: "Bei Neumond stehen etwa zwanzig von ihnen mit abgeblendeten Laternen um den Stein. Ein Mann tritt vor: Gwion, der Hüter. Sein Vater hütete den Stein vor ihm, und der Vater seines Vaters vor ihnen. Er gießt die Milch aus und spricht Worte in einer Sprache, die niemand mehr versteht. Zum ersten Mal hörst du den Namen des Gottes dieses Ortes: Mabon, der göttliche Sohn, der junge Jäger.\n\nNach dem Ritus willst du mit ihm sprechen. Er kehrt dir den Rücken zu. „Du hast das Feld gerettet, und dafür danke ich dir. Aber mit Fremden spreche ich nicht über die Götter. Der letzte Fremde, der hierherkam, war der Priester.“\n\nDie alte Frau nimmt dich beiseite. Der Priester hat Gwions Tochter Eluned ins Kloster im Tal gebracht, um sie vor dem Heidentum ihres Vaters zu retten. Seitdem spricht Gwion kaum noch mit jemandem. Eluned ist sein einziges Kind. Ihr sollte er die Gebete beibringen."
 tog_quest.0224.a: "Eluned aus dem Kloster holen."
 tog_quest.0224.a.tt: "Eine Intrige beginnt, um #V Eluned#! zu befreien. Wenn du sie für bereit hältst, nutze die Schaltfläche „Ausführen“ der Intrige."
 tog_free_daughter: "Eluned befreien"
 tog_free_daughter_action: "Befreien"
 tog_free_daughter_desc: "Ich hole [SCHEME.GetTargetCharacter.GetShortUIName] aus dem Kloster, in das der Priester sie gesperrt hat, und bringe sie zu ihrem Vater zurück."
 tog_free_daughter_desc_general: "Gwions Tochter aus dem Kloster holen, in das der Priester sie gesperrt hat."
 TOG_FREE_DAUGHTER_SUCCESS_DESC: "Eluned wird zu ihrem Vater zurückkehren, und Gwion wird bereit sein zu sprechen."
 tog_obj_daughter: "Eluned, Gwions Tochter, aus dem Kloster holen."
 tog_obj_learning: "Von Gwion lernen, was seine Ahnen bewahrt haben."
 tog_quest.0230.t: "Ein gescheiterter Versuch"
 tog_quest.0230.desc: "Alles war bereit: das Seil, das Pferd, die bestochene Pförtnerin. Doch in dieser Nacht wachte die Äbtissin lange in der Kapelle, und ihr musstet aufgeben.\n\nDie Schwestern sind etwas misstrauischer geworden. Du musst es noch einmal versuchen."
 tog_quest.0230.a: "Beim nächsten Mal."
 tog_quest.0230.a.tt: "Die Intrige geht weiter: Mit der Schaltfläche „Ausführen“ kannst du es erneut versuchen."
 tog_quest.0232.t: "Eluned"
 tog_quest.0232.desc: "Eluned ist zur Stunde der Matutin über die Klostermauer gestiegen, in einem zu großen Mantel. Am Morgen ist sie im Dorf. Gwion drückt sie lange wortlos an sich.\n\nAm Abend setzt er sich zu dir ans Feuer. „Du hast das Feld gerettet. Du hast mir meine Tochter zurückgegeben. Ein Fremder tut so etwas nicht umsonst. Was suchst du?“\n\nAlso erzählst du ihm alles: den Stein mit den Zeichen im Heidekraut von [GetTitleByKey('b_skye').GetNameNoTier], die den Mönchen abgenommenen Bücher, die Nacht im Haus des Dagda, die Zeichen von Uisneach. Die Götter, deren Namen seine Ahnen bewahrt haben, hatten einst Priester, Feste und Orte, und man hat sie euch genommen. Du willst wissen, wer sie wirklich waren.\n\nGwion hört zu, ohne dich zu unterbrechen. Dann sagt er langsam: „Ich habe dich im Traum gesehen, bevor du kamst. Ein Mann kam aus dem Westen, mit Büchern unter dem Arm. Ich wusste nicht, was das bedeutete.“ Er betrachtet die Häuser des Dorfes. „Zur Zeit meines Großvaters waren sie hundert. Jetzt sind es zwanzig. Wenn ich sterbe, wird niemand mehr die Gebete sprechen, außer Eluned, und der Priester wird sie zurückholen. Meine Ahnen haben den Stein gehütet und auf etwas gewartet. Ich glaube, das bist du. Du hast die Bücher, ich habe die Worte, die man zu den Göttern sprach. Nimm uns mit, meine Tochter und mich, und ich lehre dich alles, was ich weiß.“"
 tog_quest.0232.a: "„Deine Gebete werden nicht mit dir sterben.“"
 tog_quest.0232.a.tt: "#V Gwion#! und seine Tochter #V Eluned#! ziehen mit dir. In den kommenden Monaten wird Gwion dich lehren, was er weiß."
 tog_quest.0233.t: "Der Sohn der Mutter"
 tog_quest.0233.desc: "Am Abend beginnt Gwion mit dem Gott seines Steins. Mabon ist der Sohn der Modron, der Mutter. Man nahm ihn seiner Mutter weg, als er drei Nächte alt war, und niemand wusste, wo er war. Dann führten die ältesten Tiere der Welt, die Amsel, der Hirsch, die Eule, der Adler und der Lachs, die Suchenden zu seinem Gefängnis.\n\n„Er ist der junge Gott, der, den man befreit. Selbst die Römer haben zu ihm gebetet, entlang ihrer Mauer. Sie nannten ihn Apollo, weil sie wollten, dass alle Götter die ihren seien.“"
 tog_quest.0233.lailoken: "\n\nLailoken, der näher ans Feuer gerückt ist, fragt, welches der fünf Tiere das älteste war. „Der Lachs“, antwortet Gwion. Der Alte nickt zufrieden, als hätte er es schon gewusst."
 tog_quest.0233.a: "Der Gott, den man befreit."
 tog_quest.0234.t: "Die vier Tore"
 tog_quest.0234.desc: "„Das Jahr hat vier Tore“, sagt Gwion. Samain, wenn der Sommer stirbt und die Toten zurückkommen, um sich ans Feuer zu setzen: Man lässt ihnen einen Platz und etwas zu essen. Imbolc, wenn die Mutterschafe Milch geben: das Fest der Brigit. Beltaine mit seinen zwei Feuern, zwischen denen man das Vieh hindurchtreibt. Lugnasad, zur Ernte: das Fest des Lug, mit Spielen und Ehen für ein Jahr und einen Tag.\n\n„Die Mönche haben die Daten behalten. Sie haben nur die Namen geändert.“"
 tog_quest.0234.lailoken: "\n\nLailoken lacht leise. In seinem Tal, sagt er, lösche man am Vorabend von Samain noch immer alle Feuer, und niemand wisse mehr, warum. Gwion erklärt es ihm. Der Alte bleibt lange still."
 tog_quest.0234.a: "Die Mönche haben die Namen geändert."
 tog_quest.0235.t: "Eide und Steine"
 tog_quest.0235.desc: "Gwion lehrt dich, wie man früher schwor: bei den Göttern seines Volkes, die Hand auf dem Stein, vor Zeugen. Wer seinen Eid brach, durfte nicht mehr an den Opfern teilnehmen. Niemand sprach mehr mit ihm, niemand aß mehr mit ihm. Das war schlimmer als der Tod.\n\nUnd die aufrechten Steine sind keine Gräber, oder nicht nur. „Man kam zu ihnen, um mit denen darunter zu sprechen. Dein Stein im Heidekraut, der mit den Zeichen, der hat gesprochen. Man muss nur wieder lernen, ihn zu hören.“"
 tog_quest.0235.lailoken: "\n\nLailoken legt Gwion die Hand aufs Knie. „Das habe ich ihm gesagt, an dem Tag, als er mich befreit hat: dass sein Stein ein Text ist.“ Gwion sieht ihn zum ersten Mal mit Respekt an."
 tog_quest.0235.a: "Wieder lernen, ihn zu hören."
 tog_quest.0236.t: "Die Gebete"
 tog_quest.0236.desc: "Wochenlang spricht Gwion dir die Gebete vor, eines nach dem anderen, in der Sprache, die niemand mehr versteht. Er lässt sie dich wiederholen, bis du sie kannst. „Nicht die Worte zählen. Sondern dass man sie weiter spricht.“\n\nAm letzten Abend erzählt er dir von etwas, das sein Großvater erzählte. Lange vor den Mönchen besiegten die Römer die Völker des Festlands in einer großen Schlacht, auf einem Hügel, auf dem, so sagt man, die Götter der Gallier verloren. Doch ein Dorf am Meer hielt ihnen viel länger stand als die anderen. „Niemand weiß, wo der Hügel war. Das Dorf, sagt man, liegt in der Armorica. Wenn von den Alten etwas geblieben ist, dann dort.“"
 tog_quest.0236.lailoken: "\n\nLailoken hat die Gebete zugleich mit dir gelernt. Er murmelt sie beim Gehen. Er verhaspelt sich oft, aber er hört nie auf."
 tog_quest.0236.a: "Wir müssen hin und nachsehen."
 trait_tog_awen: "Awen"
 trait_tog_awen_desc: "Die Gabe: die Inspiration der Dichter und Propheten. Manche Träume dieses Charakters werden wahr."
 TOG_COMPANION_HELPS: "Gefährte der Suche: hilft ohne Gegenleistung"
 tog_quest.0231.t: "Eine mondlose Nacht"
 tog_quest.0231.desc: "Alles ist bereit: das Seil, das im Wald versteckte Pferd, deine Gefährten auf ihren Posten rund um das Kloster. Die Nacht ist schwarz. Bald stehen die Schwestern zur Matutin auf.\n\nVielleicht ist das der richtige Moment. Vielleicht auch nicht."
 tog_quest.0231.a: "Mein Glück versuchen."
 tog_quest.0231.b: "Einen Vorteil nutzen."
 tog_quest.0231.b.tt: "Verbraucht 1 Vorteil: +20 % Chance für diesen Versuch."
 tog_quest.0231.c: "Zwei Vorteile nutzen."
 tog_quest.0231.c.tt: "Verbraucht 2 Vorteile: +40 % Chance für diesen Versuch."
 tog_quest.0231.d: "Auf eine bessere Nacht warten."
 tog_quest.0231.d.tt: "Du handelst heute Nacht nicht. Die Intrige geht weiter: Mit der Schaltfläche „Ausführen“ kannst du zurückkehren."
 tog_quest.0251.t: "Die Pförtnerin"
 tog_quest.0251.desc: "Die Pförtnerin ist alt und arm, und sie mag die Äbtissin nicht. Lailoken bettelte am Tor um Almosen. Sie hat ihm zu verstehen gegeben, dass eine Tür ein, zwei Nächte schlecht verschlossen bleiben kann, wenn der Preis stimmt. Oder wenn man mit ihr zu reden weiß."
 tog_quest.0251.a: "Ihr ein paar Münzen zustecken."
 tog_quest.0251.b: "Ihr Vertrauen gewinnen."
 tog_quest.0251.c: "Zu riskant."
 tog_quest.0252.t: "Die Äbtissin wird misstrauisch"
 tog_quest.0252.desc: "Die Äbtissin hat Fremde um das Kloster bemerkt. Sie hat an der Tür zum Schlafsaal der Novizinnen ein neues Schloss anbringen lassen, und eine Schwester wacht nun die ganze Nacht."
 tog_quest.0252.a: "Die Spuren verwischen."
 tog_quest.0252.a.tt: "Verbraucht 1 Vorteil: Das Misstrauen der Äbtissin legt sich."
 tog_quest.0252.b: "Wir kommen schon zurecht."
 tog_quest.0253.t: "Eine Nachricht von Eluned"
 tog_quest.0253.desc: "Auf dem Markt hat dir eine kleine Novizin ein Stück Pergament in die Hand gedrückt, ohne dich anzusehen. Es ist von Eluned. Sie weiß, dass man sie holen kommt. Sie schreibt, welches Fenster nicht schließt und zu welcher Stunde die wachende Schwester einschläft."
 tog_quest.0253.a: "Sie ist bereit."
 tog_quest.0254.t: "[tog_peredur.GetFirstName] zählt"
 tog_quest.0254.desc: "Du hast [tog_peredur.GetFirstName] unauffällig zum Auskundschaften geschickt. Er ist begeistert zurückgekommen. „Dreiundvierzig Fenster, sieben Türen, zweihundertzwölf Steine in der Gartenmauer.“ Er macht eine Pause. „Ich habe laut gezählt. Da war eine Schwester. Sie hat mich gefragt, warum.“"
 tog_quest.0254.a: "Lailoken das regeln lassen."
 tog_quest.0254.a.tt: "Lailoken sucht die Schwester auf. Er erklärt ihr, der Junge sei einfältig und zähle alles, sogar die Sterne. Das ist fast wahr. Niemand schöpft Verdacht."
 tog_quest.0254.b: "Zu spät."
 tog_portress_bought_modifier: "Eingeweihte Pförtnerin"
 tog_abbess_wary_modifier: "Wachsame Äbtissin"
 tog_eluned_message_modifier: "Nachricht von Eluned"
 tog_peredur_blunder_modifier: "Peredur hat laut gezählt"
 tog_monks_wary_modifier: "Wachsame Mönche"
 tog_librarian_talks_modifier: "Redseliger Bibliothekar"
 tog_peredur_map_modifier: "Peredurs Zählung"
 tog_porter_wary_modifier: "Wachsamer Pförtner"
 tog_story_old_groves_lessons: "Gwions Lehren"
