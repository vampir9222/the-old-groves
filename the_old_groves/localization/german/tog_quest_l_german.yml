l_german:
 tog_story_old_groves: "Die alten Haine"
 tog_story_old_groves_desc: "Ein Stein mit Zeichen, die niemand lesen kann. Bücher, abgeschrieben von Mönchen, die hassten, was sie schrieben. Irgendwo unter den Erzählungen schläft der Kult der Alten."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Gefährten"
 tog_story_old_groves_destination: "Ziel"
 tog_obj_stone: "Ziel: zum Stein reisen, nach #V [GetTitleByKey('b_skye').GetNameNoTier]#!, und seine Zeichen abschreiben."
 tog_obj_wrong: "Ziel: Peredur zum Alten folgen, nach #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Ziel: den echten Alten finden, in #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Ziel: den Alten befreien, den Banditen in den Hügeln von #V [GetTitleByKey('b_glencoe').GetNameNoTier]#! gefangen halten."
 tog_dest_stone: "zur Insel [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "nach [GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "nach [GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Den Stein studieren"
 tog_quest_start_decision_desc: "Man erzählt von einem seltsamen Stein auf der Insel [GetTitleByKey('b_skye').GetNameNoTier], mit Zeichen, die niemand lesen kann."
 tog_quest_start_decision_tooltip: "Beginnt die Quest der alten Haine."
 tog_quest_start_decision_confirm: "Nach [GetTitleByKey('b_skye').GetNameNoTier] aufbrechen"
 tog_quest_start_decision_effect_tt: "Beginnt die Quest der #V alten Haine#!. Verfolgt ihren Fortschritt im Fenster #V Situationen#!."
 tog_quest_travel_decision: "Reise [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Öffnet die Reise zum aktuellen Ziel der Quest."
 tog_quest_travel_decision_not_there: "Ihr seid bereits dort."
 tog_quest_travel_decision_effect_tt: "Ihr brecht zum Ziel der Quest auf. Ein Abenteurer verlegt sein Lager dorthin."
 tog_poi_stone: "Der gravierte Stein"
 tog_poi_stone_desc: "Ein umgestürzter piktischer Stein im Heidekraut, bedeckt mit Zeichen, die niemand lesen kann."
 tog_quest.0001.t: "Der Abtrünnige"
 tog_quest.0001.desc: "Einst nannte man dich Bruder Máel Brigte. Du hast bei den Mönchen von Iona lesen gelernt, die Psalmen gesungen und geglaubt, was man dich zu glauben lehrte. Dann kamen die Nordmänner. Die Reliquien hielten kein Schiff auf, die Gebete retteten keinen Bruder, und die Äbte brachten sich mit den Büchern in Sicherheit. Du bist geblieben.\n\nHeute nennen dich die Gälen der Inseln Dubgall, den dunklen Fremden. Du hebst das Horn bei den Festen der Nordmänner, ohne daran zu glauben, und eine Frage lässt dich nicht mehr los: Wenn der Gott der Mönche die Seinen nicht schützen konnte, woran soll man dann noch glauben?\n\nHeute Morgen, als du auf die Heide stiegst, um nach Segeln Ausschau zu halten, hast du etwas anderes gefunden: einen umgestürzten Stein im Heidekraut, mit Zeichen, die du nie gesehen hast. Ein Halbmond, ein gebrochener Pfeil, zwei verbundene Kreise. Keine Buchstaben. Bilder, mit zu viel Sorgfalt gesetzt, um bloßer Schmuck zu sein."
 tog_quest.0001.a: "Ich muss verstehen, was diese Zeichen sagen."
 tog_quest.0001.a.tt: "Beginnt die Quest der #V alten Haine#!. Verfolgt ihren Fortschritt im Fenster #V Situationen#!."
 tog_quest.0001.b: "Das ist nur ein alter Stein."
 tog_quest.0001.b.tt: "Ihr könnt später über eine Entscheidung zum Stein zurückkehren."
 tog_quest.0002.t: "Ein Stein auf den Inseln"
 tog_quest.0002.desc: "Ein durchreisender Händler hat dir von einem seltsamen Stein auf der Insel [GetTitleByKey('b_skye').GetNameNoTier] im Norden erzählt: Er liegt im Heidekraut über einer Bucht, mit Zeichen, die niemand lesen kann, weder Gäle noch Nordmann. Bilder, sagte er, keine Buchstaben. Ein Halbmond, ein gebrochener Pfeil, zwei verbundene Kreise.\n\nSeitdem gehen dir diese Zeichen nicht mehr aus dem Kopf."
 tog_quest.0002.a: "Ich muss diesen Stein sehen."
 tog_quest.0002.a.tt: "Die Quest der #V alten Haine#! beginnt. Ihr brecht nach #V [GetTitleByKey('b_skye').GetNameNoTier]#! auf."
 tog_quest.0003.t: "Der Stein"
 tog_quest.0003.desc: "Der Stein liegt im Heidekraut über der Bucht, halb vom Moos überwuchert: ein Halbmond, von einem gebrochenen Pfeil durchkreuzt, zwei durch einen Balken verbundene Kreise, eine Zickzacklinie. Jemand hat ihn vor sehr langer Zeit aufgerichtet, und jemand anderes hat ihn umgestürzt: Man sieht noch die Spuren der Hebel.\n\nDu kratzt die Flechten mit dem Messer ab und schreibst jedes Zeichen, Strich für Strich, auf eine Wachstafel ab."
 tog_quest.0003.a: "Den Stein abschreiben."
 tog_quest.0020.t: "Der Hirte"
 tog_quest.0020.desc: "Kaum hast du deine Abschrift beendet, raschelt hinter dir das Heidekraut. Ein junger Mann taucht auf, außer Atem, ein Seil in der Hand.\n\n„Habt Ihr keine Ziege gesehen?“\n\nEr heißt Peredur. Er hütet das Vieh des Weilers, wenn er es findet, und er hört mit großer Aufmerksamkeit zu, ohne sich etwas zu merken. Er erblickt den Stein, vergisst die Ziege und geht um die Zeichen herum, um sie verkehrt herum zu sehen, dann richtig herum, dann sicherheitshalber noch einmal verkehrt herum.\n\n„Das ist Zeug für Alte. Ihr müsst zum Alten. Dem auf der anderen Seite des Wassers. Links, wenn man aus der Bucht kommt. Aber Vorsicht: Je nachdem, wie man steht, ändert das alles! Mein Vater sagt, der Alte, das ist Esoterik.“\n\nDu lächelst: „Esoterik ist ein Wissen, das wenigen Eingeweihten vorbehalten ist und vor denen verborgen wird, die nicht bereit sind, es zu empfangen.“\n\nPeredur nickt lange, mit tiefsinniger Miene.\n\n„Joa, ist nicht falsch. Soll ich Euch zum Alten bringen? Es ist links. Na ja, glaube ich.“"
 tog_quest.0020.a: "Zeig ihn mir, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! schließt sich Euch an und führt Euch zum Alten, nach #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_quest.0021.t: "Der falsche Alte"
 tog_quest.0021.desc: "Peredurs Alter gibt es wirklich. Er lebt in einer Hütte am Wasser in [GetTitleByKey('b_gairloch').GetNameNoTier]. Er ist achtzig, hat drei Zähne und hat in seinem Leben noch nie einen gravierten Stein gesehen. Er erzählt dir lang und breit von Heringen, Robben und der Frau, die er einst beinahe geheiratet hätte.\n\nPeredur kratzt sich am Kopf.\n\n„Ah. Vielleicht war es rechts.“\n\nDer alte Fischer hat dagegen verstanden, wen ihr meint: „Der, der mit den Steinen spricht? Der lebt im Süden, auf der anderen Seite des Wassers, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Das weiß doch jeder.“"
 tog_quest.0021.a: "Diesmal wähle ich die Richtung."
 tog_quest.0021.a.tt: "Ihr brecht nach #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#! auf, zum echten Alten."
 tog_quest.0022.t: "Das leere Haus"
 tog_quest.0022.desc: "Endlich findest du das Haus des Alten, tief in einem Tal, das die Nordmänner meiden, weil es dort nichts zu holen gibt. Die Tür ist eingeschlagen. Drinnen ist alles durchwühlt: die Truhe aufgebrochen, der Strohsack zerrissen, ein Stab auf der Schwelle entzweigebrochen.\n\nSchließlich kommt eine Nachbarin heraus. Vor drei Tagen kamen Banditen, Männer aus den Hügeln von [GetTitleByKey('b_glencoe').GetNameNoTier]. Sie suchten das Gold, das der Alte ihrer Meinung nach versteckte: Man sagt, seine Familie stamme von Myrddin ab, dem wahnsinnigen Barden, und so ein Mann muss einen Schatz haben. Sie fanden nichts. Also nahmen sie den Alten mit.\n\n„Er heißt Lailoken“, fügt sie hinzu. „Er ist achtundsechzig.“"
 tog_quest.0022.a: "Wir holen ihn."
 tog_quest.0022.a.tt: "Ihr brecht zum Lager der Banditen auf, in die Hügel von #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "Das Lager der Banditen"
 tog_quest.0023.desc: "Das Lager ist in einer Falte der Hügel von [GetTitleByKey('b_glencoe').GetNameNoTier] versteckt: ein Dutzend Hütten, ein Feuer, gestohlene Pferde und etwa zwanzig Männer, die nicht freundlich aussehen. In der Mitte, an einen Pfahl gebunden, sieht dir ein magerer alter Mann wortlos entgegen.\n\nIhr Anführer tritt vor. Er will Gold. Er will immer Gold."
 tog_quest.0023.a: "Das Lager angreifen."
 tog_quest.0023.b: "Sie überreden, ihn freizulassen."
 tog_quest.0023.b.good: "Du überzeugst sie, dass der Alte nichts wert ist und dass niemand ungestraft einen Nachkommen Myrddins misshandelt. Sie lassen ihn frei."
 tog_quest.0023.c: "Das Lösegeld zahlen."
 tog_quest.0023.c.tt: "Die Banditen nehmen das Gold und lassen den Alten frei."
 tog_quest.0050.t: "Ein Text der Götter"
 tog_quest.0050.a: "Komm, Lailoken."
 tog_quest.0010.t: "Die Wachstafel"
 tog_quest.0010.desc: "Eines Abends im Lager hast du die Tafel zu nah ans Feuer gelegt. Als du sie wiederfindest, ist das Wachs zerlaufen: Der gebrochene Pfeil ist nur noch eine weiche Spur, und du weißt nicht mehr, ob er nach links oder nach rechts zeigte. Peredur ist sich sicher: nach links."
 tog_quest.0010.a: "Die Striche aus dem Gedächtnis nachziehen."
 tog_quest.0010.a.good: "Dein Gedächtnis hält: Die Abschrift ist gerettet."
 tog_quest.0010.a.bad: "Du zweifelst an jedem Strich und machst dir die ganze Nacht Vorwürfe."
 tog_quest.0010.b: "Die Tafel künftig Peredur anvertrauen."
 tog_quest.0010.b.tt: "Peredur wird sie sorgsam hüten. Verkehrt herum, zweifellos."
 tog_quest.0011.t: "Der Händler"
 tog_quest.0011.desc: "Unterwegs begegnet ihr einem Händler auf dem Weg zu den Orkneys. Als er deine Abschrift sieht, runzelt er die Stirn: Er hat ähnliche Zeichen weiter östlich gesehen, auf anderen aufrechten Steinen, im alten Land der Pikten. Auch dort weiß niemand, was sie bedeuten."
 tog_quest.0011.a: "Ihn ausführlich befragen."
 tog_quest.0011.a.good: "Er beschreibt die anderen Steine ausführlich: Du verstehst deinen besser."
 tog_quest.0011.a.bad: "Er erzählt vor allem Märchen, und du verlierst den Tag damit, sie zu entwirren."
 tog_quest.0011.b: "Ihm seine Zeichnung abkaufen."
 tog_quest.0012.t: "Der Traum"
 tog_quest.0012.desc: "Eines Nachts im Lager kehrt der eingeritzte Halbmond in deinen Schlaf zurück. Er steigt wie ein Mond in den Himmel, und die beiden Kreise brennen unter ihm wie zwei Feuer.\n\nDu erwachst mit der Gewissheit, etwas verstanden zu haben, ohne zu wissen, was."
 tog_quest.0012.a: "Den Traum aufschreiben, bevor er verblasst."
 tog_quest.0012.a.good: "Der Traum öffnet einen Weg, und du fühlst dich den alten Göttern näher."
 tog_quest.0012.a.bad: "Der Traum führt dich in die Irre, und du erwachst verstörter als zuvor."
 tog_quest.0012.b: "Es ist nur ein Traum."
 tog_quest.0023.a.good: "Deine Männer fegen durch das Lager: Die Banditen fliehen in die Hügel und lassen ihre Beute zurück."
 tog_quest.0023.a.bad: "Der Angriff misslingt: Du entkommst knapp, aber verwundet."
 tog_quest.0023.b.bad: "Sie lachen über deine Reden und jagen dich aus dem Lager."
 tog_quest.0024.t: "Mit knapper Not"
 tog_quest.0024.desc: "Der Angriff endete in einem Desaster. Die Banditen kannten jeden Felsen dieser Hügel, und ihr wart ohne Deckung. Du bist mit knapper Not entkommen, eine Wunde in der Seite, halb getragen von Peredur, der schwor, einen Weg links herum zu kennen, und der ausnahmsweise recht hatte.\n\nDer Alte ist noch immer dort oben, an seinen Pfahl gebunden. Ihr müsst zurück, sobald du wieder stehen kannst."
 tog_quest.0024.a: "Meine Wunden versorgen und zurückkehren."
 tog_quest.0024.a.tt: "Ihr kehrt in einigen Tagen zum Lager zurück."
 tog_quest.0025.t: "Abgewiesen"
 tog_quest.0050.desc: "Der Alte reibt sich die Handgelenke und sieht dich lange an, ohne ein Wort des Dankes.\n\n„Warum? Niemand kommt einen verrückten Alten tief in den Hügeln holen. Was willst du von mir?“\n\nStatt einer Antwort reicht Peredur ihm deine Wachstafel. Der Alte dreht sie richtig herum und fährt mit dem Finger den eingeritzten Halbmond nach, dann die beiden Kreise.\n\n„Das ist ein Text.“\n\n„Ein Text? Das sind Bilder.“\n\n„Für dich. Für die, die sie eingeritzt haben, war es ein Text. Ein Text der Götter. Die, die ihn lesen konnten, haben die Mönche vertrieben, und ihre Kinder haben gelernt zu schweigen. Ich weiß nur, dass man drumherum nicht pflügen darf.“\n\nEr gibt dir die Tafel zurück.\n\n„Aber die Mönche schrieben alles auf. Selbst das, was sie hassten. Vor allem das, was sie hassten. Wenn du wissen willst, wer diese Götter waren, such in ihren Büchern: in Jarrow, in Whithorn, in Mynyw, in Dunkeld, in Applecross.“\n\nEr schweigt einen Moment, dann fügt er leiser hinzu:\n\n„Du hast mir das Leben gerettet. Bei uns zahlt man eine solche Schuld nicht mit Worten zurück: Ich werde dir folgen. Und ich habe mein Leben lang darauf geachtet, dass niemand um die Steine herum pflügt. Bevor ich sterbe, möchte ich sehen, was du aus diesem machst.“"
 tog_dest_camp: "zum Lager der Banditen"
 tog_quest.0025.desc: "Die Banditen haben dich bis zum Ende angehört, dann brachen sie unter dem Johlen ihrer Gefährten in Gelächter aus. Der Alte, noch immer an seinen Pfahl gebunden, sagte kein Wort.\n\nMit Worten ist bei diesen Männern nichts mehr zu erreichen. Bleiben Gewalt oder Gold."
 tog_quest.0025.c: "Abziehen."
 tog_quest.0025.c.tt: "Ihr verlasst das Lager. Kehrt zurück, sobald Ihr genug Gold oder Stärke habt, mit der Entscheidung „Reise zum Lager der Banditen“."
 tog_travel_desc_stone: "Ein Stein mit Zeichen, die niemand lesen kann, erwartet dich auf der Insel [GetTitleByKey('b_skye').GetNameNoTier]. Du musst ihn mit eigenen Augen sehen und abschreiben."
 tog_travel_desc_wrong: "Peredur schwört, er kenne den Weg zum Alten: links, wenn man aus der Bucht kommt, in Richtung [GetTitleByKey('b_gairloch').GetNameNoTier]. Er ist sich fast sicher."
 tog_travel_desc_house: "Nach Aussage des alten Fischers lebt der, der mit den Steinen spricht, im Süden, auf der anderen Seite des Wassers, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Diesmal wählst du den Weg."
 tog_travel_desc_camp: "Banditen haben den alten Lailoken in die Hügel von [GetTitleByKey('b_glencoe').GetNameNoTier] verschleppt. Wenn niemand ihn holt, wird ihn niemand wiedersehen."
 tog_travel_desc_camp_return: "Der alte Lailoken ist noch immer Gefangener der Banditen in den Hügeln von [GetTitleByKey('b_glencoe').GetNameNoTier]. Genug Gold für das Lösegeld oder genug Männer für den Angriff: Es ist Zeit, zurückzukehren."
 tog_quest_travel_decision_confirm: "Aufbrechen"
 tog_quest.0050.a.tt: "#V Lailoken#! schließt sich Euch an. Die Bücher der Kopistenmönche erwarten Euch in fünf Klöstern (Entscheidung „Zu einem Kloster reisen“)."
 tog_story_old_groves_monasteries: "Zu besuchende Klöster"
 tog_obj_books: "Ziel: die Bücher der Kopistenmönche beschaffen und dann lesen. Die verbleibenden Klöster stehen in der Liste unten; besucht sie in beliebiger Reihenfolge (Entscheidung „Zu einem Kloster reisen“).\n\nDas Lesen geschieht automatisch: Die Bücher werden einzeln gelesen, in der Reihenfolge, in der Ihr sie beschafft habt, und jedes dauert einige Monate."
 tog_obj_step3: "Die Bücher haben gesprochen: Nun müsst Ihr dorthin, wo man die alten Götter anbetete.\n(Die Fortsetzung folgt in einer künftigen Version.)"
 tog_dest_monastery: "zu einem Kloster"
 tog_travel_desc_monastery: "Die Bücher der Kopistenmönche erwarten dich in Jarrow, Whithorn, Mynyw, Dunkeld und Applecross. Wähle, wohin du gehst."
 tog_m.talk: "Den Mönch überzeugen."
 tog_m.talk_tt: "Eure Chancen hängen von Eurer Diplomatie ab. Bei einem Misserfolg wird der Mönch Euch nicht mehr zuhören."
 tog_m.pay: "Den Mönch bezahlen, damit er das Buch herausbringt."
 tog_m.steal: "Das Buch nachts stehlen."
 tog_m.force: "Mit meinen Männern die Tore aufbrechen."
 tog_m.leave: "Gehen."
 tog_m.leave_tt: "Ihr könnt später zurückkehren, mit der Entscheidung „Zu einem Kloster reisen“."
 tog_m.pay_good: "Der Mönch bringt das Buch unter seiner Kutte heraus."
 tog_m.pay_refused: "Der Mönch weigert sich, verängstigt: Er wird dein Geld nicht mehr nehmen."
 tog_m.pay_kept: "Der Mönch nimmt das Geld und verschwindet."
 tog_m.steal_good: "Du schlüpfst vor dem Morgengrauen hinaus, das Buch unter dem Hemd."
 tog_m.steal_bad: "Auf frischer Tat ertappt! Du entkommst knapp; das Kloster wird von nun an misstrauisch sein."
 tog_m.force_good: "Die Tore geben nach: Du nimmst das Buch und einige Kostbarkeiten mit. Der Herr des Ortes wird dir das nicht verzeihen, und die anderen Klöster werden auf der Hut sein."
 tog_m.force_bad: "Die Mönche und ihre Diener halten stand: Ihr werdet zurückgeschlagen. Die anderen Klöster werden auf der Hut sein."
 tog_m.talk_good: "Der Mönch vertraut dir das Buch an."
 tog_m.talk_bad: "Der Mönch verschließt sich: Er wird nicht mehr mit dir sprechen."
 tog_m.book_tt: "Ihr erhaltet das Buch. Ihr werdet es in den kommenden Monaten lesen."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "Das Haus, in dem der ehrwürdige Beda sein Leben lang schrieb, steht am Ufer des Tyne hinter einer niedrigen Mauer. Die Nordmänner waren schon hier: Ein Flügel ist noch vom Feuer geschwärzt. Am Wegrand sortiert ein junger Mönch Äpfel und sieht dich neugierig herankommen.\n\n„Sucht Ihr etwas, Fremder? Die Bibliothek liegt hinter dem Kreuzgang. Man sagt, sie enthalte alles, was Beda gelesen hat, und Beda hat alles gelesen.“"
 tog_quest.0121.t: "Bedas Pikten"
 tog_quest.0121.desc: "Du liest Beda. Er erzählt, wie die Pikten auf langen Schiffen aus Skythien kamen, wie sie ihre Könige über die weibliche Linie wählten und wie Colum Cille sie taufen ging. In der Vita des Heiligen liest du auch, dass er am Hof des Piktenkönigs Magiern gegenüberstand, die Wind und Nebel geboten.\n\nUnd an einem Rand hat ein Bruder, der in den Norden gereist war, notiert: „Die Pikten ritzten in Steine Zeichen, die niemand mehr liest.“\n\nDein Stein hatte Priester."
 tog_quest.0121.a: "Mein Stein hatte Priester."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "Das alte weiße Haus des heiligen Ninian überragt den Hafen. Die Mönche sind wenige und verlassen die Kapelle kaum; die Bibliothek geht auf einen Garten hinaus, dessen Mauer an manchen Stellen einstürzt.\n\nIn der Hafenschenke trinkt ein Laienbruder mehr als vernünftig und klagt jedem, der es hören will, dass man ihn nicht genug bezahlt."
 tog_quest.0122.t: "Die Druiden des Plinius"
 tog_quest.0122.desc: "Es ist ein Florilegium aus dem Frankenreich, in das ein Ire am Hof des Kaisers Seiten der Alten abgeschrieben hat. Ein Römer, Plinius, erzählt, dass die Priester der Gallier, die man Druiden nannte, nichts für heiliger hielten als die Mistel und die Eiche, die sie trägt; dass sie sie am sechsten Tag des Mondes schnitten, weiß gekleidet, mit einer goldenen Sichel. Ein anderer sagt, dass sie Streitfälle richteten, zwanzig Jahre lang eine riesige Zahl von Versen auswendig lernten und lehrten, dass die Seelen nicht sterben, sondern nach dem Tod in andere Körper übergehen.\n\nDer Druide, dieser lächerliche Zauberer der Heiligenviten, war einst ein Klerus gewesen."
 tog_quest.0122.a: "Die Druiden waren ein Klerus."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "Am äußersten Ende von Wales, dem Meer zugewandt, ist das Haus des heiligen David von guten Mauern umgeben. Die Mönche von Mynyw haben zu oft fremde Segel kommen sehen: Sie beobachten dich vom Wehrgang aus, und ihre Diener lassen ihre Stöcke nicht los."
 tog_quest.0123.t: "Die Helden der Briten"
 tog_quest.0123.desc: "Das Buch erzählt die Geschichte der Briten: Vortigern, der die Sachsen gerufen hatte; den Turm, der jede Nacht einstürzte, weil zwei Drachen, ein roter und ein weißer, in seinen Fundamenten kämpften; das vaterlose Kind, das es erriet; und einen Kriegsführer namens Arthur, Sieger in zwölf Schlachten.\n\nHelden, keine Götter. Aber auch die Briten haben ihre Alten bewahrt, und sie warten noch immer auf sie."
 tog_quest.0123.a: "Die Briten warten noch immer auf ihre Alten."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "Im Herzen des alten Piktenlandes bewahrt Dún Chaillenn einen Teil der Reliquien Colum Cilles, die hierher gebracht wurden, um sie vor den Nordmännern zu schützen. Wachen bewachen den Schrein Tag und Nacht; niemand bewacht die Bibliothek, die nur ein niedriger Raum am Ende des Kreuzgangs ist.\n\nEin Hund schläft quer vor ihrer Tür."
 tog_quest.0124.t: "Die vergessenen Riten"
 tog_quest.0124.desc: "Es ist ein hässliches Buch, ein Florilegium von vielen Händen auf schlechtem Pergament. Mehrere Seiten wurden mit dem Messer abgeschabt, um darüber Psalmen zu schreiben; hält man sie gegen das Licht, erkennt man noch die Zeilen, die man tilgen wollte.\n\nEin Mönch hat darin ohne Kommentar Sätze abgeschrieben, die seine Lehrer durchgelassen hatten: Brigit war eine Göttin, die von den Dichtern verehrt wurde; Ana war die Mutter der Götter Irlands gewesen; an Beltaine entzündeten die Druiden zwei Feuer mit großen Beschwörungen und trieben das Vieh gegen Krankheiten hindurch; einst schwor man bei ihnen, nicht bei Christus.\n\nDie Könige der alten Zeit waren keine Könige gewesen. Man hatte zu ihnen gebetet."
 tog_quest.0124.a: "Man hatte zu ihnen gebetet."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Gegenüber den Inseln ist das Haus des heiligen Máel Rubai klein und arm. Ein sehr alter, fast blinder Mönch hütet die Bibliothek: Man sagt, er kenne jedes Buch darin auswendig und lasse niemanden auch nur mit einem Blatt hinaus."
 tog_quest.0125.t: "Das Buch der Orte"
 tog_quest.0125.desc: "Es ist ein Buch der Orte: jeder Hügel, jede Quelle, jeder Stein der alten Zeit, mit der Geschichte, die seinen Namen erklärt. Das große hohle Haus des Dagda am Boyne; der Hügel von Uisneach im Herzen Irlands, wo Lug starb; der Stein des Maponos an der Mündung des Solway…\n\nDie Bücher sagen, dass diese Götter existierten. Um zu wissen, wer sie wirklich waren, musst du dorthin, wo man sie anbetete."
 tog_quest.0125.a: "Ich muss an diese Orte."
 tog_quest.0130.t: "Ein gestohlener Kult"
 tog_quest.0130.desc: "Du liest die fünf Bücher nebeneinander. Die Namen kanntest du seit deiner Kindheit: Lug, der Dagda, Brigit, Balor, die Tuatha Dé Danann, der Stamm der Dana. Könige, Ahnen, Dämonen, je nachdem, wer erzählte. Du entdeckst, dass sie die Ruinen eines Kultes sind. Eines echten, mit seinen Göttern, seinen Orten, seinen Priestern. Und man hat ihn euch gestohlen.\n\nDie Mönche haben ihre Kirchen auf die Hügel gebaut, auf denen man vor ihnen betete, ihre Kreuze auf die Steine gepflanzt, ihren Heiligen die Namen der Göttinnen gegeben. Was sie nicht zerstören konnten, haben sie getauft; was sie nicht taufen konnten, ließen sie sterben. Und was sie an seine Stelle setzten, dient vor allem dazu, die Köpfe zu beugen: dem Herrn gehorchen, den Zehnten zahlen, in einer Sprache beten, die niemand versteht.\n\nDie alten Götter waren von hier. Man hat sie euch genommen. Du wirst sie dir zurückholen."
 tog_quest.0130.a: "Ich hole zurück, was man uns gestohlen hat."
 tog_quest.0130.a.tt: "Ende des zweiten Abschnitts der Quest. Die Fortsetzung (die heiligen Orte) folgt in einer künftigen Version."
 tog_quest.0140.t: "Zu welchem Kloster?"
 tog_quest.0140.desc: "Die Bücher der Kopistenmönche erwarten dich in mehreren Klöstern. Welches willst du besuchen?"
