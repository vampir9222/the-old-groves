 tog_quest.0161.t: "Eine verschlossene Tür"
 tog_quest.0161.desc: "Der Mönch hat dich bis zum Ende angehört. Dann hat er den Kopf geschüttelt, ohne Zorn, so wie man einem Mann ein Almosen verweigert, der keines braucht.\n\n„Ich werde für Euch beten.“ Er hat sich wieder seiner Arbeit zugewandt und dich nicht mehr angesehen. Von ihm bekommst du das Buch nicht."
 tog_quest.0161.a: "Ich muss einen anderen Weg finden."
 tog_quest.0162.t: "Ein verängstigter Mönch"
 tog_quest.0162.desc: "Beim Anblick deines Geldbeutels ist der Mönch blass geworden. Er ist einen Schritt zurückgewichen, hat sich bekreuzigt und ist fast im Laufschritt zur Kapelle davongeeilt.\n\nDein Geld wird dir diese Bibliothek nicht öffnen."
 tog_quest.0162.a: "Ich muss einen anderen Weg finden."
 tog_quest.0163.t: "Ein unehrlicher Mönch"
 tog_quest.0163.desc: "Der Mönch hat das Geld genommen und versprochen, nach der Komplet mit dem Buch unter der Kutte zurückzukommen. Du hast die ganze Nacht hinter der Mauer gewartet.\n\nAm Morgen hieß es, er sei auf Pilgerfahrt gegangen. Niemand weiß, wann er zurückkehrt."
 tog_quest.0163.a: "Ich muss einen anderen Weg finden."
 tog_quest.0164.t: "Auf frischer Tat ertappt"
 tog_quest.0164.desc: "Du hattest die Bibliothek gefunden, sogar die richtige Truhe. Dann hob sich eine Laterne im Kreuzgang, und eine Stimme rief: Dieb!\n\nDu bist gerade noch über die Mauer gekommen, mit leeren Händen. Von nun an werden die Mönche ihre Tür doppelt verriegeln und jede Nacht Wache halten."
 tog_quest.0164.a: "Ich muss einen anderen Weg finden."
 tog_quest.0165.t: "Zurückgeschlagen"
 tog_quest.0165.desc: "Die Mönche haben die Glocke geläutet, noch bevor deine Männer das Tor erreichten. Diener, Bauern des Guts und einige Bewaffnete kamen von überall her, mit Mistgabeln, Stöcken und Steinen.\n\nIhr musstet zurückweichen. Von diesem Tag wird man in allen Klöstern des Landes sprechen."
 tog_quest.0165.a: "Ich muss einen anderen Weg finden."
 tog_quest.0151.t: "Segel an der Küste"
 tog_quest.0151.desc: "Hinter einer Bucht liegen drei Schiffe auf dem Kiesstrand. Nordmänner. Sie haben dich gesehen, bevor du sie gesehen hast, und ein Dutzend Männer kommt schon mit der Axt in der Hand den Strand herauf."
 tog_quest.0151.a: "Kämpfen."
 tog_quest.0151.a.good: "Die Nordmänner weichen zu ihren Schiffen zurück; du sammelst ein, was sie zurückgelassen haben."
 tog_quest.0151.a.bad: "Du kommst davon, aber verwundet und mit leichterem Geldbeutel."
 tog_quest.0151.b: "In ihrer Sprache mit ihnen reden."
 tog_quest.0151.b.good: "Ihr Anführer lacht über deinen Akzent und lässt dich ziehen."
 tog_quest.0151.b.bad: "Sie lassen dich ziehen, gegen einen Wegzoll."
 tog_quest.0152.t: "Ein Wandermönch"
 tog_quest.0152.desc: "Ein irischer Mönch geht denselben Weg wie du, barfuß, den Stab in der Hand. Er ist gesprächig und hat schnell begriffen, dass du nicht zum Beten unterwegs bist.\n\n„Ihr sucht alte Dinge, mein Freund. Wusstet Ihr, dass Christus alle Götter der Gälen besiegt hat? Reden wir darüber, der Weg ist lang.“"
 tog_quest.0152.a: "Mit ihm streiten."
 tog_quest.0152.a.good: "Der Mönch verstummt schließlich, nachdenklich. Du hast aus seinen Argumenten gelernt."
 tog_quest.0152.a.bad: "Er hat auf alles eine Antwort und erzählt es im nächsten Dorf herum."
 tog_quest.0152.b: "Schweigen und ihn reden lassen."
 tog_quest.0153.t: "Die Quelle der Bänder"
 tog_quest.0153.desc: "Am Grund eines Tals entspringt eine Quelle zwischen den Wurzeln einer alten Esche. Die Zweige sind voller Bänder, Stofffetzen und Haarsträhnen. Daneben hat man ein brandneues Kreuz aufgestellt, aber auch die Bänder sind frisch.\n\nEine alte Frau taucht ein Tuch ins Wasser und knotet es murmelnd an einen Zweig."
 tog_quest.0153.a: "Sie fragen, was sie tut."
 tog_quest.0153.a.good: "Sie sagt dir Worte, die ihre Großmutter sie gelehrt hat. Du erkennst den Namen einer Göttin."
 tog_quest.0153.a.bad: "Sie erschrickt und geht wortlos davon."
 tog_quest.0153.b: "Auch ein Band knoten."
 tog_quest.0154.t: "Der Priester und der Stein"
 tog_quest.0154.desc: "Auf einem Dorfplatz lässt ein Priester einen Menhir mit Hämmern zerschlagen. Die Dorfbewohner sehen schweigend zu. Eine Frau, die Milch am Fuß des Steins abgestellt hatte, ist an einen Pfahl gebunden; der Priester verkündet, sie werde wegen Götzendienst ausgepeitscht."
 tog_quest.0154.a: "Mit dem Schwert eingreifen."
 tog_quest.0154.a.good: "Die Männer des Priesters fliehen. Die Frau ist frei, und das Dorf hat es gesehen."
 tog_quest.0154.a.bad: "Die Frau ist befreit, aber du hast Schläge eingesteckt."
 tog_quest.0154.b: "Mit Worten eingreifen."
 tog_quest.0154.b.good: "Der Priester gibt vor dem Dorf nach und bindet die Frau los."
 tog_quest.0154.b.bad: "Der Priester demütigt dich vor allen."
 tog_quest.0154.c: "Versteckt bleiben und weiterziehen."
 tog_quest.0155.t: "Peredurs Abkürzung"
 tog_quest.0155.desc: "„Ich kenne eine Abkürzung“, hat Peredur heute Morgen gesagt. Jetzt ist es Mittag, der Nebel ist gefallen, und ihr steckt mitten in einem Moor, das noch nie jemand gesehen hat.\n\n„Hier entlang. Glaube ich. Also, früher war es hier entlang.“"
 tog_quest.0155.a: "Peredur vertrauen."
 tog_quest.0155.a.good: "Wider Erwarten findet er den Weg wieder."
 tog_quest.0155.a.bad: "Ihr lauft bis zum Abend im Kreis."
 tog_quest.0155.b: "Einen Einheimischen suchen."
 tog_quest.0155.b.good: "Ein Hirte bringt euch auf den Weg zurück."
 tog_quest.0155.b.bad: "Der Hirte lacht euch aus und sagt nichts Brauchbares."
 tog_quest.0156.t: "Ein Dieb in der Nacht"
 tog_quest.0156.desc: "Du wachst mitten in der Nacht auf. Ein Schatten beugt sich über deine Sachen, und dein Geldbeutel ist schon in seiner Hand."
 tog_quest.0156.a: "Ihn lautlos überraschen."
 tog_quest.0156.a.good: "Du packst ihn am Kragen, bevor er begreift; er flieht mit leeren Händen."
 tog_quest.0156.a.bad: "Er hört dich kommen und verschwindet mit deinem Geldbeutel."
 tog_quest.0156.b: "Sich auf ihn stürzen."
 tog_quest.0156.b.good: "Er lässt alles fallen und flieht."
 tog_quest.0156.b.bad: "Er hat ein Messer. Du bist verwundet, und er ist mit deinem Geldbeutel fort."
 tog_quest.0157.t: "Der kranke Pilger"
 tog_quest.0157.desc: "Am Wegrand liegt ein Pilger unter seinem Mantel, glühend vor Fieber. Er sei auf dem Weg nach Iona, sagt er, aber ohne Hilfe komme er nicht weiter."
 tog_quest.0157.a: "Ihm helfen."
 tog_quest.0157.a.tt: "Du pflegst ihn und bringst ihn ins nächste Dorf. Unterwegs erzählt er dir von den Heiligen und Quellen seiner Heimat."
 tog_quest.0157.b: "Weiterziehen."
 tog_m.steal_wait: "Die Mönche sind noch auf der Hut: Du musst einige Monate warten, bevor du es erneut versuchst."
