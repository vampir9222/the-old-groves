l_english:
 tog_story_old_groves: "The Old Groves"
 tog_story_old_groves_desc: "A stone carved with signs no one can read. Books copied out by monks who hated what they wrote. Somewhere beneath the tales sleeps the worship of the old ones."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Companions"
 tog_story_old_groves_destination: "Destination"
 tog_obj_stone: "Go to the stone, on #V [GetTitleByKey('b_skye').GetNameNoTier]#!, and copy it."
 tog_obj_wrong: "Follow Peredur to the old man, in #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Find the real old man, in #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Free the old man, held prisoner by bandits in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "the isle of [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "[GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "[GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Study the Stone"
 tog_quest_start_decision_desc: "There is talk of a strange stone on the isle of [GetTitleByKey('b_skye').GetNameNoTier], carved with signs no one can read."
 tog_quest_start_decision_tooltip: "The quest of the Old Groves begins."
 tog_quest_start_decision_confirm: "Leave for [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "The quest of the #V Old Groves#! begins. You can follow it in the #V Situations#! window."
 tog_quest_travel_decision: "Travel to [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "You set out for the next stage of the quest."
 tog_quest_travel_decision_not_there: "You are already there."
 tog_quest_travel_decision_effect_tt: "You leave for the next stage. If you are an adventurer, your camp follows you."
 tog_poi_stone: "The Carved Stone"
 tog_poi_stone_desc: "A Pictish stone lying overturned in the heather, covered in signs no one can read."
 tog_quest.0001.t: "The Apostate"
 tog_quest.0001.desc: "Once, they called you Brother Máel Brigte. Among the monks of Iona you learned to read, you sang the psalms and you believed what you were told to believe. Then the Norse came. The relics stopped no ship. The prayers saved no brother. The abbots went off to safety with the books. You stayed.\n\nToday the Gaels of the isles call you Dubgall, the dark foreigner. You raise the horn at the Norse feasts without believing in it. One question never leaves you: if the monks' god could not protect his own, what is left to believe in?\n\nThis morning, climbing onto the moor to watch for sails, you found something else. In the heather, an overturned stone bears signs you have never seen: a crescent, a broken arrow, two linked circles. These are not letters. They are images, carved with too much care to be mere decoration."
 tog_quest.0001.a: "I must understand what these signs say."
 tog_quest.0001.a.tt: "The quest of the #V Old Groves#! begins. You can follow it in the #V Situations#! window."
 tog_quest.0001.b: "It's only an old stone."
 tog_quest.0001.b.tt: "You can come back to the stone with the decision “Study the Stone”."
 tog_quest.0002.t: "A Stone in the Isles"
 tog_quest.0002.desc: "A passing trader told you of a strange stone in the north, on the isle of [GetTitleByKey('b_skye').GetNameNoTier]. It lies in the heather above a bay. It bears signs no one can read, neither Gael nor Norseman. They are not letters, he said, they are images: a crescent, a broken arrow, two linked circles.\n\nSince then, you cannot get those signs out of your head."
 tog_quest.0002.a: "I must see this stone."
 tog_quest.0002.a.tt: "The quest of the #V Old Groves#! begins. You set out for #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "The Stone"
 tog_quest.0003.desc: "The stone lies in the heather above the bay, half eaten by moss. On it you can make out a crescent crossed by a broken arrow, two circles joined by a bar, and a zigzag line. Someone raised it a very long time ago. Someone else knocked it down: you can still see the marks of the levers.\n\nYou scrape the lichen away with your knife. Then you copy each sign, stroke by stroke, onto a wax tablet."
 tog_quest.0003.a: "Copy the stone."
 tog_quest.0020.t: "The Shepherd"
 tog_quest.0020.desc: "You have barely finished your copy when the heather rustles behind you. A young man stumbles out, out of breath, a rope in his hand.\n\n“You haven't seen a goat?”\n\nHis name is Peredur. He minds the hamlet's animals, when he can find them. He listens with great attention and remembers everything, except what it means. He catches sight of the stone and forgets the goat. He walks around the signs to see them upside down, then right way up, then upside down again, to be safe.\n\n“That's old-folk stuff, that is. You want the old man. The one across the water, left as you leave the bay. But careful: depends which way you're facing, it changes everything! My father says the old man is all esoterism.”\n\nYou smile: “Esoterism is knowledge kept for a few initiates. It is hidden from those who are not ready to receive it.”\n\nPeredur nods for a long time, looking deeply thoughtful.\n\n“Yeah, that's not wrong. Shall I take you to the old man? It's left. Well, I think.”"
 tog_quest.0020.a: "Show me, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! goes on ahead, towards #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!. To the left."
 tog_quest.0021.t: "The Wrong Old Man"
 tog_quest.0021.desc: "Peredur's old man does exist. He lives in a hut by the water, at [GetTitleByKey('b_gairloch').GetNameNoTier]. He is eighty years old and has three teeth. He has never seen a carved stone in his life. On the other hand, he tells you at length about herring, seals and the woman he nearly married long ago.\n\nPeredur scratches his head.\n\n“Ah. Maybe it was right.”\n\nThe old fisherman, for his part, has understood who you mean: “The one who talks to stones? He lives to the south, across the water, at [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Everyone knows that.”"
 tog_quest.0021.a: "This time, I choose the direction."
 tog_quest.0021.a.tt: "You set out for #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, to the real old man."
 tog_quest.0022.t: "The Empty House"
 tog_quest.0022.desc: "At last you find the old man's house, deep in a valley where the Norse never go: there is nothing to take. The door has been smashed in. Inside, everything has been turned over: the chest split open, the straw mattress torn, a staff broken in two on the threshold.\n\nIn the end a neighbour comes out of her house. Bandits came three days ago, men from the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. They said the old man was hiding gold. His family is said to descend from Myrddin, the mad bard, and a man like that must have a treasure. They found nothing. So they took the old man.\n\n“His name is Lailoken,” she adds. “He is sixty-eight.”"
 tog_quest.0022.a: "We will go and get him."
 tog_quest.0022.a.tt: "You set out for the bandits' camp, in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "The Bandits' Camp"
 tog_quest.0023.desc: "The camp is hidden in a fold of the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. There are a dozen huts, a fire, stolen horses and some twenty dangerous-looking men. In the middle, tied to a post, a thin old man watches you approach without a word.\n\nTheir leader steps forward. He wants gold. He always wants gold."
 tog_quest.0023.a: "Attack the camp."
 tog_quest.0023.b: "Convince them to let him go."
 tog_quest.0023.b.good: "You persuade them that the old man is worth nothing, and that no one mistreats a descendant of Myrddin and gets away with it. They let him go."
 tog_quest.0023.c: "Pay the ransom."
 tog_quest.0023.c.tt: "The bandits take the gold and release the old man."
 tog_quest.0050.t: "A Text of the Gods"
 tog_quest.0050.a: "Come, Lailoken."
 tog_quest.0010.t: "The Wax Tablet"
 tog_quest.0010.desc: "One evening in camp, you set the tablet down too close to the fire. When you pick it up again, the wax has run. The broken arrow is no more than a soft smear, and you no longer know whether it leaned left or right. Peredur, for his part, is sure it leaned left."
 tog_quest.0010.a: "Redraw the strokes from memory."
 tog_quest.0010.a.good: "Your memory is sure: the copy is saved."
 tog_quest.0010.a.bad: "You doubt every stroke and spend the night blaming yourself."
 tog_quest.0010.b: "From now on, entrust the tablet to Peredur."
 tog_quest.0010.b.tt: "Peredur will guard it carefully. Upside down, no doubt."
 tog_quest.0011.t: "The Trader"
 tog_quest.0011.desc: "On the road, you meet a trader heading up to the Orkneys. When he sees your copy, he frowns. He has seen signs like these before, further east, on other standing stones, in the old land of the Picts. There too, no one knows what they mean."
 tog_quest.0011.a: "Question him at length."
 tog_quest.0011.a.good: "He describes the other stones to you in detail. You understand yours better."
 tog_quest.0011.a.bad: "He mostly tells tall tales. You waste your day untangling them."
 tog_quest.0011.b: "Buy his drawing."
 tog_quest.0012.t: "The Dream"
 tog_quest.0012.desc: "One night in camp, the carved crescent comes back to you in your sleep. It rises in the sky like a moon. Beneath it, the two circles burn like two fires.\n\nYou wake certain you have understood something, without knowing what."
 tog_quest.0012.a: "Write down the dream before it fades."
 tog_quest.0012.a.good: "The dream opens a trail for you. You feel closer to the old gods."
 tog_quest.0012.a.bad: "The dream leads you astray. You wake more troubled than before."
 tog_quest.0012.b: "It's only a dream."
 tog_quest.0023.a.good: "Your men sweep through the camp. The bandits flee into the hills and abandon their loot."
 tog_quest.0023.a.bad: "The assault goes badly. You barely make it out, wounded."
 tog_quest.0023.b.bad: "They laugh at your speeches and drive you out of the camp."
 tog_quest.0024.t: "A Narrow Escape"
 tog_quest.0024.desc: "The assault turned into a disaster. The bandits knew every rock in these hills, and you were out in the open. You barely made it out, with a wound in your side. Peredur half carried you. He swore he knew a way round to the left and, for once, he was right.\n\nThe old man is still up there, tied to his post. You will have to go back once you can stand."
 tog_quest.0024.a: "Dress my wounds, then go back."
 tog_quest.0024.a.tt: "In a few days, you will go back to the camp."
 tog_quest.0025.t: "Sent Packing"
 tog_quest.0050.desc: "The old man rubs his wrists and looks at you for a long time, without a word of thanks.\n\n“Why? No one comes looking for a mad old man deep in the hills. What do you want with me?”\n\nBy way of answer, Peredur hands him your wax tablet. The old man turns it the right way up. He runs a finger over the carved crescent, then over the two circles.\n\n“It is a text.”\n\n“A text? These are images.”\n\n“To you. To those who carved them, it was a text. A text of the gods. The monks drove out those who could read it, and their children learned to keep quiet. All I know is that you must not plough around it.”\n\nHe hands the tablet back.\n\n“But the monks wrote everything down. Even what they hated. Especially what they hated. If you want to know who these gods were, look in their books: at Jarrow, at Whithorn, at Mynyw, at Dunkeld, at Applecross.”\n\nHe falls silent for a moment, then adds, more quietly:\n\n“You saved my life. Among our people, a debt like that is not repaid with words: I will follow you. Besides, I have spent my life making sure no one ploughed around the stones. Before I die, I would like to see what you will do with this one.”"
 tog_dest_camp: "the bandits' camp"
 tog_quest.0025.desc: "The bandits heard you out. Then their leader burst out laughing, and his men began to jeer at you. The old man, still tied to his post, said not a word.\n\nWith men like these, speeches will do no more good. There remains force, or gold."
 tog_quest.0025.c: "Leave."
 tog_quest.0025.c.tt: "You can come back with the decision “Travel to the bandits' camp”."
 tog_travel_desc_stone: "A stone carved with signs no one can read awaits you on the isle of [GetTitleByKey('b_skye').GetNameNoTier]. You must see it with your own eyes and copy it."
 tog_travel_desc_wrong: "Peredur swears he knows the way to the old man: left as you leave the bay, over towards [GetTitleByKey('b_gairloch').GetNameNoTier]. He is almost sure."
 tog_travel_desc_house: "According to the old fisherman, the one who talks to stones lives to the south, across the water, at [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. This time, you choose the road."
 tog_travel_desc_camp: "Bandits have taken old Lailoken into the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. If no one goes to get him, no one will see him again."
 tog_travel_desc_camp_return: "Old Lailoken is still a prisoner of the bandits, in the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. It is time to go back."
 tog_quest_travel_decision_confirm: "Leave"
 tog_quest.0050.a.tt: "#V Lailoken#! now walks at your side. The monks' books await you in five monasteries: use the decision “Travel to a monastery”."
 tog_story_old_groves_monasteries: "Monasteries to visit"
 tog_obj_books: "Recover the books of the copyist monks, then read them. The books read themselves, one by one, in the order in which you recovered them."
 tog_obj_step3: "The books have spoken: now you must go where the old gods were once worshipped."
 tog_dest_monastery: "a monastery"
 tog_travel_desc_monastery: "The books of the copyist monks await you at Jarrow, Whithorn, Mynyw, Dunkeld and Applecross. Choose where to go."
 tog_m.talk: "Convince the monk."
 tog_m.talk_tt: "Your chances depend on your diplomacy. If you fail, the monk will not listen to you again."
 tog_m.pay: "Pay the monk to smuggle the book out."
 tog_m.steal: "Steal the book, by night."
 tog_m.force: "Force the doors with my men."
 tog_m.leave: "Leave."
 tog_m.leave_tt: "You can come back with the decision “Travel to a monastery”."
 tog_m.pay_good: "The monk brings the book out under his habit."
 tog_m.pay_refused: "The monk refuses, frightened: he will not take your money again."
 tog_m.pay_kept: "The monk takes the money and vanishes."
 tog_m.force_good: "The doors give way: you carry off the book and a few precious objects. The local lord will not forgive you, and the other monasteries will be on their guard."
 tog_m.force_bad: "The monks and their servants hold firm: you are driven back. The other monasteries will be on their guard."
 tog_m.talk_good: "The monk entrusts you with the book."
 tog_m.talk_bad: "The monk shuts himself off: he will not speak to you again."
 tog_m.book_tt: "The book is yours. You will read it in the coming months."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "The house where the Venerable Bede wrote all his life stands on the banks of the Tyne, behind a low wall. The Norse have already been through here: one wing is still blackened by fire. By the side of the path, a young monk is sorting apples. He watches you approach with curiosity.\n\n“Are you looking for something, stranger? The library is behind the cloister. They say it holds everything Bede read, and Bede had read everything.”"
 tog_quest.0121.t: "Bede's Ecclesiastical History"
 tog_quest.0121.desc: "#italic Book brought back from Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]).#!\n\nYou read Bede. He tells how the Picts came from Scythia in long ships and how they chose their kings through the female line. He also tells how Colum Cille went to “baptise” them. In the saint's life, you read that at the court of the king of the Picts he faced magi who commanded the wind and the mists.\n\nIn a margin, a brother who had travelled north noted: “the Picts carved signs on stones that no one reads any more”."
 tog_quest.0121.a: "My stone had priests."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "Saint Ninian's old white house looks down over the harbour. The monks are few and rarely leave the chapel. The library gives onto a garden whose wall is crumbling in places.\n\nAt the harbour tavern, a lay brother is drinking too much. He complains to anyone who will listen that he is not paid enough."
 tog_quest.0122.t: "The Florilegium of Sedulius"
 tog_quest.0122.desc: "#italic Book brought back from Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]).#!\n\nIt is a florilegium from Francia. An Irishman at the emperor's court copied pages from the ancient authors into it. A Roman, Pliny, tells that the priests of the Gauls were called druids. Nothing was more sacred to them than mistletoe and the oak that bears it. They cut it on the sixth day of the moon, dressed in white, with a golden sickle.\n\nAnother author says that they judged lawsuits and that for twenty years they learned by heart an immense number of verses. They taught that souls do not die: after death, they pass into other bodies.\n\nIn the lives of the saints, the druid is just a ridiculous sorcerer. Here, he is a priest."
 tog_quest.0122.a: "The druids were a clergy."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "At the far end of Wales, facing the sea, the house of Saint David is surrounded by good walls. The monks of Mynyw have too often seen foreign sails arrive. They watch you approach from the wall walk, and their servants keep their staves in hand."
 tog_quest.0123.t: "The History of the Britons"
 tog_quest.0123.desc: "#italic Book brought back from Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]).#!\n\nThe book tells the history of the Britons. It speaks of Vortigern, who had called in the Saxons, and of the tower that collapsed every night. Two dragons, one red and one white, fought in its foundations, and a fatherless child had guessed it. It also speaks of a war leader named Arthur, victor of twelve battles.\n\nHeroes, not gods. But the Britons, too, have kept the memory of their ancients."
 tog_quest.0123.a: "The Britons are still waiting for their ancients."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "In the heart of the old Pictish land, Dunkeld keeps part of the relics of Colum Cille. They were brought here to keep them safe from the Norse. Guards watch over the shrine day and night. No one watches over the library, a low room at the back of the cloister.\n\nA dog sleeps across its doorway."
 tog_quest.0124.t: "The Scraped Book"
 tog_quest.0124.desc: "#italic Book brought back from Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]).#!\n\nIt is an ugly book, a florilegium in several hands on poor vellum. Several pages have been scraped with a knife so that psalms could be written over them. Holding them up to the light, you can still make out the lines someone tried to erase.\n\nA monk copied into it, without comment, sentences his masters had let slip through. Brigit was a goddess worshipped by the poets. Ana had been the mother of the gods of Ireland. At Beltaine, the druids lit two fires with great incantations and drove the cattle between them, against disease. Once, people swore by these gods, and not by Christ.\n\nThe kings of olden times had not been kings."
 tog_quest.0124.a: "They had been worshipped."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Facing the isles, the house of Saint Máel Rubai is small and poor. A very old monk, nearly blind, keeps the library. They say he knows every book by heart and lets no one leave with so much as a single leaf."
 tog_quest.0125.t: "The Dindshenchas"
 tog_quest.0125.desc: "#italic Book brought back from Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]).#!\n\nIt is a collection of places. Every hill, every spring and every stone of olden times has its story in it, which explains its name. There is the great hollow house of the Dagda, on the Boyne. There is the hill of Uisneach, at the centre of Ireland, where Lug died. There is the stone of Mabon, on the Solway estuary…\n\nThe books say these gods existed. They do not say who they were."
 tog_quest.0125.a: "I will go where they were worshipped."
 tog_quest.0130.t: "A Stolen Faith"
 tog_quest.0130.desc: "You reread the five books side by side. The names you had known since childhood: Lug, the Dagda, Brigit, Balor, the Tuatha Dé Danann, the tribe of Dana. Depending on who told the tale, they were kings, ancestors or demons. Now you understand that they are the ruins of a faith. A real faith, with its gods, its places and its priests. And it was stolen from you.\n\nThe monks built their churches on the hills where people prayed before them. They planted their crosses on the stones and gave their female saints the names of goddesses. What they could not destroy, they baptised. What they could not baptise, they left to die. And what they put in its place serves mostly to make people bow their heads: obey the lord, pay the tithe, pray in a language no one understands.\n\nThe old gods, though, were from here. They were taken from you. You are going to take them back."
 tog_quest.0130.a: "I will take back what was stolen from us."
 tog_quest.0130.a.tt: "The books have given place names: it is time to go where the old gods were worshipped."
 tog_quest.0140.t: "Which Monastery?"
 tog_quest.0140.desc: "The books of the copyist monks await you in several monasteries. Which one do you want to visit?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_jarrow').GetValue|0] km"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_whithorn').GetValue|0] km"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_mynyw').GetValue|0] km"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_dunkeld').GetValue|0] km"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_applecross').GetValue|0] km"
 tog_quest.0140.stay: "Not now."
 tog_test_skip_step1_decision: "TEST: skip to step 2"
 tog_test_skip_step1_decision_desc: "Test decision: starts the quest if needed, adds Peredur and Lailoken, and opens step 2 (the monasteries)."
 tog_test_skip_step1_decision_confirm: "Skip to step 2"
 tog_quest.0161.t: "A Closed Door"
 tog_quest.0161.desc: "The monk heard you out. Then he shook his head, without anger, the way one refuses alms to a man who does not need them.\n\n“I will pray for you.” He went back to his work and did not look at you again. He is not the one who will give you the book."
 tog_quest.0161.a: "I will have to find another way."
 tog_quest.0162.t: "A Frightened Monk"
 tog_quest.0162.desc: "At the sight of your purse, the monk went pale. He stepped back, crossed himself and left for the chapel almost at a run.\n\nYour money will not open this library for you."
 tog_quest.0162.a: "I will have to find another way."
 tog_quest.0163.t: "A Dishonest Monk"
 tog_quest.0163.desc: "The monk took the money. He promised to come back after compline, the book under his habit. You waited all night behind the wall.\n\nIn the morning, you were told he had gone on pilgrimage. No one knows when he will be back."
 tog_quest.0163.a: "I will have to find another way."
 tog_quest.0165.t: "Driven Back"
 tog_quest.0165.desc: "The monks rang the bell before your men even reached the door. Servants, peasants from the estate and a few men-at-arms came running from everywhere, with pitchforks, staves and stones.\n\nYou had to fall back. This day will be talked about in every monastery in the land."
 tog_quest.0165.a: "I will have to find another way."
 tog_quest.0153.t: "The Ribbon Spring"
 tog_quest.0153.desc: "At the bottom of a little valley, a spring rises from among the roots of an old ash tree. Its branches are covered in ribbons, scraps of cloth and locks of hair. A brand-new cross has been planted beside it. Yet the ribbons are recent too.\n\nAn old woman dips a cloth in the spring and ties it to a branch, murmuring."
 tog_quest.0153.a: "Ask her what she is doing."
 tog_quest.0153.a.good: "She tells you words her grandmother taught her. Among them you recognise the name of a goddess."
 tog_quest.0153.a.bad: "She takes fright and leaves without a word."
 tog_quest.0153.b: "Tie a ribbon myself."
 tog_quest.0154.t: "The Priest and the Stone"
 tog_quest.0154.desc: "In a village square, a priest is having a standing stone broken down with sledgehammers. The villagers watch without a word. A woman had left milk at the foot of the stone. She has been tied to a post, and the priest announces that she will be flogged for idolatry."
 tog_quest.0154.a: "Step in, sword in hand."
 tog_quest.0154.a.good: "The priest's men flee. The woman is free, and the whole village saw it."
 tog_quest.0154.a.bad: "The woman is freed, but you took some blows."
 tog_quest.0154.b: "Step in with words."
 tog_quest.0154.b.good: "The priest gives way before the village and unties the woman."
 tog_quest.0154.b.bad: "The priest humiliates you in front of everyone."
 tog_quest.0154.c: "Stay hidden and go on your way."
 tog_quest.0155.t: "[tog_peredur.GetFirstName]'s Shortcut"
 tog_quest.0155.desc: "“I know a shortcut,” [tog_peredur.GetFirstName] said this morning. It is now midday, the fog has come down, and you are in the middle of a bog no one has ever seen.\n\n“It's this way. I think. Well, it was this way before.”"
 tog_quest.0155.a: "Trust [tog_peredur.GetFirstName]."
 tog_quest.0155.a.good: "Against all odds, he finds the way."
 tog_quest.0155.a.bad: "You go round in circles until evening."
 tog_quest.0155.b: "Look for someone local."
 tog_quest.0155.b.good: "A shepherd puts you back on the road."
 tog_quest.0155.b.bad: "The shepherd makes fun of you and says nothing useful."
 tog_quest.0171.t: "The Book Entrusted"
 tog_quest.0171.desc: "The monk looked at you for a long time. Then he went to the library without a word. He came back with a book wrapped in a cloth.\n\n“Bring it back when you have read it. And tell no one it was me.”"
 tog_quest.0171.a: "I will read it with care."
 tog_quest.0172.t: "The Price of a Book"
 tog_quest.0172.desc: "The monk counted the coins twice and made them vanish into his sleeve. Then he told you to meet him behind the wall, after compline.\n\nThis time he came. The book was under his habit."
 tog_quest.0172.a: "Everything can be bought, even among monks."
 tog_quest.0173.t: "One Book Fewer"
 tog_quest.0173.desc: "No one was keeping watch, the door was not locked and the chest only half so. You slipped out before dawn, the book under your shirt.\n\nBy the time the monks notice, you will be far away."
 tog_quest.0173.a: "No one saw me."
 tog_quest.0174.t: "The Doors Gave Way"
 tog_quest.0174.desc: "The door gave way at the third blow. The monks took refuge in the chapel, singing psalms. No one dared to stand in the way.\n\nYour men took whatever glittered. You took the book. This day will be talked about for a long time, and not kindly."
 tog_quest.0174.a: "The book is mine."
 tog_quest.0158.t: "The Old Man and the Stone"
 tog_quest.0158.desc: "When you wake, Lailoken's blanket is empty. You search for him all morning. In the end Peredur finds him at the top of a hill, sitting against a standing stone. He is talking to it in a low voice, as to an old acquaintance.\n\n“Don't look like that. It doesn't answer me, I'm not mad. But when you talk to a stone, you end up hearing what you really think.” He pats the granite. “Your monks wrote everything down because they were afraid of forgetting. The ancients wrote nothing: they trusted memory. You won't find the gods in books, lad. The books will only tell you where to look.”"
 tog_quest.0158.a: "“Go on, I'm listening.”"
 tog_quest.0158.b: "“We've been looking for you all morning!”"
 tog_quest.0159.t: "Few Winters Left"
 tog_quest.0159.desc: "For three days, Lailoken has been walking more and more slowly. This morning he fell in the mud and took a long time to get up. He refuses any help.\n\n“Don't stop for me. I have few winters left, and I would rather spend them on the road than by a fire.” He coughs for a long time. “But if you could walk a little less fast, I wouldn't say no.”"
 tog_quest.0159.a: "Slow down for him."
 tog_quest.0159.a.tt: "You take the time it needs. Lailoken will not forget it."
 tog_quest.0159.b: "Keep the same pace."
 tog_story_old_groves_books: "Books read"
 tog_story_old_groves_books_min: "0"
 tog_story_old_groves_books_max: "5"
 tog_quest.0181.t: "The Sum Is Right"
 tog_quest.0181.desc: "At the bridge, the toll-keeper demands three pennies a head and counts eleven heads for a party of eight. Before you have opened your mouth, [tog_peredur.GetFirstName] steps forward.\n\n“Eight. And you've got forty-two pennies in your purse, six hens behind your house, and you're missing four teeth. Three at the top, one at the bottom.”\n\nThe toll-keeper shuts his mouth very quickly."
 tog_quest.0181.a: "“You heard [tog_peredur.GetFirstName].”"
 tog_quest.0181.b: "Pay without arguing."
 tog_quest.0182.t: "[tog_peredur.GetFirstName] Reads"
 tog_quest.0182.desc: "In the evening, by the fire, [tog_peredur.GetFirstName] has picked up one of the books. He is holding it upside down, very seriously, frowning.\n\n“I don't know what it says. But on this page there are one thousand two hundred and forty-seven letters, and far too many “e”s. It must be a sad book.”"
 tog_quest.0182.a: "Teach him a few letters."
 tog_quest.0182.b: "Burst out laughing."
 trait_tog_dagda_cauldron: "Cauldron of the Dagda"
 trait_tog_dagda_cauldron_desc: "In the darkness of the mound, the Dagda showed this character his cauldron, the one from which no one leaves hungry."
 trait_tog_dagda_club: "Club of the Dagda"
 trait_tog_dagda_club_desc: "In the darkness of the mound, the Dagda showed this character his club: one end kills, the other brings back to life."
 trait_tog_dagda_harp: "Harp of the Dagda"
 trait_tog_dagda_harp_desc: "In the darkness of the mound, the Dagda showed this character his harp, the one that puts the seasons in order."
 tog_story_old_groves_places: "Sacred places to visit"
 tog_obj_places: "Visit the sacred places the books speak of: Brú na Bóinne, Uisneach and the stone of Mabon."
 tog_dest_place: "a sacred place"
 tog_travel_desc_places: "The books speak of places where the old gods were worshipped: the house of the Dagda on the Boyne, the hill of Uisneach, the stone of Mabon. Choose where to go."
 tog_p.leave_tt: "You can come back with the decision “Travel to a sacred place”."
 tog_test_skip_step2_decision: "TEST: Start at step 3"
 tog_test_skip_step2_decision_desc: "Test decision, to remove before release: skips steps 1 and 2 if needed and opens step 3 directly."
 tog_quest.0240.t: "Which Sacred Place?"
 tog_quest.0240.desc: "The books have given you place names. Which one do you want to see?"
 tog_quest.0240.bru: "Brú na Bóinne, the house of the Dagda ([GetTitleByKey('b_drogheda').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_bru').GetValue|0] km"
 tog_quest.0240.uisneach: "The hill of Uisneach ([GetTitleByKey('b_uisneach').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_uisneach').GetValue|0] km"
 tog_quest.0240.mabon: "The stone of Mabon ([GetTitleByKey('b_dumfries').GetNameNoTier]), about [ROOT.Char.MakeScope.Var('tog_km_mabon').GetValue|0] km"
 tog_quest.0240.mabon_locked: "You must first have seen Brú na Bóinne and Uisneach"
 tog_quest.0201.t: "The House of the Dagda"
 tog_quest.0201.desc: "The mound is bigger than anything you have seen built by men. It is a round hill, ringed with great stones covered in spirals. The Norse of Dublin have been here: you can still see the trenches they dug looking for gold.\n\nA shepherd, Eógan, grazes his sheep at the foot of the hill. He knows the old stories of his grandfather. The priest has forbidden him to tell them, and in any case no one asks him for them. You ask. So he tells. This is where the Dagda lived, the good god, with his cauldron, his club and his harp. His son Óengus took the house from him by a trick: he asked for it for “a day and a night”, and those words meant “for ever”.\n\n“Those who slept inside, in the old days, came out with visions. No one has done it since my grandfather's time.”"
 tog_quest.0201.a: "Spend the night in the mound."
 tog_quest.0202.t: "The Night in the Mound"
 tog_quest.0202.desc: "Eógan showed you the entrance, then sat down outside, against a stone. The passage is narrow, so low that you must move bent double. At the far end, the darkness is total.\n\nThe cold rises from the ground. After a while, you no longer know whether your eyes are open or closed. You hear sounds: dripping water, perhaps, or someone breathing."
 tog_quest.0202.a: "Hold out until morning."
 tog_quest.0202.good: "You keep a clear head and understand what you are living through."
 tog_quest.0202.bad: "Fear grips you all night."
 tog_quest.0203.t: "The Vision"
 tog_quest.0203.desc: "Towards the end of the night, someone is with you in the chamber. It is a huge, pot-bellied man in a tunic that is too short, laughing softly in the dark. He sets three things before you: a cauldron that never empties, a club of which one end kills and the other brings back to life, a harp that puts the seasons in order.\n\n“Take one. Only one.”"
 tog_quest.0203.a: "The cauldron."
 tog_quest.0203.b: "The club."
 tog_quest.0203.c: "The harp."
 tog_quest.0204.t: "Morning"
 tog_quest.0204.desc: "When you come out, the light hurts your eyes. Eógan is still there, against his stone, his cloak over his shoulders. He has not slept.\n\nHe looks at you for a long time. “You saw something. It shows.” He stands and picks up his staff. “All my life I've told these stories without knowing whether I believed them. I want to see what comes next. And besides, if you are going to write them down, someone has to tell you all of them.”"
 tog_quest.0204.a: "“Come.”"
 tog_quest.0204.a.tt: "#V Eógan#! takes up his staff and follows you."
 tog_quest.0211.t: "The Hill of Uisneach"
 tog_quest.0211.desc: "It used to be said that from the top of this hill you could see the whole of Ireland. Yet it is not high. The wind flattens the grass. There is no one, only sheep and, here and there, things men have left behind: a great split stone, blackened earth, an old well.\n\nThe books said it was the centre of Ireland, and that Lug had died here. But they did not say how to read what you find on the spot."
 tog_quest.0211.a: "Examine the signs."
 tog_quest.0212.t: "The Split Stone"
 tog_quest.0212.desc: "It is an enormous block of limestone, split into several pieces, as if something had broken it from within. The local people call it the stone of divisions. What does it mean?"
 tog_quest.0212.a: "The centre: the provinces meet here, and Lug is buried here."
 tog_quest.0212.b: "The lightning of the Christian God, which shattered an idol."
 tog_quest.0212.c: "A boundary marker between two farms."
 tog_quest.0213.t: "The Blackened Earth"
 tog_quest.0213.desc: "Over a wide area, the earth is black. It is mixed with burnt bones and charcoal, layer after layer, as if great fires had been lit here for centuries. Why?"
 tog_quest.0213.a: "A village burned by the Norse."
 tog_quest.0213.b: "A saint's fire, like Patrick's at Slane."
 tog_quest.0213.c: "The fires of Beltaine, between which the cattle were driven."
 tog_quest.0214.t: "The Well"
 tog_quest.0214.desc: "It is an old well, almost filled in, surrounded by flat stones worn smooth by knees. Pins, coins and small bones have been thrown into it. What were people looking for at the bottom?"
 tog_quest.0214.a: "A well blessed by a saint, for healing."
 tog_quest.0214.b: "A door to the Otherworld, through which souls pass."
 tog_quest.0214.c: "A simple water supply for the sheep."
 tog_u.wrong_tt: "A wrong reading is an offence against the god of the place. You must start again from the first sign."
 tog_quest.0215.t: "A False Trail"
 tog_quest.0215.desc: "You turn the idea over in your head, and it does not hold. Nothing in the books points that way. You looked at this place with a monk's eyes, not with those of the ancients. Everything you thought you had understood collapses.\n\nThe wind blows harder, like a reproach. You must start again from the beginning."
 tog_quest.0215.a: "Start again from the split stone."
 tog_quest.0216.t: "Lug of the Many Skills"
 tog_quest.0216.desc: "Sitting at the foot of the split stone, you gather together what you have understood.\n\nThe collection of places from Applecross said it: Uisneach is the centre of Ireland, where the provinces meet, and Lug died there. The local people say the split stone marks his grave. Lug is the king who unites.\n\nThe scraped book from Dunkeld said it: at Beltaine, the druids lit two great fires and drove the cattle between them, against disease. Here, they were lit for centuries. Lug is the light that protects.\n\nThe florilegium from Whithorn said it: souls do not die, they pass on. The well is a door, and what was thrown into it was for those on the other side. Lug comes and goes between the worlds.\n\nThese are three faces of one god. The local people tell how one day he asked to enter Tara. He presented himself as carpenter, smith, harper, warrior, poet and physician. They let him in, because no one else could do everything. He is the god of all the arts. The greatest of them, perhaps."
 tog_quest.0216.a: "Lug is the greatest."
 tog_quest.0221.t: "The Stone of Mabon"
 tog_quest.0221.desc: "Here you are at last on the shores of the Solway, in the village where, according to the books, the stone of Mabon stands. In the square, a few low houses surround a well. Women are washing linen, children are chasing a goose. Everyone falls silent as you pass.\n\nFrom the square you can see the stone. It stands alone in a field at the end of the village, taller than a man. When you ask its name, the villagers say it has none, that it is a stone like any other, and they look away. Yet there is fresh milk in the hollow at its foot.\n\nAt the far end of the field, one of the lord's men is measuring the land with a rope. An old woman whispers to you, without looking at you: “He wants to take the field from us for a debt. The field of the stone.”"
 tog_quest.0221.a: "Offer my help."
 tog_quest.0222.t: "The Debt"
 tog_quest.0222.desc: "The debt is old, swollen by interest. The Christian lord's steward makes no secret that it is the stone he is after: his master wants to pull it down and build a chapel in its place.\n\nIf the field is lost, so is the stone."
 tog_quest.0222.a: "Pay the debt."
 tog_quest.0222.b: "Negotiate with the steward."
 tog_quest.0222.c: "Forge the deed of debt."
 tog_quest.0223.t: "The Informer"
 tog_quest.0223.desc: "The field is saved. That very evening, the villagers come to find you. They invite you to the rite of the next moon, at the foot of the stone, and tell you that the keeper wants to see you.\n\nBut on the eve of the rite, you catch Aedán, a young man of the village, saddling a horse at nightfall. He is going to the priest. He says that what you are doing is a sin and that he does not want to burn with you. The villagers look at you: they are waiting to see what you will do."
 tog_quest.0223.a: "Convince him to stay."
 tog_quest.0223.b: "Buy his silence."
 tog_quest.0223.c: "Frighten him."
 tog_quest.0223.d: "Make him disappear."
 tog_quest.0223.d.tt: "Aedán will speak to no one. The villagers will not forget it."
 tog_quest.0222.d: "Intimidate the steward."
 tog_quest.0224.t: "The Keeper"
 tog_quest.0224.desc: "At the new moon, some twenty of them stand around the stone, with shaded lanterns. A man steps forward: Gwion, the keeper. His father kept the stone before him, and his father's father before them. He pours the milk and says words in a language no one understands any more. For the first time, you hear the name of the god of the place spoken aloud: Mabon, the divine son, the young hunter.\n\nAfter the rite, you want to speak to him. He turns his back on you. “You saved the field, and I thank you for it. But I do not speak of the gods to strangers. The last stranger who came here was the priest.”\n\nThe old woman takes you aside. The priest took Gwion's daughter, Eluned, to the convent in the vale, to save her from her father's paganism. Since then, Gwion hardly speaks to anyone. Eluned is his only child. She was the one he was to teach the prayers to."
 tog_quest.0224.a: "Get Eluned out of the convent."
 tog_quest.0224.a.tt: "A scheme begins to free #V Eluned#!. When you judge it ready, use the scheme's “Execute” button."
 tog_free_daughter: "Free Eluned"
 tog_free_daughter_action: "Free"
 tog_free_daughter_desc: "I will get [SCHEME.GetTargetCharacter.GetShortUIName] out of the convent where the priest locked her away, and give her back to her father."
 tog_free_daughter_desc_general: "Get Gwion's daughter out of the convent where the priest locked her away."
 TOG_FREE_DAUGHTER_SUCCESS_DESC: "Eluned will be reunited with her father, and Gwion will agree to speak."
 tog_obj_daughter: "Get Eluned, Gwion's daughter, out of the convent."
 tog_obj_learning: "Learn from Gwion what his ancestors have kept."
 tog_quest.0230.t: "A Failed Attempt"
 tog_quest.0230.desc: "Everything was ready: the rope, the horse, the portress bought. But that night the abbess stayed up late in the chapel, and you had to give up.\n\nThe sisters are a little more wary. You will have to try again."
 tog_quest.0230.a: "Next time."
 tog_quest.0230.a.tt: "The scheme goes on: you can try again with the “Execute” button."
 tog_quest.0232.t: "Eluned"
 tog_quest.0232.desc: "Eluned climbed over the convent wall at the hour of matins, in a cloak too big for her. By morning she is in the village. Gwion holds her close without a word, for a long while.\n\nIn the evening, he comes to sit by your fire. “You saved the field. You gave me back my daughter. A stranger does not do that for nothing. What are you looking for?”\n\nSo you tell him everything: the stone with the signs in the heather of [GetTitleByKey('b_skye').GetNameNoTier], the books taken from the monks, the night in the house of the Dagda, the signs of Uisneach. The gods whose names his ancestors kept once had priests, feasts and places, and they were taken from you. You want to know who they really were.\n\nGwion listens without interrupting. Then he says, slowly: “I saw you in a dream, before you came. A man came from the west with books under his arm. I did not know what it meant.” He looks at the houses of the village. “There were a hundred of them in my grandfather's time. There are twenty. When I die, there will be no one left to say the prayers, except Eluned, and the priest will take her back. My ancestors kept the stone waiting for something. I believe it is you. You have the books, I have the words that were spoken to the gods. Take us with you, my daughter and me, and I will teach you all I know.”"
 tog_quest.0232.a: "“Your prayers will not die with you.”"
 tog_quest.0232.a.tt: "#V Gwion#! and his daughter #V Eluned#! leave with you. In the coming months, Gwion will teach you what he knows."
 tog_quest.0233.t: "The Son of the Mother"
 tog_quest.0233.desc: "In the evening, Gwion begins with the god of his stone. Mabon is the son of Modron, the Mother. He was taken from his mother when he was three nights old, and no one knew where he was. Then the oldest animals in the world, the blackbird, the stag, the owl, the eagle and the salmon, led those who were looking for him to his prison.\n\n“He is the young god, the one who is set free. The Romans themselves prayed to him, along their wall. They called him Apollo, because they wanted all gods to be theirs.”"
 tog_quest.0233.lailoken: "\n\nLailoken, who has moved closer to the fire, asks which of the five animals was the oldest. “The salmon,” answers Gwion. The old man nods, satisfied, as if he already knew."
 tog_quest.0233.a: "The god who is set free."
 tog_quest.0234.t: "The Four Doors"
 tog_quest.0234.desc: "“The year has four doors,” says Gwion. Samain, when summer dies and the dead come back to sit by the fire: you leave them a place and something to eat. Imbolc, when the ewes come into milk: it is Brigit's feast. Beltaine, with its two fires between which the beasts are driven. Lugnasad, at harvest: it is Lug's feast, with games and marriages for a year and a day.\n\n“The monks kept the dates. They only changed the names.”"
 tog_quest.0234.lailoken: "\n\nLailoken laughs softly. In his valley, he says, they still put out every fire on the eve of Samain, and no one knows why any more. Gwion explains it to him. The old man stays silent for a long time."
 tog_quest.0234.a: "The monks changed the names."
 tog_quest.0235.t: "Oaths and Stones"
 tog_quest.0235.desc: "Gwion teaches you how oaths were sworn in the old days: by the gods of one's people, a hand on the stone, before witnesses. Whoever broke his oath was no longer allowed to attend the sacrifices. No one spoke to him any more, no one ate with him. It was worse than death.\n\nAnd the standing stones are not tombs, or not only. “People came to them to speak to those below. Your stone in the heather, the one with the signs, it was speaking. You just have to learn to hear it again.”"
 tog_quest.0235.lailoken: "\n\nLailoken lays a hand on Gwion's knee. “That's what I told him, the day he freed me: that his stone was a text.” Gwion looks at him with respect, for the first time."
 tog_quest.0235.a: "Learn to hear it again."
 tog_quest.0236.t: "The Prayers"
 tog_quest.0236.desc: "For weeks, Gwion recites the prayers to you, one by one, in the language no one understands any more. He makes you repeat them until you know them. “It is not the words that matter. It is that people go on saying them.”\n\nOn the last evening, he tells you of something his grandfather used to tell. Long before the monks, the Romans defeated the peoples of the continent in a great battle, on a hill where, they say, the gods of the Gauls lost. But one village, by the sea, held out against them far longer than the others. “No one knows where the hill was. The village, they say, is in Armorica. If anything of the ancients is left, it is there.”"
 tog_quest.0236.lailoken: "\n\nLailoken learned the prayers at the same time as you. He mumbles them as he walks. He often gets them wrong, but he never stops."
 tog_quest.0236.a: "We will have to go and see."
 trait_tog_awen: "Awen"
 trait_tog_awen_desc: "The gift: the inspiration of poets and prophets. Some of this character's dreams come true."
 TOG_COMPANION_HELPS: "Companion of the quest: helps without anything in return"
 tog_quest.0231.t: "A Moonless Night"
 tog_quest.0231.desc: "Everything is ready: the rope, the horse hidden in the wood, your companions at their posts around the convent. The night is black. The sisters will soon rise for matins.\n\nPerhaps this is the right moment. Or perhaps not."
 tog_quest.0231.a: "Try my luck."
 tog_quest.0231.b: "Use an advantage."
 tog_quest.0231.b.tt: "Spends 1 advantage: +20% chance for this attempt."
 tog_quest.0231.c: "Use two advantages."
 tog_quest.0231.c.tt: "Spends 2 advantages: +40% chance for this attempt."
 tog_quest.0231.d: "Wait for a better night."
 tog_quest.0231.d.tt: "You do not act tonight. The scheme goes on: you can come back with the “Execute” button."
 tog_quest.0251.t: "The Portress"
 tog_quest.0251.desc: "The portress is old and poor, and she does not like the abbess. Lailoken was begging for alms at the gate. She let him understand that a door can stay badly shut for a night or two, if the price is right. Or if one knows how to talk to her."
 tog_quest.0251.a: "Slip her a few coins."
 tog_quest.0251.b: "Win her trust."
 tog_quest.0251.c: "Too risky."
 tog_quest.0252.t: "The Abbess Grows Wary"
 tog_quest.0252.desc: "The abbess has noticed strangers around the convent. She has had a new lock put on the door of the novices' dormitory, and a sister now keeps watch all night."
 tog_quest.0252.a: "Cover our tracks."
 tog_quest.0252.a.tt: "Spends 1 advantage: the abbess's suspicion fades."
 tog_quest.0252.b: "We'll make do."
 tog_quest.0253.t: "A Message from Eluned"
 tog_quest.0253.desc: "At the market, a little novice slipped a scrap of parchment into your hand without looking at you. It is from Eluned. She knows someone is coming for her. She says which window does not close, and at what hour the sister on watch falls asleep."
 tog_quest.0253.a: "She is ready."
 tog_quest.0254.t: "[tog_peredur.GetFirstName] Counts"
 tog_quest.0254.desc: "You sent [tog_peredur.GetFirstName] to scout the place, discreetly. He came back delighted. “Forty-three windows, seven doors, two hundred and twelve stones in the garden wall.” He pauses. “I counted out loud. There was a sister. She asked me why.”"
 tog_quest.0254.a: "Let Lailoken sort it out."
 tog_quest.0254.a.tt: "Lailoken goes to find the sister. He explains that the boy is simple-minded and counts everything, even the stars. It is almost true. No one suspects a thing."
 tog_quest.0254.b: "Too late."
 tog_portress_bought_modifier: "Portress in on It"
 tog_abbess_wary_modifier: "Wary Abbess"
 tog_eluned_message_modifier: "Message from Eluned"
 tog_peredur_blunder_modifier: "Peredur Counted Out Loud"
 tog_story_old_groves_lessons: "Gwion's teachings"
 tog_story_old_groves_lessons_max: "4"
 trait_tog_awen_protected: "Awen"
 trait_tog_awen_protected_desc: "The gift: the inspiration of poets and prophets. Some of this character's dreams come true."
 trait_tog_novice: "Novice"
 trait_tog_novice_desc: "Locked away in a convent by the priest, to save her from her father's paganism."
 tog_free.success_tt: "get #V Eluned#! out of the convent (if it fails, the scheme goes on)"
 tog_quest.0229.t: "Back to Square One"
 tog_quest.0229.desc: "The plan to get Eluned out has failed. Gwion is still waiting for his daughter, and he will not speak to you as long as she is in the convent."
 tog_quest.0229.a: "Resume the scheme."
 tog_quest.0236.a.tt: "Gwion has taught you all he knows. The road now leads to Armorica."
 tog_obj_village: "Cross the sea to Armorica and find the village that held out against the Romans, at the end of a cape near #V [GetTitleByKey('b_saint_brieuc').GetNameNoTier]#!."
 tog_obj_heric: "Find where the hill of the great battle was, where the gods of the Gauls lost. They say a monk of Auxerre, #V [GetTitleByKey('b_auxerre').GetNameNoTier]#!, has read all the books of the ancient authors."
 tog_dest_village: "the village in Armorica"
 tog_dest_heric: "Auxerre"
 tog_travel_desc_village: "A village by the sea held out against the Romans longer than all the others. Gofraid knows where: in Armorica, at the end of a cape."
 tog_travel_desc_heric: "No one in Gaul knows where the hill of the great battle was. No one, except perhaps a monk of Auxerre who has read all the books of the ancient authors."
 tog_quest.0311.t: "The Village on the Cape"
 tog_quest.0311.desc: "Gofraid knew the place: at the end of a cape on the north coast, battered by the wind. Across the neck of the cape, an enormous earth rampart, half collapsed, cuts the moor from one sea to the other. The local people call it Caesar's ditch, though it is far older than Caesar. Behind it, on the plateau, all that is left of the village are rings of stones where the houses stood, and heaps of ash overgrown with grass.\n\nWhere to dig?"
 tog_quest.0311.a: "At the foot of the rampart."
 tog_quest.0311.b: "In the heaps of ash."
 tog_quest.0311.c: "In the rings of the houses."
 tog_quest.0311.d: "Under the hearth of the largest house."
 tog_quest.0312.t: "Nothing Here"
 tog_quest.0312.desc: "You dig until evening. Potsherds, boar bones, pebbles. Nothing worth the trouble. [tog_gwion.GetFirstName] thinks it is a strange sort of worship, scratching at the earth like a pig."
 tog_quest.0312.a: "Dig somewhere else."
 tog_quest.0313.t: "The Golden Sickle"
 tog_quest.0313.desc: "Under the hearthstone of the largest house lies a blade of gold. It is a thin crescent, a hand's breadth across in the middle and tapering to points, engraved with fine chevrons. It is so old that its edges are worn.\n\nYou hold it in the light for a long time. You think of the page from Pliny: “with a golden sickle”. You know that a blade of gold so thin cuts nothing. You also know that you are holding the same crescent as the one carved on your stone, in the isles, above the two circles.\n\nGofraid looks at the rampart and the ashes. “The people here never gave in,” he says. “Not to the Romans, not to the Franks. Indomitable, they were. I certainly hope they won't give in to the Norse either.”"
 tog_quest.0313.a: "The crescent of my stone."
 tog_quest.0313.a.tt: "You take the #V golden sickle#! with you. The road now leads to Auxerre."
 tog_golden_sickle_name: "The Golden Sickle"
 tog_golden_sickle_description: "A thin crescent of gold engraved with chevrons, found under the hearth of a village in Armorica that had held out against the Romans. Pliny said the druids cut mistletoe with a golden sickle."
 tog_quest.0321.t: "The One Who Knows"
 tog_quest.0321.desc: "The porter gave in at last. One evening, the monk comes out through the little garden gate. His name is Héric. He is about thirty, with the tired eyes of those who read at night, and a curiosity no rule can hold back. Sitting on a low wall, you talk for a long time, in Latin.\n\nHéric knows of the siege. Caesar told of it: Alesia, the town on the hill, encircled by two lines of ramparts, and Vercingetorix throwing down his arms at the proconsul's feet. And Héric thinks he knows where it was: two days from here, above the village of Alise. In nine centuries, the name has barely changed. He writes it into his verses.\n\n“You are looking for the gods of the Gauls,” he says as he leaves you. “You will not find them there. You will find the place where they lost.”"
 tog_quest.0321.a: "“That is already a great deal.”"
 tog_quest.0321.a.tt: "You leave at once for Alise, two days' journey away."
 tog_quest.0331.t: "Where They Lost"
 tog_quest.0331.desc: "Two days later, you are at the foot of the hill. Mont Auxois has a flat top, covered in fields and vines. Below, on the plain, a peasant is ploughing. You ask him whether he finds things in the earth. He points to a heap of scrap at the edge of the field: arrowheads, nails, bits of bronze. And in the middle, a bronze boar's head, jaws open, mounted on a long, twisted tube. A war horn.\n\nThe peasant's name is Ursin. All his life he has pulled this debris out of his field and cursed it, because it chipped the share of his plough. He watches you lift his scrap metal the way a priest lifts a relic. He asks if he can blow into it. All that comes out is a rattle, but there is something in his eyes that was not there that morning.\n\nThe next day, he has left his field to his brother. He walks behind you, the horn on his shoulder."
 tog_quest.0331.a: "“It is mine, but you will be the one to play it.”"
 tog_carnyx_name: "Gaulish Carnyx"
 tog_carnyx_description: "A Gaulish war horn, a carnyx, with a bronze boar's head, dug out of a field at the foot of the hill where the Gauls surrendered to the Romans."
 tog_golden_sickle_modifier: "Golden Sickle"
 tog_carnyx_modifier: "Gaulish Carnyx"
 tog_test_skip_step4_decision: "TEST: Start at step 5"
 tog_test_skip_step4_decision_desc: "Test decision, to remove before release: skips the earlier steps if needed and opens step 5 (the continent) directly."
 tog_obj_guide: "Find a guide who knows Gaul well, before setting out to look for the village and the hill Gwion spoke of."
 tog_find_guide_decision: "Look for a Guide"
 tog_find_guide_decision_desc: "No one around you knows Gaul. You need a man who knows its roads, its ports and its languages, and who knows where it is better not to stop."
 tog_find_guide_decision_tooltip: "You let it be known that you are looking for a guide to Gaul."
 tog_find_guide_decision_confirm: "Search"
 tog_find_guide_decision_effect_tt: "Soon, in the ports and markets, people will know you are looking for a guide."
 tog_quest.0300.t: "Looking for a Guide"
 tog_quest.0300.desc: "You need a man who knows Gaul. They can be found in the ports and markets, but you have to find one, and he has to agree to follow a stranger on an odd venture. You can pay to spread the word, or count on your name to bring someone to you."
 tog_quest.0300.a: "Pay to spread the word."
 tog_quest.0300.b: "Rely on my name."
 tog_quest.0300.tt: "Someone will come forward in the coming days."
 tog_quest.0301.t: "The Explorer"
 tog_quest.0301.desc: "One evening a man turns up, a sack over his shoulder. His name is Gofraid, half Norse, half Gael. He started out a merchant and ended up a wanderer. He has sailed up the Loire and the Seine, sold furs in Rouen and spent a winter in Tours. He has learned the Romance tongue of the Franks and the Breton of Armorica. He knows the roads of Gaul as other men know their field.\n\nHe listens to you explain what you are looking for, picking his teeth with a knife. “A village that held out against the Romans longer than the others, and a hill where the gods lost?” He smiles. “The village, I know where it is. The hill, no. I've seen many things over there, but never anyone looking for that. I'm coming.”"
 tog_quest.0301.a: "“Welcome, Gofraid.”"
 tog_quest.0301.join_tt: "#V Gofraid#! picks up his sack. The road to Armorica is open."
 tog_quest.0331.a.tt: "The #V Gaulish carnyx#! is yours, and #V Ursin#! carries it. It is time to go home and read the stone again."
 tog_obj_read_stone: "Go home and read the stone again, from the wax tablet of the first day. With all you have learned, it should finally speak."
 tog_obj_mon: "Perform the first rite of the ancients on Ynys Môn, #V [GetTitleByKey('b_yns_mon').GetNameNoTier]#!, the island where the Romans slaughtered the last druids."
 tog_dest_mon: "Ynys Môn"
 tog_travel_desc_mon: "The stone says that with the golden sickle one cuts the mistletoe. Pliny said how: from an oak, dressed in white. And there is only one fitting place: Môn, where the gods were silenced."
 tog_read_stone_decision: "Read the Stone"
 tog_read_stone_decision_desc: "You still have the wax tablet from the first day. You understood nothing of it then. Now you have the books, the gods of the sacred places, Gwion's prayers and the golden sickle."
 tog_read_stone_decision_tooltip: "You read the stone again with all you have learned."
 tog_read_stone_decision_confirm: "Read"
 tog_read_stone_decision_effect_tt: "You set the tablet before you."
 tog_quest.0401.t: "The Stone Read"
 tog_quest.0411.t: "The Isle of the Wise"
 tog_quest.0411.desc: "The florilegium from Whithorn spoke of it. A Roman wrote there that Môn was the isle of the wise, and that the legions had slaughtered the last druids there and cut down their sacred groves. There are no woods left. Where a little remained, the monks finished the job: on the hill of the great grove there is now a church.\n\nMistletoe grows on many trees, but almost never on the oak, and Pliny knew it. You would never have found it without a local woman, Nest. When she was little, her grandmother showed her a hollow that people avoid without knowing why. At the bottom stands an old hollow oak and, in its high branches, a ball of mistletoe."
 tog_quest.0411.a: "Perform the rite."
 tog_quest.0412.t: "The First Rite"
 tog_quest.0412.a: "Keep the mistletoe, wrapped in white linen."
 tog_quest.0412.tt: "The mistletoe is woven into a crown. You take the #V mistletoe crown of Môn#! with you, and #V Nest#! leaves with you."
 tog_mistletoe_name: "The Mistletoe Crown of Môn"
 tog_mistletoe_description: "A crown woven from the mistletoe cut from an old hollow oak on Ynys Môn, caught in a white cloak at the first rite of the ancients since the druids fell silent."
 tog_mistletoe_modifier: "Mistletoe Crown of Môn"
 tog_test_skip_step5_decision: "TEST: Start at step 6"
 tog_test_skip_step5_decision_desc: "Test decision, to remove before release: skips the earlier steps if needed, gives the golden sickle and opens step 6 (reading the stone) directly."
 tog_quest.0184.t: "The Children of Lir"
 tog_quest.0184.desc: "In the evening, by the fire, [tog_eogan.GetFirstName] begins a story. It is the one about the four children of King Lir. Their jealous stepmother turned them into swans, condemned to wander nine hundred years on the cold waters, until the day a bell would be heard ringing.\n\nHe tells it well. The others have fallen silent, even [tog_gofraid.GetFirstName]. But the night is wearing on, and tomorrow's road is long."
 tog_quest.0184.a: "“Go on, we're listening.”"
 tog_quest.0184.b: "“The ending tomorrow. We leave at dawn.”"
 tog_quest.0185.t: "[tog_gwion.GetFirstName]'s Dream"
 tog_quest.0185.desc: "When he wakes, [tog_gwion.GetFirstName] is pale. He dreamed of this morning's road: a ford, willows, and men hidden in the willows. “Some of my dreams come true,” he says. “Not all of them. But I have had this one twice.”\n\nThe ford is an hour's walk away. Going round it costs a day."
 tog_quest.0185.a: "Go round the ford."
 tog_quest.0185.a.tt: "A day lost. You will never know whether there was anyone in the willows."
 tog_quest.0185.b: "“Dreams are dreams.”"
 tog_quest.0185.b.good: "There is no one at the ford."
 tog_quest.0185.b.bad: "There were men in the willows."
 tog_quest.0186.t: "The Innkeeper"
 tog_quest.0186.desc: "The innkeeper names his price for the night, the meal and hay for the animals. [tog_gofraid.GetFirstName] bursts out laughing. “You're counting the hay twice, friend, and your wine is mostly water.” He turns to you. “Leave it to me. I know his sort from the Loire to the Seine.”"
 tog_quest.0186.a: "“Go ahead.”"
 tog_quest.0186.b: "Pay the asking price."
 tog_quest.0187.t: "The Midnight Carnyx"
 tog_quest.0187.desc: "In the middle of the night, a dreadful rattle wakes the whole camp. The horses kick, [tog_peredur.GetFirstName] gropes for his sword and Lailoken swears in a language no one knows. It is [tog_ursin.GetFirstName], off to one side, the horn at his lips. He is practising. He is very proud: this time, you could almost hear a note."
 tog_quest.0187.a: "“Once more, [tog_ursin.GetFirstName]!”"
 tog_quest.0187.b: "“Not at night.”"
 tog_quest.0401.desc: "You lay on the table the wax tablet from the first day, when you knew nothing. Back then, they were only strokes. Tonight, you lay the golden sickle beside it, and you look.\n\nThe crescent at the top is the sickle. You hold it in your hand: the same tapering points, the same curve. The broken arrow crossing it is the branch being cut, the mistletoe falling from the oak, as in Pliny. The two linked circles are the two fires of Beltaine the scraped book from Dunkeld spoke of, the ones lit for centuries on the hill of Uisneach. And the zigzag running through them is the path of souls. The florilegium from Whithorn called them immortal: they pass from one world to the other through the well of Uisneach, through the house of the Dagda.\n\nPiece by piece, everything you have gathered over the years comes to rest on the stone, and it all fits together. It is no longer a drawing. It is a prayer."
 tog_quest.0401.lailoken: "\n\nLailoken has come over without a sound. He lays his old finger on the crescent, as on the day he told you it was a text. “For forty years I've been looking at these stones,” he says. “I knew they spoke. I didn't know they said that.”"
 tog_quest.0401.end: "\n\nYou take a fresh tablet and write, with a hand that does not tremble: #italic With the golden sickle, the mistletoe is cut from the oak. Through the two fires, souls pass and return.#! These are the first words of the faith. They no longer existed anywhere. Now they exist.\n\nWhat remains is to do what it says."
 tog_quest.0401.a: "“What remains is to do what it says.”"
 tog_quest.0401.a.tt: "The stone has spoken. Now the mistletoe must be cut, on Ynys Môn."
 tog_quest.0413.t: "The Men from the Hill"
 tog_quest.0413.intro: "You come back to the hollow dressed in white, as Pliny said, your companions around you.\n\nIt is [tog_nest.GetFirstName] who holds the white cloak beneath the tree. No one decided it: she stepped forward of her own accord. The women of her family kept this oak for generations. It is for her to receive what it gives.\n\nYou are halfway up the oak when [tog_nest.GetFirstName] cries out. At the edge of the hollow, some twenty men are coming down between the trees. There are peasants with staves and pitchforks, two of the lord's men in arms and, in front of them, a monk in a black habit, a cross raised high. Someone warned him. “Cut down that tree! Tear the devil from its branches!”\n\nYou have no time to climb down. You do not need to. Below, without a word, your companions have placed themselves between the oak and the hill."
 tog_quest.0413.peredur: " [tog_peredur.GetFirstName] has drawn his sword."
 tog_quest.0413.gofraid: " [tog_gofraid.GetFirstName] has pulled out his knife."
 tog_quest.0413.eogan: " [tog_eogan.GetFirstName] has taken up his shepherd's staff."
 tog_quest.0413.lailoken: " Even old Lailoken has stood up, leaning on his staff."
 tog_quest.0413.gwion: " [tog_gwion.GetFirstName] does not move: he looks the monk straight in the eye."
 tog_quest.0413.together: " No one turns back towards you. They leave it to you."
 tog_quest.0413.carnyx: "\n\nThen [tog_ursin.GetFirstName] raises the carnyx.\n\nThe sound rolls through the hollow like the roar of a beast, hoarse, enormous. No one here has heard that sound for a thousand years. The bronze boar's head seems to howl. The peasants stop dead. One of them drops his pitchfork. The monk raises his cross higher, but behind him the men are already backing away, then they run."
 tog_quest.0413.nocarnyx: "\n\nThe peasants look at these armed men who do not give a single step. They hesitate and look at each other. Then, one after another, they back away, and they start to run."
 tog_quest.0413.end: "\n\nThe monk stays alone at the edge of the hollow for a moment. Then he leaves too."
 tog_quest.0413.a: "“Let them go.”"
 tog_quest.0413.b: "“Catch the monk!”"
 tog_quest.0413.tt: "Your companions took up arms for you. They will not forget it."
 tog_quest.0412.desc: "When the hollow has fallen silent again, you raise the golden sickle to the branch. It does not cut, of course. You slice the mistletoe with your knife and let it fall into the cloak Nest holds out below.\n\nNothing happens. The wind stirs the leaves. A blackbird sings.\n\nBut for the first time in generations, someone has performed a rite of the ancients. You do not know whether you did it as it should be done. But it is done, and from now on you will know how to write it down.\n\nWhen you climb down from the tree, Nest has not moved. She is still holding the folded cloak against her, the mistletoe in the hollow of the linen. She looks at the oak as if she were seeing it for the first time.\n\n“My grandmother made me swear never to cut wood here,” she says at last. “A hundred times I asked her why. She said she didn't know, that her mother had made her swear too. She died without knowing.” She hands you the cloak. “You know. You found what they were keeping without knowing it. I'm not going to go home and pretend I don't know. If you write down what is done under this oak, I want to be there.”"
 tog_obj_step7: "The first rite is done. What has been gathered must never be lost again: it must be written down."
 tog_obj_verses: "Write the Book of the Druids: everything you have gathered, so that it can be taught, copied, and so that no one can ever erase it again."
 tog_obj_founded: "The worship of the ancients has followers once more."
 tog_story_old_groves_verses: "Book of the Druids: +[Story.MakeScope.Var('tog_verses_rate').GetValue|V0]% per month"
 tog_story_old_groves_verses_max: "100"
 tog_write_verses_decision: "Write the Book of the Druids"
 tog_write_verses_decision_desc: "If the Church won, it is because it had a book: the same everywhere, which priests copied from one end of the world to the other. The old gods had only the memory of the druids, and when the druids died, everything died with them. You will not make the same mistake."
 tog_write_verses_decision_tooltip: "You begin a book that gathers everything the worship of the ancients once was."
 tog_write_verses_decision_confirm: "Start writing"
 tog_write_verses_decision_effect_tt: "The writing begins. It progresses each month according to your learning, and your companions will take part in it."
 tog_verses.up: "The writing progresses."
 tog_verses.up_big: "The writing progresses a great deal."
 tog_verses.up_small: "The writing progresses a little."
 tog_verses.same: "The writing does not progress."
 tog_verses.down: "Pages must be redone: the writing slips back."
 tog_quest.0511.t: "Two Ways of Telling"
 tog_quest.0511.desc: "[tog_gwion.GetFirstName] and [tog_eogan.GetFirstName] are arguing over your page, about the house of the Dagda and Óengus's trick. [tog_eogan.GetFirstName] tells it the way his grandfather did, with the details that make people laugh and the silences that frighten them. [tog_gwion.GetFirstName] says it is not a fireside tale. These are words that were spoken to the gods, and you do not change them to raise a laugh.\n\nThey both turn to you."
 tog_quest.0511.a: "“[tog_gwion.GetFirstName] is right: these are sacred words.”"
 tog_quest.0511.b: "“[tog_eogan.GetFirstName] is right: this is how the people remember it.”"
 tog_quest.0511.c: "“I will write both, side by side.”"
 tog_quest.0512.t: "A Memory of Lailoken's"
 tog_quest.0512.desc: "Lailoken was dozing by the fire. He sits up all at once. “My mother used to sing that!” It is a nursery rhyme from his childhood, about a woman who rose from a lake with a cup in her hand. He recovers three lines of it, then five. Then he hesitates, starts again, mixes them up.\n\nIt may be a very ancient fragment. It may be a market song."
 tog_quest.0512.a: "Write it down as he remembers it."
 tog_quest.0512.a.bad: "The next day, he remembers it differently: pages must be redone."
 tog_quest.0512.b: "“Your memory is playing tricks on you, old man.”"
 tog_quest.0513.t: "What the Women Did"
 tog_quest.0513.desc: "[tog_nest.GetFirstName] reads over your shoulder and frowns. “There are only men in your book. Druids, kings, warriors.” She tells you what her grandmother used to do: the milk poured into the spring on the first day of May, the ember kept alight all through the night of Imbolc, the words said to a woman in childbirth. “No one ever wrote them down, because no one ever asked the women.”"
 tog_quest.0513.a: "“They will have their chapter.”"
 tog_quest.0513.b: "“The book speaks of the gods, not of the hearth.”"
 tog_quest.0514.t: "[tog_peredur.GetFirstName] Counts the Pages"
 tog_quest.0514.desc: "[tog_peredur.GetFirstName] has spent the evening counting the pages. “There are one hundred and eighty-seven. And there are eleven where you wrote Lug with two g's.” He offers to number them all, so they never get mixed up. He looks very proud of his idea."
 tog_quest.0514.a: "“Number them, [tog_peredur.GetFirstName].”"
 tog_quest.0514.a.good: "The pages are numbered, in perfect order. They talk about it all the way to the village."
 tog_quest.0514.b: "“Leave the pages alone, [tog_peredur.GetFirstName].”"
 tog_quest.0515.t: "The Dream of the Page"
 tog_quest.0515.desc: "[tog_gwion.GetFirstName] comes to find you before dawn. He has dreamed of a page of the book, a page you have not yet written: the prayer said when the fires of Beltaine are lit. He saw it word for word. He wants you to write it down at once, before the dream fades."
 tog_quest.0515.a: "Write down what he dreamed."
 tog_quest.0515.a.bad: "Reading it over, [tog_gwion.GetFirstName] is no longer sure of anything: it must be redone."
 tog_quest.0515.b: "“A dream is not a book.”"
 tog_quest.0516.t: "[tog_gofraid.GetFirstName]'s Vellum"
 tog_quest.0516.desc: "[tog_gofraid.GetFirstName] comes back from the market with a bundle under his arm. “Vellum from Tours. The best. I got it at half price from a merchant who didn't know what he was selling.” He sets it on the table with a wink. “Mind you, half price is still a price.”"
 tog_quest.0516.a: "“I'll take it at your price.”"
 tog_quest.0516.b: "Haggle hard."
 tog_quest.0519.t: "A Night of Writing"
 tog_quest.0519.desc: "The lamp smokes, the ink thickens, and the passage you are writing will not come. You could keep going until dawn. You could also go to bed and come back to it tomorrow."
 tog_quest.0519.a: "Write all night."
 tog_quest.0519.b: "Reread everything from the beginning."
 tog_quest.0501.t: "The Oath"
 tog_quest.0501.desc: "The book is finished. You call it the Book of the Druids.\n\nYou know it is not perfect. There are gaps you filled as best you could, and things you had to choose for want of knowing. But for the first time in a very long while, the worship of the ancients exists somewhere other than in the margins of the monks.\n\nOn the day of Beltaine, you climb the hill with those who followed you, met one by one along the way. You read them the Book from beginning to end, aloud, under the sky. [tog_gwion.GetFirstName] pours the milk into the Beltaine fire. For the first time in his life, he does not look around to make sure no one sees him. Then each in turn swears by Lug and by the Dagda, as people swore before baptism.\n\nThat evening, the worship of the ancients has followers once more."
 tog_quest.0501.a: "“By Lug and by the Dagda.”"
 tog_quest.0501.a.tt: "The worship of the ancients is reborn: you, your court and your companions take the oath, and the #V Book of the Druids#! joins your treasury. If your line follows the Gaelic rite, it takes the legendary name #V Lugaid#!. If you are an adventurer, the faithful raise a #V tent of offerings#! in your camp."
 tog_verses_book_name: "The Book of the Druids"
 tog_verses_book_description: "The book that gathers everything the worship of the ancients once was: the stone, the monks' books, the gods of the sacred places, the keeper's prayers, the first rite. Written so that no one can ever erase it again."
 tog_verses_book_modifier: "Book of the Druids"
 tog_house_lugaid: "Lugaid"
 tog_test_skip_step6_decision: "TEST: Start at step 7"
 tog_test_skip_step6_decision_desc: "Test decision, to remove before release: sets up the companions and artefacts of the earlier steps and opens step 7 (the Book of the Druids) directly."
 tog_quest.0603.t: "Taking Up the Torch"
 tog_quest.0603.desc: "[tog_dead_companion.GetFirstName] has left you. Their place by the fire stays empty all evening.\n\nThe next day, [tog_heir_companion.GetFirstName] comes to find you, eyes red. “[tog_dead_companion.GetSheHe|U] used to tell me about what you were looking for. I want to carry on in their place.”"
 tog_quest.0603.a: "“Your place is with us.”"
 tog_quest.0603.a.tt: "#V [tog_heir_companion.GetFirstName]#! takes [tog_dead_companion.GetFirstName]'s place by the fire."
 tog_quest.0601.t: "What He Leaves Behind"
 tog_quest.0601.desc: "His belongings have been brought to you: the wax tablet of the stone, his notes, tablets covered in cramped writing. You are still too young to understand everything he was looking for. But his companions have stayed, and they look at you the way one looks at someone one is waiting for."
 tog_quest.0601.a: "“One day, I will understand.”"
 tog_quest.0601.a.tt: "The quest will resume when you are 16."
 tog_quest.0602.t: "The Inheritance"
 tog_quest.0602.desc: "You have taken up his notes, his tablet of the stone, everything he had gathered. His companions came to find you one by one. They asked for nothing: they only wanted to know whether you would carry on.\n\nYou opened his notes at the page where he had stopped."
 tog_quest.0602.a: "“I will carry on.”"
 tog_quest.0602.a.tt: "You take up the road where he left off."
 tog_quest.0514.b.bad: "[tog_peredur.GetFirstName] sulks in a corner and counts the ceiling beams out loud. Impossible to concentrate."
 tog_quest.0519.b.good: "As you reread, the missing passage comes to you on its own."
 tog_quest.0516.b.good: "[tog_gofraid.GetFirstName] grumbles, but lets the bundle go for next to nothing. Everyone heard the scene."
 tog_quest.0513.b.bad: "[tog_nest.GetFirstName] no longer speaks to you. That chapter will not be written."
 tog_quest.0516.c: "“I'll take it all and pay a copyist from Tours with it.”"
 tog_quest.0519.c: "Pay copyists to go faster."
 tog_quest.0520.t: "A Page That Does Not Hold"
 tog_quest.0520.desc: "You reread yesterday's page, and it does not hold. Each word is right on its own, but together they say nothing. That is not how one spoke to the gods."
 tog_quest.0520.a: "Tear it up and start again."
 tog_quest.0520.b: "Leave it and come back to it later."
 tog_quest.0521.t: "A Curious Visitor"
 tog_quest.0521.desc: "A passing merchant, welcomed at your table, has seen the sheets on your desk. He asks politely what you are writing that is so important. He looks like a man who tells everything he sees to the first priest he meets."
 tog_quest.0521.a: "Show him a harmless page."
 tog_quest.0521.a.good: "He is bored after three lines and talks about something else."
 tog_quest.0521.a.bad: "He read the name of a god over your shoulder. Rumours about you are going round the village."
 tog_quest.0521.b: "Offer him something to forget what he saw."
 tog_quest.0522.t: "Out of Ink"
 tog_quest.0522.desc: "The last pot of ink is empty. Good ink can be found in town, at a good price. Otherwise, [tog_gwion.GetFirstName] says that in the old days it was made with oak galls and iron. He might be able to remember how."
 tog_quest.0522.a: "Buy good ink in town."
 tog_quest.0522.b: "Make it ourselves, with oak galls."
 tog_quest.0522.b.good: "The ink is black and holds well. It even smells of the forest."
 tog_quest.0522.b.bad: "The ink fades as it dries: whole pages must be gone over again."
 tog_quest.0513.a.great: "[tog_nest.GetFirstName] brings in women from the area. They talk all night, and you write everything down."
 tog_quest.0512.a.great: "Lailoken's lines echo a passage in the books. It was not a market song."
 tog_quest.0512.b.bad: "Lailoken sulks by the fire. The evening is lost."
 tog_quest.0511.b.great: "[tog_eogan.GetFirstName] tells, you write, and the pages fill up. The tale is already being retold in the village."
 tog_quest.0511.a.great: "Written as [tog_gwion.GetFirstName] speaks them, the words sound like a prayer."
 tog_quest.0515.a.great: "[tog_gwion.GetFirstName]'s prayer flows by itself. Reading it aloud, you feel you have always known it."
 tog_find_bard_decision_desc: "A faith spreads through poets more than through priests. Bards go from court to court, and kings listen to them. One is needed to sing the Book."
 tog_find_bard_decision: "Look for a Bard"
 tog_test_skip_step7_decision_desc: "Test decision, to remove before release: sets up the companions and artefacts, founds the faith and opens step 8 (the faithful) directly."
 tog_find_bard_decision_effect_tt: "Three bards will come forward; you will choose the one who joins your court."
 tog_find_bard_decision_confirm: "Search"
 tog_send_companions_decision: "Send the Companions to Preach"
 tog_obj_faithful: "Spread the faith: send your companions to win followers among the lords, and find a bard to sing the Book.[Story.Custom('TogMissionLine_tog_eogan')][Story.Custom('TogMissionLine_tog_nest')][Story.Custom('TogMissionLine_tog_gofraid')][Story.Custom('TogMissionLine_tog_ursin')][Story.Custom('TogMissionLine_tog_gwion')][Story.Custom('TogMissionLine_tog_peredur')][Story.Custom('TogMissionLine_tog_lailoken')]"
 tog_quest.0730.t: "The First Gathering"
 tog_send_companions_decision_confirm: "Send them"
 tog_find_bard_decision_tooltip: "You let it be known that you are looking for a bard."
 tog_quest.0730.desc: "They have all come back. Tonight, for the first time, the great hall is full: your companions, dusty from their roads, the people of your household, and a few faces you do not know, who came because they had heard of you.\n\n[tog_bard.GetFirstName] takes up his harp. He does not sing a song: he sings the Book, from the very first word. The crescent and the mistletoe, the two fires, the Dagda in his house on the Boyne, Lug coming and going between the worlds. No one speaks. Even the servants have stopped at the back of the hall.\n\n"
 tog_quest.0721.tt: "The bard settles at your court. As long as he stays, his talent serves you."
 tog_send_companions_decision_tooltip: "You send your companions to the lords of their own lands."
 tog_send_companions_decision_desc: "The Book is written. Now it must be heard. Your companions each come from a different land: let them go back there and win to the faith the lords who are willing to listen."
 tog_quest.0721.a: "The fili from Ireland, [tog_bard_1.GetFirstName]: the lore of the ancients."
 tog_quest.0712.lost: "#N [tog_mission_target.GetTitledFirstName] has not been converted.#!\n\nA messenger arrives with the news: [tog_mission_target.GetTitledFirstName] listened politely, then sent [tog_missionary.GetFirstName] away with a meal and nothing more. The road home will be long."
 tog_quest.0712.won: "#P [tog_mission_target.GetTitledFirstName] has joined the worship of the ancients.#!\n\nA messenger arrives with the news: [tog_mission_target.GetTitledFirstName] listened for a long time, then asked to have the Book read a second time. They swore by Lug and by the Dagda.\n\nThe worship of the ancients has one more lord."
 tog_quest.0721.b: "The Welsh bard, [tog_bard_2.GetFirstName]: glory in the courts of kings."
 tog_quest.0721.desc: "Three have come forward. A fili from Ireland, who recites the genealogy of twenty kings without a pause. A clear-voiced Welsh bard, who has sung at the court of Gwynedd. And an older singer from Armorica, who speaks little but knows songs no one else remembers.\n\nOnly one will stay."
 tog_quest.0721.c: "The singer from Armorica, [tog_bard_3.GetFirstName]: the old songs that soothe."
 tog_quest.0712.t: "News from [tog_missionary.GetFirstName]"
 tog_quest.0730.a: "“This is only the beginning.”"
 tog_send_companions_decision_effect_tt: "Each companion leaves for their homeland and tries to win a count to the worship of the ancients. The more they like you, the better their chances. They will return in a few months."
 tog_quest.0730.a.tt: "The word of the Book spreads. The worship of the ancients grows."
 tog_test_skip_step7_decision: "TEST: Start at step 8"
 tog_quest.0721.t: "The Bards"
 tog_quest.0712.other: "[tog_missionary.GetFirstName] took the Book to [tog_mission_target.GetTitledFirstName].\n\n"
 tog_quest.0712.peredur: "[tog_missionary.GetFirstName] went north. At [tog_mission_target.GetTitledFirstName]'s hall, he recited the Book from memory, without missing a line, counting the stanzas on his fingers. He mixed up left and right when pointing the way to the sacred hill, but no one noticed.\n\n"
 tog_quest.0712.triumph: "#P [tog_mission_target.GetTitledFirstName] has joined the worship of the ancients.#!\n\nA messenger arrives with the news: [tog_mission_target.GetTitledFirstName] swore by Lug and by the Dagda before all their people. Since then, their bards sing your name in their great hall.\n\nThe worship of the ancients has one more lord, and an ally."
 tog_quest.0712.lailoken: "Lailoken insisted on going, despite his age. He arrived at [tog_mission_target.GetTitledFirstName]'s hall leaning on his staff. He spoke as old men speak, at length, of things no one remembers any more.\n\n"
 tog_quest.0712.nest: "[tog_missionary.GetFirstName] went back to Wales. She did not speak of gods at first: she spoke of the old oak of Môn, of her grandmother, of the women who kept the tree without knowing why. [tog_mission_target.GetTitledFirstName] let her speak.\n\n"
 tog_quest.0712.gofraid: "[tog_missionary.GetFirstName] landed in the isles with a bundle of goods and an urge to talk. At [tog_mission_target.GetTitledFirstName]'s hall, he sold his furs, drank more than was wise and spoke of Lug as of an old friend.\n\n"
 tog_quest.0712.chased: "#N [tog_mission_target.GetTitledFirstName] has not been converted.#!\n\nA messenger arrives with the news: [tog_mission_target.GetTitledFirstName] had [tog_missionary.GetFirstName] driven out with sticks, to the shouts of the chaplain. You are spoken of at that court, and not kindly."
 tog_quest.0712.gwion: "[tog_missionary.GetFirstName] went back to the Solway, where his people had always prayed in secret. He asked to see [tog_mission_target.GetTitledFirstName] and recited the prayers in the old tongue, without explaining anything.\n\n"
 tog_quest.0712.eogan: "[tog_missionary.GetFirstName] arrived in Ireland with his shepherd's staff and his stories. He sat at [tog_mission_target.GetTitledFirstName]'s table and told, as only he can, of the house of the Dagda and Óengus's trick.\n\n"
 tog_quest.0712.wounded: "#N [tog_mission_target.GetTitledFirstName] has not been converted.#!\n\nA messenger arrives with the news: the men of [tog_mission_target.GetTitledFirstName]'s priest lay in wait for [tog_missionary.GetFirstName] at a bend in the road. They beat them and left them in a ditch. [tog_missionary.GetFirstName] is coming home, bearing the marks of the blows."
 tog_quest.0712.ursin: "[tog_missionary.GetFirstName] set off again for Burgundy, the carnyx on his shoulder. Before [tog_mission_target.GetTitledFirstName]'s castle, he blew the horn until someone came out to ask what he wanted.\n\n"
 tog_test_random_opinions_decision: "TEST: Random companion opinions"
 tog_test_random_opinions_decision_desc: "Test decision, to remove before release: gives each companion a random opinion of you (+80, +40, −20 or −60), to test the missions."
 trait_tog_blood_of_myrddin: "Blood of Myrddin"
 trait_tog_blood_of_myrddin_desc: "He claims descent from Myrddin, the wild man of the woods who saw the future and was said to be the son of a demon. No one knows whether it is true, but the old man stubbornly refuses to die, and he sees coming what others do not."
 tog_second_sight_modifier: "Lailoken's Second Sight"
 tog_second_sight_modifier_desc: "Lailoken sees what is being plotted before it is plotted: schemes against you are harder to hide."
 tog_bard_welsh_modifier: "Bard of the Ancients"
 tog_bard_fili_modifier_desc: "A fili from Ireland recites the Book and the genealogies: piety and learning."
 tog_bard_welsh_modifier_desc: "A Welsh bard sings the Book from court to court: prestige and the favour of vassals."
 tog_bard_breton_modifier: "Singer of the Ancients"
 tog_bard_breton_modifier_desc: "A singer from Armorica knows songs no one remembers any more: they soothe the heart."
 tog_bard_fili_modifier: "Fili of the Ancients"
 tog_mission_res_wounded: "was wounded"
 tog_mission_res_pending: "on the road"
 tog_empty: ""
 tog_mission_res_lost: "convinced no one"
 tog_mission_res_chased: "was driven out"
 tog_mission_res_triumph: "converted a count, who sings your praises"
 tog_mission_res_won: "converted a count"
 tog_mission_line_tog_eogan: "\n• [Story.MakeScope.Var('tog_eogan').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_eogan')]"
 tog_mission_line_tog_nest: "\n• [Story.MakeScope.Var('tog_nest').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_nest')]"
 tog_mission_line_tog_gofraid: "\n• [Story.MakeScope.Var('tog_gofraid').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_gofraid')]"
 tog_mission_line_tog_ursin: "\n• [Story.MakeScope.Var('tog_ursin').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_ursin')]"
 tog_mission_line_tog_gwion: "\n• [Story.MakeScope.Var('tog_gwion').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_gwion')]"
 tog_mission_line_tog_peredur: "\n• [Story.MakeScope.Var('tog_peredur').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_peredur')]"
 tog_mission_line_tog_lailoken: "\n• [Story.MakeScope.Var('tog_lailoken').Char.GetFirstName]: [Story.Custom('TogMissionRes_tog_lailoken')]"
 tog_quest.0721.county_tt: "In two months, his songs will have won the county where your court resides to the worship of the ancients."
 tog_quest.0722.t: "The Bard's Songs"
 tog_quest.0722.desc: "For two months, [tog_bard.GetFirstName] has been singing the Book in the markets, at evening gatherings, at weddings, wherever people are willing to listen. Children know the songs by heart before their prayers. The old nod their heads: these were their grandparents' stories.\n\nOne morning, the priest says mass in an almost empty church. All of [tog_bard_county.GetName] is singing the Book."
 tog_quest.0722.a: "“Sing again.”"
 tog_quest.0712.yes: "One more lord for the old gods."
 tog_quest.0712.no: "Another time, then."
 tog_quest.0730.nolords: "When he falls silent, no one applauds. They stay seated for a long time, as one stays after a prayer. This time, your companions have won no lord. But in the villages they passed through, people are already humming passages of the Book without knowing where they come from.\n\nThe lords will come later. The songs are already on their way."
 tog_quest.0730.lords: "When he falls silent, there is a knock at the door. A messenger arrives, then another. Lords you have never met, won over by your companions, send you their greetings. They ask when they may come and hear the Book in their turn.\n\nYears ago, you had only a stone no one could read. Tonight, the worship of the ancients has its lords, its bard and its songs."
 tog_obj_step10: "The word of the Book is spreading through the villages. The worship of the ancients grows."
 tog_test_skip_step8_decision_desc: "Test decision, to remove before release: sets up the companions, founds the faith if needed and opens step 10; the plague breaks out the following month."
 tog_test_skip_step8_decision: "TEST: Start at step 10"
 tog_obj_plague: "A cattle plague is ravaging a neighbouring duchy. Go and light the fires of Beltaine there."
 tog_obj_fires: "Light the fires of Beltaine in the heart of the stricken duchy."
 tog_story_old_groves_plague: "Duchy struck by the plague"
 tog_cattle_plague_modifier: "Cattle Plague"
 tog_cattle_plague_modifier_desc: "The beasts are dying in the byres and the fields. Relics and blessings do nothing."
 nick_tog_voice_of_lug: "the Voice of Lug"
 nick_tog_voice_of_lug_desc: "Lit the fires of Beltaine, and Lug spoke through their mouth."
 fervor_gain_tog_miracle: "Miracle of the Beltaine Fires"
 tog_beltaine_fires_decision: "Light the Fires of Beltaine"
 tog_beltaine_fires_decision_desc: "The scraped book from Dunkeld said it: at Beltaine, the beasts were driven between two fires, against disease. The monks could do nothing against the plague. The old gods, perhaps."
 tog_beltaine_fires_decision_tooltip: "You set out for the duchy struck by the plague."
 tog_beltaine_fires_decision_confirm: "On our way"
 tog_beltaine_fires_decision_effect_tt: "You set out for the stricken duchy."
 tog_quest.0900.t: "The Cattle Plague"
 tog_quest.0900.desc: "A passing merchant tells what he saw in the duchy of [tog_plague_duchy.GetNameNoTier]. Cows lying in the fields no longer get up. Byres are burned with the animals inside. Families are eating their seed grain. The bishops have brought out the relics, the monks have blessed the herds. Nothing works.\n\nYou remember a page of the scraped book from Dunkeld: at Beltaine, two fires were lit and the beasts were driven between the flames, “against disease”."
 tog_quest.0900.a: "“We must go there.”"
 tog_quest.0900.a.tt: "You can now take the decision #V Light the Fires of Beltaine#!."
 tog_quest.0901.t: "The Crowd"
 tog_quest.0901.desc: "The news has gone ahead of you. When you arrive, they are already there. There are hundreds of them, come from all over [tog_plague_duchy.GetNameNoTier] with whatever beasts they have left: thin cows, coughing sheep, a goat a child holds on a rope. They do not know who you are. They only know that the monks' prayers changed nothing, and that people say you know other prayers.\n\nYour companions have prepared the wood: two pyres of oak, one on each side of the path. The sun is setting. No one speaks."
 tog_quest.0901.a: "“Light the fires.”"
 tog_quest.0902.t: "The Voice of Lug"
 tog_quest.0902.desc: "All night long, the beasts pass between the flames, one after another, and you speak the words of the Book. Towards dawn, the wind drops all at once. The two fires lean towards each other and meet above the path, in an arch. Three ravens circle three times overhead, then fly off to the west.\n\nIn the morning, the beasts get up. They eat.\n\nYou climb onto the stone at the side of the path. The crowd falls silent. And the words that come out of your mouth are not yours: “I did not die at Uisneach. I was waiting for my fire to be lit again.”\n\nThe old gods have priests, followers and a miracle once more. But the Christians still hold the lands where they were worshipped. The sacred groves of the island of Britain and of Ireland will not be free until those lands are returned to the old gods."
 tog_quest.0902.a: "“Lug has returned.”"
 tog_quest.0902.a.tt: "The plague disappears. The duchy of [tog_plague_duchy.GetNameNoTier] joins the worship of the ancients, and so do some of its lords. From now on you are called #V the Voice of Lug#!, and an army of #V Lug's Faithful#! rises for you; more will come in time.\n\nYour dynasty gains the casus belli #V Return the Land to the Old Gods#!: a duchy of Britain or Ireland held by Christians for a lord, a county for an adventurer."
 tog_expel_saxons_cb: "Return the Land to the Old Gods"
 tog_expel_saxons_cb_desc: "Take back a duchy of Britain or Ireland from the Christians."
 TOG_EXPEL_SAXONS_CB_NAME: "Return [TITLE.GetBaseNameNoTier] to the Old Gods"
 TOG_EXPEL_SAXONS_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]War to Return [TITLE.GetBaseNameNoTier] to the Old Gods"
 TOG_EXPEL_SAXONS_WAR_NAME_BASE: "War to Return the Land to the Old Gods"
 tog_expel_saxons_victory_desc: "The attacker gains the counties of the duchy held by the defender and their vassals."
 tog_expel_saxons_white_peace_desc: "No territory changes hands."
 tog_expel_saxons_defeat_desc: "The attacker pays reparations and loses prestige."
 tog_expel_saxons_adventurer_cb: "Return the Land to the Old Gods"
 tog_expel_saxons_adventurer_cb_desc: "Take back a county of Britain or Ireland from the Christians, and settle there."
 tog_expel_saxons_adventurer_victory_desc: "The attacker takes the county and becomes its lord."
 trait_tog_voice_of_lug: "The Voice of Lug"
 trait_tog_voice_of_lug_desc: "Refounded the worship of the old gods. At the miracle of the Beltaine fires, Lug spoke through this character's mouth. From time to time, followers take up arms to join them."
 tog_lug_host_name: "Lug's Faithful"
 tog_quest.0910.t: "Lug's Faithful"
 tog_quest.0910.desc: "They arrive one morning, two or three hundred of them, with scythes, axes and spears cut from ash. They are peasants' sons, landless younger sons, a few old soldiers. They have heard of the fires of Beltaine and of the word of Lug. They kneel before you and swear on the Book to follow you wherever you go."
 tog_quest.0910.a: "“Rise. Lug needs strong arms.”"
 tog_test_saxons_cb_decision: "TEST: Get “Return the Land to the Old Gods”"
 tog_test_saxons_cb_decision_desc: "Test decision, to remove before release: unlocks the casus belli “Return the Land to the Old Gods” for your dynasty (and converts you to the faith of the ancients if needed)."
 tog_spear_of_lug_decision: "Forge the Spear of Lug"
 tog_spear_of_lug_decision_desc: "The Tuatha Dé had four treasures: the stone of Fál, the sword of Nuada, the cauldron of the Dagda and the spear of Lug, which never missed its mark. War is about to begin. Those who will fight for the old gods need a sign."
 tog_spear_of_lug_decision_tooltip: "You have the spear of Lug forged."
 tog_spear_of_lug_decision_confirm: "Light the forge"
 tog_spear_of_lug_decision_effect_tt: "The #V spear of Lug#! joins your treasury. There is only one."
 tog_quest.0920.t: "The Spear of Lug"
 tog_quest.0920.desc: "The smith worked for nine days and nine nights. With every hammer blow, he called on Goibniu, the smith of the gods. When he hands you the spear, the point is still warm. The crescent, the two circles and the triskele have been engraved on it.\n\nYou raise it before your faithful. No one says a word. They all know what it means: war is about to begin."
 tog_quest.0920.a: "“To the sea.”"
 tog_spear_of_lug_name: "Spear of Lug"
 tog_spear_of_lug_description: "Forged by a faithful smith who called on Goibniu, engraved with the crescent, the two circles and the triskele. Like that of the Tuatha Dé, it is said never to miss its mark."
 tog_spear_of_lug_modifier: "Spear of Lug"
 tog_quest.0188.t: "[tog_peredur.GetFirstName]'s Larder"
 tog_quest.0188.desc: "[tog_peredur.GetFirstName] comes back to camp at nightfall, bent under two sacks. He sets them down in front of you and starts unpacking, counting out loud: “Forty-three eggs. Two cheeses, a big one and a small one. A ham. Eleven apples, one of them bruised. A sack of barley.”\n\nYou ask him where all this came from. He thinks. “Three pennies, a song, and I helped an old woman find her goat.” A pause. “Might not have been her goat.”"
 tog_quest.0188.a: "“I don't want to know.”"
 tog_quest.0189.t: "The Hunt"
 tog_quest.0189.desc: "Supplies are running low. [tog_hunter.GetFirstName] disappears before dawn, without a word, with a bow and a spear. In the evening, [tog_hunter.GetFirstName] comes back with a roe deer over the shoulders and two salmon at the belt. Tonight, the camp eats its fill."
 tog_quest.0189.a: "“Let it be roasted.”"
 tog_test_provisions_decision: "TEST: 500 provisions"
 tog_test_provisions_decision_desc: "Test decision, to remove before release: adds 500 provisions to the camp."
 tog_m.talk_closed: "The monks here no longer listen to you"
 tog_m.pay_closed: "No monk here will take your money any more"
 tog_m.steal_tt: "The scheme #V Steal the Book#! begins. You will attempt the theft whenever you wish, with the “Execute” button."
 tog_m.steal_scheming: "A theft is already being prepared"
 tog_steal_book: "Steal the Book"
 tog_steal_book_action: "Steal"
 tog_steal_book_desc: "I will take the book from the library that [SCHEME.GetTargetCharacter.GetShortUIName] keeps."
 tog_steal_book_desc_general: "Steal a book from a monastery library."
 TOG_STEAL_BOOK_SUCCESS_DESC: "The book will be yours, and no one will know who took it."
 tog_steal.success_tt: "If the scheme succeeds, the book is yours. If not, the monks grow a little warier, but you can try again."
 tog_quest.0260.t: "A Night in the Cloister"
 tog_quest.0260.desc: "You know the way now: the garden wall, the kitchen door, the staircase that creaks on the seventh step. The brother librarian sleeps beside his books. The monks will soon rise for matins.\n\nPerhaps tonight is the night."
 tog_quest.0260.d: "Wait for a better night."
 tog_quest.0261.t: "The Brother Librarian"
 tog_quest.0261.desc: "The brother librarian likes to talk, and he likes wine. At the market, over a jug, he tells you everything. He tells you which books he keeps and which he lends to no one. He also tells you that the chest at the back has not shut properly since last winter."
 tog_quest.0261.a: "“Another jug, brother?”"
 tog_quest.0261.b: "Just listen."
 tog_quest.0262.t: "[tog_peredur.GetFirstName] Has Counted"
 tog_quest.0262.desc: "[tog_peredur.GetFirstName] comes back from the monastery, where he went to sell eggs. He spreads a parchment covered in strokes before you. “Fourteen monks. Nine steps up to the library. Three windows, one with no shutter. The porter sleeps from the second to the fourth prayer. And there are forty-two books.”"
 tog_quest.0262.a: "“You're a treasure, [tog_peredur.GetFirstName].”"
 tog_quest.0263.t: "A Night Patrol"
 tog_quest.0263.desc: "You had your hand on the chest when a lantern rose at the end of the corridor. You slipped out through a window, empty-handed. No one recognised you, but the monks have doubled the watch."
 tog_quest.0263.a: "“Next time.”"
 tog_quest.0263.a.tt: "The scheme goes on, with slightly lower odds. You can try again with the “Execute” button."
 tog_reach_heric: "Meet Héric"
 tog_reach_heric_action: "Enter"
 tog_reach_heric_desc: "I will convince the porter of Saint-Germain to let me speak to [SCHEME.GetTargetCharacter.GetShortUIName]."
 tog_reach_heric_desc_general: "Convince the porter of an abbey to let you speak to a monk."
 TOG_REACH_HERIC_SUCCESS_DESC: "Héric will come out to speak to you."
 tog_heric.success_tt: "If the scheme succeeds, Héric agrees to receive you. If not, the porter grows a little warier, but you can try again."
 tog_quest.0320.t: "The Gate of Saint-Germain"
 tog_quest.0320.desc: "Saint-Germain of Auxerre is closed to strangers. The porter listens to you through the hatch and always repeats the same thing: the brothers receive no one. Yet the monk you are looking for is behind these walls. His name is Héric, and they say he knows Caesar better than anyone.\n\nYou will have to win over the porter, or someone he listens to."
 tog_quest.0320.a: "“I will be back.”"
 tog_quest.0320.a.tt: "The scheme #V Meet Héric#! begins. You will try your luck whenever you wish, with the “Execute” button."
 tog_quest.0325.t: "At the Hatch"
 tog_quest.0325.desc: "The porter knows you now. He has accepted your gifts and listened to your stories of the island of Britain. Tonight he hesitates, his hand on the latch."
 tog_quest.0325.a: "Talk to him some more."
 tog_quest.0325.d: "Come back another day."
 tog_quest.0326.t: "The Hatch Slams Shut"
 tog_quest.0326.desc: "The porter was about to open. Then a footstep rang out in the cloister, and the hatch slammed shut. The next day, another brother keeps the gate, and he does not smile."
 tog_quest.0326.a: "“There will be other evenings.”"
 trait_tog_cloistered: "Cloistered"
 trait_tog_cloistered_desc: "Never leaves their monastery."
 tog_obj_after: "The old gods have priests, followers and a miracle once more. What remains is to take back from the Christians the lands where they were worshipped, on the island of Britain and in Ireland, with the casus belli #V Return the Land to the Old Gods#!. Your dynasty can also have the #V spear of Lug#! forged."
 tog_quest.0511.c.tt: "Both versions side by side: it takes longer to write, but no one is offended."
 tog_quest.0521.b.tt: "He leaves with his coin and will say nothing."
 tog_verses.d_p20: "Book of the Druids: #P +20#!"
 tog_verses.d_p15: "Book of the Druids: #P +15#!"
