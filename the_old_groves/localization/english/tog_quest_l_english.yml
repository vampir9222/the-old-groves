l_english:
 tog_story_old_groves: "The Old Groves"
 tog_story_old_groves_desc: "A stone carved with signs no one can read. Books copied by monks who hated what they wrote. Somewhere beneath the tales sleeps the worship of the old ones."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Companions"
 tog_story_old_groves_destination: "Destination"
 tog_obj_stone: "Objective: go to the stone, on #V [GetTitleByKey('b_skye').GetNameNoTier]#!, and copy its signs."
 tog_obj_wrong: "Objective: follow Peredur to the old man, in #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Objective: find the real old man, in #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Objective: free the old man, held by bandits in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_obj_books: "Old Lailoken has joined you. The monks wrote everything down: their books must be found.\n(The next part will come in a future version.)"
 tog_dest_stone: "the Isle of [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "[GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "[GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Study the Stone"
 tog_quest_start_decision_desc: "There is talk of a strange stone on the isle of [GetTitleByKey('b_skye').GetNameNoTier], carved with signs no one can read."
 tog_quest_start_decision_tooltip: "Starts the quest of the Old Groves."
 tog_quest_start_decision_confirm: "Leave for [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "Starts the quest of the #V Old Groves#!. Follow its progress in the #V Situations#! window."
 tog_quest_travel_decision: "Travel to [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
