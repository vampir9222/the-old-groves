l_english:
 tog_story_old_groves: "The Old Groves"
 tog_story_old_groves_desc: "A stone carved with signs no one can read. Books copied by monks who hated what they wrote. Somewhere beneath the tales sleeps the worship of the old ones."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Companions"
 tog_story_old_groves_destination: "Destination"
 tog_obj_stone: "Objective: go to the stone, on #V [GetTitleByKey('b_skye').GetNameNoTier]#!, and copy its signs."
 tog_obj_wrong: "Objective: follow Peredur to the old man, in #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Objective: find the real old man, in #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Objective: free the old man, held by bandits in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "the Isle of [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "[GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "[GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Study the Stone"
 tog_quest_start_decision_desc: "There is talk of a strange stone on the isle of [GetTitleByKey('b_skye').GetNameNoTier], carved with signs no one can read."
 tog_quest_start_decision_tooltip: "Starts the quest of the Old Groves."
 tog_quest_start_decision_confirm: "Leave for [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "Starts the quest of the #V Old Groves#!. Follow its progress in the #V Situations#! window."
 tog_quest_travel_decision: "Travel to [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Opens the journey to the quest's current destination."
 tog_quest_travel_decision_not_there: "You are already there."
 tog_quest_travel_decision_effect_tt: "You set out for the quest destination. An adventurer moves their camp there."
 tog_poi_stone: "The Carved Stone"
 tog_poi_stone_desc: "A toppled Pictish stone in the heather, covered in signs no one can read."
 tog_quest.0001.t: "The Apostate"
 tog_quest.0001.desc: "Once, they called you Brother Máel Brigte. You learned to read among the monks of Iona, sang the psalms, believed what you were told to believe. Then the Norsemen came. The relics stopped no ship, the prayers saved no brother, and the abbots fled to safety with the books. You stayed.\n\nNow the Gaels of the isles call you Dubgall, the Dark Foreigner. You raise the horn at the Norse feasts without believing, and one question never leaves you: if the monks' god could not protect his own, what is left to believe?\n\nThis morning, climbing onto the moor to watch for sails, you found something else: a toppled stone in the heather, carved with signs you have never seen. A crescent, a broken arrow, two linked circles. Not letters. Images, set down with too much care to be mere decoration."
 tog_quest.0001.a: "I must understand what these signs say."
 tog_quest.0001.a.tt: "Starts the quest of the #V Old Groves#!. Follow its progress in the #V Situations#! window."
 tog_quest.0001.b: "It is only an old stone."
 tog_quest.0001.b.tt: "You can come back to the stone later, through a decision."
 tog_quest.0002.t: "A Stone in the Isles"
 tog_quest.0002.desc: "A passing trader told you of a strange stone on the isle of [GetTitleByKey('b_skye').GetNameNoTier], in the north: lying in the heather above a bay, carved with signs that no one, Gael or Norseman, can read. Images, he said, not letters. A crescent, a broken arrow, two linked circles.\n\nSince then, you cannot get those signs out of your head."
 tog_quest.0002.a: "I must see this stone."
 tog_quest.0002.a.tt: "The quest of the #V Old Groves#! begins. You set out for #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "The Stone"
 tog_quest.0003.desc: "The stone lies in the heather above the bay, half eaten by moss: a crescent crossed by a broken arrow, two circles joined by a bar, a zigzag line. Someone raised it long ago, and someone else knocked it down: the marks of the levers still show.\n\nYou scrape away the lichen with a knife and copy every sign, stroke by stroke, onto a wax tablet."
 tog_quest.0003.a: "Copy the stone."
 tog_quest.0020.t: "The Shepherd"
 tog_quest.0020.desc: "You have barely finished your copy when the heather rustles behind you. A young man stumbles out, out of breath, a rope in his hand.\n\n“You haven't seen a goat?”\n\nHis name is Peredur. He minds the hamlet's animals, when he can find them, and he listens with great attention while retaining nothing. He catches sight of the stone, forgets the goat, and walks around the signs to see them upside down, then right way up, then upside down again, to be safe.\n\n“That's old-folk stuff, that is. You want the old man. The one across the water. Left as you leave the bay. But careful: depends which way you're facing, it changes everything! My father says the old man is all esoterism.”\n\nYou smile: “Esoterism is knowledge kept for a few initiates, hidden from those who are not ready to receive it.”\n\nPeredur nods slowly, looking deeply thoughtful.\n\n“Yeah, that's not wrong. Shall I take you to the old man? It's left. Well, I think.”"
 tog_quest.0020.a: "Show me, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! joins you and leads you to the old man, in #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_quest.0021.t: "The Wrong Old Man"
 tog_quest.0021.desc: "Peredur's old man does exist. He lives in a hut by the water in [GetTitleByKey('b_gairloch').GetNameNoTier]. He is eighty, has three teeth, and has never seen a carved stone in his life. He talks to you at length about herring, seals, and the woman he nearly married long ago.\n\nPeredur scratches his head.\n\n“Ah. Maybe it was right.”\n\nThe old fisherman, for his part, has understood who you mean: “The one who talks to stones? He lives south, across the water, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Everybody knows that.”"
 tog_quest.0021.a: "This time, I choose the way."
 tog_quest.0021.a.tt: "You set out for #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, to the real old man."
 tog_quest.0022.t: "The Empty House"
 tog_quest.0022.desc: "At last you find the old man's house, deep in a valley the Norsemen leave alone because there is nothing to take. The door has been smashed in. Inside, everything has been turned over: the chest broken open, the straw mattress torn, a staff snapped in two on the threshold.\n\nA neighbour finally comes out. Bandits came three days ago, men from the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. They were looking for the gold the old man was hiding, or so they thought: they say his family descends from Myrddin, the mad bard, and a man like that must have a treasure. They found nothing. So they took the old man.\n\n“His name is Lailoken,” she adds. “He is sixty-eight.”"
 tog_quest.0022.a: "We will go and find him."
 tog_quest.0022.a.tt: "You set out for the bandits' camp, in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "The Bandits' Camp"
 tog_quest.0023.desc: "The camp is hidden in a fold of the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]: a dozen huts, a fire, stolen horses, and some twenty men who do not look friendly. In the middle, tied to a post, a thin old man watches you come without a word.\n\nTheir chief steps forward. He wants gold. He always wants gold."
 tog_quest.0023.a: "Attack the camp."
 tog_quest.0023.b: "Talk them into freeing him."
 tog_quest.0023.b.good: "You convince them the old man is worth nothing, and that no one mistreats a descendant of Myrddin unpunished. They let him go."
 tog_quest.0023.c: "Pay the ransom."
 tog_quest.0023.c.tt: "The bandits take the gold and free the old man."
 tog_quest.0050.t: "A Text of the Gods"
 tog_quest.0050.a: "Come, Lailoken."
 tog_quest.0010.t: "The Wax Tablet"
 tog_quest.0010.desc: "One evening at camp, you set the tablet too close to the fire. When you find it again, the wax has run: the broken arrow is now only a soft smear, and you no longer know whether it leaned left or right. Peredur, for his part, is sure it leaned left."
 tog_quest.0010.a: "Redraw the strokes from memory."
 tog_quest.0010.a.good: "Your memory holds: the copy is saved."
 tog_quest.0010.a.bad: "You doubt every stroke, and spend the night blaming yourself."
 tog_quest.0010.b: "Let Peredur carry the tablet from now on."
 tog_quest.0010.b.tt: "Peredur will guard it carefully. Upside down, no doubt."
 tog_quest.0011.t: "The Trader"
 tog_quest.0011.desc: "On the road, you meet a trader bound for Orkney. Seeing your copy, he frowns: he has seen signs like these further east, on other standing stones, in the old land of the Picts. No one there knows what they mean either."
 tog_quest.0011.a: "Question him at length."
 tog_quest.0011.a.good: "He describes the other stones in detail: you understand yours better."
 tog_quest.0011.a.bad: "He mostly tells tall tales, and you waste the day untangling them."
 tog_quest.0011.b: "Buy his drawing."
 tog_quest.0012.t: "The Dream"
 tog_quest.0012.desc: "One night at camp, the carved crescent comes back to you in your sleep. It rises in the sky like a moon, and the two circles burn beneath it like two fires.\n\nYou wake certain you have understood something, without knowing what."
 tog_quest.0012.a: "Write the dream down before it fades."
 tog_quest.0012.a.good: "The dream opens a path, and you feel closer to the old gods."
 tog_quest.0012.a.bad: "The dream leads you astray, and you wake more troubled than before."
 tog_quest.0012.b: "It is only a dream."
 tog_quest.0023.a.good: "Your men sweep through the camp: the bandits flee into the hills, leaving their loot behind."
 tog_quest.0023.a.bad: "The assault goes wrong: you escape by a hair, but wounded."
 tog_quest.0023.b.bad: "They laugh at your speeches and drive you out of the camp."
 tog_quest.0024.t: "By a Hair"
 tog_quest.0024.desc: "The assault turned into a disaster. The bandits knew every rock in these hills, and you were out in the open. You got away by a hair, a wound in your side, half carried by Peredur, who swore he knew a way round to the left, and who, for once, was right.\n\nThe old man is still up there, tied to his post. You will have to go back, once you can stand."
 tog_quest.0024.a: "Dress my wounds, and go back."
 tog_quest.0024.a.tt: "You will return to the camp in a few days."
 tog_quest.0025.t: "Turned Away"
 tog_quest.0050.desc: "The old man rubs his wrists and looks at you for a long time, without a word of thanks.\n\n“Why? No one comes looking for a mad old man deep in the hills. What do you want with me?”\n\nBy way of answer, Peredur hands him your wax tablet. The old man turns it the right way up and runs a finger along the carved crescent, then over the two circles.\n\n“It is a text.”\n\n“A text? These are pictures.”\n\n“To you. To those who carved them, it was a text. A text of the gods. Those who could read them, the monks drove away, and their children learned to keep quiet. Me, I only know you must not plough around it.”\n\nHe gives you back the tablet.\n\n“But the monks wrote everything down. Even what they hated. Above all what they hated. If you want to know who these gods were, look in their books: at Jarrow, at Whithorn, at Mynyw, at Dunkeld, at Applecross.”\n\nHe falls silent for a moment, then adds, more quietly:\n\n“You saved my life. Where I come from, a debt like that is not repaid with words: I will follow you. And I have spent my life making sure no one ploughed around the stones. Before I die, I would like to see what you will do with that one.”"
 tog_dest_camp: "the Bandits' Camp"
 tog_quest.0025.desc: "The bandits heard you out, then burst out laughing amid the jeers of their companions. The old man, still tied to his post, said nothing.\n\nWords will no longer work with these men. Force or gold remain."
 tog_quest.0025.c: "Leave."
 tog_quest.0025.c.tt: "You leave the camp. Come back once you have enough gold or strength, with the decision “Travel to the Bandits' Camp”."
 tog_travel_desc_stone: "A stone carved with signs no one can read awaits you on the isle of [GetTitleByKey('b_skye').GetNameNoTier]. You must see it with your own eyes, and copy it."
 tog_travel_desc_wrong: "Peredur swears he knows the way to the old man: left as you leave the bay, towards [GetTitleByKey('b_gairloch').GetNameNoTier]. He is almost sure."
 tog_travel_desc_house: "According to the old fisherman, the one who talks to stones lives south, across the water, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. This time, you choose the road."
 tog_travel_desc_camp: "Bandits have taken old Lailoken into the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. If no one goes after him, no one will see him again."
 tog_travel_desc_camp_return: "Old Lailoken is still held by the bandits in the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. Enough gold for the ransom, or enough men for the assault: it is time to go back."
 tog_quest_travel_decision_confirm: "Set out"
 tog_quest.0050.a.tt: "#V Lailoken#! joins you. The books of the copyist monks await you in five monasteries (decision “Travel to a monastery”)."
 tog_story_old_groves_monasteries: "Monasteries to visit"
 tog_obj_books: "Objective: recover the books of the copyist monks, then read them. The remaining monasteries are in the list below; visit them in any order (decision “Travel to a monastery”).\n\nReading is automatic: the books are read one at a time, in the order you recovered them, and each takes a few months."
 tog_obj_step3: "The books have spoken: now you must go where the old gods were worshipped.\n(The next part will come in a future version.)"
 tog_dest_monastery: "a monastery"
 tog_travel_desc_monastery: "The books of the copyist monks await you at Jarrow, Whithorn, Mynyw, Dunkeld and Applecross. Choose where to go."
 tog_m.talk: "Convince the monk."
 tog_m.talk_tt: "Your chances depend on your diplomacy. If you fail, the monk will not listen to you again."
 tog_m.pay: "Pay the monk to smuggle the book out."
 tog_m.steal: "Steal the book, by night."
 tog_m.force: "Force the doors with my men."
 tog_m.leave: "Leave."
 tog_m.leave_tt: "You can come back later, with the decision “Travel to a monastery”."
 tog_m.pay_good: "The monk brings the book out under his robe."
 tog_m.pay_refused: "The monk refuses, frightened: he will not take your money any more."
 tog_m.pay_kept: "The monk takes the money and vanishes."
 tog_m.steal_good: "You slip out before dawn, the book under your shirt."
 tog_m.steal_bad: "Caught in the act! You barely get away; the monastery will be wary from now on."
 tog_m.force_good: "The doors give way: you carry off the book and a few precious things. The local lord will not forgive you, and the other monasteries will be on their guard."
 tog_m.force_bad: "The monks and their servants hold firm: you are driven back. The other monasteries will be on their guard."
 tog_m.talk_good: "The monk entrusts you with the book."
 tog_m.talk_bad: "The monk shuts himself off: he will not speak to you again."
 tog_m.book_tt: "You obtain the book. You will read it in the coming months."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "The house where the Venerable Bede wrote all his life stands by the Tyne, behind a low wall. The Norsemen have already been here: one wing is still blackened by fire. By the road, a young monk is sorting apples and watches you approach with curiosity.\n\n“Looking for something, stranger? The library is behind the cloister. They say it holds everything Bede ever read, and Bede read everything.”"
 tog_quest.0121.t: "Bede's Picts"
 tog_quest.0121.desc: "You read Bede. He tells how the Picts came from Scythia in long ships, how they took their kings through the female line, and how Colum Cille went to baptise them. In the saint's life, you also read that at the Pictish king's court he faced magi who commanded the wind and the mists.\n\nAnd in a margin, a brother who had travelled north wrote: “the Picts carved on stones signs that no one reads any more.”\n\nYour stone had priests."
 tog_quest.0121.a: "My stone had priests."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "Saint Ninian's old white house looks down over the harbour. The monks are few and seldom leave the chapel; the library opens onto a garden whose wall is crumbling in places.\n\nIn the harbour tavern, a lay brother drinks more than he should and complains to anyone who will listen that he is not paid enough."
 tog_quest.0122.t: "Pliny's Druids"
 tog_quest.0122.desc: "It is a florilegium from Francia, in which an Irishman at the emperor's court copied pages from the Ancients. A Roman, Pliny, tells that the priests of the Gauls, called druids, held nothing more sacred than the mistletoe and the oak that bears it; that they gathered it on the sixth day of the moon, dressed in white, with a golden sickle. Another says they judged disputes, learned by heart for twenty years a great number of verses, and taught that souls do not die, but pass after death into other bodies.\n\nThe druid, that ridiculous sorcerer of the saints' lives, had once been a clergy."
 tog_quest.0122.a: "The druids were a clergy."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "At the far end of Wales, facing the sea, Saint David's house is surrounded by good walls. The monks of Mynyw have seen foreign sails arrive too often: they watch you come from the wall-walk, and their servants keep hold of their staffs."
 tog_quest.0123.t: "The Heroes of the Britons"
 tog_quest.0123.desc: "The book tells the history of the Britons: Vortigern, who called in the Saxons; the tower that collapsed every night because two dragons, a red one and a white one, fought in its foundations; the fatherless child who guessed it; and a war leader named Arthur, victor of twelve battles.\n\nHeroes, not gods. But the Britons too have kept their ancients, and they are still waiting for them."
 tog_quest.0123.a: "The Britons still wait for their ancients."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "In the heart of the old Pictish land, Dún Chaillenn keeps some of the relics of Colum Cille, brought here to shelter them from the Norsemen. Guards watch over the shrine day and night; no one watches over the library, which is only a low room at the back of the cloister.\n\nA dog sleeps across its door."
 tog_quest.0124.t: "The Forgotten Rites"
 tog_quest.0124.desc: "It is an ugly book, a florilegium in many hands on poor vellum. Several pages have been scraped with a knife so that psalms could be written over them; holding them up to the light, you can still make out the lines someone tried to erase.\n\nA monk copied into it, without comment, sentences his masters had let slip through: Brigit was a goddess worshipped by poets; Ana had been the mother of the gods of Ireland; at Beltaine the druids lit two fires with great incantations and drove the cattle between them against disease; people once swore by them, and not by Christ.\n\nThe kings of old had not been kings. They had been prayed to."
 tog_quest.0124.a: "They had been prayed to."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "Facing the isles, Saint Máel Rubai's house is small and poor. A very old, almost blind monk keeps the library: they say he knows every book in it by heart, and lets no one leave with so much as a leaf."
 tog_quest.0125.t: "The Book of Places"
 tog_quest.0125.desc: "It is a book of places: every hill, every spring, every stone of the old days, with the story that explains its name. The great hollow house of the Dagda on the Boyne; the hill of Uisneach, at the heart of Ireland, where Lug died; the stone of Maponos, on the Solway estuary…\n\nThe books say these gods existed. To know who they really were, you will have to go where they were worshipped."
 tog_quest.0125.a: "I will have to go to these places."
 tog_quest.0130.t: "A Stolen Worship"
 tog_quest.0130.desc: "You read the five books side by side. The names you had known since childhood: Lug, the Dagda, Brigit, Balor, the Tuatha Dé Danann, the tribe of Dana. Kings, ancestors, demons, depending on who told the tale. You discover they are the ruins of a worship. A real one, with its gods, its places, its priests. And it was stolen from you.\n\nThe monks built their churches on the hills where people prayed before them, planted their crosses on the stones, gave their saints the names of goddesses. What they could not destroy, they baptised; what they could not baptise, they left to die. And what they put in its place serves above all to bow heads: obey the lord, pay the tithe, pray in a tongue no one understands.\n\nThe old gods were from here. They were taken from you. You will take them back."
 tog_quest.0130.a: "I will take back what was stolen from us."
 tog_quest.0130.a.tt: "End of the second step of the quest. The next part (the sacred places) will come in a future version."
 tog_quest.0140.t: "Which Monastery?"
 tog_quest.0140.desc: "The books of the copyist monks await you in several monasteries. Which one do you want to visit?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier])"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier])"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier])"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier])"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier])"
 tog_quest.0140.stay: "Not now."
 tog_test_skip_step1_decision: "TEST: skip to step 2"
 tog_test_skip_step1_decision_desc: "Test decision: starts the quest if needed, adds Peredur and Lailoken, and opens step 2 (the monasteries)."
 tog_test_skip_step1_decision_confirm: "Skip to step 2"
 tog_quest.0161.t: "A Closed Door"
 tog_quest.0161.desc: "The monk heard you out. Then he shook his head, without anger, the way one refuses alms to a man who does not need them.\n\n\"I will pray for you.\" He went back to his work and did not look at you again. He will not be the one to give you the book."
 tog_quest.0161.a: "I will have to find another way."
 tog_quest.0162.t: "A Frightened Monk"
 tog_quest.0162.desc: "At the sight of your purse, the monk turned pale. He stepped back, crossed himself, and hurried off towards the chapel, almost running.\n\nYour money will not open this library."
 tog_quest.0162.a: "I will have to find another way."
 tog_quest.0163.t: "A Dishonest Monk"
 tog_quest.0163.desc: "The monk took the money and promised to come back after compline with the book under his habit. You waited all night behind the wall.\n\nIn the morning, you were told he had left on pilgrimage. No one knows when he will return."
 tog_quest.0163.a: "I will have to find another way."
 tog_quest.0164.t: "Caught in the Act"
 tog_quest.0164.desc: "You had found the library, even the right chest. Then a lantern rose in the cloister and a voice cried thief.\n\nYou cleared the wall just in time, empty-handed. From now on, the monks will double-lock their door and keep watch every night."
 tog_quest.0164.a: "I will have to find another way."
 tog_quest.0165.t: "Driven Back"
 tog_quest.0165.desc: "The monks rang the bell before your men even reached the gate. Servants, peasants from the estate and a few men-at-arms came from everywhere, with pitchforks, staves and stones.\n\nYou had to fall back. This day will be talked about in every monastery in the land."
 tog_quest.0165.a: "I will have to find another way."
 tog_quest.0151.t: "Sails on the Coast"
 tog_quest.0151.desc: "Round a bay, three ships are drawn up on the shingle. Norsemen. They saw you before you saw them, and a dozen men are already coming up the beach towards you, axes in hand."
 tog_quest.0151.a: "Fight."
 tog_quest.0151.a.good: "The Norsemen fall back to their ships; you pick up what they left behind."
 tog_quest.0151.a.bad: "You get away, but wounded and with a lighter purse."
 tog_quest.0151.b: "Speak to them in their tongue."
 tog_quest.0151.b.good: "Their chief laughs at your accent and lets you pass."
 tog_quest.0151.b.bad: "They let you pass, for a toll."
 tog_quest.0152.t: "A Wandering Monk"
 tog_quest.0152.desc: "An Irish monk walks the same road as you, barefoot, staff in hand. He is talkative, and he soon guesses you are not going anywhere to pray.\n\n\"You are looking for old things, my friend. Did you know Christ defeated all the gods of the Gaels? Let us talk about it, the road is long.\""
 tog_quest.0152.a: "Debate with him."
 tog_quest.0152.a.good: "The monk falls silent at last, thoughtful. You have learned from his arguments."
 tog_quest.0152.a.bad: "He has an answer for everything, and tells the next village so."
 tog_quest.0152.b: "Keep quiet and let him talk."
 tog_quest.0153.t: "The Spring of Ribbons"
 tog_quest.0153.desc: "At the bottom of a glen, a spring wells up between the roots of an old ash tree. The branches are covered in ribbons, scraps of cloth, locks of hair. A brand new cross has been planted beside it, but the ribbons are fresh too.\n\nAn old woman dips a rag in the water and ties it to a branch, murmuring."
 tog_quest.0153.a: "Ask her what she is doing."
 tog_quest.0153.a.good: "She tells you words her grandmother taught her. You recognise the name of a goddess."
 tog_quest.0153.a.bad: "She takes fright and leaves without a word."
 tog_quest.0153.b: "Tie a ribbon too."
 tog_quest.0154.t: "The Priest and the Stone"
 tog_quest.0154.desc: "In a village square, a priest is having a standing stone broken down with hammers. The villagers watch in silence. A woman who had left milk at the foot of the stone has been tied to a post; the priest announces she will be whipped for idolatry."
 tog_quest.0154.a: "Step in, sword in hand."
 tog_quest.0154.a.good: "The priest's men run off. The woman is free, and the village saw it."
 tog_quest.0154.a.bad: "The woman is freed, but you took some blows."
 tog_quest.0154.b: "Step in with words."
 tog_quest.0154.b.good: "The priest gives way before the village and unties the woman."
 tog_quest.0154.b.bad: "The priest humiliates you in front of everyone."
 tog_quest.0154.c: "Stay hidden and move on."
 tog_quest.0155.t: "Peredur's Shortcut"
 tog_quest.0155.desc: "\"I know a shortcut,\" Peredur said this morning. It is now noon, the fog has come down, and you are in the middle of a bog no one has ever seen.\n\n\"It's this way. I think. Well, it used to be this way.\""
 tog_quest.0155.a: "Trust Peredur."
 tog_quest.0155.a.good: "Against all odds, he finds the path again."
 tog_quest.0155.a.bad: "You go round in circles until evening."
 tog_quest.0155.b: "Look for a local."
 tog_quest.0155.b.good: "A shepherd puts you back on the road."
 tog_quest.0155.b.bad: "The shepherd laughs at you and says nothing useful."
 tog_quest.0156.t: "A Thief in the Night"
 tog_quest.0156.desc: "You wake in the middle of the night. A shadow is bent over your belongings, and your purse is already in its hand."
 tog_quest.0156.a: "Take him by surprise, silently."
 tog_quest.0156.a.good: "You grab him by the collar before he understands; he runs off with nothing."
 tog_quest.0156.a.bad: "He hears you coming and vanishes with your purse."
 tog_quest.0156.b: "Jump on him."
 tog_quest.0156.b.good: "He drops everything and runs."
 tog_quest.0156.b.bad: "He has a knife. You are wounded, and he is gone with your purse."
 tog_quest.0157.t: "The Sick Pilgrim"
 tog_quest.0157.desc: "By the roadside, a pilgrim lies under his cloak, burning with fever. He is going to Iona, he says, but he will go no further without help."
 tog_quest.0157.a: "Help him."
 tog_quest.0157.a.tt: "You tend him and take him to the next village. On the way, he tells you about the saints and springs of his country."
 tog_quest.0157.b: "Move on."
 tog_m.steal_wait: "The monks are still on their guard: you must wait a few months before trying again."
