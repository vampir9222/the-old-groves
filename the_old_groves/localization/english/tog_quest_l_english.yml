 tog_poi_stone: "The Carved Stone"
 tog_poi_stone_desc: "A toppled Pictish stone in the heather, covered in signs no one can read."
 tog_quest.0001.t: "The Apostate"
 tog_quest.0001.desc: "Once, they called you Brother Máel Brigte. You learned to read among the monks of Iona, sang the psalms, believed what you were told to believe. Then the Norsemen came. The relics stopped no ship, the prayers saved no brother, and the abbots fled to safety with the books. You stayed.\n\nNow the Gaels of the isles call you Dubgall, the Dark Foreigner. You raise the horn at the Norse feasts without believing, and one question never leaves you: if the monks' god could not protect his own, what is left to believe?\n\nThis morning, climbing onto the moor to watch for sails, you found something else: a toppled stone in the heather, carved with signs you have never seen. A crescent, a broken arrow, two linked circles. Not letters. Images, set down with too much care to be mere decoration."
 tog_quest.0001.a: "I must understand what these signs say."
 tog_quest.0001.a.tt: "Starts the quest of the #V Old Groves#!. Follow its progress in the #V Situations#! window."
 tog_quest.0001.b: "It is only an old stone."
 tog_quest.0001.b.tt: "You can come back to the stone later, through a decision."
 tog_quest.0002.t: "A Stone in the Isles"
 tog_quest.0002.desc: "A passing trader told you of a strange stone on the isle of [GetTitleByKey('b_skye').GetNameNoTier], in the north: lying in the heather above a bay, carved with signs that no one, Gael or Norseman, can read. Images, he said, not letters. A crescent, a broken arrow, two linked circles.\n\nSince then, you cannot get those signs out of your head."
 tog_quest.0002.a: "I must see this stone."
 tog_quest.0002.a.tt: "The quest of the #V Old Groves#! begins. You set out for #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "The Stone"
 tog_quest.0003.desc: "The stone lies in the heather above the bay, half eaten by moss: a crescent crossed by a broken arrow, two circles joined by a bar, a zigzag line. Someone raised it long ago, and someone else knocked it down: the marks of the levers still show.\n\nYou scrape away the lichen with a knife and copy every sign, stroke by stroke, onto a wax tablet."
 tog_quest.0003.a: "Copy the stone."
 tog_quest.0020.t: "The Shepherd"
 tog_quest.0020.desc: "You have barely finished your copy when the heather rustles behind you. A young man stumbles out, out of breath, a rope in his hand.\n\n“You haven't seen a goat?”\n\nHis name is Peredur. He minds the hamlet's animals, when he can find them, and he listens with great attention while retaining nothing. He catches sight of the stone, forgets the goat, and walks around the signs to see them upside down, then right way up, then upside down again, to be safe.\n\n“That's old-folk stuff, that is. You want the old man. The one across the water. Left as you leave the bay. But careful: depends which way you're facing, it changes everything! My father says the old man is all esoterism.”\n\nYou smile: “Esoterism is knowledge kept for a few initiates, hidden from those who are not ready to receive it.”\n\nPeredur nods slowly, looking deeply thoughtful.\n\n“Yeah, that's not wrong. Shall I take you to the old man? It's left. Well, I think.”"
 tog_quest.0020.a: "Show me, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! joins you and leads you to the old man, in #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_quest.0021.t: "The Wrong Old Man"
 tog_quest.0021.desc: "Peredur's old man does exist. He lives in a hut by the water in [GetTitleByKey('b_gairloch').GetNameNoTier]. He is eighty, has three teeth, and has never seen a carved stone in his life. He talks to you at length about herring, seals, and the woman he nearly married long ago.\n\nPeredur scratches his head.\n\n“Ah. Maybe it was right.”\n\nThe old fisherman, for his part, has understood who you mean: “The one who talks to stones? He lives south, across the water, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Everybody knows that.”"
 tog_quest.0021.a: "This time, I choose the way."
 tog_quest.0021.a.tt: "You set out for #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, to the real old man."
 tog_quest.0022.t: "The Empty House"
 tog_quest.0022.desc: "At last you find the old man's house, deep in a valley the Norsemen leave alone because there is nothing to take. The door has been smashed in. Inside, everything has been turned over: the chest broken open, the straw mattress torn, a staff snapped in two on the threshold.\n\nA neighbour finally comes out. Bandits came three days ago, men from the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. They were looking for the gold the old man was hiding, or so they thought: they say his family descends from Myrddin, the mad bard, and a man like that must have a treasure. They found nothing. So they took the old man.\n\n“His name is Lailoken,” she adds. “He is sixty-eight.”"
 tog_quest.0022.a: "We will go and find him."
 tog_quest.0022.a.tt: "You set out for the bandits' camp, in the hills of #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "The Bandits' Camp"
 tog_quest.0023.desc: "The camp is hidden in a fold of the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]: a dozen huts, a fire, stolen horses, and some twenty men who do not look friendly. In the middle, tied to a post, a thin old man watches you come without a word.\n\nTheir chief steps forward. He wants gold. He always wants gold."
 tog_quest.0023.a: "Attack the camp."
 tog_quest.0023.b: "Talk them into freeing him."
 tog_quest.0023.b.good: "You convince them the old man is worth nothing, and that no one mistreats a descendant of Myrddin unpunished. They let him go."
 tog_quest.0023.c: "Pay the ransom."
 tog_quest.0023.c.tt: "The bandits take the gold and free the old man."
 tog_quest.0050.t: "A Text of the Gods"
 tog_quest.0050.a: "Come, Lailoken."
 tog_quest.0050.a.tt: "#V Lailoken#! joins you. End of the first step of the quest: the next part (the books of the copyist monks) will come in a future version."
 tog_quest.0010.t: "The Wax Tablet"
 tog_quest.0010.desc: "One evening at camp, you set the tablet too close to the fire. When you find it again, the wax has run: the broken arrow is now only a soft smear, and you no longer know whether it leaned left or right. Peredur, for his part, is sure it leaned left."
 tog_quest.0010.a: "Redraw the strokes from memory."
 tog_quest.0010.a.good: "Your memory holds: the copy is saved."
 tog_quest.0010.a.bad: "You doubt every stroke, and spend the night blaming yourself."
 tog_quest.0010.b: "Let Peredur carry the tablet from now on."
 tog_quest.0010.b.tt: "Peredur will guard it carefully. Upside down, no doubt."
 tog_quest.0011.t: "The Trader"
 tog_quest.0011.desc: "On the road, you meet a trader bound for Orkney. Seeing your copy, he frowns: he has seen signs like these further east, on other standing stones, in the old land of the Picts. No one there knows what they mean either."
 tog_quest.0011.a: "Question him at length."
 tog_quest.0011.a.good: "He describes the other stones in detail: you understand yours better."
 tog_quest.0011.a.bad: "He mostly tells tall tales, and you waste the day untangling them."
 tog_quest.0011.b: "Buy his drawing."
 tog_quest.0012.t: "The Dream"
 tog_quest.0012.desc: "One night at camp, the carved crescent comes back to you in your sleep. It rises in the sky like a moon, and the two circles burn beneath it like two fires.\n\nYou wake certain you have understood something, without knowing what."
 tog_quest.0012.a: "Write the dream down before it fades."
 tog_quest.0012.a.good: "The dream opens a path, and you feel closer to the old gods."
 tog_quest.0012.a.bad: "The dream leads you astray, and you wake more troubled than before."
 tog_quest.0012.b: "It is only a dream."
 tog_quest.0023.a.good: "Your men sweep through the camp: the bandits flee into the hills, leaving their loot behind."
 tog_quest.0023.a.bad: "The assault goes wrong: you escape by a hair, but wounded."
 tog_quest.0023.b.bad: "They laugh at your speeches and drive you out of the camp."
 tog_quest.0024.t: "By a Hair"
 tog_quest.0024.desc: "The assault turned into a disaster. The bandits knew every rock in these hills, and you were out in the open. You got away by a hair, a wound in your side, half carried by Peredur, who swore he knew a way round to the left, and who, for once, was right.\n\nThe old man is still up there, tied to his post. You will have to go back, once you can stand."
 tog_quest.0024.a: "Dress my wounds, and go back."
 tog_quest.0024.a.tt: "You will return to the camp in a few days."
 tog_quest.0025.t: "Turned Away"
 tog_quest.0050.desc: "The old man rubs his wrists and looks at you for a long time, without a word of thanks.\n\n“Why? No one comes looking for a mad old man deep in the hills. What do you want with me?”\n\nBy way of answer, Peredur hands him your wax tablet. The old man turns it the right way up and runs a finger along the carved crescent, then over the two circles.\n\n“It is a text.”\n\n“A text? These are pictures.”\n\n“To you. To those who carved them, it was a text. A text of the gods. Those who could read them, the monks drove away, and their children learned to keep quiet. Me, I only know you must not plough around it.”\n\nHe gives you back the tablet.\n\n“But the monks wrote everything down. Even what they hated. Above all what they hated. If you want to know who these gods were, look in their books: at Jarrow, at Whithorn, at Mynyw, at Dunkeld, at Applecross.”\n\nHe falls silent for a moment, then adds, more quietly:\n\n“You saved my life. Where I come from, a debt like that is not repaid with words: I will follow you. And I have spent my life making sure no one ploughed around the stones. Before I die, I would like to see what you will do with that one.”"
 tog_dest_camp: "the Bandits' Camp"
 tog_quest.0025.desc: "The bandits heard you out, then burst out laughing amid the jeers of their companions. The old man, still tied to his post, said nothing.\n\nWords will no longer work with these men. Force or gold remain."
 tog_quest.0025.c: "Leave."
 tog_quest.0025.c.tt: "You leave the camp. Come back once you have enough gold or strength, with the decision “Travel to the Bandits' Camp”."
 tog_travel_desc_stone: "A stone carved with signs no one can read awaits you on the isle of [GetTitleByKey('b_skye').GetNameNoTier]. You must see it with your own eyes, and copy it."
 tog_travel_desc_wrong: "Peredur swears he knows the way to the old man: left as you leave the bay, towards [GetTitleByKey('b_gairloch').GetNameNoTier]. He is almost sure."
 tog_travel_desc_house: "According to the old fisherman, the one who talks to stones lives south, across the water, in [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. This time, you choose the road."
 tog_travel_desc_camp: "Bandits have taken old Lailoken into the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. If no one goes after him, no one will see him again."
 tog_travel_desc_camp_return: "Old Lailoken is still held by the bandits in the hills of [GetTitleByKey('b_glencoe').GetNameNoTier]. Enough gold for the ransom, or enough men for the assault: it is time to go back."
