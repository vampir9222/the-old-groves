 tog_offerings_tent_domicile_building: "Tent of Offerings"
 tog_offerings_tent_domicile_building_desc: "Wherever the camp stops, the followers of the old gods come to leave their gifts: a few coins, grain, a cheese, a lamb. They leave with a blessing.\n\nEach month, the faithful bring #P 100#! provisions."
 tog_offerings_tent.tt.quest: "Given by the faithful at the founding of the worship of the ancients"
 tog_test_gold_decision: "TEST: 50 gold"
 tog_test_gold_decision_desc: "Test decision, to remove before release: adds 50 gold."
 tog_test_reform_decision: "TEST: reform requirements"
 tog_test_reform_decision_desc: "Test decision, to remove before release: gives 5000 piety and all the counties of the faith's holy sites, converted."
 tog_mabon.tried: "This approach has already failed"
 tog_quest.0222.b.good: "The steward agrees to wait for the next harvest: the field is saved."
 tog_quest.0222.b.bad: "The steward will hear none of it. You will have to find something else."
 tog_quest.0222.d.good: "The steward turns pale and tears up the deed of debt himself."
 tog_quest.0222.d.bad: "The steward calls his men and you must withdraw. You will have to find something else."
 tog_quest.0222.c.good: "The new deed passes for genuine: the debt is settled."
 tog_quest.0222.c.bad: "The steward notices the ink is too fresh. You will have to find something else."
 tog_quest.0223.a.good: "Aedán unsaddles his horse. He stays."
 tog_quest.0223.a.bad: "Aedán will not listen to you. You will have to find something else before he leaves."
 tog_quest.0223.c.good: "Aedán is too frightened to mount his horse. He will say nothing."
 tog_quest.0223.c.bad: "Aedán stands up to you. You will have to find something else before he leaves."
 tog_offerings_modifier: "Offerings of the Faithful"
 tog_offerings_modifier_desc: "The followers of the old gods bring their gifts to their lord: a few coins, grain, a lamb, and a great deal of respect."
 tog_druid_heritage_decision: "Take Up the Heritage of the Groves"
 tog_druid_heritage_decision_desc: "The old gods have followers, but no army yet. For your house to bear their name in battle, the druids and bards must recognise it as the guardian of the groves. That cannot be bought with gold."
 tog_druid_heritage_decision_tooltip: "Your dynasty takes up the heritage of the groves."
 tog_druid_heritage_decision_confirm: "May the groves recognise us"
 tog_druid_heritage_decision_effect_tt: "Your dynasty gains the casus belli #V Return the Land to the Old Gods#!: a duchy of Britain or Ireland held by Christians for a lord, a county for an adventurer.\n\nIt can also have the #V spear of Lug#! forged."
 tog_relic.0001.t: "The Keeper"
 tog_relic.0001.desc.mistletoe: "On the shore of the strait, an old woman is waiting for you in front of her house as if she knew you would come. She lets you in and opens a chest. Inside, on a white cloak, lies a woven crown of mistletoe. The leaves should have dried out long ago. They are green.\n\n“My mother kept it,” she says, “and her mother before her. The Romans burned the oaks, not all the mistletoe.”"
 tog_relic.0001.desc.sickle: "In a wood half a day from Chartres, a charcoal burner beckons you to follow him. He stops before an old oak and pulls a leather bundle from under its roots. Inside is a thin crescent of gold, engraved with chevrons.\n\n“A pedlar from Armorica left it with my grandfather,” he says. “He said this was where it had to be brought back, among the Carnutes, where the druids of all Gaul used to gather.”"
 tog_relic.0001.desc.carnyx: "At the foot of the hill of Alise, a peasant watches you pass with your companions. He sets down his pick and goes to fetch something from under a heap of stones at the edge of his field: a bronze boar's head, jaws open, mounted on a long, twisted tube. A war horn.\n\n“These have always come out of the earth,” he says. “My father said they were the horns of the ancients. You look like someone who would know what to do with it.”"
 tog_relic.0001.desc.cauldron: "On the hill of Tara, near the stone of Fál, an old man is minding sheep. He takes you to his hut. In a corner, under hides, there is a great blackened bronze cauldron, ringed with iron, big enough to cook a calf in.\n\n“The cauldron of the Dagda,” he says. “No one ever left it unsatisfied. My family has kept it since the kings stopped coming here.”"
 tog_relic.0001.desc.branch: "On the shore, far from the monastery, a woman is gathering seaweed. When she sees your companions, she takes from her basket a silver branch from which hang three little silver apples. The wind stirs it, and it chimes softly.\n\n“The branch of Manannán,” she says. “Whoever hears it forgets their sorrows. If the monks found it, they would melt it down to make a chalice.”"
 tog_relic.0001.desc.torc: "On the rock of Peñalba, where the name of Lugus can still be read carved into the stone, a shepherd is waiting for you. He opens his hand. In it lies a twisted gold torc, ending in two serpents' heads.\n\n“The ancients wore it at their necks and offered it to the god,” he says. “It was found in a crack in the rock. No one here knows any more whom it belongs to.”"
 tog_relic.0001.desc.outro: "\n\nThe keeper will not give it up for nothing. He is old, and winter is coming."
 tog_relic.0001.a: "Pay what is asked."
 tog_relic.0001.b: "Haggle."
 tog_relic.0001.b.success: "The keeper accepts a lower price"
 tog_relic.0001.b.failure: "The keeper packs the relic away"
 tog_relic.0001.c: "“Keep it. It belongs here.”"
 tog_relic.0001.lost.tt: "The relic goes back to its hiding place. Perhaps it will reappear on another pilgrimage."
 tog_cauldron_name: "The Cauldron of the Dagda"
 tog_cauldron_description: "A great blackened bronze cauldron, ringed with iron, kept near the stone of Fál, at Tara. It was one of the four treasures of the Tuatha Dé: no one left it unsatisfied."
 tog_cauldron_modifier: "Cauldron of the Dagda"
 tog_silver_branch_name: "The Silver Branch"
 tog_silver_branch_description: "A silver branch from which hang three silver apples, hidden on the isle of Iona. It is said to come from the land of Manannán, beneath the sea, and that whoever hears it chime forgets their sorrows."
 tog_silver_branch_modifier: "Silver Branch"
 tog_torc_name: "The Torc of Lugus"
 tog_torc_description: "A twisted gold torc ending in two serpents' heads, found in a crack in the rock of Peñalba, where the Celtiberians carved the name of Lugus."
 tog_torc_modifier: "Torc of Lugus"
 tog_convert_old_faith_decision: "Renew the Bond with the Old Gods"
 tog_convert_old_faith_decision_desc: "The saints did not stop the Saxons, nor the Norse. The bards, though, still sing of the Children of Dôn, and the old stones are still standing on the moors. It is time to give these gods what your ancestors owed them."
 tog_convert_old_faith_decision_tooltip: "You renounce the monks' faith for the old gods."
 tog_convert_old_faith_decision_confirm: "Let the monks say what they will"
 tog_convert_old_faith_decision_effect_tt: "As with any conversion, your close family and the county of your capital may follow you, and your vassals will hear of it."
