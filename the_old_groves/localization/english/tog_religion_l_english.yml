 # Other rites
 tog_brythonic_rite: "Plant Dôn"
 tog_brythonic_rite_adj: "Brythonic Druidic"
 tog_brythonic_rite_adherent: "Brythonic Druidist"
 tog_brythonic_rite_adherent_plural: "Brythonic Druidists"
 tog_brythonic_rite_desc: "The tradition of the island Britons and their Armorican cousins: Wales, Cornwall, Cumbria and Pictland. It honours Lleu and the Children of Dôn, reveres standing stones and sacred groves, and opens its priesthood and its thrones to women and men alike."
 tog_gaulish_rite: "Gutuatrism"
 tog_gaulish_rite_adj: "Gaulish Druidic"
 tog_gaulish_rite_adherent: "Gaulish Druidist"
 tog_gaulish_rite_adherent_plural: "Gaulish Druidists"
 tog_gaulish_rite_desc: "The tradition of the continent, rebuilt from inscriptions and the accounts of Greeks and Romans. It honours Lugus and Sucellos, reads the stars like Caesar's druids, burns its dead and keeps the heads of its enemies."
 tog_celtiberian_rite: "Lugovism"
 tog_celtiberian_rite_adj: "Celtiberian Druidic"
 tog_celtiberian_rite_adherent: "Celtiberian Druidist"
 tog_celtiberian_rite_adherent_plural: "Celtiberian Druidists"
 tog_celtiberian_rite_desc: "The tradition of the Celts of Hispania, from the Meseta to Gallaecia. It honours Lugus, seals hospitality with pacts engraved in bronze, and gives its fallen warriors to the vultures that carry their souls away."

