l_english:
 # Religion
 tog_celtic_religion: "Celtic"
 tog_celtic_religion_adj: "Celtic"
 tog_celtic_religion_adherent: "Celt"
 tog_celtic_religion_adherent_plural: "Celts"
 tog_celtic_religion_desc: "The old beliefs of the Celtic peoples, from Ireland to Gaul and as far as Hispania. They survive only in the tales kept by monks and in the standing stones, waiting for someone to awaken them."

 # Faith
 tog_druidism: "Druidism"
 tog_druidism_adj: "Druidic"
 tog_druidism_adherent: "Druidist"
 tog_druidism_adherent_plural: "Druidists"
 tog_druidism_desc: "A new faith that claims the druids as its own. Rebuilt from sagas preserved by monks, from half-understood ruins and from what its followers know of Norse paganism, it lays claim to a past it does not truly restore."

 # Rites
 tog_gaelic_rite: "Gaelic Rite"
 tog_gaelic_rite_adj: "Gaelic"
 tog_gaelic_rite_adherent: "Gael"
 tog_gaelic_rite_adherent_plural: "Gaels"
 tog_gaelic_rite_desc: "The tradition of the Gaels of Ireland, Dál Riata and Man. It honours Lug and the Tuatha Dé, keeps Samain and Beltaine, and remembers the ancestors in the genealogies of the poets."

 # Custom doctrine
 tog_doctrine_clerical_function_judges_name: "Judges and Arbiters"
 tog_doctrine_clerical_function_judges_descriptive_name: "Judicial Clergy"
 tog_doctrine_clerical_function_judges_desc: "Our [ROOT.Faith.PriestNeuterPlural] judge crimes, inheritances and boundary disputes, and step between armies about to clash. A punishment they pronounce is no single man's whim."

