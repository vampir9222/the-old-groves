l_english:
 bm_867_tog_old_groves: "The Old Groves"
 bm_867_tog_old_groves_desc: "The druids have been dead for centuries. All that remains are standing stones, the names of gods copied out by monks, and a few twisted memories. But in 867, amid Norse raids and Christian kingdoms, some begin to dig through these ruins… and to dream of waking what sleeps."
 bm_867_tog_dubgall: "Dubgall the Apostate"
 bm_867_tog_dubgall_desc: "867. The Hebrides. A monk of Iona has renounced his baptism and sails with the Norse. He can read the old tales the monks copied out, and he is beginning to wonder whether the forgotten gods might live again."

 bookmark_tog_dubgall: "Dubgall the Apostate"
 bookmark_tog_dubgall_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_tog_dubgall_desc: "He was called Brother Máel Brigte, “the servant of Brigit”, and he copied manuscripts on Iona. When the Norse came back, he did not flee to Kells with the others. He stayed, and in the end he went over to their side. The Gaels now call him Dubgall, “the dark foreigner”.\n\nHe has read the old sagas the monks copied in spite of themselves. He knows the names of gods no one prays to any more. And he is beginning to wonder whether they might live again.\n\n#weak Tip: choose the Scholars camp purpose.#!"
 bookmark_tog_rhodri: "Prince Rhodri"
 bookmark_tog_rhodri_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_rhodri_desc: "Rhodri ap Merfyn holds Gwynedd and the isle of Môn, where the Romans slaughtered the last druids. The Norse ravage his coasts, the Saxons press from the east, and the saints do little to protect him. His bards, though, still sing of the Children of Dôn.\n\n#weak Tip: a decision lets you return to the old gods.#!"
 bookmark_tog_dumnarth: "Petty King Dumnarth"
 bookmark_tog_dumnarth_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_dumnarth_desc: "Dumnarth rules Cornwall, the last kingdom of the southern Britons. Every year, Wessex pushes a little further west. The monks pray for him, but prayers do not stop the Saxons. Out on the moors, the standing stones are still waiting.\n\n#weak Tip: a decision lets you return to the old gods.#!"
 bookmark_tog_salomon: "King Salomon"
 bookmark_tog_salomon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tog_salomon_desc: "Salomon took the throne of Brittany by killing his cousin Erispoe at the foot of an altar. Since then he has wrested part of Anjou from the Franks, and he fears neither King Charles nor the Archbishop of Tours. He is nearly sixty: if he wants to leave behind more than a kingdom, he has little time left. Beneath the chapels of Armorica, the old gods of Gaul still sleep.\n\n#weak Tip: a decision lets you return to the old gods.#!"

