l_french:
 bm_867_tog_old_groves: "Les Anciens Bosquets"
 bm_867_tog_old_groves_desc: "Les druides sont morts depuis des siècles. Il n'en reste que des pierres dressées, des noms de dieux recopiés par des moines et quelques souvenirs déformés. Mais en 867, au milieu des raids norrois et des royaumes chrétiens, certains commencent à fouiller ces ruines… et à rêver de réveiller ce qui dort."

 bookmark_tog_dubgall: "Dubgall l'Apostat"
 bookmark_tog_dubgall_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_tog_dubgall_desc: "Il s'appelait frère Máel Brigte, « le serviteur de Brigit », et copiait des manuscrits à Iona. Quand les Norrois sont revenus, il n'a pas fui à Kells avec les autres. Il est resté, et il a fini par passer de leur côté. Les Gaëls l'appellent désormais Dubgall, « l'étranger sombre ».\n\nIl a lu les vieilles sagas que les moines ont recopiées malgré eux. Il sait les noms de dieux que plus personne ne prie. Et il commence à se demander s'ils pourraient revivre.\n\n#weak Conseil : choisis la vocation de camp des Érudits.#!"
 bookmark_tog_rhodri: "Prince Rhodri"
 bookmark_tog_rhodri_desc: "Rhodri ap Merfyn tient le Gwynedd et l'île de Môn, où les Romains ont massacré les derniers druides. Les Norrois ravagent ses côtes, les Saxons pressent à l'est, et les saints ne le protègent guère. Ses bardes, eux, chantent encore les Enfants de Dôn.\n\n#weak Conseil : une décision te permet de revenir aux anciens dieux.#!"
 bookmark_tog_dumnarth: "Petit roi Dumnarth"
 bookmark_tog_dumnarth_desc: "Dumnarth règne sur la Cornouailles, le dernier royaume des Bretons du sud. Chaque année, le Wessex avance un peu plus vers l'ouest. Les moines prient pour lui, mais les prières n'arrêtent pas les Saxons. Dans les landes, les pierres dressées attendent toujours.\n\n#weak Conseil : une décision te permet de revenir aux anciens dieux.#!"

