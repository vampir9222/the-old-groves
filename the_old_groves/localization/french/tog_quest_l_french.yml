l_french:
 tog_story_old_groves: "Les Anciens Bosquets"
 tog_story_old_groves_desc: "Une pierre gravée de signes que personne ne sait lire. Des livres recopiés par des moines qui détestaient ce qu'ils écrivaient. Quelque part, sous les récits, dort le culte des anciens."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Compagnons"
 tog_story_old_groves_destination: "Destination"
 tog_obj_stone: "Se rendre auprès de la pierre, à #V [GetTitleByKey('b_skye').GetNameNoTier]#!, et la copier."
 tog_obj_wrong: "Suivre Peredur jusqu'au vieux, à #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Trouver le vrai vieux, à #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Délivrer le vieux, prisonnier des bandits dans les collines de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "l'île de [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "[GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "[GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Étudier la pierre"
 tog_quest_start_decision_desc: "On parle d'une pierre étrange dans l'île de [GetTitleByKey('b_skye').GetNameNoTier], gravée de signes que personne ne sait lire."
 tog_quest_start_decision_tooltip: "Commence la quête des Anciens Bosquets."
 tog_quest_start_decision_confirm: "Partir pour [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "Commence la quête des #V Anciens Bosquets#!. Suivez sa progression dans la fenêtre des #V Situations#!."
 tog_quest_travel_decision: "Voyager vers [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Ouvre le voyage vers la destination actuelle de la quête."
 tog_quest_travel_decision_not_there: "Vous êtes déjà sur place."
 tog_quest_travel_decision_effect_tt: "Vous partez vers la destination de la quête. Un aventurier y déplace son camp."
 tog_poi_stone: "La pierre gravée"
 tog_poi_stone_desc: "Une pierre picte renversée dans la bruyère, couverte de signes que personne ne sait lire."
 tog_quest.0001.t: "L'Apostat"
 tog_quest.0001.desc: "Autrefois, on t'appelait frère Máel Brigte. Tu as appris à lire chez les moines d'Iona, chanté les psaumes, cru ce qu'on te disait de croire. Puis les Norrois sont venus. Les reliques n'ont arrêté aucun navire, les prières n'ont sauvé aucun frère, et les abbés sont partis à l'abri avec les livres. Toi, tu es resté.\n\nAujourd'hui, les Gaëls des îles t'appellent Dubgall, l'Étranger noir. Tu lèves la corne aux fêtes des Norrois sans y croire, et une question ne te quitte plus : si le dieu des moines n'a pas su protéger les siens, que reste-t-il à croire ?\n\nCe matin, en montant guetter les voiles sur la lande, tu as trouvé autre chose : une pierre renversée dans la bruyère, gravée de signes que tu n'as jamais vus. Un croissant, une flèche brisée, deux cercles reliés. Pas des lettres. Des images, posées là avec trop de soin pour n'être que des décorations."
 tog_quest.0001.a: "Je dois comprendre ce que disent ces signes."
 tog_quest.0001.a.tt: "Commence la quête des #V Anciens Bosquets#!. Suivez sa progression dans la fenêtre des #V Situations#!."
 tog_quest.0001.b: "Ce n'est qu'une vieille pierre."
 tog_quest.0001.b.tt: "Vous pourrez revenir à la pierre plus tard, par une décision."
 tog_quest.0002.t: "Une pierre dans les îles"
 tog_quest.0002.desc: "Un marchand de passage t'a parlé d'une pierre étrange, dans l'île de [GetTitleByKey('b_skye').GetNameNoTier], au nord : couchée dans la bruyère au-dessus d'une baie, gravée de signes que personne, ni chez les Gaëls ni chez les Norrois, ne sait lire. Des images, a-t-il dit, pas des lettres. Un croissant, une flèche brisée, deux cercles reliés.\n\nDepuis, tu n'arrives plus à te sortir ces signes de la tête."
 tog_quest.0002.a: "Je dois voir cette pierre."
 tog_quest.0002.a.tt: "La quête des #V Anciens Bosquets#! commence. Vous partez pour #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "La pierre"
 tog_quest.0003.desc: "La pierre est couchée dans la bruyère, au-dessus de la baie, à moitié mangée par la mousse : un croissant traversé d'une flèche brisée, deux cercles reliés par une barre, un trait en zigzag. Quelqu'un l'a dressée il y a très longtemps, et quelqu'un d'autre l'a renversée : on voit encore les marques des leviers.\n\nTu grattes le lichen au couteau et tu relèves chaque signe, trait par trait, sur une tablette de cire."
 tog_quest.0003.a: "Copier la pierre."
 tog_quest.0020.t: "Le berger"
 tog_quest.0020.desc: "Tu finis à peine ton relevé quand la bruyère s'agite derrière toi. Un jeune homme en sort, essoufflé, une corde à la main.\n\n« Vous avez pas vu une chèvre ? »\n\nIl s'appelle Peredur. Il garde les bêtes du hameau, quand il les trouve, et il écoute avec beaucoup d'attention sans rien retenir. Il aperçoit la pierre, oublie la chèvre, et fait le tour des signes pour les voir à l'envers, puis à l'endroit, puis encore à l'envers, par sécurité.\n\n« Ça, c'est des trucs de vieux. Faut voir le vieux. Celui de l'autre côté de l'eau. À gauche en sortant de la baie. Mais faites attention : selon comment on est tourné, ça change tout ! Mon père dit que le vieux, c'est de l'ésotérisme. »\n\nTu souris : « L'ésotérisme, c'est un savoir réservé à quelques initiés, qu'on cache à ceux qui ne sont pas prêts à le recevoir. »\n\nPeredur hoche longuement la tête, l'air pénétré.\n\n« Ouais, c'est pas faux. Je vous emmène chez le vieux ? C'est à gauche. Enfin, je crois. »"
 tog_quest.0020.a: "Montre-moi, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! vous rejoint et vous conduit chez le vieux, à #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_quest.0021.t: "Le mauvais vieux"
 tog_quest.0021.desc: "Le vieux de Peredur existe bel et bien. Il vit dans une cabane au bord de l'eau, à [GetTitleByKey('b_gairloch').GetNameNoTier]. Il a quatre-vingts ans, trois dents, et il n'a jamais vu une pierre gravée de sa vie. Il te parle longuement du hareng, des phoques, et de la femme qu'il a failli épouser autrefois.\n\nPeredur se gratte la tête.\n\n« Ah. C'était peut-être à droite. »\n\nLe vieux pêcheur, lui, a compris de qui vous parlez : « Celui qui parle aux pierres ? Il vit au sud, de l'autre côté de l'eau, à [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Tout le monde sait ça. »"
 tog_quest.0021.a: "Cette fois, c'est moi qui choisis la direction."
 tog_quest.0021.a.tt: "Vous partez pour #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, chez le vrai vieux."
 tog_quest.0022.t: "La maison vide"
 tog_quest.0022.desc: "Tu trouves enfin la maison du vieux, au fond d'une vallée où les Norrois ne vont pas parce qu'il n'y a rien à prendre. La porte est enfoncée. À l'intérieur, tout a été retourné : le coffre éventré, la paillasse déchirée, un bâton brisé en deux sur le seuil.\n\nUne voisine finit par sortir de chez elle. Des bandits sont venus il y a trois jours, des hommes des collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Ils cherchaient l'or que le vieux cachait, d'après eux : on dit que sa famille descend de Myrddin, le barde fou, et un homme pareil a forcément un trésor. Ils n'ont rien trouvé. Alors ils ont emmené le vieux.\n\n« Il s'appelle Lailoken, ajoute-t-elle. Il a soixante-huit ans. »"
 tog_quest.0022.a: "Nous allons le chercher."
 tog_quest.0022.a.tt: "Vous partez pour le camp des bandits, dans les collines de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "Le camp des bandits"
 tog_quest.0023.desc: "Le camp est caché dans un repli des collines de [GetTitleByKey('b_glencoe').GetNameNoTier] : une dizaine de huttes, un feu, des chevaux volés, et une vingtaine d'hommes qui n'ont pas l'air commode. Au milieu, attaché à un poteau, un vieil homme maigre te regarde approcher sans rien dire.\n\nLeur chef s'avance. Il veut de l'or. Il veut toujours de l'or."
 tog_quest.0023.a: "Attaquer le camp."
 tog_quest.0023.b: "Les convaincre de le relâcher."
 tog_quest.0023.b.good: "Tu les persuades que le vieux ne vaut rien, et qu'on ne maltraite pas impunément un descendant de Myrddin. Ils le relâchent."
 tog_quest.0023.c: "Payer la rançon."
 tog_quest.0023.c.tt: "Les bandits prennent l'or et relâchent le vieux."
 tog_quest.0050.t: "Un texte des dieux"
 tog_quest.0050.a: "Viens, Lailoken."
 tog_quest.0010.t: "La tablette de cire"
 tog_quest.0010.desc: "Un soir de bivouac, tu as posé la tablette trop près du feu. Quand tu la retrouves, la cire a coulé : la flèche brisée n'est plus qu'une trace molle, et tu ne sais plus si elle penchait vers la gauche ou vers la droite. Peredur, lui, est sûr qu'elle penchait à gauche."
 tog_quest.0010.a: "Refaire les traits de mémoire."
 tog_quest.0010.a.good: "Ta mémoire est sûre : le relevé est sauvé."
 tog_quest.0010.a.bad: "Tu doutes de chaque trait, et tu passes la nuit à te le reprocher."
 tog_quest.0010.b: "Confier désormais la tablette à Peredur."
 tog_quest.0010.b.tt: "Peredur la gardera précieusement. À l'envers, sans doute."
 tog_quest.0011.t: "Le marchand"
 tog_quest.0011.desc: "Sur la route, vous croisez un marchand qui remonte vers les Orcades. En voyant ton relevé, il fronce les sourcils : il a vu des signes semblables, plus à l'est, sur d'autres pierres dressées, dans l'ancien pays des Pictes. Là-bas non plus, personne ne sait ce qu'ils veulent dire."
 tog_quest.0011.a: "L'interroger longuement."
 tog_quest.0011.a.good: "Il te décrit les autres pierres en détail : tu comprends mieux la tienne."
 tog_quest.0011.a.bad: "Il raconte surtout des fables, et tu perds ta journée à les démêler."
 tog_quest.0011.b: "Lui acheter son dessin."
 tog_quest.0012.t: "Le rêve"
 tog_quest.0012.desc: "Une nuit de bivouac, le croissant gravé revient dans ton sommeil. Il se lève dans le ciel comme une lune, et les deux cercles brûlent sous lui comme deux feux.\n\nTu te réveilles avec la certitude d'avoir compris quelque chose, sans savoir quoi."
 tog_quest.0012.a: "Noter le rêve avant qu'il s'efface."
 tog_quest.0012.a.good: "Le rêve t'ouvre une piste, et tu te sens plus proche des anciens dieux."
 tog_quest.0012.a.bad: "Le rêve t'égare, et tu te réveilles plus troublé qu'avant."
 tog_quest.0012.b: "Ce n'est qu'un rêve."
 tog_quest.0023.a.good: "Tes hommes balaient le camp : les bandits s'enfuient dans les collines en abandonnant leur butin."
 tog_quest.0023.a.bad: "L'assaut tourne mal : tu t'en sors de justesse, mais blessé."
 tog_quest.0023.b.bad: "Ils rient de tes discours et te chassent du camp."
 tog_quest.0024.t: "De justesse"
 tog_quest.0024.desc: "L'assaut a tourné au désastre. Les bandits connaissaient chaque rocher de ces collines, et vous étiez à découvert. Tu t'en es sorti de justesse, une plaie au flanc, porté à moitié par Peredur qui jurait connaître un passage par la gauche, et qui, pour une fois, avait raison.\n\nLe vieux est toujours là-haut, attaché à son poteau. Il faudra y retourner, quand tu tiendras debout."
 tog_quest.0024.a: "Panser mes blessures, et y retourner."
 tog_quest.0024.a.tt: "Vous retournerez au camp dans quelques jours."
 tog_quest.0025.t: "Éconduit"
 tog_quest.0050.desc: "Le vieux se frotte les poignets et te regarde longtemps, sans un mot de remerciement.\n\n« Pourquoi ? Personne ne vient chercher un vieux fou au fond des collines. Qu'est-ce que tu me veux ? »\n\nPour toute réponse, Peredur lui tend ta tablette de cire. Le vieux la remet à l'endroit, et passe le doigt sur le croissant gravé, puis sur les deux cercles.\n\n« C'est un texte. »\n\n« Un texte ? Ce sont des images. »\n\n« Pour toi. Pour ceux qui les ont gravés, c'était un texte. Un texte des dieux. Ceux qui savaient les lire, les moines les ont chassés, et leurs enfants ont appris à se taire. Moi, je sais seulement qu'il ne faut pas labourer autour. »\n\nIl te rend la tablette.\n\n« Mais les moines écrivaient tout. Même ce qu'ils détestaient. Surtout ce qu'ils détestaient. Si tu veux savoir qui étaient ces dieux, cherche dans leurs livres : à Jarrow, à Whithorn, à Mynyw, à Dunkeld, à Applecross. »\n\nIl se tait un moment, puis ajoute, plus bas :\n\n« Tu m'as sauvé la vie. Chez nous, une dette pareille ne se rembourse pas avec des mots : je te suivrai. Et puis j'ai passé ma vie à surveiller qu'on ne laboure pas autour des pierres. Avant de mourir, je voudrais voir ce que tu vas faire de celle-là. »"
 tog_dest_camp: "le camp des bandits"
 tog_quest.0025.desc: "Les bandits t'ont écouté jusqu'au bout, puis ils ont éclaté de rire, sous les huées de leurs compagnons. Le vieux, toujours attaché à son poteau, n'a pas dit un mot.\n\nLes discours ne serviront plus à rien avec ces hommes-là. Il reste la force, ou l'or."
 tog_quest.0025.c: "Partir."
 tog_quest.0025.c.tt: "Vous quittez le camp. Revenez quand vous aurez assez d'or ou de forces, avec la décision « Voyager vers le camp des bandits »."
 tog_travel_desc_stone: "Une pierre gravée de signes que personne ne sait lire t'attend dans l'île de [GetTitleByKey('b_skye').GetNameNoTier]. Il faut la voir de tes yeux, et la copier."
 tog_travel_desc_wrong: "Peredur jure qu'il connaît le chemin jusqu'au vieux : à gauche en sortant de la baie, du côté de [GetTitleByKey('b_gairloch').GetNameNoTier]. Il en est presque sûr."
 tog_travel_desc_house: "D'après le vieux pêcheur, celui qui parle aux pierres vit au sud, de l'autre côté de l'eau, à [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Cette fois, c'est toi qui choisis la route."
 tog_travel_desc_camp: "Des bandits ont emmené le vieux Lailoken dans les collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Si personne ne va le chercher, personne ne le reverra."
 tog_travel_desc_camp_return: "Le vieux Lailoken est toujours prisonnier des bandits, dans les collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Assez d'or pour la rançon, ou assez d'hommes pour l'assaut : il est temps d'y retourner."
 tog_quest_travel_decision_confirm: "Partir"
 tog_quest.0050.a.tt: "#V Lailoken#! vous rejoint. Les livres des moines copistes vous attendent dans cinq monastères (décision « Voyager vers un monastère »)."
 tog_story_old_groves_monasteries: "Monastères à visiter"
 tog_obj_books: "Récupérer les livres des moines copistes, puis les lire. Les livres se lisent automatiquement, un par un, dans l'ordre où vous les avez récupérés."
 tog_obj_step3: "Les livres ont parlé : il faut maintenant aller là où l'on priait les anciens dieux.\n(La suite viendra dans une prochaine version.)"
 tog_dest_monastery: "un monastère"
 tog_travel_desc_monastery: "Les livres des moines copistes t'attendent à Jarrow, à Whithorn, à Mynyw, à Dunkeld et à Applecross. Choisis où aller."
 tog_m.talk: "Convaincre le moine."
 tog_m.talk_tt: "Vos chances dépendent de votre diplomatie. En cas d'échec, le moine ne voudra plus vous écouter."
 tog_m.pay: "Payer le moine pour qu'il sorte le livre."
 tog_m.steal: "Voler le livre, de nuit."
 tog_m.force: "Forcer les portes avec mes hommes."
 tog_m.leave: "Partir."
 tog_m.leave_tt: "Vous pourrez revenir plus tard, avec la décision « Voyager vers un monastère »."
 tog_m.pay_good: "Le moine sort le livre sous sa robe."
 tog_m.pay_refused: "Le moine refuse, effrayé : il ne voudra plus de ton argent."
 tog_m.pay_kept: "Le moine prend l'argent et disparaît."
 tog_m.steal_good: "Tu ressors avant l'aube, le livre sous ta chemise."
 tog_m.steal_bad: "Pris sur le fait ! Tu t'enfuis de justesse. Tu pourras retenter ta chance une autre nuit."
 tog_m.force_good: "Les portes cèdent : tu emportes le livre et quelques objets précieux. Le seigneur du lieu ne te le pardonnera pas, et les autres monastères seront sur leurs gardes."
 tog_m.force_bad: "Les moines et leurs serviteurs tiennent bon : vous êtes repoussés. Les autres monastères seront sur leurs gardes."
 tog_m.talk_good: "Le moine te confie le livre."
 tog_m.talk_bad: "Le moine se ferme : il ne te parlera plus."
 tog_m.book_tt: "Vous obtenez le livre. Vous le lirez dans les prochains mois."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "La maison où le vénérable Bède a écrit toute sa vie se dresse au bord de la Tyne, derrière un mur bas. Les Norrois sont déjà passés par ici : une aile est encore noircie par le feu. Au bord du chemin, un jeune moine trie des pommes et te regarde approcher avec curiosité.\n\n« Vous cherchez quelque chose, étranger ? La bibliothèque est derrière le cloître. On dit qu'elle contient tout ce que Bède a lu, et Bède avait tout lu. »"
 tog_quest.0121.t: "L'Histoire ecclésiastique de Bède"
 tog_quest.0121.desc: "#italic Livre rapporté de Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]).#!\n\nTu lis Bède. Il raconte comment les Pictes sont venus de Scythie sur de longs navires, comment ils prenaient leurs rois par les femmes, et comment Colum Cille est allé les baptiser. Dans la vie du saint, tu lis aussi qu'il affrontait chez le roi des Pictes des mages qui commandaient au vent et aux brumes.\n\nEt dans une marge, un frère qui avait voyagé au nord a noté : « les Pictes gravaient sur les pierres des signes que nul ne lit plus ».\n\nTa pierre avait des prêtres."
 tog_quest.0121.a: "Ma pierre avait des prêtres."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "La vieille maison blanche de saint Ninian domine le port. Les moines y sont peu nombreux et ne quittent guère la chapelle ; la bibliothèque donne sur un jardin dont le mur s'effondre par endroits.\n\nÀ la taverne du port, un frère convers boit plus que de raison et se plaint à qui veut l'entendre qu'on ne le paie pas assez."
 tog_quest.0122.t: "Le florilège de Sedulius"
 tog_quest.0122.desc: "#italic Livre rapporté de Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]).#!\n\nC'est un florilège venu de Francie, où un Irlandais de la cour de l'empereur a recopié des pages des Anciens. Un Romain, Pline, raconte que les prêtres des Gaulois, qu'on appelait druides, ne tenaient rien pour plus sacré que le gui et le chêne qui le porte ; qu'ils le cueillaient au sixième jour de la lune, vêtus de blanc, avec une faucille d'or. Un autre dit qu'ils jugeaient les procès, qu'ils apprenaient par cœur pendant vingt ans un nombre immense de vers, et qu'ils enseignaient que les âmes ne meurent pas, mais passent après la mort dans d'autres corps.\n\nLe druide, ce sorcier ridicule des vies de saints, avait été un clergé."
 tog_quest.0122.a: "Les druides étaient un clergé."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "Au bout du pays de Galles, face à la mer, la maison de saint David est entourée de bons murs. Les moines de Mynyw ont trop souvent vu arriver des voiles étrangères : ils te regardent approcher depuis le chemin de ronde, et leurs serviteurs ne lâchent pas leurs bâtons."
 tog_quest.0123.t: "L'Histoire des Bretons"
 tog_quest.0123.desc: "#italic Livre rapporté de Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]).#!\n\nLe livre raconte l'histoire des Bretons : Vortigern, qui avait appelé les Saxons ; la tour qui s'effondrait chaque nuit parce que deux dragons, un rouge et un blanc, se battaient dans ses fondations ; l'enfant sans père qui l'avait deviné ; et un chef de guerre nommé Arthur, vainqueur de douze batailles.\n\nDes héros, pas des dieux. Mais les Bretons aussi ont gardé leurs anciens, et ils les attendent encore."
 tog_quest.0123.a: "Les Bretons attendent encore leurs anciens."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "Au cœur de l'ancien pays picte, Dún Chaillenn garde une partie des reliques de Colum Cille, apportées ici pour les mettre à l'abri des Norrois. Les gardes veillent jour et nuit sur la châsse ; personne ne veille sur la bibliothèque, qui n'est qu'une salle basse au fond du cloître.\n\nUn chien dort en travers de sa porte."
 tog_quest.0124.t: "Le livre gratté"
 tog_quest.0124.desc: "#italic Livre rapporté de Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]).#!\n\nC'est un livre laid, un florilège de plusieurs mains sur un mauvais vélin. Plusieurs pages ont été grattées au couteau pour qu'on puisse écrire des psaumes par-dessus ; en les tenant contre la lumière, tu devines encore les lignes qu'on a voulu effacer.\n\nUn moine y a recopié, sans les commenter, des phrases que ses maîtres avaient laissé passer : Brigit était une déesse que vénéraient les poètes ; Ana avait été la mère des dieux d'Irlande ; les druides allumaient à Beltaine deux feux avec de grandes incantations et y faisaient passer le bétail contre les maladies ; on jurait autrefois par eux, et non par le Christ.\n\nLes rois de l'ancien temps n'avaient pas été des rois. On les avait priés."
 tog_quest.0124.a: "On les avait priés."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "En face des îles, la maison de saint Máel Rubai est petite et pauvre. Un très vieux moine, presque aveugle, garde la bibliothèque : on dit qu'il en connaît chaque livre par cœur, et qu'il ne laisse sortir personne avec le moindre feuillet."
 tog_quest.0125.t: "Le Dindshenchas"
 tog_quest.0125.desc: "#italic Livre rapporté d'Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]).#!\n\nC'est un recueil de lieux : chaque colline, chaque source, chaque pierre de l'ancien temps, avec l'histoire qui explique son nom. La grande maison creuse du Dagda sur la Boyne ; la colline d'Uisneach, au centre de l'Irlande, où Lug était mort ; la pierre de Maponos, sur l'estuaire de la Solway…\n\nLes livres disent que ces dieux ont existé. Pour savoir qui ils étaient vraiment, il faudra aller là où on les priait."
 tog_quest.0125.a: "Il faudra aller sur ces lieux."
 tog_quest.0130.t: "Un culte volé"
 tog_quest.0130.desc: "Tu relis les cinq livres côte à côte. Les noms, tu les connaissais depuis l'enfance : Lug, le Dagda, Brigit, Balor, les Tuatha Dé Danann, la tribu de Dana. Des rois, des ancêtres, des démons, selon qui racontait. Tu découvres qu'ils sont les ruines d'un culte. Un vrai, avec ses dieux, ses lieux, ses prêtres. Et on vous l'a volé.\n\nLes moines ont bâti leurs églises sur les collines où l'on priait avant eux, planté leurs croix sur les pierres, donné à leurs saintes le nom des déesses. Ce qu'ils n'ont pas pu détruire, ils l'ont baptisé ; ce qu'ils n'ont pas pu baptiser, ils l'ont laissé mourir. Et ce qu'ils ont mis à la place sert surtout à faire baisser la tête : obéir au seigneur, payer la dîme, prier dans une langue que personne ne comprend.\n\nLes anciens dieux, eux, étaient d'ici. On vous les a pris. Tu vas les reprendre."
 tog_quest.0130.a: "Je vais reprendre ce qu'on nous a volé."
 tog_quest.0130.a.tt: "Fin de la deuxième étape de la quête. La suite (les lieux sacrés) viendra dans une prochaine version."
 tog_quest.0140.t: "Vers quel monastère ?"
 tog_quest.0140.desc: "Les livres des moines copistes t'attendent dans plusieurs monastères. Lequel veux-tu visiter ?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier])"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier])"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier])"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier])"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier])"
 tog_quest.0140.stay: "Pas maintenant."
 tog_test_skip_step1_decision: "TEST : passer à l'étape 2"
 tog_test_skip_step1_decision_desc: "Décision de test : lance la quête si besoin, ajoute Peredur et Lailoken, et ouvre l'étape 2 (les monastères)."
 tog_test_skip_step1_decision_confirm: "Passer à l'étape 2"
 tog_quest.0161.t: "Une porte fermée"
 tog_quest.0161.desc: "Le moine t'a écouté jusqu'au bout. Puis il a secoué la tête, sans colère, comme on refuse une aumône à un homme qui n'en a pas besoin.\n\n« Je prierai pour vous. » Il a repris son ouvrage et ne t'a plus regardé. Ce n'est pas lui qui te donnera le livre."
 tog_quest.0161.a: "Il faudra trouver un autre moyen."
 tog_quest.0162.t: "Un moine effrayé"
 tog_quest.0162.desc: "À la vue de ta bourse, le moine a pâli. Il a reculé d'un pas, s'est signé, et il est parti presque en courant vers la chapelle.\n\nTon argent ne t'ouvrira pas cette bibliothèque."
 tog_quest.0162.a: "Il faudra trouver un autre moyen."
 tog_quest.0163.t: "Un moine malhonnête"
 tog_quest.0163.desc: "Le moine a pris l'argent, a promis de revenir après complies avec le livre sous sa robe. Tu as attendu toute la nuit derrière le mur.\n\nAu matin, on t'a dit qu'il était parti en pèlerinage. Personne ne sait quand il reviendra."
 tog_quest.0163.a: "Il faudra trouver un autre moyen."
 tog_quest.0164.t: "Pris sur le fait"
 tog_quest.0164.desc: "Tu avais trouvé la bibliothèque, et même le bon coffre. Puis une lanterne s'est levée dans le cloître et une voix a crié au voleur.\n\nTu as sauté le mur de justesse, les mains vides. Les moines vont faire bonne garde quelque temps, mais ils ne pourront pas veiller toutes les nuits."
 tog_quest.0164.a: "Il faudra trouver un autre moyen."
 tog_quest.0165.t: "Repoussés"
 tog_quest.0165.desc: "Les moines ont sonné la cloche avant même que tes hommes atteignent la porte. Les serviteurs, les paysans du domaine et quelques hommes d'armes sont arrivés de partout, avec des fourches, des bâtons et des pierres.\n\nVous avez dû reculer. On parlera de ce jour dans tous les monastères du pays."
 tog_quest.0165.a: "Il faudra trouver un autre moyen."
 tog_quest.0151.t: "Des voiles sur la côte"
 tog_quest.0151.desc: "Au détour d'une baie, trois navires sont tirés sur la grève. Des Norrois. Ils t'ont vu avant que tu les voies, et une dizaine d'hommes remontent déjà la plage vers toi, la hache à la main."
 tog_quest.0151.a: "Se battre."
 tog_quest.0151.a.good: "Les Norrois reculent vers leurs navires ; tu ramasses ce qu'ils ont abandonné."
 tog_quest.0151.a.bad: "Tu t'en sors, mais blessé et la bourse plus légère."
 tog_quest.0151.b: "Leur parler dans leur langue."
 tog_quest.0151.b.good: "Le chef rit de ton accent et te laisse passer."
 tog_quest.0151.b.bad: "Ils te laissent passer, contre un péage."
 tog_quest.0152.t: "Un moine errant"
 tog_quest.0152.desc: "Un moine irlandais marche sur la même route que toi, pieds nus, le bâton à la main. Il est bavard, et il a vite compris que tu ne vas pas prier.\n\n« Vous cherchez de vieilles choses, mon ami. Saviez-vous que le Christ a vaincu tous les dieux des Gaëls ? Discutons-en, la route est longue. »"
 tog_quest.0152.a: "Débattre avec lui."
 tog_quest.0152.a.good: "Le moine finit par se taire, songeur. Tu as appris de ses arguments."
 tog_quest.0152.a.bad: "Il a réponse à tout, et il le fait savoir au prochain village."
 tog_quest.0152.b: "Se taire et le laisser parler."
 tog_quest.0153.t: "La source aux rubans"
 tog_quest.0153.desc: "Au fond d'un vallon, une source sort d'entre les racines d'un vieux frêne. Les branches sont couvertes de rubans, de bouts d'étoffe, de mèches de cheveux. Une croix toute neuve a été plantée à côté, mais les rubans, eux, sont récents aussi.\n\nUne vieille femme y trempe un linge et le noue à une branche en murmurant."
 tog_quest.0153.a: "Lui demander ce qu'elle fait."
 tog_quest.0153.a.good: "Elle te dit des mots que sa grand-mère lui a appris. Tu reconnais un nom de déesse."
 tog_quest.0153.a.bad: "Elle prend peur et s'en va sans rien dire."
 tog_quest.0153.b: "Nouer un ruban, toi aussi."
 tog_quest.0154.t: "Le prêtre et la pierre"
 tog_quest.0154.desc: "Sur la place d'un village, un prêtre fait abattre une pierre levée à coups de masse. Les villageois regardent sans rien dire. Une femme qui avait déposé du lait au pied de la pierre a été attachée à un poteau ; le prêtre annonce qu'elle sera fouettée pour idolâtrie."
 tog_quest.0154.a: "Intervenir, l'épée à la main."
 tog_quest.0154.a.good: "Les hommes du prêtre s'enfuient. La femme est libre, et le village a vu."
 tog_quest.0154.a.bad: "La femme est libérée, mais tu as pris des coups."
 tog_quest.0154.b: "Intervenir avec des mots."
 tog_quest.0154.b.good: "Le prêtre cède devant le village et détache la femme."
 tog_quest.0154.b.bad: "Le prêtre t'humilie devant tout le monde."
 tog_quest.0154.c: "Rester caché et passer son chemin."
 tog_quest.0155.t: "Le raccourci de Peredur"
 tog_quest.0155.desc: "« Je connais un raccourci », a dit Peredur ce matin. Il est maintenant midi, le brouillard est tombé, et vous êtes au milieu d'une tourbière que personne n'a jamais vue.\n\n« C'est par là. Je crois. Enfin, c'était par là avant. »"
 tog_quest.0155.a: "Faire confiance à Peredur."
 tog_quest.0155.a.good: "Contre toute attente, il retrouve le chemin."
 tog_quest.0155.a.bad: "Vous tournez en rond jusqu'au soir."
 tog_quest.0155.b: "Chercher quelqu'un du pays."
 tog_quest.0155.b.good: "Un berger vous remet sur la route."
 tog_quest.0155.b.bad: "Le berger se moque de vous et ne dit rien d'utile."
 tog_quest.0156.t: "Un voleur dans la nuit"
 tog_quest.0156.desc: "Tu te réveilles au milieu de la nuit. Une ombre est penchée sur tes affaires, et ta bourse est déjà dans sa main."
 tog_quest.0156.a: "Le surprendre en silence."
 tog_quest.0156.a.good: "Tu le saisis au collet avant qu'il comprenne ; il s'enfuit sans rien."
 tog_quest.0156.a.bad: "Il t'entend venir et disparaît avec ta bourse."
 tog_quest.0156.b: "Lui sauter dessus."
 tog_quest.0156.b.good: "Il lâche tout et s'enfuit."
 tog_quest.0156.b.bad: "Il a un couteau. Tu es blessé, et il est parti avec ta bourse."
 tog_quest.0157.t: "Le pèlerin malade"
 tog_quest.0157.desc: "Au bord du chemin, un pèlerin est couché sous son manteau, brûlant de fièvre. Il va à Iona, dit-il, mais il n'ira pas plus loin sans aide."
 tog_quest.0157.a: "L'aider."
 tog_quest.0157.a.tt: "Tu le soignes et le mènes jusqu'au prochain village. En chemin, il te parle des saints et des sources de son pays."
 tog_quest.0157.b: "Passer son chemin."
 tog_m.steal_wait: "Les moines font encore bonne garde : il faut attendre quelques mois avant de retenter."
 tog_quest.0171.t: "Le livre confié"
 tog_quest.0171.desc: "Le moine t'a regardé longtemps, puis il est allé jusqu'à la bibliothèque sans un mot. Il en est revenu avec un livre enveloppé dans un linge.\n\n« Rapportez-le quand vous l'aurez lu. Et ne dites à personne que c'est moi. »"
 tog_quest.0171.a: "Je le lirai avec soin."
 tog_quest.0172.t: "Le prix d'un livre"
 tog_quest.0172.desc: "Le moine a compté les pièces deux fois, les a fait disparaître dans sa manche, et t'a donné rendez-vous derrière le mur après complies.\n\nIl est venu, cette fois. Le livre était sous sa robe."
 tog_quest.0172.a: "Tout s'achète, même chez les moines."
 tog_quest.0173.t: "Un livre de moins"
 tog_quest.0173.desc: "Le chien n'a pas aboyé, la porte n'était pas fermée, et le coffre ne l'était qu'à moitié. Tu es ressorti avant l'aube, le livre sous ta chemise.\n\nQuand les moines s'en apercevront, tu seras loin."
 tog_quest.0173.a: "Personne ne m'a vu."
 tog_quest.0174.t: "Les portes ont cédé"
 tog_quest.0174.desc: "La porte a cédé au troisième coup. Les moines se sont réfugiés dans la chapelle en chantant des psaumes, et personne n'a osé s'interposer.\n\nTes hommes ont pris ce qui brillait. Toi, tu as pris le livre. On parlera longtemps de ce jour, et pas en bien."
 tog_quest.0174.a: "Le livre est à moi."
 tog_quest.0158.t: "Le vieux et la pierre"
 tog_quest.0158.desc: "Au réveil, la couverture de Lailoken est vide. On le cherche toute la matinée. Peredur finit par le trouver en haut d'une colline, assis contre une pierre levée, en train de lui parler à voix basse comme à une vieille connaissance.\n\n« Ne fais pas cette tête. Elle ne me répond pas, je ne suis pas fou. Mais quand on parle à une pierre, on finit par entendre ce qu'on pense vraiment. » Il tapote le granit. « Tes moines écrivaient tout parce qu'ils avaient peur d'oublier. Les anciens n'écrivaient rien. Ils avaient confiance en la mémoire. Ce n'est pas dans les livres que tu trouveras les dieux, petit. Les livres te diront seulement où chercher. »"
 tog_quest.0158.a: "« Continue, je t'écoute. »"
 tog_quest.0158.b: "« On t'a cherché toute la matinée ! »"
 tog_quest.0159.t: "Peu d'hivers"
 tog_quest.0159.desc: "Depuis trois jours, Lailoken marche de plus en plus lentement. Ce matin, il est tombé dans la boue et il a mis longtemps à se relever. Il refuse qu'on l'aide.\n\n« Ne t'arrête pas pour moi. Je t'ai dit qu'il me restait peu d'hivers ; je préfère les passer sur la route qu'au coin d'un feu. » Il tousse, longtemps. « Mais si tu pouvais marcher un peu moins vite, je ne dirais pas non. »"
 tog_quest.0159.a: "Ralentir pour lui."
 tog_quest.0159.a.tt: "Vous prenez le temps qu'il faut. Lailoken ne l'oubliera pas."
 tog_quest.0159.b: "Continuer au même pas."
 tog_story_old_groves_books: "Livres lus"
 tog_story_old_groves_books_min: "0"
 tog_story_old_groves_books_max: "5"
 tog_quest.0181.t: "Le compte est bon"
 tog_quest.0181.desc: "Au pont, le péagiste réclame trois deniers par personne et en compte onze pour une troupe de huit. Avant que tu aies ouvert la bouche, Peredur s'avance.\n\n« Huit. Et toi, tu as quarante-deux deniers dans ta bourse, six poules derrière ta maison et il te manque quatre dents. Trois en haut, une en bas. »\n\nLe péagiste referme la bouche très vite."
 tog_quest.0181.a: "« Tu as entendu Peredur. »"
 tog_quest.0181.b: "Payer sans discuter."
 tog_quest.0182.t: "Peredur lit"
 tog_quest.0182.desc: "Le soir, au feu, Peredur a pris un des livres. Il le tient à l'envers, très sérieusement, en fronçant les sourcils.\n\n« Je ne sais pas ce que ça dit. Mais sur cette page il y a mille deux cent quarante-sept lettres, et il y a beaucoup trop de « e ». Ça doit être un livre triste. »"
 tog_quest.0182.a: "Lui apprendre quelques lettres."
 tog_quest.0182.b: "Éclater de rire."
 tog_quest.0183.t: "Le pari du berger"
 tog_quest.0183.desc: "Un berger rentre son troupeau quand vous traversez son village. Il se vante d'avoir le plus grand troupeau du pays, si grand que personne n'a jamais pu le compter. Il parie une bourse que personne ne le fera avant que ses bêtes soient dans l'enclos.\n\nPeredur jette un coup d'œil distrait. « Trois cent dix-huit. Et il y en a une qui boite, celle avec la tache sur l'oreille gauche. » Il réfléchit. « Ou droite. »"
 tog_quest.0183.a: "Parier sur Peredur."
 tog_quest.0183.b: "« On ne parie pas. »"
 trait_tog_dagda_cauldron: "Chaudron du Dagda"
 trait_tog_dagda_cauldron_desc: "Dans le noir du tumulus, le Dagda lui a montré son chaudron, celui dont personne ne repart affamé."
 trait_tog_dagda_club: "Massue du Dagda"
 trait_tog_dagda_club_desc: "Dans le noir du tumulus, le Dagda lui a montré sa massue : un bout tue, l'autre ramène à la vie."
 trait_tog_dagda_harp: "Harpe du Dagda"
 trait_tog_dagda_harp_desc: "Dans le noir du tumulus, le Dagda lui a montré sa harpe, celle qui met les saisons dans l'ordre."
 tog_story_old_groves_places: "Lieux sacrés à visiter"
 tog_obj_places: "Visiter les lieux sacrés dont parlent les livres : Brú na Bóinne, Uisneach et la pierre de Mabon."
 tog_dest_place: "un lieu sacré"
 tog_travel_desc_places: "Les livres parlent de lieux où l'on priait les anciens dieux : la maison du Dagda sur la Boyne, la colline d'Uisneach, la pierre de Mabon. Choisis où aller."
 tog_p.leave_tt: "Vous pourrez revenir plus tard, avec la décision de voyage de la quête."
 tog_test_skip_step2_decision: "TEST : Commencer à l'étape 3"
 tog_test_skip_step2_decision_desc: "Décision de test, à retirer avant publication : saute les étapes 1 et 2 si besoin et ouvre directement l'étape 3."
 tog_quest.0240.t: "Vers quel lieu sacré ?"
 tog_quest.0240.desc: "Les livres t'ont donné des noms de lieux. Lequel veux-tu voir ?"
 tog_quest.0240.bru: "Brú na Bóinne, la maison du Dagda ([GetTitleByKey('b_drogheda').GetNameNoTier])"
 tog_quest.0240.uisneach: "La colline d'Uisneach ([GetTitleByKey('b_uisneach').GetNameNoTier])"
 tog_quest.0240.mabon: "La pierre de Mabon ([GetTitleByKey('b_dumfries').GetNameNoTier])"
 tog_quest.0240.mabon_locked: "Il faut d'abord avoir vu Brú na Bóinne et Uisneach"
 tog_quest.0201.t: "La maison du Dagda"
 tog_quest.0201.desc: "Le tumulus est plus grand que tout ce que tu as vu bâtir par des hommes : une colline ronde cerclée de grandes pierres couvertes de spirales. Les Norrois de Dublin sont passés par là ; on voit encore les tranchées qu'ils ont creusées pour chercher de l'or.\n\nUn berger, Eógan, garde ses moutons au pied de la colline. Il tient les vieilles histoires de son grand-père ; le prêtre lui a défendu de les raconter, et de toute façon personne ne lui en demande jamais. Toi, tu lui en demandes. Alors il raconte : c'est ici que vivait le Dagda, le bon dieu, avec son chaudron, sa massue et sa harpe, jusqu'à ce que son fils Óengus lui prenne la maison par une ruse, « un jour et une nuit », qui voulaient dire toujours.\n\n« Ceux qui dormaient dedans, autrefois, en ressortaient avec des visions. Personne ne l'a fait depuis le temps de mon grand-père. »"
 tog_quest.0201.a: "Passer la nuit dans le tumulus."
 tog_quest.0202.t: "La nuit dans le tumulus"
 tog_quest.0202.desc: "Eógan t'a montré l'entrée, puis il s'est assis dehors, contre une pierre. Le couloir est étroit, si bas qu'il faut avancer courbé. Au fond, le noir est complet.\n\nLe froid monte du sol. Au bout d'un moment, tu ne sais plus si tu as les yeux ouverts ou fermés. Il y a des bruits : de l'eau qui goutte, peut-être, ou quelqu'un qui respire."
 tog_quest.0202.a: "Tenir jusqu'au matin."
 tog_quest.0202.good: "Tu gardes la tête claire : tu comprends ce que tu vis."
 tog_quest.0202.bad: "La peur te tient toute la nuit."
 tog_quest.0203.t: "La vision"
 tog_quest.0203.desc: "Vers la fin de la nuit, il y a quelqu'un avec toi dans la chambre. Un homme immense, ventru, vêtu d'une tunique trop courte, qui rit doucement dans le noir. Il pose devant toi trois choses : un chaudron qui ne se vide jamais, une massue dont un bout tue et l'autre ramène à la vie, une harpe qui met les saisons dans l'ordre.\n\n« Prends-en une. Une seule. »"
 tog_quest.0203.a: "Le chaudron."
 tog_quest.0203.b: "La massue."
 tog_quest.0203.c: "La harpe."
 tog_quest.0204.t: "Le matin"
 tog_quest.0204.desc: "Quand tu ressors, la lumière te fait mal aux yeux. Eógan est toujours là, contre sa pierre, son manteau sur les épaules. Il n'a pas dormi.\n\nIl te regarde longtemps. « Tu as vu quelque chose. Ça se voit. » Il se lève, ramasse son bâton. « Toute ma vie, j'ai raconté ces histoires sans savoir si j'y croyais. Je veux voir la suite. Et puis il faut bien quelqu'un pour te les raconter toutes, si tu dois les écrire. »"
 tog_quest.0204.a: "« Viens. »"
 tog_quest.0204.a.tt: "#V Eógan#! rejoint la quête."
 tog_quest.0211.t: "La colline d'Uisneach"
 tog_quest.0211.desc: "La colline n'est pas haute, mais de son sommet on voit l'Irlande entière, disait-on autrefois. Le vent couche l'herbe. Il n'y a personne, seulement des moutons et, ici et là, des choses que les hommes ont laissées : une grande pierre fendue, une terre noircie, un vieux puits.\n\nLes livres disaient que c'était le centre, et que Lug était mort ici. Mais ils ne disaient pas comment lire ce que l'on trouve sur place."
 tog_quest.0211.a: "Examiner les signes."
 tog_quest.0212.t: "La pierre fendue"
 tog_quest.0212.desc: "Un énorme bloc de calcaire, fendu en plusieurs morceaux, comme si quelque chose l'avait brisé de l'intérieur. Les gens du pays l'appellent la pierre des divisions. Que veut-elle dire ?"
 tog_quest.0212.a: "Le centre : les provinces s'y rejoignent, et Lug y est enterré."
 tog_quest.0212.b: "La foudre du Dieu chrétien, qui a brisé une idole."
 tog_quest.0212.c: "Une borne de partage entre deux fermes."
 tog_quest.0213.t: "La terre noircie"
 tog_quest.0213.desc: "Sur une large surface, la terre est noire, mêlée d'os brûlés et de charbon, couche après couche, comme si l'on y avait allumé de grands feux pendant des siècles. Pourquoi ?"
 tog_quest.0213.a: "Un village brûlé par les Norrois."
 tog_quest.0213.b: "Le feu d'un saint, comme celui de Patrick à Slane."
 tog_quest.0213.c: "Les feux de Beltaine, entre lesquels on faisait passer le bétail."
 tog_quest.0214.t: "Le puits"
 tog_quest.0214.desc: "Un vieux puits, presque comblé, entouré de pierres plates usées par les genoux. On y a jeté des épingles, des pièces, des petits os. Que cherchait-on au fond ?"
 tog_quest.0214.a: "Un puits béni par un saint, pour guérir."
 tog_quest.0214.b: "Une porte vers l'Autre monde, où passent les âmes."
 tog_quest.0214.c: "Une simple réserve d'eau pour les moutons."
 tog_u.wrong_tt: "Une mauvaise lecture : une faute envers le dieu du lieu. Il faut recommencer depuis le premier signe."
 tog_quest.0215.t: "Une fausse piste"
 tog_quest.0215.desc: "Tu tournes l'idée dans ta tête, et elle ne tient pas. Rien dans les livres ne va dans ce sens. Tu as regardé ce lieu avec les yeux d'un moine, pas avec ceux des anciens, et tout ce que tu croyais avoir compris s'effondre avec.\n\nLe vent souffle plus fort, comme un reproche. Il faut tout reprendre depuis le début."
 tog_quest.0215.a: "Reprendre depuis la pierre fendue."
 tog_quest.0216.t: "Lug aux mille arts"
 tog_quest.0216.desc: "Assis au pied de la pierre fendue, tu rassembles ce que tu as compris.\n\nLe recueil des lieux d'Applecross le disait : Uisneach est le centre de l'Irlande, là où les provinces se rejoignent, et Lug y est mort ; la pierre fendue marque sa tombe. Lug est le roi qui rassemble.\n\nLe livre gratté de Dunkeld le disait : à Beltaine, les druides allumaient deux grands feux et faisaient passer le bétail entre eux contre les maladies, et on les a allumés ici pendant des siècles. Lug est la lumière qui protège.\n\nLes Anciens recopiés à Whithorn le disaient : les âmes ne meurent pas, elles passent. Le puits est une porte, et ce qu'on y jetait était pour ceux de l'autre côté. Lug va et vient entre les mondes.\n\nTrois visages d'un même dieu. Les livres disaient qu'il avait demandé à entrer à Tara en se présentant comme charpentier, forgeron, harpiste, guerrier, poète, médecin, et qu'on l'avait laissé entrer parce que personne d'autre ne savait tout faire. Le dieu de tous les arts. Le plus grand d'entre eux, peut-être."
 tog_quest.0216.a: "Lug est le plus grand."
 tog_quest.0221.t: "La pierre de Mabon"
 tog_quest.0221.desc: "Te voilà enfin au bord de la Solway, dans le village où, d'après les livres, se dresse la pierre de Mabon. Sur la place, quelques maisons basses entourent un puits ; des femmes lavent du linge, des enfants courent après une oie, et tout le monde se tait quand tu passes.\n\nDe la place, on voit la pierre : elle se dresse seule dans un champ, au bout du village, plus haute qu'un homme. Quand tu demandes son nom, les villageois disent qu'elle n'en a pas, que c'est une pierre comme une autre, et ils détournent les yeux. Mais il y a du lait frais dans le creux à son pied.\n\nAu bout du champ, un homme du seigneur mesure la terre avec une corde. Une vieille femme te souffle, sans te regarder : « Il veut nous prendre le champ pour une dette. Le champ de la pierre. »"
 tog_quest.0221.a: "Proposer ton aide."
 tog_quest.0222.t: "La dette"
 tog_quest.0222.desc: "La dette est ancienne, gonflée par les intérêts, et l'intendant du seigneur chrétien ne cache pas que c'est la pierre qui l'intéresse : son maître veut l'abattre et bâtir une chapelle à la place.\n\nSi le champ est perdu, la pierre aussi."
 tog_quest.0222.a: "Payer la dette."
 tog_quest.0222.b: "Négocier avec l'intendant."
 tog_quest.0222.c: "Falsifier la reconnaissance de dette."
 tog_quest.0223.t: "Le délateur"
 tog_quest.0223.desc: "Le champ est sauvé. Le soir même, les villageois viennent te trouver : ils t'invitent au rite de la prochaine lune, au pied de la pierre, et te disent que le gardien veut te voir.\n\nMais la veille du rite, tu surprends Aedán, un jeune du village, qui selle un cheval à la nuit tombée. Il va chez le prêtre. Il dit que ce que vous faites est un péché, et qu'il ne veut pas brûler avec vous. Les villageois te regardent : ils attendent de voir ce que tu vas faire."
 tog_quest.0223.a: "Le convaincre de rester."
 tog_quest.0223.b: "Acheter son silence."
 tog_quest.0223.c: "L'effrayer."
 tog_quest.0223.d: "Le faire disparaître."
 tog_quest.0223.d.tt: "Aedán ne parlera à personne. Les villageois ne l'oublieront pas."
 tog_quest.0222.d: "Intimider l'intendant."
 tog_quest.0224.t: "Le gardien"
 tog_quest.0224.desc: "À la nouvelle lune, ils sont une vingtaine autour de la pierre, avec des lanternes voilées. Un homme s'avance, Gwion, le gardien. Son père gardait la pierre avant lui, et le père de son père. Il verse le lait, dit des mots dans une langue que personne ne comprend plus, et pour la première fois, tu entends prononcer le nom du dieu du lieu : Maponos, le fils divin, le jeune chasseur.\n\nAprès le rite, tu veux lui parler. Il te tourne le dos. « Tu as sauvé le champ, et je t'en remercie. Mais je ne parle pas des dieux aux étrangers. Le dernier étranger qui est venu ici, c'était le prêtre. »\n\nLa vieille femme te prend à part. Le prêtre a emmené la fille de Gwion, Eluned, au couvent du val, pour la sauver du paganisme de son père. Depuis, Gwion ne parle presque plus à personne. Elle est sa seule enfant ; c'est à elle qu'il devait apprendre les prières."
 tog_quest.0224.a: "Faire sortir Eluned du couvent."
 tog_quest.0224.a.tt: "Un complot commence pour libérer #V Eluned#!. À chaque étape du complot, une tentative : ses chances dépendent de votre intrigue et de vos agents."
 tog_free_daughter: "Libérer Eluned"
 tog_free_daughter_action: "Libérer"
 tog_free_daughter_desc: "Je vais faire sortir [SCHEME.GetTargetCharacter.GetShortUIName] du couvent où le prêtre l'a enfermée, pour la rendre à son père."
 tog_free_daughter_desc_general: "Faire sortir la fille de Gwion du couvent où le prêtre l'a enfermée."
 TOG_FREE_DAUGHTER_SUCCESS_DESC: "Eluned retrouvera son père, et Gwion acceptera de parler."
 tog_obj_daughter: "Faire sortir Eluned, la fille de Gwion, du couvent."
 tog_obj_learning: "Apprendre auprès de Gwion ce que ses ancêtres ont gardé."
 tog_quest.0230.t: "Une tentative manquée"
 tog_quest.0230.desc: "Tout était prêt : la corde, le cheval, la sœur portière achetée. Mais cette nuit-là, l'abbesse a veillé tard dans la chapelle, et il a fallu renoncer.\n\nLes sœurs se méfient un peu plus. Il faudra recommencer."
 tog_quest.0230.a: "La prochaine fois."
 tog_quest.0230.a.tt: "Le complot continue : une nouvelle tentative aura lieu à la prochaine étape."
 tog_quest.0232.t: "Eluned"
 tog_quest.0232.desc: "Eluned est passée par-dessus le mur du couvent à l'heure de matines, dans un manteau trop grand. Au matin, elle est au village, et Gwion la serre contre lui sans rien dire pendant un long moment.\n\nLe soir, il vient s'asseoir près de ton feu. « Tu as sauvé le champ. Tu m'as rendu ma fille. Un étranger ne fait pas ça pour rien. Qu'est-ce que tu cherches ? »\n\nAlors tu lui racontes : la pierre aux signes dans la bruyère de Skye, les livres volés aux moines, la nuit dans la maison du Dagda, les signes d'Uisneach. Que les dieux dont ses ancêtres gardaient le nom avaient eu des prêtres, des fêtes, des lieux, et qu'on vous les a pris. Que tu veux savoir qui ils étaient vraiment.\n\nGwion t'écoute sans t'interrompre. Puis il dit, lentement : « Je t'ai vu en rêve, avant que tu viennes. Un homme qui venait de l'ouest avec des livres sous le bras. Je ne savais pas ce que ça voulait dire. » Il regarde les maisons du village. « Ils étaient cent du temps de mon grand-père. Ils sont vingt. Quand je mourrai, il n'y aura plus personne pour dire les prières, sauf Eluned, et le prêtre la reprendra. Mes ancêtres ont gardé la pierre en attendant quelque chose. Je crois que c'est toi. Tu as les livres ; moi, j'ai les mots qu'on disait aux dieux. Emmène-nous, ma fille et moi, et je t'apprendrai tout ce que je sais. »"
 tog_quest.0232.a: "« Tes prières ne mourront pas avec toi. »"
 tog_quest.0232.a.tt: "#V Gwion#! rejoint la quête, avec sa fille #V Eluned#!. Les mois suivants, il vous enseignera ce qu'il sait."
 tog_quest.0233.t: "Le fils de la Mère"
 tog_quest.0233.desc: "Le soir, Gwion commence par le dieu de sa pierre. Maponos est le fils de Modron, la Mère. On l'a enlevé à sa mère quand il avait trois nuits, et personne ne savait où il était, jusqu'à ce que les plus vieux animaux du monde, le merle, le cerf, le hibou, l'aigle et le saumon, mènent ceux qui le cherchaient jusqu'à sa prison.\n\n« C'est le dieu jeune, celui qu'on délivre. Les Romains eux-mêmes l'ont prié, le long de leur mur ; ils l'appelaient Apollon, parce qu'ils voulaient que tous les dieux soient les leurs. »"
 tog_quest.0233.lailoken: "\n\nLailoken, qui s'est rapproché du feu, demande lequel des cinq animaux était le plus vieux. « Le saumon », répond Gwion. Le vieux hoche la tête, satisfait, comme s'il le savait déjà."
 tog_quest.0233.a: "Le dieu qu'on délivre."
 tog_quest.0234.t: "Les quatre portes"
 tog_quest.0234.desc: "« L'année a quatre portes », dit Gwion. Samain, quand l'été meurt et que les morts reviennent s'asseoir près du feu ; on leur laisse une place et de quoi manger. Imbolc, quand les brebis ont leur lait, la fête de Brigit. Beltaine, et ses deux feux entre lesquels on fait passer les bêtes. Lugnasad, à la moisson, la fête de Lug, où l'on fait des jeux et des mariages pour un an et un jour.\n\n« Les moines ont gardé les dates. Ils ont seulement changé les noms. »"
 tog_quest.0234.lailoken: "\n\nLailoken rit tout bas. Dans sa vallée, dit-il, on éteint encore tous les feux la veille de Samain, et personne ne sait plus pourquoi. Gwion le lui explique, et le vieux reste longtemps silencieux."
 tog_quest.0234.a: "Les moines ont changé les noms."
 tog_quest.0235.t: "Les serments et les pierres"
 tog_quest.0235.desc: "Gwion t'apprend comment on jurait autrefois : par les dieux de son peuple, la main sur la pierre, devant témoins. Celui qui manquait à son serment était chassé des sacrifices. Personne ne lui parlait plus, personne ne mangeait avec lui. C'était pire que la mort.\n\nEt les pierres levées ne sont pas des tombes, ou pas seulement. « On y venait pour parler à ceux d'en dessous. Ta pierre de la bruyère, celle avec les signes, elle parlait. Il faut seulement réapprendre à l'entendre. »"
 tog_quest.0235.lailoken: "\n\nLailoken pose la main sur le genou de Gwion. « C'est ce que je lui ai dit, il y a longtemps, que sa pierre était un texte. » Gwion le regarde avec respect pour la première fois."
 tog_quest.0235.a: "Réapprendre à l'entendre."
 tog_quest.0236.t: "Les prières"
 tog_quest.0236.desc: "Pendant des semaines, Gwion te dit les prières, une à une, dans la langue que personne ne comprend plus, en te faisant répéter jusqu'à ce que tu les saches. « Ce ne sont pas les mots qui comptent. C'est qu'on continue de les dire. »\n\nLe dernier soir, il te parle d'une chose que son grand-père lui racontait. Bien avant les moines, les Romains ont traversé la mer et vaincu les peuples du continent dans une grande bataille, sur une colline où l'on dit que les dieux des Gaulois ont perdu. Mais il y avait un village, au bord de la mer, qui leur a tenu tête bien plus longtemps que les autres. « Personne ne sait où était la colline. Le village, on dit qu'il est en Armorique. Si quelque chose est resté des anciens, c'est là-bas. »"
 tog_quest.0236.lailoken: "\n\nLailoken a appris les prières en même temps que toi. Il les marmonne en marchant, et il se trompe souvent, mais il ne s'arrête jamais."
 tog_quest.0236.a: "Il faudra aller voir."
 trait_tog_awen: "L'Awen"
 trait_tog_awen_desc: "Le don : l'inspiration des poètes et des prophètes. Certains de ses rêves se réalisent."
 TOG_COMPANION_HELPS: "Compagnon de la quête : aide sans contrepartie"
 tog_quest.0231.t: "Une nuit sans lune"
 tog_quest.0231.desc: "Tout est prêt : la corde, le cheval caché dans le bois, tes compagnons à leur poste autour du couvent. La nuit est noire, les sœurs vont bientôt se lever pour matines.\n\nC'est peut-être le bon moment. Ou peut-être pas."
 tog_quest.0231.a: "Tenter votre chance."
 tog_quest.0231.b: "Utiliser un avantage."
 tog_quest.0231.b.tt: "Dépense 1 avantage : +20 % de chances pour cette tentative."
 tog_quest.0231.c: "Utiliser deux avantages."
 tog_quest.0231.c.tt: "Dépense 2 avantages : +40 % de chances pour cette tentative."
 tog_quest.0231.d: "Attendre une meilleure nuit."
 tog_quest.0231.d.tt: "Pas de tentative cette fois : le complot continue jusqu'à la prochaine occasion."
 tog_quest.0251.t: "La sœur portière"
 tog_quest.0251.desc: "La sœur portière est vieille, pauvre, et elle n'aime pas l'abbesse. Elle a laissé entendre à Lailoken, qui faisait l'aumône à la porte, qu'une porte peut rester mal fermée une nuit ou deux, si l'on y met le prix. Ou si l'on sait lui parler."
 tog_quest.0251.a: "Lui glisser quelques pièces."
 tog_quest.0251.b: "Gagner sa confiance."
 tog_quest.0251.c: "Trop risqué."
 tog_quest.0252.t: "L'abbesse se méfie"
 tog_quest.0252.desc: "L'abbesse a remarqué des étrangers autour du couvent. Elle a fait poser une nouvelle serrure à la porte du dortoir des novices, et une sœur veille désormais toute la nuit."
 tog_quest.0252.a: "Brouiller les pistes."
 tog_quest.0252.a.tt: "Dépense 1 avantage : la méfiance de l'abbesse retombe."
 tog_quest.0252.b: "On fera avec."
 tog_quest.0253.t: "Un message d'Eluned"
 tog_quest.0253.desc: "Une petite novice, au marché, t'a glissé un bout de parchemin dans la main sans te regarder. C'est d'Eluned. Elle sait qu'on vient la chercher. Elle dit quelle fenêtre ne ferme pas, et à quelle heure la sœur qui veille s'endort."
 tog_quest.0253.a: "Elle est prête."
 tog_quest.0254.t: "Peredur compte"
 tog_quest.0254.desc: "Tu as envoyé Peredur repérer les lieux, discrètement. Il est revenu ravi. « Quarante-trois fenêtres, sept portes, deux cent douze pierres dans le mur du jardin. » Il marque une pause. « J'ai compté à voix haute. Il y avait une sœur. Elle m'a demandé pourquoi. »"
 tog_quest.0254.a: "Laisser Lailoken arranger ça."
 tog_quest.0254.a.tt: "Lailoken va trouver la sœur et lui explique que le garçon est simple d'esprit et qu'il compte tout, même les étoiles. C'est presque vrai. Personne ne se méfie."
 tog_quest.0254.b: "Trop tard."
 tog_portress_bought_modifier: "Sœur portière complice"
 tog_abbess_wary_modifier: "Abbesse sur ses gardes"
 tog_eluned_message_modifier: "Message d'Eluned"
 tog_peredur_blunder_modifier: "Peredur a compté à voix haute"
 tog_story_old_groves_lessons: "Enseignements de Gwion"
 tog_story_old_groves_lessons_max: "4"
 trait_tog_awen_protected: "L'Awen"
 trait_tog_awen_protected_desc: "Le don : l'inspiration des poètes et des prophètes. Certains de ses rêves se réalisent."
 trait_tog_novice: "Novice"
 trait_tog_novice_desc: "Enfermée au couvent par le prêtre, pour la sauver du paganisme de son père."
 tog_free.success_tt: "faire sortir #V Eluned#! du couvent (en cas d'échec, le complot continue)"
 tog_quest.0229.t: "Tout est à refaire"
 tog_quest.0229.desc: "Le plan pour faire sortir Eluned est tombé à l'eau. Gwion attend toujours sa fille, et il ne te parlera pas tant qu'elle sera au couvent."
 tog_quest.0229.a: "Reprendre le complot."
 tog_quest.0236.a.tt: "Fin de l'apprentissage. La quête continue sur le continent, en Armorique."
 tog_obj_village: "Traverser la mer jusqu'en Armorique et trouver le village qui a résisté aux Romains, au bout d'un cap près de #V [GetTitleByKey('b_saint_brieuc').GetNameNoTier]#!."
 tog_obj_heric: "Trouver où était la colline de la grande bataille. On dit qu'un moine d'Auxerre, #V [GetTitleByKey('b_auxerre').GetNameNoTier]#!, connaît tous les livres des Anciens."
 tog_obj_alise: "Se rendre sur la colline d'Alise, près de #V [GetTitleByKey('b_montbard').GetNameNoTier]#!, là où les dieux des Gaulois ont perdu."
 tog_obj_step6: "La serpe d'or et la trompe de guerre sont dans ton trésor.\n(La suite viendra dans une prochaine version.)"
 tog_dest_village: "le village d'Armorique"
 tog_dest_heric: "Auxerre"
 tog_dest_alise: "Alise"
 tog_travel_desc_village: "Un village au bord de la mer a tenu tête aux Romains plus longtemps que tous les autres. Gofraid connaît la côte : c'est en Armorique, au bout d'un cap."
 tog_travel_desc_heric: "Personne en Gaule ne sait où était la colline de la grande bataille. Personne, sauf peut-être un moine d'Auxerre qui a lu tous les livres des Anciens."
 tog_travel_desc_alise: "Héric a parlé d'une colline plate au-dessus du village d'Alise, à deux jours d'Auxerre."
 tog_quest.0301.t: "Le pilote"
 tog_quest.0301.desc: "Pour traverser jusqu'en Armorique, il faut quelqu'un qui connaisse les courants, les écueils et les ports où l'on ne pose pas de questions. Au port, on t'indique Gofraid : un Gall-Goídil, moitié norrois et moitié gaël, qui a navigué de Dublin à la Loire et n'a jamais perdu un navire.\n\nIl t'écoute raconter ce que tu cherches en se curant les dents avec un couteau. « Un village qui n'a jamais payé les Romains ? » Il sourit. « Mes ancêtres non plus n'aimaient pas payer. »"
 tog_quest.0301.a: "« Viens pour l'histoire. »"
 tog_quest.0301.b: "« Viens pour l'argent. »"
 tog_quest.0301.join_tt: "#V Gofraid#! rejoint la quête. Le navire part pour l'Armorique."
 tog_quest.0311.t: "Le village du cap"
 tog_quest.0311.desc: "Un vieux pêcheur de la côte, Riwal, connaissait l'endroit : au bout d'un cap, sur la côte nord, battu par le vent. En travers de sa base, un énorme rempart de terre à moitié effondré coupe la lande d'une mer à l'autre ; les gens du pays l'appellent le fossé de César, alors qu'il est bien plus vieux que César. Derrière, sur le plateau, il ne reste du village que des cercles de pierres là où étaient les maisons, et des tas de cendre envahis d'herbe.\n\nOù creuser ?"
 tog_quest.0311.a: "Au pied du rempart."
 tog_quest.0311.b: "Dans les tas de cendre."
 tog_quest.0311.c: "Dans les cercles des maisons."
 tog_quest.0311.d: "Sous le foyer de la plus grande maison."
 tog_quest.0312.t: "Rien ici"
 tog_quest.0312.desc: "Vous creusez jusqu'au soir. Des tessons, des os de sanglier, des cailloux. Rien qui vaille la peine. Gwion trouve que c'est un drôle de culte, de gratter la terre comme un cochon."
 tog_quest.0312.a: "Creuser ailleurs."
 tog_quest.0313.t: "La serpe d'or"
 tog_quest.0313.desc: "Sous la pierre du foyer de la plus grande maison, il y a une lame d'or. Un croissant mince, large comme la main au milieu et effilé aux pointes, gravé de fins chevrons, si vieux que les bords en sont usés.\n\nTu la tiens longtemps dans la lumière. Tu penses à la page de Pline : avec une faucille d'or. Tu sais qu'un croissant de feuille d'or ne coupe rien. Tu sais aussi que tu tiens le même croissant que celui qui est gravé sur ta pierre, dans les îles, au-dessus des deux cercles.\n\nRiwal dit simplement que ceux d'ici n'ont jamais payé personne, ni les Romains, ni les Francs, et qu'il espère bien qu'ils ne paieront jamais les Norrois non plus."
 tog_quest.0313.a: "Le croissant de ma pierre."
 tog_quest.0313.a.tt: "La #V serpe d'or#! rejoint ton trésor. La quête continue vers Auxerre."
 tog_golden_sickle_name: "La serpe d'or"
 tog_golden_sickle_description: "Un mince croissant d'or gravé de chevrons, trouvé sous le foyer d'un village d'Armorique qui avait tenu tête aux Romains. Pline disait que les druides cueillaient le gui avec une faucille d'or."
 tog_quest.0321.t: "Celui qui sait"
 tog_quest.0321.desc: "Tu ne peux pas entrer à Saint-Germain. Tu attends à la porte de l'abbaye, trois jours, en disant à qui veut l'entendre que tu viens de Bretagne au-delà de la mer pour parler de César. Le troisième jour, le moine sort. Il s'appelle Héric. Il a la trentaine, les yeux fatigués de ceux qui lisent la nuit, et une curiosité qu'aucune règle ne retient. Vous parlez tout un après-midi, assis sur un muret, en latin.\n\nHéric connaît le siège. César l'a raconté : Alésia, la ville sur la colline, encerclée de deux lignes de remparts, et Vercingétorix qui jette ses armes aux pieds du proconsul. Et Héric pense savoir où c'était : à deux jours d'ici, au-dessus du village d'Alise. Le nom a à peine changé en neuf siècles. Il l'écrit dans ses vers.\n\n« Tu cherches les dieux des Gaulois, dit-il en te quittant. Tu ne les trouveras pas là-bas. Tu trouveras l'endroit où ils ont perdu. »"
 tog_quest.0321.a: "« C'est déjà beaucoup. »"
 tog_quest.0321.a.tt: "La quête continue vers Alise."
 tog_quest.0331.t: "Là où ils ont perdu"
 tog_quest.0331.desc: "Le mont Auxois est une colline plate, couverte de champs et de vignes. En bas, dans la plaine, un paysan laboure. Quand tu lui demandes s'il trouve des choses dans la terre, il montre un tas de ferraille au bord du champ : des pointes de flèches, des clous, des morceaux de bronze. Et au milieu, une tête de sanglier en bronze, la gueule ouverte, montée sur un long tube tordu. Une trompe de guerre.\n\nLe paysan s'appelle Ursin. Toute sa vie, il a sorti ces débris de son champ en les maudissant parce qu'ils ébréchaient le soc de sa charrue. Il te regarde soulever sa ferraille comme un prêtre soulève une relique. Il demande s'il peut souffler dedans. Il ne sort qu'un râle, mais il y a dans ses yeux quelque chose qui n'y était pas le matin.\n\nLe lendemain, il a laissé son champ à son frère et marche derrière vous, la trompe sur l'épaule."
 tog_quest.0331.a: "« Garde-la. Tu apprendras à en jouer. »"
 tog_quest.0331.a.tt: "Le #V carnyx gaulois#! rejoint ton trésor et #V Ursin#! rejoint la quête. Fin de la cinquième étape. La suite viendra dans une prochaine version."
 tog_carnyx_name: "Carnyx gaulois"
 tog_carnyx_description: "Une trompe de guerre gauloise, un carnyx, à tête de sanglier en bronze, sortie d'un champ au pied de la colline où les Gaulois se sont rendus aux Romains."
 tog_golden_sickle_modifier: "Serpe d'or"
 tog_carnyx_modifier: "Carnyx gaulois"
 tog_test_skip_step4_decision: "TEST : Commencer à l'étape 5"
 tog_test_skip_step4_decision_desc: "Décision de test, à retirer avant publication : saute les étapes précédentes si besoin et ouvre directement l'étape 5 (le continent)."
