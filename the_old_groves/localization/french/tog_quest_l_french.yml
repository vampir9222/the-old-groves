l_french:
 tog_story_old_groves: "Les Anciens Bosquets"
 tog_story_old_groves_desc: "Une pierre gravée de signes que personne ne sait lire. Des livres recopiés par des moines qui détestaient ce qu'ils écrivaient. Quelque part, sous les récits, dort le culte des anciens."
 tog_story_old_groves_info: "[Story.Custom('TogQuestObjective')]"
 tog_story_old_groves_companions: "Compagnons"
 tog_story_old_groves_destination: "Destination"
 tog_obj_stone: "Se rendre auprès de la pierre, à #V [GetTitleByKey('b_skye').GetNameNoTier]#!, et la copier."
 tog_obj_wrong: "Suivre Peredur jusqu'au vieux, à #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!."
 tog_obj_house: "Trouver le vrai vieux, à #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!."
 tog_obj_camp: "Délivrer le vieux, prisonnier des bandits dans les collines de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_dest_stone: "l'île de [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_dest_wrong: "[GetTitleByKey('b_gairloch').GetNameNoTier]"
 tog_dest_house: "[GetTitleByKey('b_ardnamurchon').GetNameNoTier]"
 tog_quest_start_decision: "Étudier la pierre"
 tog_quest_start_decision_desc: "On parle d'une pierre étrange dans l'île de [GetTitleByKey('b_skye').GetNameNoTier], gravée de signes que personne ne sait lire."
 tog_quest_start_decision_tooltip: "La quête des Anciens Bosquets commence."
 tog_quest_start_decision_confirm: "Partir pour [GetTitleByKey('b_skye').GetNameNoTier]"
 tog_quest_start_decision_effect_tt: "La quête des #V Anciens Bosquets#! commence. Tu peux la suivre dans la fenêtre des #V Situations#!."
 tog_quest_travel_decision: "Voyager vers [ROOT.Char.Custom('TogTravelTarget')]"
 tog_quest_travel_decision_desc: "[ROOT.Char.Custom('TogTravelDesc')]"
 tog_quest_travel_decision_tooltip: "Tu prends la route de la prochaine étape de la quête."
 tog_quest_travel_decision_not_there: "Tu es déjà sur place."
 tog_quest_travel_decision_effect_tt: "Tu pars pour la prochaine étape. Si tu es aventurier, ton camp te suit."
 tog_poi_stone: "La pierre gravée"
 tog_poi_stone_desc: "Une pierre picte renversée dans la bruyère, couverte de signes que personne ne sait lire."
 tog_quest.0001.t: "L'Apostat"
 tog_quest.0001.desc: "Autrefois, on t'appelait frère Máel Brigte. Chez les moines d'Iona, tu as appris à lire, tu as chanté les psaumes et tu as cru ce qu'on te disait de croire. Puis les Norrois sont venus. Les reliques n'ont arrêté aucun navire. Les prières n'ont sauvé aucun frère. Les abbés sont partis à l'abri avec les livres. Toi, tu es resté.\n\nAujourd'hui, les Gaëls des îles t'appellent Dubgall, l'étranger sombre. Tu lèves la corne aux fêtes des Norrois sans y croire. Une question ne te quitte plus : si le dieu des moines n'a pas su protéger les siens, que reste-t-il à croire ?\n\nCe matin, en montant sur la lande pour guetter les voiles, tu as trouvé autre chose. Dans la bruyère, une pierre renversée porte des signes que tu n'as jamais vus : un croissant, une flèche brisée, deux cercles reliés. Ce ne sont pas des lettres. Ce sont des images, gravées avec trop de soin pour n'être qu'un décor."
 tog_quest.0001.a: "Je dois comprendre ce que disent ces signes."
 tog_quest.0001.a.tt: "La quête des #V Anciens Bosquets#! commence. Tu peux la suivre dans la fenêtre des #V Situations#!."
 tog_quest.0001.b: "Ce n'est qu'une vieille pierre."
 tog_quest.0001.b.tt: "Tu pourras revenir à la pierre avec la décision « Étudier la pierre »."
 tog_quest.0002.t: "Une pierre dans les îles"
 tog_quest.0002.desc: "Un marchand de passage t'a parlé d'une pierre étrange, au nord, dans l'île de [GetTitleByKey('b_skye').GetNameNoTier]. Elle est couchée dans la bruyère, au-dessus d'une baie. Elle porte des signes que personne ne sait lire, ni chez les Gaëls ni chez les Norrois. Ce ne sont pas des lettres, a-t-il dit, ce sont des images : un croissant, une flèche brisée, deux cercles reliés.\n\nDepuis, ces signes ne te sortent plus de la tête."
 tog_quest.0002.a: "Je dois voir cette pierre."
 tog_quest.0002.a.tt: "La quête des #V Anciens Bosquets#! commence. Tu prends la route de #V [GetTitleByKey('b_skye').GetNameNoTier]#!."
 tog_quest.0003.t: "La pierre"
 tog_quest.0003.desc: "La pierre est couchée dans la bruyère, au-dessus de la baie, à moitié mangée par la mousse. On y voit un croissant traversé d'une flèche brisée, deux cercles reliés par une barre et un trait en zigzag. Quelqu'un l'a dressée il y a très longtemps. Quelqu'un d'autre l'a renversée : on voit encore les marques des leviers.\n\nTu grattes le lichen au couteau. Puis tu relèves chaque signe, trait par trait, sur une tablette de cire."
 tog_quest.0003.a: "Copier la pierre."
 tog_quest.0020.t: "Le berger"
 tog_quest.0020.desc: "Tu finis à peine ton relevé quand la bruyère s'agite derrière toi. Un jeune homme en sort, essoufflé, une corde à la main.\n\n« Vous avez pas vu une chèvre ? »\n\nIl s'appelle Peredur. Il garde les bêtes du hameau, quand il les trouve. Il écoute avec beaucoup d'attention et retient tout, sauf ce que ça veut dire. Il aperçoit la pierre et oublie la chèvre. Il fait le tour des signes pour les voir à l'envers, puis à l'endroit, puis encore à l'envers, par sécurité.\n\n« Ça, c'est des trucs de vieux. Faut voir le vieux. Celui de l'autre côté de l'eau, à gauche en sortant de la baie. Mais faites attention : selon comment on est tourné, ça change tout ! Mon père dit que le vieux, c'est de l'ésotérisme. »\n\nTu souris : « L'ésotérisme, c'est un savoir réservé à quelques initiés. On le cache à ceux qui ne sont pas prêts à le recevoir. »\n\nPeredur hoche longuement la tête, l'air pénétré.\n\n« Ouais, c'est pas faux. Je vous emmène chez le vieux ? C'est à gauche. Enfin, je crois. »"
 tog_quest.0020.a: "Montre-moi, Peredur."
 tog_quest.0020.a.tt: "#V Peredur#! part devant, vers #V [GetTitleByKey('b_gairloch').GetNameNoTier]#!. Par la gauche."
 tog_quest.0021.t: "Le mauvais vieux"
 tog_quest.0021.desc: "Le vieux de Peredur existe bel et bien. Il vit dans une cabane au bord de l'eau, à [GetTitleByKey('b_gairloch').GetNameNoTier]. Il a quatre-vingts ans et trois dents. Il n'a jamais vu de pierre gravée de sa vie. En revanche, il te parle longuement du hareng, des phoques et de la femme qu'il a failli épouser autrefois.\n\nPeredur se gratte la tête.\n\n« Ah. C'était peut-être à droite. »\n\nLe vieux pêcheur, lui, a compris de qui vous parlez : « Celui qui parle aux pierres ? Il vit au sud, de l'autre côté de l'eau, à [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Tout le monde sait ça. »"
 tog_quest.0021.a: "Cette fois, c'est moi qui choisis la direction."
 tog_quest.0021.a.tt: "Tu prends la route de #V [GetTitleByKey('b_ardnamurchon').GetNameNoTier]#!, chez le vrai vieux."
 tog_quest.0022.t: "La maison vide"
 tog_quest.0022.desc: "Tu trouves enfin la maison du vieux, au fond d'une vallée où les Norrois ne vont pas : il n'y a rien à prendre. La porte est enfoncée. À l'intérieur, tout a été retourné : le coffre éventré, la paillasse déchirée, un bâton brisé en deux sur le seuil.\n\nUne voisine finit par sortir de chez elle. Des bandits sont venus il y a trois jours, des hommes des collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. D'après eux, le vieux cachait de l'or. On dit que sa famille descend de Myrddin, le barde fou, et un homme pareil a forcément un trésor. Ils n'ont rien trouvé. Alors ils ont emmené le vieux.\n\n« Il s'appelle Lailoken, ajoute-t-elle. Il a soixante-huit ans. »"
 tog_quest.0022.a: "Nous allons le chercher."
 tog_quest.0022.a.tt: "Tu prends la route du camp des bandits, dans les collines de #V [GetTitleByKey('b_glencoe').GetNameNoTier]#!."
 tog_quest.0023.t: "Le camp des bandits"
 tog_quest.0023.desc: "Le camp est caché dans un repli des collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Il y a une dizaine de huttes, un feu, des chevaux volés et une vingtaine d'hommes à l'air dangereux. Au milieu, attaché à un poteau, un vieil homme maigre te regarde approcher sans rien dire.\n\nLeur chef s'avance. Il veut de l'or. Il veut toujours de l'or."
 tog_quest.0023.a: "Attaquer le camp."
 tog_quest.0023.b: "Les convaincre de le relâcher."
 tog_quest.0023.b.good: "Tu les persuades que le vieux ne vaut rien, et qu'on ne maltraite pas impunément un descendant de Myrddin. Ils le relâchent."
 tog_quest.0023.c: "Payer la rançon."
 tog_quest.0023.c.tt: "Les bandits prennent l'or et relâchent le vieux."
 tog_quest.0050.t: "Un texte des dieux"
 tog_quest.0050.a: "Viens, Lailoken."
 tog_quest.0010.t: "La tablette de cire"
 tog_quest.0010.desc: "Un soir de bivouac, tu as posé la tablette trop près du feu. Quand tu la reprends, la cire a coulé. La flèche brisée n'est plus qu'une trace molle, et tu ne sais plus si elle penchait vers la gauche ou vers la droite. Peredur, lui, est sûr qu'elle penchait à gauche."
 tog_quest.0010.a: "Refaire les traits de mémoire."
 tog_quest.0010.a.good: "Ta mémoire est sûre : le relevé est sauvé."
 tog_quest.0010.a.bad: "Tu doutes de chaque trait et tu passes la nuit à te le reprocher."
 tog_quest.0010.b: "Confier désormais la tablette à Peredur."
 tog_quest.0010.b.tt: "Peredur la gardera précieusement. À l'envers, sans doute."
 tog_quest.0011.t: "Le marchand"
 tog_quest.0011.desc: "Sur la route, vous croisez un marchand qui remonte vers les Orcades. En voyant ton relevé, il fronce les sourcils. Il a déjà vu des signes semblables, plus à l'est, sur d'autres pierres dressées, dans l'ancien pays des Pictes. Là-bas non plus, personne ne sait ce qu'ils veulent dire."
 tog_quest.0011.a: "L'interroger longuement."
 tog_quest.0011.a.good: "Il te décrit les autres pierres en détail. Tu comprends mieux la tienne."
 tog_quest.0011.a.bad: "Il raconte surtout des fables. Tu perds ta journée à les démêler."
 tog_quest.0011.b: "Lui acheter son dessin."
 tog_quest.0012.t: "Le rêve"
 tog_quest.0012.desc: "Une nuit de bivouac, le croissant gravé revient dans ton sommeil. Il se lève dans le ciel comme une lune. Sous lui, les deux cercles brûlent comme deux feux.\n\nTu te réveilles avec la certitude d'avoir compris quelque chose, sans savoir quoi."
 tog_quest.0012.a: "Noter le rêve avant qu'il s'efface."
 tog_quest.0012.a.good: "Le rêve t'ouvre une piste. Tu te sens plus proche des anciens dieux."
 tog_quest.0012.a.bad: "Le rêve t'égare. Tu te réveilles plus troublé qu'avant."
 tog_quest.0012.b: "Ce n'est qu'un rêve."
 tog_quest.0023.a.good: "Tes hommes balaient le camp. Les bandits s'enfuient dans les collines et abandonnent leur butin."
 tog_quest.0023.a.bad: "L'assaut tourne mal. Tu t'en sors de justesse, mais blessé."
 tog_quest.0023.b.bad: "Ils rient de tes discours et te chassent du camp."
 tog_quest.0024.t: "De justesse"
 tog_quest.0024.desc: "L'assaut a tourné au désastre. Les bandits connaissaient chaque rocher de ces collines, et vous étiez à découvert. Tu t'en es sorti de justesse, une plaie au flanc. Peredur t'a porté à moitié. Il jurait connaître un passage par la gauche et, pour une fois, il avait raison.\n\nLe vieux est toujours là-haut, attaché à son poteau. Il faudra y retourner, quand tu tiendras debout."
 tog_quest.0024.a: "Panser mes blessures, puis y retourner."
 tog_quest.0024.a.tt: "Dans quelques jours, tu retourneras au camp."
 tog_quest.0025.t: "Éconduit"
 tog_quest.0050.desc: "Le vieux se frotte les poignets et te regarde longtemps, sans un mot de remerciement.\n\n« Pourquoi ? Personne ne vient chercher un vieux fou au fond des collines. Qu'est-ce que tu me veux ? »\n\nPour toute réponse, Peredur lui tend ta tablette de cire. Le vieux la remet à l'endroit. Il passe le doigt sur le croissant gravé, puis sur les deux cercles.\n\n« C'est un texte. »\n\n« Un texte ? Ce sont des images. »\n\n« Pour toi. Pour ceux qui les ont gravés, c'était un texte. Un texte des dieux. Les moines ont chassé ceux qui savaient le lire, et leurs enfants ont appris à se taire. Moi, je sais seulement qu'il ne faut pas labourer autour. »\n\nIl te rend la tablette.\n\n« Mais les moines écrivaient tout. Même ce qu'ils détestaient. Surtout ce qu'ils détestaient. Si tu veux savoir qui étaient ces dieux, cherche dans leurs livres : à Jarrow, à Whithorn, à Mynyw, à Dunkeld, à Applecross. »\n\nIl se tait un moment, puis il ajoute, plus bas :\n\n« Tu m'as sauvé la vie. Chez nous, une dette pareille ne se rembourse pas avec des mots : je te suivrai. Et puis, j'ai passé ma vie à surveiller qu'on ne laboure pas autour des pierres. Avant de mourir, je voudrais voir ce que tu vas faire de celle-là. »"
 tog_dest_camp: "le camp des bandits"
 tog_quest.0025.desc: "Les bandits t'ont écouté jusqu'au bout. Puis leur chef a éclaté de rire, et ses hommes se sont mis à te huer. Le vieux, toujours attaché à son poteau, n'a pas dit un mot.\n\nAvec ces hommes-là, les discours ne serviront plus à rien. Il reste la force, ou l'or."
 tog_quest.0025.c: "Partir."
 tog_quest.0025.c.tt: "Tu pourras revenir avec la décision « Voyager vers le camp des bandits »."
 tog_travel_desc_stone: "Une pierre gravée de signes que personne ne sait lire t'attend dans l'île de [GetTitleByKey('b_skye').GetNameNoTier]. Il faut la voir de tes yeux et la copier."
 tog_travel_desc_wrong: "Peredur jure qu'il connaît le chemin jusqu'au vieux : à gauche en sortant de la baie, du côté de [GetTitleByKey('b_gairloch').GetNameNoTier]. Il en est presque sûr."
 tog_travel_desc_house: "D'après le vieux pêcheur, celui qui parle aux pierres vit au sud, de l'autre côté de l'eau, à [GetTitleByKey('b_ardnamurchon').GetNameNoTier]. Cette fois, c'est toi qui choisis la route."
 tog_travel_desc_camp: "Des bandits ont emmené le vieux Lailoken dans les collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Si personne ne va le chercher, personne ne le reverra."
 tog_travel_desc_camp_return: "Le vieux Lailoken est toujours prisonnier des bandits, dans les collines de [GetTitleByKey('b_glencoe').GetNameNoTier]. Il est temps d'y retourner."
 tog_quest_travel_decision_confirm: "Partir"
 tog_quest.0050.a.tt: "#V Lailoken#! marche désormais à tes côtés. Les livres des moines t'attendent dans cinq monastères : utilise la décision « Voyager vers un monastère »."
 tog_story_old_groves_monasteries: "Monastères à visiter"
 tog_obj_books: "Récupérer les livres des moines copistes, puis les lire. Les livres se lisent d'eux-mêmes, un par un, dans l'ordre où tu les as récupérés."
 tog_obj_step3: "Les livres ont parlé : il faut maintenant aller là où l'on priait les anciens dieux."
 tog_dest_monastery: "un monastère"
 tog_travel_desc_monastery: "Les livres des moines copistes t'attendent à Jarrow, à Whithorn, à Mynyw, à Dunkeld et à Applecross. Choisis où aller."
 tog_m.talk: "Convaincre le moine."
 tog_m.talk_tt: "Tes chances dépendent de ta diplomatie. Si tu échoues, le moine ne t'écoutera plus."
 tog_m.pay: "Payer le moine pour qu'il sorte le livre."
 tog_m.steal: "Voler le livre, de nuit."
 tog_m.force: "Forcer les portes avec mes hommes."
 tog_m.leave: "Partir."
 tog_m.leave_tt: "Tu pourras revenir avec la décision « Voyager vers un monastère »."
 tog_m.pay_good: "Le moine sort le livre sous sa robe."
 tog_m.pay_refused: "Le moine refuse, effrayé : il ne voudra plus de ton argent."
 tog_m.pay_kept: "Le moine prend l'argent et disparaît."
 tog_m.force_good: "Les portes cèdent : tu emportes le livre et quelques objets précieux. Le seigneur du lieu ne te le pardonnera pas, et les autres monastères seront sur leurs gardes."
 tog_m.force_bad: "Les moines et leurs serviteurs tiennent bon : vous êtes repoussés. Les autres monastères seront sur leurs gardes."
 tog_m.talk_good: "Le moine te confie le livre."
 tog_m.talk_bad: "Le moine se ferme : il ne te parlera plus."
 tog_m.book_tt: "Le livre est à toi. Tu le liras dans les mois qui viennent."
 tog_quest.0101.t: "Jarrow"
 tog_quest.0101.desc: "La maison où le vénérable Bède a écrit toute sa vie se dresse au bord de la Tyne, derrière un mur bas. Les Norrois sont déjà passés par ici : une aile est encore noircie par le feu. Au bord du chemin, un jeune moine trie des pommes. Il te regarde approcher avec curiosité.\n\n« Vous cherchez quelque chose, étranger ? La bibliothèque est derrière le cloître. On dit qu'elle contient tout ce que Bède a lu, et Bède avait tout lu. »"
 tog_quest.0121.t: "L'Histoire ecclésiastique de Bède"
 tog_quest.0121.desc: "#italic Livre rapporté de Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]).#!\n\nTu lis Bède. Il raconte comment les Pictes sont venus de Scythie sur de longs navires et comment ils choisissaient leurs rois par les femmes. Il raconte aussi comment Colum Cille est allé les « baptiser ». Dans la vie du saint, tu lis qu'il affrontait, chez le roi des Pictes, des mages qui commandaient au vent et aux brumes.\n\nDans une marge, un frère qui avait voyagé au nord a noté : « les Pictes gravaient sur les pierres des signes que nul ne lit plus »."
 tog_quest.0121.a: "Ma pierre avait des prêtres."
 tog_quest.0102.t: "Whithorn"
 tog_quest.0102.desc: "La vieille maison blanche de saint Ninian domine le port. Les moines y sont peu nombreux et quittent rarement la chapelle. La bibliothèque donne sur un jardin dont le mur s'effondre par endroits.\n\nÀ la taverne du port, un frère convers boit trop. Il se plaint à qui veut l'entendre qu'on ne le paie pas assez."
 tog_quest.0122.t: "Le florilège de Sedulius"
 tog_quest.0122.desc: "#italic Livre rapporté de Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]).#!\n\nC'est un florilège venu de Francie. Un Irlandais de la cour de l'empereur y a recopié des pages des auteurs anciens. Un Romain, Pline, raconte que les prêtres des Gaulois s'appelaient druides. Rien n'était plus sacré pour eux que le gui et le chêne qui le porte. Ils le cueillaient au sixième jour de la lune, vêtus de blanc, avec une faucille d'or.\n\nUn autre auteur dit qu'ils jugeaient les procès et qu'ils apprenaient par cœur, pendant vingt ans, un nombre immense de vers. Ils enseignaient que les âmes ne meurent pas : après la mort, elles passent dans d'autres corps.\n\nDans les vies de saints, le druide n'est qu'un sorcier ridicule. Ici, c'est un prêtre."
 tog_quest.0122.a: "Les druides étaient un clergé."
 tog_quest.0103.t: "Mynyw"
 tog_quest.0103.desc: "Au bout du pays de Galles, face à la mer, la maison de saint David est entourée de bons murs. Les moines de Mynyw ont trop souvent vu arriver des voiles étrangères. Ils te regardent approcher depuis le chemin de ronde, et leurs serviteurs gardent leurs bâtons à la main."
 tog_quest.0123.t: "L'Histoire des Bretons"
 tog_quest.0123.desc: "#italic Livre rapporté de Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]).#!\n\nLe livre raconte l'histoire des Bretons. Il parle de Vortigern, qui avait appelé les Saxons, et de la tour qui s'effondrait chaque nuit. Deux dragons, un rouge et un blanc, se battaient dans ses fondations, et un enfant sans père l'avait deviné. Il parle aussi d'un chef de guerre nommé Arthur, vainqueur de douze batailles.\n\nDes héros, pas des dieux. Mais les Bretons, eux aussi, ont gardé le souvenir de leurs anciens."
 tog_quest.0123.a: "Les Bretons attendent encore leurs anciens."
 tog_quest.0104.t: "Dunkeld"
 tog_quest.0104.desc: "Au cœur de l'ancien pays picte, Dunkeld garde une partie des reliques de Colum Cille. On les a apportées ici pour les mettre à l'abri des Norrois. Des gardes veillent jour et nuit sur la châsse. Personne ne veille sur la bibliothèque, une salle basse au fond du cloître.\n\nUn chien dort en travers de sa porte."
 tog_quest.0124.t: "Le livre gratté"
 tog_quest.0124.desc: "#italic Livre rapporté de Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]).#!\n\nC'est un livre laid, un florilège de plusieurs mains sur un mauvais vélin. On a gratté plusieurs pages au couteau pour écrire des psaumes par-dessus. En les tenant contre la lumière, tu devines encore les lignes qu'on a voulu effacer.\n\nUn moine y a recopié, sans les commenter, des phrases que ses maîtres avaient laissé passer. Brigit était une déesse que vénéraient les poètes. Ana avait été la mère des dieux d'Irlande. À Beltaine, les druides allumaient deux feux avec de grandes incantations et ils y faisaient passer le bétail, contre les maladies. Autrefois, on jurait par ces dieux, et non par le Christ.\n\nLes rois de l'ancien temps n'avaient pas été des rois."
 tog_quest.0124.a: "On les avait priés."
 tog_quest.0105.t: "Applecross"
 tog_quest.0105.desc: "En face des îles, la maison de saint Máel Rubai est petite et pauvre. Un très vieux moine, presque aveugle, garde la bibliothèque. On dit qu'il connaît chaque livre par cœur et qu'il ne laisse sortir personne avec le moindre feuillet."
 tog_quest.0125.t: "Le Dindshenchas"
 tog_quest.0125.desc: "#italic Livre rapporté d'Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]).#!\n\nC'est un recueil de lieux. Chaque colline, chaque source et chaque pierre de l'ancien temps y a son histoire, qui explique son nom. Il y a la grande maison creuse du Dagda, sur la Boyne. Il y a la colline d'Uisneach, au centre de l'Irlande, où Lug était mort. Il y a la pierre de Mabon, sur l'estuaire de la Solway…\n\nLes livres disent que ces dieux ont existé. Ils ne disent pas qui ils étaient."
 tog_quest.0125.a: "J'irai là où on les priait."
 tog_quest.0130.t: "Un culte volé"
 tog_quest.0130.desc: "Tu relis les cinq livres côte à côte. Les noms, tu les connaissais depuis l'enfance : Lug, le Dagda, Brigit, Balor, les Tuatha Dé Danann, la tribu de Dana. Selon qui racontait, c'étaient des rois, des ancêtres ou des démons. Maintenant, tu comprends que ce sont les ruines d'un culte. Un vrai culte, avec ses dieux, ses lieux et ses prêtres. Et on vous l'a volé.\n\nLes moines ont bâti leurs églises sur les collines où l'on priait avant eux. Ils ont planté leurs croix sur les pierres et donné à leurs saintes le nom des déesses. Ce qu'ils n'ont pas pu détruire, ils l'ont baptisé. Ce qu'ils n'ont pas pu baptiser, ils l'ont laissé mourir. Et ce qu'ils ont mis à la place sert surtout à faire baisser la tête : obéir au seigneur, payer la dîme, prier dans une langue que personne ne comprend.\n\nLes anciens dieux, eux, étaient d'ici. On vous les a pris. Tu vas les reprendre."
 tog_quest.0130.a: "Je vais reprendre ce qu'on nous a volé."
 tog_quest.0130.a.tt: "Les livres ont donné des noms de lieux : il est temps d'aller là où l'on priait les anciens dieux."
 tog_quest.0140.t: "Vers quel monastère ?"
 tog_quest.0140.desc: "Les livres des moines copistes t'attendent dans plusieurs monastères. Lequel veux-tu visiter ?"
 tog_quest.0140.jarrow: "Jarrow ([GetTitleByKey('b_durham').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_jarrow').GetValue|0] km"
 tog_quest.0140.whithorn: "Whithorn ([GetTitleByKey('b_wigtown').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_whithorn').GetValue|0] km"
 tog_quest.0140.mynyw: "Mynyw ([GetTitleByKey('b_st_davids').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_mynyw').GetValue|0] km"
 tog_quest.0140.dunkeld: "Dunkeld ([GetTitleByKey('b_dunkeld').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_dunkeld').GetValue|0] km"
 tog_quest.0140.applecross: "Applecross ([GetTitleByKey('b_applecross').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_applecross').GetValue|0] km"
 tog_quest.0140.stay: "Pas maintenant."
 tog_test_skip_step1_decision: "TEST : passer à l'étape 2"
 tog_test_skip_step1_decision_desc: "Décision de test : lance la quête si besoin, ajoute Peredur et Lailoken, et ouvre l'étape 2 (les monastères)."
 tog_test_skip_step1_decision_confirm: "Passer à l'étape 2"
 tog_quest.0161.t: "Une porte fermée"
 tog_quest.0161.desc: "Le moine t'a écouté jusqu'au bout. Puis il a secoué la tête, sans colère, comme on refuse l'aumône à un homme qui n'en a pas besoin.\n\n« Je prierai pour vous. » Il a repris son ouvrage et ne t'a plus regardé. Ce n'est pas lui qui te donnera le livre."
 tog_quest.0161.a: "Il faudra trouver un autre moyen."
 tog_quest.0162.t: "Un moine effrayé"
 tog_quest.0162.desc: "À la vue de ta bourse, le moine a pâli. Il a reculé d'un pas, il s'est signé et il est parti presque en courant vers la chapelle.\n\nTon argent ne t'ouvrira pas cette bibliothèque."
 tog_quest.0162.a: "Il faudra trouver un autre moyen."
 tog_quest.0163.t: "Un moine malhonnête"
 tog_quest.0163.desc: "Le moine a pris l'argent. Il a promis de revenir après complies, le livre sous sa robe. Tu as attendu toute la nuit derrière le mur.\n\nAu matin, on t'a dit qu'il était parti en pèlerinage. Personne ne sait quand il reviendra."
 tog_quest.0163.a: "Il faudra trouver un autre moyen."
 tog_quest.0165.t: "Repoussés"
 tog_quest.0165.desc: "Les moines ont sonné la cloche avant même que tes hommes atteignent la porte. Les serviteurs, les paysans du domaine et quelques hommes d'armes sont arrivés de partout, avec des fourches, des bâtons et des pierres.\n\nVous avez dû reculer. On parlera de ce jour dans tous les monastères du pays."
 tog_quest.0165.a: "Il faudra trouver un autre moyen."
 tog_quest.0153.t: "La source aux rubans"
 tog_quest.0153.desc: "Au fond d'un vallon, une source sort d'entre les racines d'un vieux frêne. Ses branches sont couvertes de rubans, de bouts d'étoffe et de mèches de cheveux. Une croix toute neuve a été plantée à côté. Pourtant, les rubans sont récents, eux aussi.\n\nUne vieille femme trempe un linge dans la source et le noue à une branche en murmurant."
 tog_quest.0153.a: "Lui demander ce qu'elle fait."
 tog_quest.0153.a.good: "Elle te dit des mots que sa grand-mère lui a appris. Tu y reconnais un nom de déesse."
 tog_quest.0153.a.bad: "Elle prend peur et s'en va sans rien dire."
 tog_quest.0153.b: "Nouer un ruban, moi aussi."
 tog_quest.0154.t: "Le prêtre et la pierre"
 tog_quest.0154.desc: "Sur la place d'un village, un prêtre fait abattre une pierre levée à coups de masse. Les villageois regardent sans rien dire. Une femme avait déposé du lait au pied de la pierre. On l'a attachée à un poteau, et le prêtre annonce qu'elle sera fouettée pour idolâtrie."
 tog_quest.0154.a: "Intervenir, l'épée à la main."
 tog_quest.0154.a.good: "Les hommes du prêtre s'enfuient. La femme est libre, et tout le village l'a vu."
 tog_quest.0154.a.bad: "La femme est libérée, mais tu as pris des coups."
 tog_quest.0154.b: "Intervenir avec des mots."
 tog_quest.0154.b.good: "Le prêtre cède devant le village et détache la femme."
 tog_quest.0154.b.bad: "Le prêtre t'humilie devant tout le monde."
 tog_quest.0154.c: "Rester caché et passer son chemin."
 tog_quest.0155.t: "Le raccourci de [tog_peredur.GetFirstName]"
 tog_quest.0155.desc: "« Je connais un raccourci », a dit [tog_peredur.GetFirstName] ce matin. Il est maintenant midi, le brouillard est tombé, et vous êtes au milieu d'une tourbière que personne n'a jamais vue.\n\n« C'est par là. Je crois. Enfin, c'était par là avant. »"
 tog_quest.0155.a: "Faire confiance à [tog_peredur.GetFirstName]."
 tog_quest.0155.a.good: "Contre toute attente, il retrouve le chemin."
 tog_quest.0155.a.bad: "Vous tournez en rond jusqu'au soir."
 tog_quest.0155.b: "Chercher quelqu'un du pays."
 tog_quest.0155.b.good: "Un berger vous remet sur la route."
 tog_quest.0155.b.bad: "Le berger se moque de vous et ne dit rien d'utile."
 tog_quest.0171.t: "Le livre confié"
 tog_quest.0171.desc: "Le moine t'a regardé longtemps. Puis il est allé jusqu'à la bibliothèque sans un mot. Il en est revenu avec un livre enveloppé dans un linge.\n\n« Rapportez-le quand vous l'aurez lu. Et ne dites à personne que c'est moi. »"
 tog_quest.0171.a: "Je le lirai avec soin."
 tog_quest.0172.t: "Le prix d'un livre"
 tog_quest.0172.desc: "Le moine a compté les pièces deux fois et les a fait disparaître dans sa manche. Puis il t'a donné rendez-vous derrière le mur, après complies.\n\nIl est venu, cette fois. Le livre était sous sa robe."
 tog_quest.0172.a: "Tout s'achète, même chez les moines."
 tog_quest.0173.t: "Un livre de moins"
 tog_quest.0173.desc: "Personne ne veillait, la porte n'était pas fermée et le coffre ne l'était qu'à moitié. Tu es ressorti avant l'aube, le livre sous ta chemise.\n\nQuand les moines s'en apercevront, tu seras loin."
 tog_quest.0173.a: "Personne ne m'a vu."
 tog_quest.0174.t: "Les portes ont cédé"
 tog_quest.0174.desc: "La porte a cédé au troisième coup. Les moines se sont réfugiés dans la chapelle en chantant des psaumes. Personne n'a osé s'interposer.\n\nTes hommes ont pris ce qui brillait. Toi, tu as pris le livre. On parlera longtemps de ce jour, et pas en bien."
 tog_quest.0174.a: "Le livre est à moi."
 tog_quest.0158.t: "Le vieux et la pierre"
 tog_quest.0158.desc: "Au réveil, la couverture de Lailoken est vide. Vous le cherchez toute la matinée. Peredur finit par le trouver en haut d'une colline, assis contre une pierre levée. Il lui parle à voix basse, comme à une vieille connaissance.\n\n« Ne fais pas cette tête. Elle ne me répond pas, je ne suis pas fou. Mais quand on parle à une pierre, on finit par entendre ce qu'on pense vraiment. » Il tapote le granit. « Tes moines écrivaient tout parce qu'ils avaient peur d'oublier. Les anciens n'écrivaient rien : ils avaient confiance en la mémoire. Ce n'est pas dans les livres que tu trouveras les dieux, petit. Les livres te diront seulement où chercher. »"
 tog_quest.0158.a: "« Continue, je t'écoute. »"
 tog_quest.0158.b: "« On t'a cherché toute la matinée ! »"
 tog_quest.0159.t: "Peu d'hivers"
 tog_quest.0159.desc: "Depuis trois jours, Lailoken marche de plus en plus lentement. Ce matin, il est tombé dans la boue et il a mis longtemps à se relever. Il refuse qu'on l'aide.\n\n« Ne t'arrête pas pour moi. Il me reste peu d'hivers, et je préfère les passer sur la route qu'au coin d'un feu. » Il tousse longtemps. « Mais si tu pouvais marcher un peu moins vite, je ne dirais pas non. »"
 tog_quest.0159.a: "Ralentir pour lui."
 tog_quest.0159.a.tt: "Tu prends le temps qu'il faut. Lailoken ne l'oubliera pas."
 tog_quest.0159.b: "Continuer au même pas."
 tog_story_old_groves_books: "Livres lus"
 tog_story_old_groves_books_min: "0"
 tog_story_old_groves_books_max: "5"
 tog_quest.0181.t: "Le compte est bon"
 tog_quest.0181.desc: "Au pont, le péagiste réclame trois deniers par personne et en compte onze pour une troupe de huit. Avant que tu aies ouvert la bouche, [tog_peredur.GetFirstName] s'avance.\n\n« Huit. Et toi, tu as quarante-deux deniers dans ta bourse, six poules derrière ta maison et il te manque quatre dents. Trois en haut, une en bas. »\n\nLe péagiste referme la bouche très vite."
 tog_quest.0181.a: "« Tu as entendu [tog_peredur.GetFirstName]. »"
 tog_quest.0181.b: "Payer sans discuter."
 tog_quest.0182.t: "[tog_peredur.GetFirstName] lit"
 tog_quest.0182.desc: "Le soir, au feu, [tog_peredur.GetFirstName] a pris un des livres. Il le tient à l'envers, très sérieusement, en fronçant les sourcils.\n\n« Je ne sais pas ce que ça dit. Mais sur cette page il y a mille deux cent quarante-sept lettres, et il y a beaucoup trop de « e ». Ça doit être un livre triste. »"
 tog_quest.0182.a: "Lui apprendre quelques lettres."
 tog_quest.0182.b: "Éclater de rire."
 trait_tog_dagda_cauldron: "Chaudron du Dagda"
 trait_tog_dagda_cauldron_desc: "Dans le noir du tumulus, le Dagda lui a montré son chaudron, celui dont personne ne repart affamé."
 trait_tog_dagda_club: "Massue du Dagda"
 trait_tog_dagda_club_desc: "Dans le noir du tumulus, le Dagda lui a montré sa massue : un bout tue, l'autre ramène à la vie."
 trait_tog_dagda_harp: "Harpe du Dagda"
 trait_tog_dagda_harp_desc: "Dans le noir du tumulus, le Dagda lui a montré sa harpe, celle qui met les saisons dans l'ordre."
 tog_story_old_groves_places: "Lieux sacrés à visiter"
 tog_obj_places: "Visiter les lieux sacrés dont parlent les livres : Brú na Bóinne, Uisneach et la pierre de Mabon."
 tog_dest_place: "un lieu sacré"
 tog_travel_desc_places: "Les livres parlent de lieux où l'on priait les anciens dieux : la maison du Dagda sur la Boyne, la colline d'Uisneach, la pierre de Mabon. Choisis où aller."
 tog_p.leave_tt: "Tu pourras revenir avec la décision « Voyager vers un lieu sacré »."
 tog_test_skip_step2_decision: "TEST : Commencer à l'étape 3"
 tog_test_skip_step2_decision_desc: "Décision de test, à retirer avant publication : saute les étapes 1 et 2 si besoin et ouvre directement l'étape 3."
 tog_quest.0240.t: "Vers quel lieu sacré ?"
 tog_quest.0240.desc: "Les livres t'ont donné des noms de lieux. Lequel veux-tu voir ?"
 tog_quest.0240.bru: "Brú na Bóinne, la maison du Dagda ([GetTitleByKey('b_drogheda').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_bru').GetValue|0] km"
 tog_quest.0240.uisneach: "La colline d'Uisneach ([GetTitleByKey('b_uisneach').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_uisneach').GetValue|0] km"
 tog_quest.0240.mabon: "La pierre de Mabon ([GetTitleByKey('b_dumfries').GetNameNoTier]), environ [ROOT.Char.MakeScope.Var('tog_km_mabon').GetValue|0] km"
 tog_quest.0240.mabon_locked: "Il faut d'abord avoir vu Brú na Bóinne et Uisneach"
 tog_quest.0201.t: "La maison du Dagda"
 tog_quest.0201.desc: "Le tumulus est plus grand que tout ce que tu as vu bâtir par des hommes. C'est une colline ronde, cerclée de grandes pierres couvertes de spirales. Les Norrois de Dublin sont passés par là : on voit encore les tranchées qu'ils ont creusées pour chercher de l'or.\n\nUn berger, Eógan, garde ses moutons au pied de la colline. Il connaît les vieilles histoires de son grand-père. Le prêtre lui a défendu de les raconter, et de toute façon personne ne les lui demande. Toi, tu les lui demandes. Alors il raconte. C'est ici que vivait le Dagda, le dieu bon, avec son chaudron, sa massue et sa harpe. Son fils Óengus lui a pris la maison par une ruse : il l'a demandée pour « un jour et une nuit », et ces mots voulaient dire « pour toujours ».\n\n« Ceux qui dormaient dedans, autrefois, en ressortaient avec des visions. Personne ne l'a fait depuis le temps de mon grand-père. »"
 tog_quest.0201.a: "Passer la nuit dans le tumulus."
 tog_quest.0202.t: "La nuit dans le tumulus"
 tog_quest.0202.desc: "Eógan t'a montré l'entrée, puis il s'est assis dehors, contre une pierre. Le couloir est étroit, si bas qu'il faut avancer courbé. Au fond, le noir est complet.\n\nLe froid monte du sol. Au bout d'un moment, tu ne sais plus si tes yeux sont ouverts ou fermés. Tu entends des bruits : de l'eau qui goutte, peut-être, ou quelqu'un qui respire."
 tog_quest.0202.a: "Tenir jusqu'au matin."
 tog_quest.0202.good: "Tu gardes la tête claire et tu comprends ce que tu vis."
 tog_quest.0202.bad: "La peur te tient toute la nuit."
 tog_quest.0203.t: "La vision"
 tog_quest.0203.desc: "Vers la fin de la nuit, quelqu'un est avec toi dans la chambre. C'est un homme immense, ventru, vêtu d'une tunique trop courte, qui rit doucement dans le noir. Il pose devant toi trois choses : un chaudron qui ne se vide jamais, une massue dont un bout tue et l'autre ramène à la vie, une harpe qui met les saisons dans l'ordre.\n\n« Prends-en une. Une seule. »"
 tog_quest.0203.a: "Le chaudron."
 tog_quest.0203.b: "La massue."
 tog_quest.0203.c: "La harpe."
 tog_quest.0204.t: "Le matin"
 tog_quest.0204.desc: "Quand tu ressors, la lumière te fait mal aux yeux. Eógan est toujours là, contre sa pierre, son manteau sur les épaules. Il n'a pas dormi.\n\nIl te regarde longtemps. « Tu as vu quelque chose. Ça se voit. » Il se lève et ramasse son bâton. « Toute ma vie, j'ai raconté ces histoires sans savoir si j'y croyais. Je veux voir la suite. Et puis, si tu dois les écrire, il faut bien quelqu'un pour te les raconter toutes. »"
 tog_quest.0204.a: "« Viens. »"
 tog_quest.0204.a.tt: "#V Eógan#! prend son bâton et te suit."
 tog_quest.0211.t: "La colline d'Uisneach"
 tog_quest.0211.desc: "On disait autrefois que du sommet de cette colline, on voyait l'Irlande entière. Elle n'est pourtant pas haute. Le vent couche l'herbe. Il n'y a personne, seulement des moutons et, ici et là, des choses que les hommes ont laissées : une grande pierre fendue, une terre noircie, un vieux puits.\n\nLes livres disaient que c'était le centre de l'Irlande, et que Lug était mort ici. Mais ils ne disaient pas comment lire ce que l'on trouve sur place."
 tog_quest.0211.a: "Examiner les signes."
 tog_quest.0212.t: "La pierre fendue"
 tog_quest.0212.desc: "C'est un énorme bloc de calcaire, fendu en plusieurs morceaux, comme si quelque chose l'avait brisé de l'intérieur. Les gens du pays l'appellent la pierre des divisions. Que veut-elle dire ?"
 tog_quest.0212.a: "Le centre : les provinces s'y rejoignent, et Lug y est enterré."
 tog_quest.0212.b: "La foudre du Dieu chrétien, qui a brisé une idole."
 tog_quest.0212.c: "Une borne de partage entre deux fermes."
 tog_quest.0213.t: "La terre noircie"
 tog_quest.0213.desc: "Sur une large surface, la terre est noire. Elle est mêlée d'os brûlés et de charbon, couche après couche, comme si l'on y avait allumé de grands feux pendant des siècles. Pourquoi ?"
 tog_quest.0213.a: "Un village brûlé par les Norrois."
 tog_quest.0213.b: "Le feu d'un saint, comme celui de Patrick à Slane."
 tog_quest.0213.c: "Les feux de Beltaine, entre lesquels on faisait passer le bétail."
 tog_quest.0214.t: "Le puits"
 tog_quest.0214.desc: "C'est un vieux puits, presque comblé, entouré de pierres plates usées par les genoux. On y a jeté des épingles, des pièces et des petits os. Que cherchait-on au fond ?"
 tog_quest.0214.a: "Un puits béni par un saint, pour guérir."
 tog_quest.0214.b: "Une porte vers l'Autre Monde, où passent les âmes."
 tog_quest.0214.c: "Une simple réserve d'eau pour les moutons."
 tog_u.wrong_tt: "Une mauvaise lecture est une faute envers le dieu du lieu. Il faut reprendre depuis le premier signe."
 tog_quest.0215.t: "Une fausse piste"
 tog_quest.0215.desc: "Tu tournes l'idée dans ta tête, et elle ne tient pas. Rien dans les livres ne va dans ce sens. Tu as regardé ce lieu avec les yeux d'un moine, pas avec ceux des anciens. Tout ce que tu croyais avoir compris s'effondre.\n\nLe vent souffle plus fort, comme un reproche. Il faut tout reprendre depuis le début."
 tog_quest.0215.a: "Reprendre depuis la pierre fendue."
 tog_quest.0216.t: "Lug aux mille arts"
 tog_quest.0216.desc: "Assis au pied de la pierre fendue, tu rassembles ce que tu as compris.\n\nLe recueil des lieux d'Applecross le disait : Uisneach est le centre de l'Irlande, là où les provinces se rejoignent, et Lug y est mort. Les gens du pays disent que la pierre fendue marque sa tombe. Lug est le roi qui rassemble.\n\nLe livre gratté de Dunkeld le disait : à Beltaine, les druides allumaient deux grands feux et faisaient passer le bétail entre eux, contre les maladies. Ici, on les a allumés pendant des siècles. Lug est la lumière qui protège.\n\nLe florilège de Whithorn le disait : les âmes ne meurent pas, elles passent. Le puits est une porte, et ce qu'on y jetait était pour ceux de l'autre côté. Lug va et vient entre les mondes.\n\nCe sont trois visages d'un même dieu. Les gens du pays racontent qu'un jour, il a demandé à entrer à Tara. Il s'est présenté comme charpentier, forgeron, harpiste, guerrier, poète et médecin. On l'a laissé entrer, parce que personne d'autre ne savait tout faire. C'est le dieu de tous les arts. Le plus grand d'entre eux, peut-être."
 tog_quest.0216.a: "Lug est le plus grand."
 tog_quest.0221.t: "La pierre de Mabon"
 tog_quest.0221.desc: "Te voilà enfin au bord de la Solway, dans le village où se dresse la pierre de Mabon, d'après les livres. Sur la place, quelques maisons basses entourent un puits. Des femmes lavent du linge, des enfants courent après une oie. Tout le monde se tait quand tu passes.\n\nDe la place, on voit la pierre. Elle se dresse seule dans un champ, au bout du village, plus haute qu'un homme. Quand tu demandes son nom, les villageois disent qu'elle n'en a pas, que c'est une pierre comme une autre, et ils détournent les yeux. Pourtant, il y a du lait frais dans le creux à son pied.\n\nAu bout du champ, un homme du seigneur mesure la terre avec une corde. Une vieille femme te souffle, sans te regarder : « Il veut nous prendre le champ pour une dette. Le champ de la pierre. »"
 tog_quest.0221.a: "Proposer mon aide."
 tog_quest.0222.t: "La dette"
 tog_quest.0222.desc: "La dette est ancienne, gonflée par les intérêts. L'intendant du seigneur chrétien ne cache pas que c'est la pierre qui l'intéresse : son maître veut l'abattre et bâtir une chapelle à sa place.\n\nSi le champ est perdu, la pierre aussi."
 tog_quest.0222.a: "Payer la dette."
 tog_quest.0222.b: "Négocier avec l'intendant."
 tog_quest.0222.c: "Falsifier la reconnaissance de dette."
 tog_quest.0223.t: "Le délateur"
 tog_quest.0223.desc: "Le champ est sauvé. Le soir même, les villageois viennent te trouver. Ils t'invitent au rite de la prochaine lune, au pied de la pierre, et ils te disent que le gardien veut te voir.\n\nMais la veille du rite, tu surprends Aedán, un jeune du village, qui selle un cheval à la nuit tombée. Il va chez le prêtre. Il dit que ce que vous faites est un péché et qu'il ne veut pas brûler avec vous. Les villageois te regardent : ils attendent de voir ce que tu vas faire."
 tog_quest.0223.a: "Le convaincre de rester."
 tog_quest.0223.b: "Acheter son silence."
 tog_quest.0223.c: "L'effrayer."
 tog_quest.0223.d: "Le faire disparaître."
 tog_quest.0223.d.tt: "Aedán ne parlera à personne. Les villageois ne l'oublieront pas."
 tog_quest.0222.d: "Intimider l'intendant."
 tog_quest.0224.t: "Le gardien"
 tog_quest.0224.desc: "À la nouvelle lune, ils sont une vingtaine autour de la pierre, avec des lanternes voilées. Un homme s'avance : Gwion, le gardien. Son père gardait la pierre avant lui, et le père de son père avant eux. Il verse le lait et dit des mots dans une langue que plus personne ne comprend. Pour la première fois, tu entends prononcer le nom du dieu du lieu : Mabon, le fils divin, le jeune chasseur.\n\nAprès le rite, tu veux lui parler. Il te tourne le dos. « Tu as sauvé le champ, et je t'en remercie. Mais je ne parle pas des dieux aux étrangers. Le dernier étranger venu ici, c'était le prêtre. »\n\nLa vieille femme te prend à part. Le prêtre a emmené la fille de Gwion, Eluned, au couvent du val, pour la sauver du paganisme de son père. Depuis, Gwion ne parle presque plus à personne. Eluned est sa seule enfant. C'est à elle qu'il devait apprendre les prières."
 tog_quest.0224.a: "Faire sortir Eluned du couvent."
 tog_quest.0224.a.tt: "Un complot commence pour libérer #V Eluned#!. Quand tu le juges prêt, utilise le bouton « Exécuter » du complot."
 tog_free_daughter: "Libérer Eluned"
 tog_free_daughter_action: "Libérer"
 tog_free_daughter_desc: "Je vais faire sortir [SCHEME.GetTargetCharacter.GetShortUIName] du couvent où le prêtre l'a enfermée, pour la rendre à son père."
 tog_free_daughter_desc_general: "Faire sortir la fille de Gwion du couvent où le prêtre l'a enfermée."
 TOG_FREE_DAUGHTER_SUCCESS_DESC: "Eluned retrouvera son père, et Gwion acceptera de parler."
 tog_obj_daughter: "Faire sortir Eluned, la fille de Gwion, du couvent."
 tog_obj_learning: "Apprendre auprès de Gwion ce que ses ancêtres ont gardé."
 tog_quest.0230.t: "Une tentative manquée"
 tog_quest.0230.desc: "Tout était prêt : la corde, le cheval, la sœur portière achetée. Mais cette nuit-là, l'abbesse a veillé tard dans la chapelle, et il a fallu renoncer.\n\nLes sœurs se méfient un peu plus. Il faudra recommencer."
 tog_quest.0230.a: "La prochaine fois."
 tog_quest.0230.a.tt: "Le complot continue : tu pourras retenter avec le bouton « Exécuter »."
 tog_quest.0232.t: "Eluned"
 tog_quest.0232.desc: "Eluned a passé le mur du couvent à l'heure de matines, dans un manteau trop grand. Au matin, elle est au village. Gwion la serre contre lui sans rien dire, pendant un long moment.\n\nLe soir, il vient s'asseoir près de ton feu. « Tu as sauvé le champ. Tu m'as rendu ma fille. Un étranger ne fait pas ça pour rien. Qu'est-ce que tu cherches ? »\n\nAlors tu lui racontes tout : la pierre aux signes dans la bruyère de [GetTitleByKey('b_skye').GetNameNoTier], les livres pris aux moines, la nuit dans la maison du Dagda, les signes d'Uisneach. Les dieux dont ses ancêtres gardaient le nom avaient eu des prêtres, des fêtes et des lieux, et on vous les a pris. Tu veux savoir qui ils étaient vraiment.\n\nGwion t'écoute sans t'interrompre. Puis il dit, lentement : « Je t'ai vu en rêve, avant que tu viennes. Un homme venait de l'ouest avec des livres sous le bras. Je ne savais pas ce que ça voulait dire. » Il regarde les maisons du village. « Ils étaient cent du temps de mon grand-père. Ils sont vingt. Quand je mourrai, il n'y aura plus personne pour dire les prières, sauf Eluned, et le prêtre la reprendra. Mes ancêtres ont gardé la pierre en attendant quelque chose. Je crois que c'est toi. Tu as les livres, moi j'ai les mots qu'on disait aux dieux. Emmène-nous, ma fille et moi, et je t'apprendrai tout ce que je sais. »"
 tog_quest.0232.a: "« Tes prières ne mourront pas avec toi. »"
 tog_quest.0232.a.tt: "#V Gwion#! et sa fille #V Eluned#! partent avec toi. Dans les mois qui viennent, Gwion t'enseignera ce qu'il sait."
 tog_quest.0233.t: "Le fils de la Mère"
 tog_quest.0233.desc: "Le soir, Gwion commence par le dieu de sa pierre. Mabon est le fils de Modron, la Mère. On l'a enlevé à sa mère quand il avait trois nuits, et personne ne savait où il était. Puis les plus vieux animaux du monde, le merle, le cerf, le hibou, l'aigle et le saumon, ont mené ceux qui le cherchaient jusqu'à sa prison.\n\n« C'est le dieu jeune, celui qu'on délivre. Les Romains eux-mêmes l'ont prié, le long de leur mur. Ils l'appelaient Apollon, parce qu'ils voulaient que tous les dieux soient les leurs. »"
 tog_quest.0233.lailoken: "\n\nLailoken, qui s'est rapproché du feu, demande lequel des cinq animaux était le plus vieux. « Le saumon », répond Gwion. Le vieux hoche la tête, satisfait, comme s'il le savait déjà."
 tog_quest.0233.a: "Le dieu qu'on délivre."
 tog_quest.0234.t: "Les quatre portes"
 tog_quest.0234.desc: "« L'année a quatre portes », dit Gwion. Samain, quand l'été meurt et que les morts reviennent s'asseoir près du feu : on leur laisse une place et de quoi manger. Imbolc, quand les brebis ont leur lait : c'est la fête de Brigit. Beltaine, avec ses deux feux entre lesquels on fait passer les bêtes. Lugnasad, à la moisson : c'est la fête de Lug, avec des jeux et des mariages pour un an et un jour.\n\n« Les moines ont gardé les dates. Ils ont seulement changé les noms. »"
 tog_quest.0234.lailoken: "\n\nLailoken rit tout bas. Dans sa vallée, dit-il, on éteint encore tous les feux la veille de Samain, et plus personne ne sait pourquoi. Gwion le lui explique. Le vieux reste longtemps silencieux."
 tog_quest.0234.a: "Les moines ont changé les noms."
 tog_quest.0235.t: "Les serments et les pierres"
 tog_quest.0235.desc: "Gwion t'apprend comment on jurait autrefois : par les dieux de son peuple, la main sur la pierre, devant témoins. Celui qui manquait à son serment n'avait plus le droit d'assister aux sacrifices. Personne ne lui parlait plus, personne ne mangeait avec lui. C'était pire que la mort.\n\nEt les pierres levées ne sont pas des tombes, ou pas seulement. « On y venait pour parler à ceux d'en dessous. Ta pierre de la bruyère, celle avec les signes, elle parlait. Il faut seulement réapprendre à l'entendre. »"
 tog_quest.0235.lailoken: "\n\nLailoken pose la main sur le genou de Gwion. « C'est ce que je lui ai dit, le jour où il m'a délivré : que sa pierre était un texte. » Gwion le regarde avec respect, pour la première fois."
 tog_quest.0235.a: "Réapprendre à l'entendre."
 tog_quest.0236.t: "Les prières"
 tog_quest.0236.desc: "Pendant des semaines, Gwion te dit les prières, une à une, dans la langue que plus personne ne comprend. Il te les fait répéter jusqu'à ce que tu les saches. « Ce ne sont pas les mots qui comptent. C'est qu'on continue de les dire. »\n\nLe dernier soir, il te parle d'une chose que son grand-père racontait. Bien avant les moines, les Romains ont vaincu les peuples du continent dans une grande bataille, sur une colline où, dit-on, les dieux des Gaulois ont perdu. Mais un village, au bord de la mer, leur a résisté bien plus longtemps que les autres. « Personne ne sait où était la colline. Le village, on dit qu'il est en Armorique. Si quelque chose est resté des anciens, c'est là-bas. »"
 tog_quest.0236.lailoken: "\n\nLailoken a appris les prières en même temps que toi. Il les marmonne en marchant. Il se trompe souvent, mais il ne s'arrête jamais."
 tog_quest.0236.a: "Il faudra aller voir."
 trait_tog_awen: "L'Awen"
 trait_tog_awen_desc: "Le don : l'inspiration des poètes et des prophètes. Certains de ses rêves se réalisent."
 TOG_COMPANION_HELPS: "Compagnon de la quête : aide sans contrepartie"
 tog_quest.0231.t: "Une nuit sans lune"
 tog_quest.0231.desc: "Tout est prêt : la corde, le cheval caché dans le bois, tes compagnons à leur poste autour du couvent. La nuit est noire. Les sœurs vont bientôt se lever pour matines.\n\nC'est peut-être le bon moment. Ou peut-être pas."
 tog_quest.0231.a: "Tenter ma chance."
 tog_quest.0231.b: "Utiliser un avantage."
 tog_quest.0231.b.tt: "Dépense 1 avantage : +20 % de chances pour cette tentative."
 tog_quest.0231.c: "Utiliser deux avantages."
 tog_quest.0231.c.tt: "Dépense 2 avantages : +40 % de chances pour cette tentative."
 tog_quest.0231.d: "Attendre une meilleure nuit."
 tog_quest.0231.d.tt: "Tu n'agis pas cette nuit. Le complot continue : tu pourras revenir avec le bouton « Exécuter »."
 tog_quest.0251.t: "La sœur portière"
 tog_quest.0251.desc: "La sœur portière est vieille et pauvre, et elle n'aime pas l'abbesse. Lailoken faisait l'aumône à la porte. Elle lui a laissé entendre qu'une porte peut rester mal fermée une nuit ou deux, si l'on y met le prix. Ou si l'on sait lui parler."
 tog_quest.0251.a: "Lui glisser quelques pièces."
 tog_quest.0251.b: "Gagner sa confiance."
 tog_quest.0251.c: "Trop risqué."
 tog_quest.0252.t: "L'abbesse se méfie"
 tog_quest.0252.desc: "L'abbesse a remarqué des étrangers autour du couvent. Elle a fait poser une nouvelle serrure à la porte du dortoir des novices, et une sœur veille désormais toute la nuit."
 tog_quest.0252.a: "Brouiller les pistes."
 tog_quest.0252.a.tt: "Dépense 1 avantage : la méfiance de l'abbesse retombe."
 tog_quest.0252.b: "On fera avec."
 tog_quest.0253.t: "Un message d'Eluned"
 tog_quest.0253.desc: "Au marché, une petite novice t'a glissé un bout de parchemin dans la main, sans te regarder. Il vient d'Eluned. Elle sait qu'on vient la chercher. Elle dit quelle fenêtre ne ferme pas, et à quelle heure la sœur qui veille s'endort."
 tog_quest.0253.a: "Elle est prête."
 tog_quest.0254.t: "[tog_peredur.GetFirstName] compte"
 tog_quest.0254.desc: "Tu as envoyé [tog_peredur.GetFirstName] repérer les lieux, discrètement. Il est revenu ravi. « Quarante-trois fenêtres, sept portes, deux cent douze pierres dans le mur du jardin. » Il marque une pause. « J'ai compté à voix haute. Il y avait une sœur. Elle m'a demandé pourquoi. »"
 tog_quest.0254.a: "Laisser Lailoken arranger ça."
 tog_quest.0254.a.tt: "Lailoken va trouver la sœur. Il lui explique que le garçon est simple d'esprit et qu'il compte tout, même les étoiles. C'est presque vrai. Personne ne se méfie."
 tog_quest.0254.b: "Trop tard."
 tog_portress_bought_modifier: "Sœur portière complice"
 tog_abbess_wary_modifier: "Abbesse sur ses gardes"
 tog_eluned_message_modifier: "Message d'Eluned"
 tog_peredur_blunder_modifier: "Peredur a compté à voix haute"
 tog_story_old_groves_lessons: "Enseignements de Gwion"
 tog_story_old_groves_lessons_max: "4"
 trait_tog_awen_protected: "L'Awen"
 trait_tog_awen_protected_desc: "Le don : l'inspiration des poètes et des prophètes. Certains de ses rêves se réalisent."
 trait_tog_novice: "Novice"
 trait_tog_novice_desc: "Enfermée au couvent par le prêtre, pour la sauver du paganisme de son père."
 tog_free.success_tt: "faire sortir #V Eluned#! du couvent (en cas d'échec, le complot continue)"
 tog_quest.0229.t: "Tout est à refaire"
 tog_quest.0229.desc: "Le plan pour faire sortir Eluned a échoué. Gwion attend toujours sa fille, et il ne te parlera pas tant qu'elle sera au couvent."
 tog_quest.0229.a: "Reprendre le complot."
 tog_quest.0236.a.tt: "Gwion t'a appris tout ce qu'il sait. La route mène maintenant en Armorique."
 tog_obj_village: "Traverser la mer jusqu'en Armorique et trouver le village qui a résisté aux Romains, au bout d'un cap près de #V [GetTitleByKey('b_saint_brieuc').GetNameNoTier]#!."
 tog_obj_heric: "Trouver où était la colline de la grande bataille, là où les dieux des Gaulois ont perdu. On dit qu'un moine d'Auxerre, #V [GetTitleByKey('b_auxerre').GetNameNoTier]#!, a lu tous les livres des auteurs anciens."
 tog_dest_village: "le village d'Armorique"
 tog_dest_heric: "Auxerre"
 tog_travel_desc_village: "Un village au bord de la mer a tenu tête aux Romains plus longtemps que tous les autres. Gofraid sait où : en Armorique, au bout d'un cap."
 tog_travel_desc_heric: "Personne en Gaule ne sait où était la colline de la grande bataille. Personne, sauf peut-être un moine d'Auxerre qui a lu tous les livres des auteurs anciens."
 tog_quest.0311.t: "Le village du cap"
 tog_quest.0311.desc: "Gofraid connaissait l'endroit : au bout d'un cap, sur la côte nord, battu par le vent. En travers de la base du cap, un énorme rempart de terre à moitié effondré coupe la lande d'une mer à l'autre. Les gens du pays l'appellent le fossé de César, alors qu'il est bien plus vieux que César. Derrière, sur le plateau, il ne reste du village que des cercles de pierres, là où étaient les maisons, et des tas de cendre envahis d'herbe.\n\nOù creuser ?"
 tog_quest.0311.a: "Au pied du rempart."
 tog_quest.0311.b: "Dans les tas de cendre."
 tog_quest.0311.c: "Dans les cercles des maisons."
 tog_quest.0311.d: "Sous le foyer de la plus grande maison."
 tog_quest.0312.t: "Rien ici"
 tog_quest.0312.desc: "Vous creusez jusqu'au soir. Des tessons, des os de sanglier, des cailloux. Rien qui vaille la peine. [tog_gwion.GetFirstName] trouve que c'est un drôle de culte, de gratter la terre comme un cochon."
 tog_quest.0312.a: "Creuser ailleurs."
 tog_quest.0313.t: "La serpe d'or"
 tog_quest.0313.desc: "Sous la pierre du foyer de la plus grande maison, il y a une lame d'or. C'est un croissant mince, large comme la main au milieu et effilé aux pointes, gravé de fins chevrons. Il est si vieux que ses bords sont usés.\n\nTu le tiens longtemps dans la lumière. Tu penses à la page de Pline : « avec une faucille d'or ». Tu sais qu'une lame d'or aussi mince ne coupe rien. Tu sais aussi que tu tiens le même croissant que celui qui est gravé sur ta pierre, dans les îles, au-dessus des deux cercles.\n\nGofraid regarde le rempart et les cendres. « Ceux d'ici n'ont jamais plié, dit-il. Ni devant les Romains, ni devant les Francs. Des irréductibles. J'espère bien qu'ils ne plieront pas non plus devant les Norrois. »"
 tog_quest.0313.a: "Le croissant de ma pierre."
 tog_quest.0313.a.tt: "Tu emportes la #V serpe d'or#!. La route mène maintenant à Auxerre."
 tog_golden_sickle_name: "La serpe d'or"
 tog_golden_sickle_description: "Un mince croissant d'or gravé de chevrons, trouvé sous le foyer d'un village d'Armorique qui avait tenu tête aux Romains. Pline disait que les druides cueillaient le gui avec une faucille d'or."
 tog_quest.0321.t: "Celui qui sait"
 tog_quest.0321.desc: "Le portier a fini par céder. Un soir, le moine sort par la petite porte du jardin. Il s'appelle Héric. Il a la trentaine, les yeux fatigués de ceux qui lisent la nuit, et une curiosité qu'aucune règle ne retient. Assis sur un muret, vous parlez longtemps, en latin.\n\nHéric connaît le siège. César l'a raconté : Alésia, la ville sur la colline, encerclée de deux lignes de remparts, et Vercingétorix qui jette ses armes aux pieds du proconsul. Et Héric pense savoir où c'était : à deux jours d'ici, au-dessus du village d'Alise. En neuf siècles, le nom a à peine changé. Il l'écrit dans ses vers.\n\n« Tu cherches les dieux des Gaulois, dit-il en te quittant. Tu ne les trouveras pas là-bas. Tu trouveras l'endroit où ils ont perdu. »"
 tog_quest.0321.a: "« C'est déjà beaucoup. »"
 tog_quest.0321.a.tt: "Tu pars aussitôt pour Alise, à deux jours de route."
 tog_quest.0331.t: "Là où ils ont perdu"
 tog_quest.0331.desc: "Deux jours plus tard, tu es au pied de la colline. Le mont Auxois a le sommet plat, couvert de champs et de vignes. En bas, dans la plaine, un paysan laboure. Tu lui demandes s'il trouve des choses dans la terre. Il montre un tas de ferraille au bord du champ : des pointes de flèches, des clous, des morceaux de bronze. Et au milieu, une tête de sanglier en bronze, la gueule ouverte, montée sur un long tube tordu. Une trompe de guerre.\n\nLe paysan s'appelle Ursin. Toute sa vie, il a sorti ces débris de son champ en les maudissant, parce qu'ils ébréchaient le soc de sa charrue. Il te regarde soulever sa ferraille comme un prêtre soulève une relique. Il demande s'il peut souffler dedans. Il n'en sort qu'un râle, mais il y a dans ses yeux quelque chose qui n'y était pas le matin.\n\nLe lendemain, il a laissé son champ à son frère. Il marche derrière vous, la trompe sur l'épaule."
 tog_quest.0331.a: "« Elle est à moi, mais c'est toi qui en joueras. »"
 tog_carnyx_name: "Carnyx gaulois"
 tog_carnyx_description: "Une trompe de guerre gauloise, un carnyx, à tête de sanglier en bronze, sortie d'un champ au pied de la colline où les Gaulois se sont rendus aux Romains."
 tog_golden_sickle_modifier: "Serpe d'or"
 tog_carnyx_modifier: "Carnyx gaulois"
 tog_test_skip_step4_decision: "TEST : Commencer à l'étape 5"
 tog_test_skip_step4_decision_desc: "Décision de test, à retirer avant publication : saute les étapes précédentes si besoin et ouvre directement l'étape 5 (le continent)."
 tog_obj_guide: "Trouver un guide qui connaisse bien la Gaule, avant de partir chercher le village et la colline dont parlait Gwion."
 tog_find_guide_decision: "Chercher un guide"
 tog_find_guide_decision_desc: "Personne autour de toi ne connaît la Gaule. Il te faut un homme qui en connaisse les routes, les ports et les langues, et qui sache où il vaut mieux ne pas s'arrêter."
 tog_find_guide_decision_tooltip: "Tu fais savoir que tu cherches un guide pour la Gaule."
 tog_find_guide_decision_confirm: "Chercher"
 tog_find_guide_decision_effect_tt: "Bientôt, dans les ports et sur les marchés, on saura que tu cherches un guide."
 tog_quest.0300.t: "Chercher un guide"
 tog_quest.0300.desc: "Il te faut un homme qui connaisse la Gaule. On en trouve dans les ports et sur les marchés, mais il faut le trouver, et qu'il accepte de suivre un inconnu dans une drôle d'entreprise. Tu peux payer pour faire circuler la nouvelle, ou compter sur ton nom pour qu'on vienne à toi."
 tog_quest.0300.a: "Payer pour que la nouvelle circule."
 tog_quest.0300.b: "Faire valoir mon nom."
 tog_quest.0300.tt: "Quelqu'un se présentera dans les jours qui viennent."
 tog_quest.0301.t: "L'explorateur"
 tog_quest.0301.desc: "Un homme se présente un soir, un sac sur l'épaule. Il s'appelle Gofraid, moitié norrois, moitié gaël. Il a commencé marchand et fini vagabond. Il a remonté la Loire et la Seine, vendu des fourrures à Rouen et passé un hiver à Tours. Il a appris le roman des Francs et le breton d'Armorique. Il connaît les routes de la Gaule comme d'autres connaissent leur champ.\n\nIl t'écoute raconter ce que tu cherches en se curant les dents avec un couteau. « Un village qui a tenu tête aux Romains plus longtemps que les autres, et une colline où les dieux ont perdu ? » Il sourit. « Le village, je sais où il est. La colline, non. J'ai vu bien des choses là-bas, mais jamais quelqu'un qui cherchait ça. Je viens. »"
 tog_quest.0301.a: "« Bienvenue, Gofraid. »"
 tog_quest.0301.join_tt: "#V Gofraid#! prend son sac. La route de l'Armorique est ouverte."
 tog_quest.0331.a.tt: "Le #V carnyx gaulois#! est à toi, et #V Ursin#! le porte. Il est temps de rentrer relire la pierre."
 tog_obj_read_stone: "Rentrer et relire la pierre, à partir de la tablette de cire du premier jour. Avec tout ce que tu as appris, elle devrait enfin parler."
 tog_obj_mon: "Accomplir le premier rite des anciens à Ynys Môn, #V [GetTitleByKey('b_yns_mon').GetNameNoTier]#!, l'île où les Romains ont massacré les derniers druides."
 tog_dest_mon: "Ynys Môn"
 tog_travel_desc_mon: "La pierre dit qu'avec la faucille d'or on coupe le gui. Pline disait comment : sur un chêne, vêtu de blanc. Et il n'y a qu'un endroit qui convienne : Môn, où l'on a fait taire les dieux."
 tog_read_stone_decision: "Lire la pierre"
 tog_read_stone_decision_desc: "Tu as encore la tablette de cire du premier jour. Tu n'y comprenais rien, alors. Maintenant, tu as les livres, les dieux des lieux sacrés, les prières de Gwion et la serpe d'or."
 tog_read_stone_decision_tooltip: "Tu relis la pierre avec tout ce que tu as appris."
 tog_read_stone_decision_confirm: "Lire"
 tog_read_stone_decision_effect_tt: "Tu poses la tablette devant toi."
 tog_quest.0401.t: "La pierre lue"
 tog_quest.0411.t: "L'île des sages"
 tog_quest.0411.desc: "Le florilège de Whithorn en parlait. Un Romain y racontait que Môn était l'île des sages, et que les légions y avaient massacré les derniers druides et abattu leurs bois sacrés. Il n'y a plus de bois. Là où il en restait un peu, les moines ont fini le travail : sur la colline du grand bosquet, il y a maintenant une église.\n\nLe gui pousse sur bien des arbres, mais presque jamais sur le chêne, et Pline le savait. Tu ne l'aurais jamais trouvé sans une femme du pays, Nest. Quand elle était petite, sa grand-mère lui a montré un vallon que les gens évitent sans savoir pourquoi. Au fond, il y a un vieux chêne creux et, dans ses branches hautes, une boule de gui."
 tog_quest.0411.a: "Accomplir le rite."
 tog_quest.0412.t: "Le premier rite"
 tog_quest.0412.a: "Garder le gui, enveloppé de lin blanc."
 tog_quest.0412.tt: "Le gui est tressé en couronne. Tu emportes la #V couronne de gui de Môn#!, et #V Nest#! part avec toi."
 tog_mistletoe_name: "La couronne de gui de Môn"
 tog_mistletoe_description: "Une couronne tressée du gui coupé sur un vieux chêne creux d'Ynys Môn, recueilli dans un manteau blanc au premier rite des anciens depuis que les druides se sont tus."
 tog_mistletoe_modifier: "Couronne de gui de Môn"
 tog_test_skip_step5_decision: "TEST : Commencer à l'étape 6"
 tog_test_skip_step5_decision_desc: "Décision de test, à retirer avant publication : saute les étapes précédentes si besoin, donne la serpe d'or et ouvre directement l'étape 6 (lire la pierre)."
 tog_quest.0184.t: "Les enfants de Lir"
 tog_quest.0184.desc: "Le soir, au feu, [tog_eogan.GetFirstName] commence une histoire. C'est celle des quatre enfants du roi Lir. Leur belle-mère jalouse les a changés en cygnes, condamnés à errer neuf cents ans sur les eaux froides, jusqu'au jour où l'on entendrait sonner une cloche.\n\nIl raconte bien. Les autres se sont tus, même [tog_gofraid.GetFirstName]. Mais la nuit avance, et la route de demain est longue."
 tog_quest.0184.a: "« Continue, on t'écoute. »"
 tog_quest.0184.b: "« La fin demain. On part à l'aube. »"
 tog_quest.0185.t: "Le rêve de [tog_gwion.GetFirstName]"
 tog_quest.0185.desc: "Au réveil, [tog_gwion.GetFirstName] est pâle. Il a rêvé de la route de ce matin : un gué, des saules, et des hommes cachés dans les saules. « Certains de mes rêves se réalisent, dit-il. Pas tous. Mais celui-là, je l'ai fait deux fois. »\n\nLe gué est à une heure de marche. Le contourner fait perdre une journée."
 tog_quest.0185.a: "Contourner le gué."
 tog_quest.0185.a.tt: "Une journée de perdue. Vous ne saurez jamais s'il y avait quelqu'un dans les saules."
 tog_quest.0185.b: "« Les rêves sont des rêves. »"
 tog_quest.0185.b.good: "Il n'y a personne au gué."
 tog_quest.0185.b.bad: "Il y avait des hommes dans les saules."
 tog_quest.0186.t: "L'aubergiste"
 tog_quest.0186.desc: "L'aubergiste annonce son prix pour la nuit, le repas et le foin des bêtes. [tog_gofraid.GetFirstName] éclate de rire. « Tu comptes le foin deux fois, l'ami, et ton vin, c'est surtout de l'eau. » Il se tourne vers toi. « Laisse-moi faire. Ce genre-là, je le connais de la Loire à la Seine. »"
 tog_quest.0186.a: "« Fais. »"
 tog_quest.0186.b: "Payer le prix demandé."
 tog_quest.0187.t: "Le carnyx de minuit"
 tog_quest.0187.desc: "Au milieu de la nuit, un râle épouvantable réveille tout le campement. Les chevaux ruent, [tog_peredur.GetFirstName] cherche son épée et Lailoken jure dans une langue que personne ne connaît. C'est [tog_ursin.GetFirstName], à l'écart, la trompe à la bouche. Il s'entraîne. Il est très fier : cette fois, on a presque entendu une note."
 tog_quest.0187.a: "« Encore une fois, [tog_ursin.GetFirstName] ! »"
 tog_quest.0187.b: "« Pas la nuit. »"
 tog_quest.0401.desc: "Tu poses sur la table la tablette de cire du premier jour, quand tu ne savais rien. À l'époque, ce n'étaient que des traits. Ce soir, tu poses la serpe d'or à côté, et tu regardes.\n\nLe croissant, en haut, c'est la serpe. Tu la tiens dans ta main : mêmes pointes effilées, même courbe. La flèche brisée qui le traverse, c'est la branche qu'on coupe, le gui qui tombe du chêne, comme chez Pline. Les deux cercles reliés, ce sont les deux feux de Beltaine dont parlait le livre gratté de Dunkeld, ceux qu'on a allumés pendant des siècles sur la colline d'Uisneach. Et le zigzag qui les traverse, c'est le chemin des âmes. Le florilège de Whithorn les disait immortelles : elles passent d'un monde à l'autre par le puits d'Uisneach, par la maison du Dagda.\n\nPièce après pièce, tout ce que tu as rassemblé depuis des années vient se poser sur la pierre, et tout s'emboîte. Ce n'est plus un dessin. C'est une prière."
 tog_quest.0401.lailoken: "\n\nLailoken s'est approché sans bruit. Il pose son vieux doigt sur le croissant, comme le jour où il t'a dit que c'était un texte. « Il y a quarante ans que je regarde ces pierres, dit-il. Je savais qu'elles parlaient. Je ne savais pas qu'elles disaient ça. »"
 tog_quest.0401.end: "\n\nTu prends une tablette neuve et tu écris, d'une main qui ne tremble pas : #italic Avec la faucille d'or, on coupe le gui sur le chêne. Par les deux feux, les âmes passent et reviennent.#! Ce sont les premiers mots du culte. Ils n'existaient plus nulle part. Maintenant, ils existent.\n\nIl reste à faire ce qu'elle dit."
 tog_quest.0401.a: "« Il reste à faire ce qu'elle dit. »"
 tog_quest.0401.a.tt: "La pierre a parlé. Il faut maintenant couper le gui, à Ynys Môn."
 tog_quest.0413.t: "Les hommes de la colline"
 tog_quest.0413.intro: "Tu reviens au vallon vêtu de blanc, comme le disait Pline, tes compagnons autour de toi.\n\nC'est [tog_nest.GetFirstName] qui tient le manteau blanc sous l'arbre. Personne ne l'a décidé : elle s'est avancée d'elle-même. Ce chêne, les femmes de sa famille l'ont gardé pendant des générations. C'est à elle de recevoir ce qu'il donne.\n\nTu es à mi-hauteur du chêne quand [tog_nest.GetFirstName] crie. Au bord du vallon, une vingtaine d'hommes descendent entre les arbres. Il y a des paysans avec des bâtons et des fourches, deux hommes du seigneur en armes et, devant eux, un moine en robe noire, une croix levée. Quelqu'un l'a prévenu. « Abattez cet arbre ! Arrachez le diable de ses branches ! »\n\nTu n'as pas le temps de descendre. Tu n'en as pas besoin. En bas, sans un mot, tes compagnons se sont placés entre le chêne et la colline."
 tog_quest.0413.peredur: " [tog_peredur.GetFirstName] a tiré son épée."
 tog_quest.0413.gofraid: " [tog_gofraid.GetFirstName] a sorti son couteau."
 tog_quest.0413.eogan: " [tog_eogan.GetFirstName] a pris son bâton de berger."
 tog_quest.0413.lailoken: " Même le vieux Lailoken s'est levé, appuyé sur son bâton."
 tog_quest.0413.gwion: " [tog_gwion.GetFirstName] ne bouge pas : il regarde le moine droit dans les yeux."
 tog_quest.0413.together: " Personne ne se retourne vers toi. Ils te laissent faire."
 tog_quest.0413.carnyx: "\n\nAlors [tog_ursin.GetFirstName] lève le carnyx.\n\nLe son roule dans le vallon comme le rugissement d'une bête, rauque, énorme. Personne ici n'a entendu ce son depuis mille ans. La tête de sanglier en bronze semble hurler. Les paysans s'arrêtent net. L'un d'eux lâche sa fourche. Le moine lève sa croix plus haut, mais derrière lui, les hommes reculent déjà, puis ils courent."
 tog_quest.0413.nocarnyx: "\n\nLes paysans regardent ces hommes armés qui ne reculent pas d'un pas. Ils hésitent et se regardent. Puis, l'un après l'autre, ils reculent, et ils se mettent à courir."
 tog_quest.0413.end: "\n\nLe moine reste seul un moment au bord du vallon. Puis il part, lui aussi."
 tog_quest.0413.a: "« Qu'on les laisse partir. »"
 tog_quest.0413.b: "« Rattrapez le moine ! »"
 tog_quest.0413.tt: "Tes compagnons ont pris les armes pour toi. Ils ne l'oublieront pas."
 tog_quest.0412.desc: "Quand le vallon est redevenu silencieux, tu lèves la serpe d'or vers la branche. Elle ne coupe pas, bien sûr. Tu tranches le gui avec ton couteau et tu le laisses tomber dans le manteau que Nest tend en dessous.\n\nRien ne se passe. Le vent agite les feuilles. Un merle chante.\n\nMais pour la première fois depuis des générations, quelqu'un a accompli un rite des anciens. Tu ne sais pas si tu l'as fait comme il fallait. Mais il est fait, et désormais tu sauras l'écrire.\n\nQuand tu redescends de l'arbre, Nest n'a pas bougé. Elle tient toujours le manteau plié contre elle, le gui au creux du lin. Elle regarde le chêne comme si elle le voyait pour la première fois.\n\n« Ma grand-mère m'a fait jurer de ne jamais couper de bois ici, dit-elle enfin. Cent fois, je lui ai demandé pourquoi. Elle répondait qu'elle ne savait pas, que sa mère le lui avait fait jurer aussi. Elle est morte sans savoir. » Elle te tend le manteau. « Toi, tu sais. Tu as trouvé ce qu'elles gardaient sans le savoir. Je ne vais pas rentrer chez moi et faire semblant de l'ignorer. Si tu écris ce qu'on fait sous ce chêne, je veux être là. »"
 tog_obj_step7: "Le premier rite est accompli. Ce qui a été rassemblé ne doit plus jamais se perdre : il faut l'écrire."
 tog_obj_verses: "Écrire les Vers sacrés : tout ce que tu as rassemblé, pour qu'on puisse l'enseigner, le recopier, et que plus personne ne puisse l'effacer."
 tog_obj_founded: "Le culte des anciens a de nouveau des fidèles."
 tog_story_old_groves_verses: "Vers sacrés : +[Story.MakeScope.Var('tog_verses_rate').GetValue|V0] % par mois"
 tog_story_old_groves_verses_max: "100"
 tog_write_verses_decision: "Écrire les Vers sacrés"
 tog_write_verses_decision_desc: "Si l'Église a gagné, c'est parce qu'elle avait un livre : le même partout, que les prêtres recopiaient d'un bout à l'autre du monde. Les anciens dieux n'avaient que la mémoire des druides, et quand les druides sont morts, tout est mort avec eux. Tu ne referas pas la même erreur."
 tog_write_verses_decision_tooltip: "Tu commences un livre qui rassemble tout ce que le culte des anciens a été."
 tog_write_verses_decision_confirm: "Commencer à écrire"
 tog_write_verses_decision_effect_tt: "L'écriture commence. Elle avance chaque mois selon ton érudition, et tes compagnons y prendront part."
 tog_verses.up: "L'écriture avance."
 tog_verses.up_big: "L'écriture avance beaucoup."
 tog_verses.up_small: "L'écriture avance un peu."
 tog_verses.same: "L'écriture n'avance pas."
 tog_verses.down: "Il faut reprendre des pages : l'écriture recule."
 tog_quest.0511.t: "Deux manières de dire"
 tog_quest.0511.desc: "[tog_gwion.GetFirstName] et [tog_eogan.GetFirstName] se disputent au-dessus de ta page, à propos de la maison du Dagda et de la ruse d'Óengus. [tog_eogan.GetFirstName] la raconte comme son grand-père, avec les détails qui font rire et les silences qui font peur. [tog_gwion.GetFirstName] dit que ce n'est pas une histoire de veillée. Ce sont des mots qu'on disait aux dieux, et on ne les change pas pour faire rire.\n\nIls se tournent vers toi tous les deux."
 tog_quest.0511.a: "« [tog_gwion.GetFirstName] a raison : ce sont des mots sacrés. »"
 tog_quest.0511.b: "« [tog_eogan.GetFirstName] a raison : c'est comme ça que le peuple s'en souvient. »"
 tog_quest.0511.c: "« J'écrirai les deux, l'une à côté de l'autre. »"
 tog_quest.0512.t: "Un souvenir de Lailoken"
 tog_quest.0512.desc: "Lailoken somnolait près du feu. Il se redresse d'un coup. « Ma mère chantait ça ! » C'est une comptine de son enfance, sur une femme qui sortait d'un lac avec une coupe à la main. Il en retrouve trois vers, puis cinq. Puis il hésite, recommence, mélange.\n\nC'est peut-être un fragment très ancien. C'est peut-être une chanson de marché."
 tog_quest.0512.a: "L'écrire tel qu'il s'en souvient."
 tog_quest.0512.a.bad: "Le lendemain, il s'en souvient autrement : il faut reprendre des pages."
 tog_quest.0512.b: "« Ta mémoire te trompe, vieil homme. »"
 tog_quest.0513.t: "Ce que faisaient les femmes"
 tog_quest.0513.desc: "[tog_nest.GetFirstName] lit par-dessus ton épaule et fronce les sourcils. « Il n'y a que des hommes, dans ton livre. Des druides, des rois, des guerriers. » Elle te raconte ce que faisait sa grand-mère : le lait versé à la source au premier jour de mai, la braise gardée toute la nuit d'Imbolc, les mots qu'on dit à une femme qui accouche. « Personne ne les a jamais écrits, parce que personne ne les a jamais demandés aux femmes. »"
 tog_quest.0513.a: "« Ils auront leur chapitre. »"
 tog_quest.0513.b: "« Le livre parle des dieux, pas du foyer. »"
 tog_quest.0514.t: "[tog_peredur.GetFirstName] compte les pages"
 tog_quest.0514.desc: "[tog_peredur.GetFirstName] a passé la soirée à compter les pages. « Il y en a cent quatre-vingt-sept. Et il y en a onze où tu as écrit Lug avec deux g. » Il propose de les numéroter toutes, pour qu'on ne les mélange jamais. Il a l'air très fier de son idée."
 tog_quest.0514.a: "« Numérote-les, [tog_peredur.GetFirstName]. »"
 tog_quest.0514.a.good: "Les pages sont numérotées, parfaitement en ordre. On en parle jusqu'au village."
 tog_quest.0514.b: "« Laisse les pages tranquilles, [tog_peredur.GetFirstName]. »"
 tog_quest.0515.t: "Le rêve de la page"
 tog_quest.0515.desc: "[tog_gwion.GetFirstName] vient te trouver avant l'aube. Il a rêvé d'une page du livre, une page que tu n'as pas encore écrite : la prière qu'on dit quand on allume les feux de Beltaine. Il l'a vue mot à mot. Il veut que tu l'écrives tout de suite, avant que le rêve s'efface."
 tog_quest.0515.a: "Écrire ce qu'il a rêvé."
 tog_quest.0515.a.bad: "En la relisant, [tog_gwion.GetFirstName] n'est plus sûr de rien : il faut reprendre."
 tog_quest.0515.b: "« Un rêve n'est pas un livre. »"
 tog_quest.0516.t: "Le vélin de [tog_gofraid.GetFirstName]"
 tog_quest.0516.desc: "[tog_gofraid.GetFirstName] revient du marché avec un ballot sous le bras. « Du vélin de Tours. Le meilleur. Je l'ai eu à moitié prix d'un marchand qui ne savait pas ce qu'il vendait. » Il le pose sur la table avec un clin d'œil. « Enfin, à moitié prix, c'est encore un prix. »"
 tog_quest.0516.a: "« Je le prends à ton prix. »"
 tog_quest.0516.b: "Marchander durement."
 tog_quest.0519.t: "Une nuit d'écriture"
 tog_quest.0519.desc: "La lampe fume, l'encre épaissit, et le passage que tu écris ne vient pas. Tu pourrais continuer jusqu'à l'aube. Tu pourrais aussi aller dormir et y revenir demain."
 tog_quest.0519.a: "Écrire toute la nuit."
 tog_quest.0519.b: "Tout relire depuis le début."
 tog_quest.0501.t: "Le serment"
 tog_quest.0501.desc: "Le livre est fini. Tu l'appelles les Vers sacrés.\n\nTu sais qu'il n'est pas parfait. Il y a des trous que tu as comblés comme tu as pu, et des choses que tu as dû choisir faute de savoir. Mais pour la première fois depuis très longtemps, le culte des anciens existe ailleurs que dans les marges des moines.\n\nLe jour de Beltaine, tu montes sur la colline avec ceux qui t'ont suivi, rencontrés un à un sur le chemin. Tu leur lis les Vers d'un bout à l'autre, à voix haute, sous le ciel. [tog_gwion.GetFirstName] verse le lait dans le feu de Beltaine. Pour la première fois de sa vie, il ne regarde pas autour de lui pour vérifier que personne ne le voit. Puis chacun, à son tour, jure par Lug et par le Dagda, comme on jurait avant le baptême.\n\nCe soir-là, le culte des anciens a de nouveau des fidèles."
 tog_quest.0501.a: "« Par Lug et par le Dagda. »"
 tog_quest.0501.a.tt: "Le culte des anciens renaît : toi, ta cour et tes compagnons prêtez serment, et les #V Vers sacrés#! rejoignent ton trésor. Si ta lignée suit le rite gaélique, elle prend le nom légendaire de #V Lugaid#!. Si tu es aventurier, les fidèles dressent dans ton camp une #V tente des offrandes#!."
 tog_verses_book_name: "Les Vers sacrés"
 tog_verses_book_description: "Le livre qui rassemble tout ce que le culte des anciens a été : la pierre, les livres des moines, les dieux des lieux sacrés, les prières du gardien, le premier rite. Écrit pour que plus personne ne puisse l'effacer."
 tog_verses_book_modifier: "Vers sacrés"
 tog_house_lugaid: "Lugaid"
 tog_test_skip_step6_decision: "TEST : Commencer à l'étape 7"
 tog_test_skip_step6_decision_desc: "Décision de test, à retirer avant publication : met en place les compagnons et les artefacts des étapes précédentes et ouvre directement l'étape 7 (les Vers sacrés)."
 tog_quest.0603.t: "La relève"
 tog_quest.0603.desc: "[tog_dead_companion.GetFirstName] vous a quittés. Sa place près du feu reste vide toute la soirée.\n\nLe lendemain, [tog_heir_companion.GetFirstName] vient te trouver, les yeux rougis. « [tog_dead_companion.GetSheHe|U] me parlait de ce que vous cherchiez. Je veux continuer à sa place. »"
 tog_quest.0603.a: "« Ta place est avec nous. »"
 tog_quest.0603.a.tt: "#V [tog_heir_companion.GetFirstName]#! prend la place de [tog_dead_companion.GetFirstName] près du feu."
 tog_quest.0601.t: "Ce qu'il laisse"
 tog_quest.0601.desc: "On t'a apporté ses affaires : la tablette de cire de la pierre, ses notes, des tablettes couvertes d'une écriture serrée. Tu es encore trop jeune pour comprendre tout ce qu'il cherchait. Mais ses compagnons sont restés, et ils te regardent comme on regarde quelqu'un qu'on attend."
 tog_quest.0601.a: "« Un jour, je comprendrai. »"
 tog_quest.0601.a.tt: "La quête reprendra quand tu auras 16 ans."
 tog_quest.0602.t: "L'héritage"
 tog_quest.0602.desc: "Tu as repris ses notes, sa tablette de la pierre, tout ce qu'il avait rassemblé. Ses compagnons sont venus te trouver un par un. Ils n'ont rien demandé : ils voulaient seulement savoir si tu continuerais.\n\nTu as ouvert ses notes à la page où il s'était arrêté."
 tog_quest.0602.a: "« Je continue. »"
 tog_quest.0602.a.tt: "Tu reprends le chemin là où il s'était arrêté."
 tog_quest.0514.b.bad: "[tog_peredur.GetFirstName] boude dans un coin et compte à voix haute les poutres du plafond. Impossible de se concentrer."
 tog_quest.0519.b.good: "En relisant, le passage qui manquait te vient tout seul."
 tog_quest.0516.b.good: "[tog_gofraid.GetFirstName] grogne, mais lâche le ballot pour presque rien. Tout le monde a entendu la scène."
 tog_quest.0513.b.bad: "[tog_nest.GetFirstName] ne t'adresse plus la parole. Ce chapitre-là ne sera pas écrit."
 tog_quest.0516.c: "« Je prends tout et je paie un copiste de Tours avec. »"
 tog_quest.0519.c: "Payer des copistes pour aller plus vite."
 tog_quest.0520.t: "Une page qui ne tient pas"
 tog_quest.0520.desc: "Tu relis la page d'hier, et elle ne tient pas. Les mots sont justes un par un, mais ensemble ils ne disent rien. Ce n'est pas comme ça qu'on parlait aux dieux."
 tog_quest.0520.a: "La déchirer et recommencer."
 tog_quest.0520.b: "La laisser et y revenir plus tard."
 tog_quest.0521.t: "Un visiteur curieux"
 tog_quest.0521.desc: "Un marchand de passage, reçu à ta table, a vu les feuillets sur ton pupitre. Il demande poliment ce que tu écris de si important. Il a l'air d'un homme qui raconte tout ce qu'il voit au premier prêtre venu."
 tog_quest.0521.a: "Lui montrer une page sans danger."
 tog_quest.0521.a.good: "Il s'ennuie au bout de trois lignes et parle d'autre chose."
 tog_quest.0521.a.bad: "Il a lu un nom de dieu par-dessus ton épaule. Des bruits courent sur toi au village."
 tog_quest.0521.b: "Lui offrir de quoi oublier ce qu'il a vu."
 tog_quest.0522.t: "L'encre manque"
 tog_quest.0522.desc: "Le dernier pot d'encre est vide. On en trouve de la bonne en ville, à bon prix. Sinon, [tog_gwion.GetFirstName] dit qu'autrefois on la faisait avec des galles de chêne et du fer. Il saurait peut-être s'en souvenir."
 tog_quest.0522.a: "Acheter de la bonne encre en ville."
 tog_quest.0522.b: "La faire soi-même, avec des galles de chêne."
 tog_quest.0522.b.good: "L'encre est noire et tient bien. Elle a même une odeur de forêt."
 tog_quest.0522.b.bad: "L'encre pâlit en séchant : il faut repasser sur des pages entières."
 tog_quest.0513.a.great: "[tog_nest.GetFirstName] fait venir des femmes du pays. Elles parlent toute la nuit, et tu écris tout."
 tog_quest.0512.a.great: "Les vers de Lailoken font écho à un passage des livres. Ce n'était pas une chanson de marché."
 tog_quest.0512.b.bad: "Lailoken boude au coin du feu. La soirée est perdue."
 tog_quest.0511.b.great: "[tog_eogan.GetFirstName] raconte, tu écris et les pages se remplissent. Le récit se répète déjà dans le village."
 tog_quest.0511.a.great: "Écrits comme [tog_gwion.GetFirstName] les dit, les mots sonnent comme une prière."
 tog_quest.0515.a.great: "La prière de [tog_gwion.GetFirstName] coule d'elle-même. En la lisant à voix haute, tu as l'impression de l'avoir toujours sue."
 tog_find_bard_decision_desc: "Un culte se répand par les poètes plus que par les prêtres. Les bardes vont de cour en cour, et les rois les écoutent. Il en faut un qui chante les Vers."
 tog_find_bard_decision: "Chercher un barde"
 tog_test_skip_step7_decision_desc: "Décision de test, à retirer avant publication : met en place les compagnons et les artefacts, fonde le culte et ouvre directement l'étape 8 (les fidèles)."
 tog_find_bard_decision_effect_tt: "Trois bardes se présenteront ; tu choisiras celui qui rejoint ta cour."
 tog_find_bard_decision_confirm: "Chercher"
 tog_send_companions_decision: "Envoyer les compagnons prêcher"
 tog_obj_faithful: "Répandre le culte : envoyer tes compagnons gagner des fidèles parmi les seigneurs, et trouver un barde pour chanter les Vers.[Story.Custom('TogMissionLine_tog_eogan')][Story.Custom('TogMissionLine_tog_nest')][Story.Custom('TogMissionLine_tog_gofraid')][Story.Custom('TogMissionLine_tog_ursin')][Story.Custom('TogMissionLine_tog_gwion')][Story.Custom('TogMissionLine_tog_peredur')][Story.Custom('TogMissionLine_tog_lailoken')]"
 tog_quest.0730.t: "La première veillée"
 tog_send_companions_decision_confirm: "Les envoyer"
 tog_find_bard_decision_tooltip: "Tu fais savoir que tu cherches un barde."
 tog_quest.0730.desc: "Ils sont tous rentrés. Ce soir, pour la première fois, la grande salle est pleine : tes compagnons, poussiéreux de leurs routes, les gens de ta maison, et quelques visages que tu ne connais pas, venus parce qu'ils ont entendu parler de toi.\n\n[tog_bard.GetFirstName] prend sa harpe. Il ne chante pas une chanson : il chante les Vers, depuis le premier mot. Le croissant et le gui, les deux feux, le Dagda dans sa maison de la Boyne, Lug qui va et vient entre les mondes. Personne ne parle. Même les serviteurs se sont arrêtés au fond de la salle.\n\n"
 tog_quest.0721.tt: "Le barde s'installe à ta cour. Tant qu'il reste, son talent te sert."
 tog_send_companions_decision_tooltip: "Tu envoies tes compagnons auprès des seigneurs de leurs pays."
 tog_send_companions_decision_desc: "Les Vers sont écrits. Il faut maintenant qu'on les entende. Tes compagnons viennent chacun d'un pays différent : qu'ils y retournent, et qu'ils gagnent à la foi les seigneurs qui voudront l'écouter."
 tog_quest.0721.a: "Le fili d'Irlande, [tog_bard_1.GetFirstName] : le savoir des anciens."
 tog_quest.0712.lost: "#N [tog_mission_target.GetTitledFirstName] n'a pas été converti.#!\n\nUn messager arrive avec la nouvelle : [tog_mission_target.GetTitledFirstName] a écouté poliment, puis a renvoyé [tog_missionary.GetFirstName] avec un repas et rien d'autre. La route du retour sera longue."
 tog_quest.0712.won: "#P [tog_mission_target.GetTitledFirstName] a rejoint le culte des anciens.#!\n\nUn messager arrive avec la nouvelle : [tog_mission_target.GetTitledFirstName] a écouté longtemps, puis il a demandé qu'on lui lise les Vers une seconde fois. Il a juré par Lug et par le Dagda.\n\nLe culte des anciens a un seigneur de plus."
 tog_quest.0721.b: "Le barde gallois, [tog_bard_2.GetFirstName] : la gloire dans les cours des rois."
 tog_quest.0721.desc: "Trois se sont présentés. Un fili d'Irlande, qui récite sans hésiter la généalogie de vingt rois. Un barde gallois à la voix claire, qui a chanté à la cour de Gwynedd. Et un chanteur d'Armorique, plus âgé, qui parle peu mais connaît des chansons que plus personne ne sait.\n\nUn seul restera."
 tog_quest.0721.c: "Le chanteur d'Armorique, [tog_bard_3.GetFirstName] : les vieux chants qui apaisent."
 tog_quest.0712.t: "Des nouvelles de [tog_missionary.GetFirstName]"
 tog_quest.0730.a: "« Ce n'est qu'un début. »"
 tog_send_companions_decision_effect_tt: "Chaque compagnon part pour son pays et tente de gagner un comte au culte des anciens. Plus il t'apprécie, plus il a de chances. Ils reviendront dans quelques mois."
 tog_quest.0730.a.tt: "Les Vers se répandent. Le culte des anciens grandit."
 tog_test_skip_step7_decision: "TEST : Commencer à l'étape 8"
 tog_quest.0721.t: "Les bardes"
 tog_quest.0712.other: "[tog_missionary.GetFirstName] a porté les Vers chez [tog_mission_target.GetTitledFirstName].\n\n"
 tog_quest.0712.peredur: "[tog_missionary.GetFirstName] est parti vers le Nord. Chez [tog_mission_target.GetTitledFirstName], il a récité les Vers de mémoire, sans en oublier un, en comptant les strophes sur ses doigts. Il s'est trompé de gauche et de droite en indiquant le chemin de la colline sacrée, mais personne ne l'a remarqué.\n\n"
 tog_quest.0712.triumph: "#P [tog_mission_target.GetTitledFirstName] a rejoint le culte des anciens.#!\n\nUn messager arrive avec la nouvelle : [tog_mission_target.GetTitledFirstName] a juré par Lug et par le Dagda devant tous ses gens. Depuis, ses bardes chantent ton nom dans sa grande salle.\n\nLe culte des anciens a un seigneur de plus, et un allié."
 tog_quest.0712.lailoken: "Lailoken a voulu partir, malgré son âge. Il est arrivé chez [tog_mission_target.GetTitledFirstName] appuyé sur son bâton. Il a parlé comme parlent les vieux, longtemps, de choses que plus personne ne se rappelle.\n\n"
 tog_quest.0712.nest: "[tog_missionary.GetFirstName] est rentrée au pays de Galles. Elle n'a pas parlé de dieux, d'abord : elle a parlé du vieux chêne de Môn, de sa grand-mère, des femmes qui gardaient l'arbre sans savoir pourquoi. [tog_mission_target.GetTitledFirstName] l'a laissée parler.\n\n"
 tog_quest.0712.gofraid: "[tog_missionary.GetFirstName] a débarqué dans les îles avec un ballot de marchandises et l'envie de parler. Chez [tog_mission_target.GetTitledFirstName], il a vendu ses fourrures, bu plus que de raison et parlé de Lug comme d'un vieil ami.\n\n"
 tog_quest.0712.chased: "#N [tog_mission_target.GetTitledFirstName] n'a pas été converti.#!\n\nUn messager arrive avec la nouvelle : [tog_mission_target.GetTitledFirstName] a fait chasser [tog_missionary.GetFirstName] à coups de bâton par ses hommes, sous les cris de son chapelain. On parle de toi dans sa cour, et pas en bien."
 tog_quest.0712.gwion: "[tog_missionary.GetFirstName] est retourné vers la Solway, là où les siens priaient en secret depuis toujours. Il a demandé à voir [tog_mission_target.GetTitledFirstName] et il lui a dit les prières dans la vieille langue, sans rien expliquer.\n\n"
 tog_quest.0712.eogan: "[tog_missionary.GetFirstName] est arrivé en Irlande avec son bâton de berger et ses histoires. Il s'est assis à la table de [tog_mission_target.GetTitledFirstName] et il a raconté, comme il sait le faire, la maison du Dagda et la ruse d'Óengus.\n\n"
 tog_quest.0712.wounded: "#N [tog_mission_target.GetTitledFirstName] n'a pas été converti.#!\n\nUn messager arrive avec la nouvelle : les hommes du prêtre de [tog_mission_target.GetTitledFirstName] ont attendu [tog_missionary.GetFirstName] au détour d'un chemin. Ils l'ont battu et laissé dans un fossé. [tog_missionary.GetFirstName] rentre, avec les marques des coups."
 tog_quest.0712.ursin: "[tog_missionary.GetFirstName] est reparti vers la Bourgogne, le carnyx sur l'épaule. Devant le château de [tog_mission_target.GetTitledFirstName], il a soufflé dans la trompe jusqu'à ce qu'on vienne lui demander ce qu'il voulait.\n\n"
 tog_test_random_opinions_decision: "TEST : Opinions aléatoires des compagnons"
 tog_test_random_opinions_decision_desc: "Décision de test, à retirer avant publication : donne à chaque compagnon une opinion de toi tirée au hasard (+80, +40, −20 ou −60), pour tester les missions."
 trait_tog_blood_of_myrddin: "Sang de Myrddin"
 trait_tog_blood_of_myrddin_desc: "Il dit descendre de Myrddin, le fou des forêts qui voyait l'avenir et que l'on disait fils d'un démon. Personne ne sait si c'est vrai, mais le vieil homme refuse obstinément de mourir, et il voit venir ce que les autres ne voient pas."
 tog_second_sight_modifier: "Seconde vue de Lailoken"
 tog_second_sight_modifier_desc: "Lailoken voit ce qui se trame avant que ça se trame : les complots contre toi sont plus difficiles à cacher."
 tog_bard_welsh_modifier: "Barde des anciens"
 tog_bard_fili_modifier_desc: "Un fili d'Irlande récite les Vers et les généalogies : piété et savoir."
 tog_bard_welsh_modifier_desc: "Un barde gallois chante les Vers de cour en cour : prestige et faveur des vassaux."
 tog_bard_breton_modifier: "Chanteur des anciens"
 tog_bard_breton_modifier_desc: "Un chanteur d'Armorique connaît des chants que personne ne sait plus : ils apaisent le cœur."
 tog_bard_fili_modifier: "Fili des anciens"
 tog_mission_res_wounded: "a été blessé"
 tog_mission_res_pending: "en route"
 tog_empty: ""
 tog_mission_res_lost: "n'a convaincu personne"
 tog_mission_res_chased: "a été chassé"
 tog_mission_res_triumph: "a converti un comte, qui chante tes louanges"
 tog_mission_res_won: "a converti un comte"
 tog_mission_line_tog_eogan: "\n• [Story.MakeScope.Var('tog_eogan').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_eogan')]"
 tog_mission_line_tog_nest: "\n• [Story.MakeScope.Var('tog_nest').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_nest')]"
 tog_mission_line_tog_gofraid: "\n• [Story.MakeScope.Var('tog_gofraid').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_gofraid')]"
 tog_mission_line_tog_ursin: "\n• [Story.MakeScope.Var('tog_ursin').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_ursin')]"
 tog_mission_line_tog_gwion: "\n• [Story.MakeScope.Var('tog_gwion').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_gwion')]"
 tog_mission_line_tog_peredur: "\n• [Story.MakeScope.Var('tog_peredur').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_peredur')]"
 tog_mission_line_tog_lailoken: "\n• [Story.MakeScope.Var('tog_lailoken').Char.GetFirstName] : [Story.Custom('TogMissionRes_tog_lailoken')]"
 tog_quest.0721.county_tt: "Dans deux mois, ses chants auront gagné au culte des anciens le comté où se tient ta cour."
 tog_quest.0722.t: "Les chants du barde"
 tog_quest.0722.desc: "Depuis deux mois, [tog_bard.GetFirstName] chante les Vers sur les marchés, aux veillées, aux noces, partout où l'on veut bien l'écouter. Les enfants les savent par cœur avant leurs prières. Les vieux hochent la tête : c'étaient les histoires de leurs grands-parents.\n\nUn matin, le prêtre dit la messe dans une église presque vide. Tout [tog_bard_county.GetName] chante les Vers."
 tog_quest.0722.a: "« Chante encore. »"
 tog_quest.0712.yes: "Un seigneur de plus pour les anciens dieux."
 tog_quest.0712.no: "Ce sera pour une autre fois."
 tog_quest.0730.nolords: "Quand il se tait, personne n'applaudit. Ils restent assis longtemps, comme on reste après une prière. Cette fois, tes compagnons n'ont gagné aucun seigneur. Mais dans les villages qu'ils ont traversés, on fredonne déjà des bouts de Vers sans savoir d'où ils viennent.\n\nLes seigneurs viendront plus tard. Les chants, eux, sont déjà partis."
 tog_quest.0730.lords: "Quand il se tait, on frappe à la porte. Un messager arrive, puis un autre. Des seigneurs que tu n'as jamais rencontrés, gagnés par tes compagnons, t'envoient leur salut. Ils demandent quand ils pourront venir entendre les Vers à leur tour.\n\nIl y a des années, tu n'avais qu'une pierre que personne ne savait lire. Ce soir, le culte des anciens a ses seigneurs, son barde et ses chants."
 tog_obj_step10: "Les Vers se répandent dans les villages. Le culte des anciens grandit."
 tog_test_skip_step8_decision_desc: "Décision de test, à retirer avant publication : met en place les compagnons, fonde le culte si besoin et ouvre l'étape 10 ; la peste se déclare le mois suivant."
 tog_test_skip_step8_decision: "TEST : Commencer à l'étape 10"
 tog_obj_plague: "Une peste des bêtes ravage un duché voisin. Va y allumer les feux de Beltaine."
 tog_obj_fires: "Allumer les feux de Beltaine au cœur du duché frappé."
 tog_story_old_groves_plague: "Duché frappé par la peste"
 tog_cattle_plague_modifier: "Peste des bêtes"
 tog_cattle_plague_modifier_desc: "Les bêtes meurent dans les étables et les champs. Les reliques et les bénédictions n'y font rien."
 nick_tog_voice_of_lug: "la Voix de Lug"
 nick_tog_voice_of_lug_desc: "A allumé les feux de Beltaine, et Lug a parlé par sa bouche."
 fervor_gain_tog_miracle: "Miracle des feux de Beltaine"
 tog_beltaine_fires_decision: "Allumer les feux de Beltaine"
 tog_beltaine_fires_decision_desc: "Le livre gratté de Dunkeld le disait : à Beltaine, on faisait passer les bêtes entre deux feux, contre les maladies. Les moines n'ont rien pu faire contre la peste. Les anciens dieux, peut-être."
 tog_beltaine_fires_decision_tooltip: "Tu pars pour le duché frappé par la peste."
 tog_beltaine_fires_decision_confirm: "En route"
 tog_beltaine_fires_decision_effect_tt: "Tu prends la route du duché frappé."
 tog_quest.0900.t: "La peste des bêtes"
 tog_quest.0900.desc: "Un marchand de passage raconte ce qu'il a vu dans le duché de [tog_plague_duchy.GetNameNoTier]. Des vaches couchées dans les champs ne se relèvent plus. On brûle les étables avec les bêtes dedans. Des familles mangent leurs semences. Les évêques ont fait sortir les reliques, les moines ont béni les troupeaux. Rien n'y fait.\n\nTu te souviens d'une page du livre gratté de Dunkeld : à Beltaine, on allumait deux feux et on faisait passer les bêtes entre les flammes, « contre les maladies »."
 tog_quest.0900.a: "« Il faut y aller. »"
 tog_quest.0900.a.tt: "Tu peux maintenant prendre la décision #V Allumer les feux de Beltaine#!."
 tog_quest.0901.t: "La foule"
 tog_quest.0901.desc: "La nouvelle t'a précédé. Quand tu arrives, ils sont déjà là. Ils sont des centaines, venus de tout [tog_plague_duchy.GetNameNoTier] avec ce qui leur reste de bêtes : des vaches maigres, des moutons qui toussent, une chèvre qu'un enfant tient au bout d'une corde. Ils ne savent pas qui tu es. Ils savent seulement que les prières des moines n'ont rien changé, et qu'on dit que toi, tu connais d'autres prières.\n\nTes compagnons ont préparé le bois : deux bûchers de chêne, de part et d'autre du chemin. Le soleil se couche. Personne ne parle."
 tog_quest.0901.a: "« Allumez les feux. »"
 tog_quest.0902.t: "La Voix de Lug"
 tog_quest.0902.desc: "Toute la nuit, les bêtes passent entre les flammes, l'une après l'autre, et tu dis les Vers. Vers l'aube, le vent tombe d'un coup. Les deux feux se penchent l'un vers l'autre et se rejoignent au-dessus du chemin, en arche. Trois corbeaux tournent trois fois au-dessus, puis s'en vont vers l'ouest.\n\nAu matin, les bêtes se relèvent. Elles mangent.\n\nTu montes sur la pierre au bord du chemin. La foule se tait. Et les mots qui sortent de ta bouche ne sont pas les tiens : « Je ne suis pas mort à Uisneach. J'attendais qu'on rallume mon feu. »\n\nLes anciens dieux ont de nouveau des prêtres, des fidèles et un miracle. Mais les chrétiens tiennent encore les terres où on les priait. Les bois sacrés de l'île de Bretagne et d'Irlande ne seront libres que lorsque ces terres seront rendues aux anciens dieux."
 tog_quest.0902.a: "« Lug est revenu. »"
 tog_quest.0902.a.tt: "La peste disparaît. Le duché de [tog_plague_duchy.GetNameNoTier] rejoint le culte des anciens, et certains de ses seigneurs aussi. On t'appelle désormais #V la Voix de Lug#!, et une armée de #V fidèles de Lug#! se lève pour toi ; d'autres viendront avec le temps.\n\nTa dynastie obtient le casus belli #V Rendre la terre aux anciens dieux#! : un duché de Grande-Bretagne ou d'Irlande tenu par des chrétiens pour un seigneur, un comté pour un aventurier."
 tog_expel_saxons_cb: "Rendre la terre aux anciens dieux"
 tog_expel_saxons_cb_desc: "Reprendre un duché de Grande-Bretagne ou d'Irlande aux chrétiens."
 TOG_EXPEL_SAXONS_CB_NAME: "Rendre [TITLE.GetBaseNameNoTier] aux anciens dieux"
 TOG_EXPEL_SAXONS_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Guerre pour rendre [TITLE.GetBaseNameNoTier] aux anciens dieux"
 TOG_EXPEL_SAXONS_WAR_NAME_BASE: "Guerre pour rendre la terre aux anciens dieux"
 tog_expel_saxons_victory_desc: "L'attaquant obtient les comtés du duché tenus par le défenseur et ses vassaux."
 tog_expel_saxons_white_peace_desc: "Aucun territoire ne change de mains."
 tog_expel_saxons_defeat_desc: "L'attaquant paie des réparations et perd du prestige."
 tog_expel_saxons_adventurer_cb: "Rendre la terre aux anciens dieux"
 tog_expel_saxons_adventurer_cb_desc: "Reprendre un comté de Grande-Bretagne ou d'Irlande aux chrétiens, et s'y installer."
 tog_expel_saxons_adventurer_victory_desc: "L'attaquant prend le comté et devient seigneur."
 trait_tog_voice_of_lug: "La Voix de Lug"
 trait_tog_voice_of_lug_desc: "A refondé le culte des anciens dieux. Au miracle des feux de Beltaine, Lug a parlé par sa bouche. De temps en temps, des fidèles prennent les armes pour le rejoindre."
 tog_lug_host_name: "Fidèles de Lug"
 tog_quest.0910.t: "Les fidèles de Lug"
 tog_quest.0910.desc: "Ils arrivent un matin, deux ou trois cents, avec des faux, des haches et des lances taillées dans le frêne. Ce sont des fils de paysans, des cadets sans terre, quelques vieux soldats. Ils ont entendu parler des feux de Beltaine et de la parole de Lug. Ils s'agenouillent devant toi et jurent sur les Vers de te suivre partout où tu iras."
 tog_quest.0910.a: "« Relevez-vous. Lug a besoin de bras. »"
 tog_test_saxons_cb_decision: "TEST : Obtenir « Rendre la terre aux anciens dieux »"
 tog_test_saxons_cb_decision_desc: "Décision de test, à retirer avant publication : débloque le casus belli « Rendre la terre aux anciens dieux » pour ta dynastie (et te convertit à la foi des anciens si besoin)."
 tog_spear_of_lug_decision: "Forger la lance de Lug"
 tog_spear_of_lug_decision_desc: "Les Tuatha Dé avaient quatre trésors : la pierre de Fál, l'épée de Nuada, le chaudron du Dagda et la lance de Lug, qui ne manquait jamais sa cible. La guerre va commencer. Il faut un signe à ceux qui se battront pour les anciens dieux."
 tog_spear_of_lug_decision_tooltip: "Tu fais forger la lance de Lug."
 tog_spear_of_lug_decision_confirm: "Qu'on allume la forge"
 tog_spear_of_lug_decision_effect_tt: "La #V lance de Lug#! rejoint ton trésor. Il n'en existe qu'une."
 tog_quest.0920.t: "La lance de Lug"
 tog_quest.0920.desc: "Le forgeron a travaillé neuf jours et neuf nuits. À chaque coup de marteau, il invoquait Goibniu, le forgeron des dieux. Quand il te tend la lance, la pointe est encore tiède. On y a gravé le croissant, les deux cercles et le triskèle.\n\nTu la lèves devant tes fidèles. Personne ne dit rien. Ils savent tous ce que cela veut dire : la guerre va commencer."
 tog_quest.0920.a: "« Jusqu'à la mer. »"
 tog_spear_of_lug_name: "Lance de Lug"
 tog_spear_of_lug_description: "Forgée par un fidèle qui invoquait Goibniu, gravée du croissant, des deux cercles et du triskèle. Comme celle des Tuatha Dé, on dit qu'elle ne manque jamais sa cible."
 tog_spear_of_lug_modifier: "Lance de Lug"
 tog_quest.0188.t: "Le garde-manger de [tog_peredur.GetFirstName]"
 tog_quest.0188.desc: "[tog_peredur.GetFirstName] revient au camp à la nuit tombée, courbé sous deux sacs. Il les pose devant toi et commence à déballer, en comptant à voix haute : « Quarante-trois œufs. Deux fromages, un gros, un petit. Un jambon. Onze pommes, dont une piquée. Un sac d'orge. »\n\nTu lui demandes d'où vient tout ça. Il réfléchit. « Trois deniers, une chanson, et j'ai aidé une vieille à retrouver sa chèvre. » Un temps. « C'était peut-être pas sa chèvre. »"
 tog_quest.0188.a: "« Je ne veux pas savoir. »"
 tog_quest.0189.t: "La chasse"
 tog_quest.0189.desc: "Les vivres baissent. [tog_hunter.GetFirstName] disparaît avant l'aube, sans un mot, avec un arc et une lance. Le soir, [tog_hunter.GetFirstName] revient avec un chevreuil sur les épaules et deux saumons à la ceinture. Ce soir, le camp mange à sa faim."
 tog_quest.0189.a: "« Qu'on le fasse rôtir. »"
 tog_test_provisions_decision: "TEST : 500 provisions"
 tog_test_provisions_decision_desc: "Décision de test, à retirer avant publication : ajoute 500 provisions au camp."
 tog_m.talk_closed: "Les moines d'ici ne t'écoutent plus"
 tog_m.pay_closed: "Plus aucun moine d'ici n'acceptera ton argent"
 tog_m.steal_tt: "Le complot #V Dérober le livre#! commence. Tu tenteras le vol quand tu le voudras, avec le bouton « Exécuter »."
 tog_m.steal_scheming: "Un vol est déjà en préparation"
 tog_steal_book: "Dérober le livre"
 tog_steal_book_action: "Dérober"
 tog_steal_book_desc: "Je vais prendre le livre de la bibliothèque dont [SCHEME.GetTargetCharacter.GetShortUIName] a la garde."
 tog_steal_book_desc_general: "Dérober un livre dans la bibliothèque d'un monastère."
 TOG_STEAL_BOOK_SUCCESS_DESC: "Le livre sera à toi, et personne ne saura qui l'a pris."
 tog_steal.success_tt: "Si le complot réussit, le livre est à toi. Sinon, les moines se méfient un peu plus, mais tu pourras retenter."
 tog_quest.0260.t: "Une nuit dans le cloître"
 tog_quest.0260.desc: "Tu connais maintenant le chemin : le mur du jardin, la porte de la cuisine, l'escalier qui grince à la septième marche. Le frère bibliothécaire dort près de ses livres. Les moines se lèveront bientôt pour matines.\n\nC'est peut-être cette nuit."
 tog_quest.0260.d: "Attendre une meilleure nuit."
 tog_quest.0261.t: "Le frère bibliothécaire"
 tog_quest.0261.desc: "Le frère bibliothécaire aime parler, et il aime le vin. Au marché, devant une cruche, il te raconte tout. Il te dit quels livres il garde et lesquels il ne prête à personne. Il te dit aussi que le coffre du fond ferme mal depuis l'hiver dernier."
 tog_quest.0261.a: "« Encore une cruche, mon frère ? »"
 tog_quest.0261.b: "Écouter, sans plus."
 tog_quest.0262.t: "[tog_peredur.GetFirstName] a compté"
 tog_quest.0262.desc: "[tog_peredur.GetFirstName] revient du monastère, où il est allé vendre des œufs. Il étale devant toi un parchemin couvert de traits. « Quatorze moines. Neuf marches jusqu'à la bibliothèque. Trois fenêtres, dont une sans volet. Le portier dort de la deuxième à la quatrième prière. Et il y a quarante-deux livres. »"
 tog_quest.0262.a: "« Tu es un trésor, [tog_peredur.GetFirstName]. »"
 tog_quest.0263.t: "Une ronde de nuit"
 tog_quest.0263.desc: "Tu avais la main sur le coffre quand une lanterne s'est levée au bout du couloir. Tu as filé par une fenêtre, les mains vides. Personne ne t'a reconnu, mais les moines ont doublé la garde."
 tog_quest.0263.a: "« La prochaine fois. »"
 tog_quest.0263.a.tt: "Le complot continue, avec un peu moins de chances. Tu pourras retenter avec le bouton « Exécuter »."
 tog_reach_heric: "Rencontrer Héric"
 tog_reach_heric_action: "Entrer"
 tog_reach_heric_desc: "Je vais convaincre le portier de Saint-Germain de me laisser parler à [SCHEME.GetTargetCharacter.GetShortUIName]."
 tog_reach_heric_desc_general: "Convaincre le portier d'une abbaye de te laisser parler à un moine."
 TOG_REACH_HERIC_SUCCESS_DESC: "Héric sortira te parler."
 tog_heric.success_tt: "Si le complot réussit, Héric accepte de te recevoir. Sinon, le portier se méfie un peu plus, mais tu pourras retenter."
 tog_quest.0320.t: "La porte de Saint-Germain"
 tog_quest.0320.desc: "Saint-Germain d'Auxerre est fermée aux étrangers. Le portier t'écoute à travers le guichet et répète toujours la même chose : les frères ne reçoivent personne. Pourtant, le moine que tu cherches est derrière ces murs. Il s'appelle Héric, et on dit qu'il connaît César mieux que personne.\n\nIl faudra gagner le portier, ou quelqu'un qu'il écoute."
 tog_quest.0320.a: "« Je reviendrai. »"
 tog_quest.0320.a.tt: "Le complot #V Rencontrer Héric#! commence. Tu tenteras ta chance quand tu le voudras, avec le bouton « Exécuter »."
 tog_quest.0325.t: "Au guichet"
 tog_quest.0325.desc: "Le portier te connaît maintenant. Il a accepté tes présents et écouté tes histoires de l'île de Bretagne. Ce soir, il hésite, la main sur le loquet."
 tog_quest.0325.a: "Lui parler encore."
 tog_quest.0325.d: "Revenir un autre jour."
 tog_quest.0326.t: "Le guichet se referme"
 tog_quest.0326.desc: "Le portier allait ouvrir. Puis un pas a sonné dans le cloître, et le guichet s'est refermé d'un coup. Le lendemain, c'est un autre frère qui garde la porte, et il ne sourit pas."
 tog_quest.0326.a: "« Il y aura d'autres soirs. »"
 trait_tog_cloistered: "Cloîtré"
 trait_tog_cloistered_desc: "Ne quitte pas son monastère."
 tog_obj_after: "Les anciens dieux ont de nouveau des prêtres, des fidèles et un miracle. Il reste à reprendre aux chrétiens les terres où on les priait, dans l'île de Bretagne et en Irlande, avec le casus belli #V Rendre la terre aux anciens dieux#!. Ta dynastie peut aussi faire forger la #V lance de Lug#!."
 tog_quest.0511.c.tt: "Les deux versions côte à côte : c'est plus long à écrire, mais personne n'est vexé."
 tog_quest.0521.b.tt: "Il repart avec sa pièce et ne dira rien."
 tog_verses.d_p20: "Vers sacrés : #P +20#!"
 tog_verses.d_p15: "Vers sacrés : #P +15#!"
 tog_verses.d_p10: "Vers sacrés : #P +10#!"
 tog_verses.d_p5: "Vers sacrés : #P +5#!"
 tog_verses.d_0: "Vers sacrés : #V +0#!"
 tog_verses.d_m5: "Vers sacrés : #N -5#!"
 tog_verses.d_m10: "Vers sacrés : #N -10#!"
 tog_offerings_tent_domicile_building: "Tente des offrandes"
 tog_offerings_tent_domicile_building_desc: "Partout où le camp s'arrête, les fidèles des anciens dieux viennent déposer leurs dons : quelques pièces, du grain, un fromage, un agneau. Ils repartent avec une bénédiction.\n\nChaque mois, les fidèles apportent #P 100#! provisions."
 tog_offerings_tent.tt.quest: "Offerte par les fidèles à la fondation du culte des anciens"
 tog_test_gold_decision: "TEST : 50 or"
 tog_test_gold_decision_desc: "Décision de test, à retirer avant publication : ajoute 50 pièces d'or."
 tog_test_reform_decision: "TEST : prérequis de la réforme"
 tog_test_reform_decision_desc: "Décision de test, à retirer avant publication : donne 5000 de piété et tous les comtés des lieux saints de la foi, convertis."
 tog_mabon.tried: "Cette manière a déjà échoué"
 tog_quest.0222.b.good: "L'intendant accepte d'attendre la prochaine récolte : le champ est sauvé."
 tog_quest.0222.b.bad: "L'intendant ne veut rien entendre. Il faudra trouver autre chose."
 tog_quest.0222.d.good: "L'intendant blêmit et déchire lui-même la reconnaissance de dette."
 tog_quest.0222.d.bad: "L'intendant appelle ses hommes et tu dois te retirer. Il faudra trouver autre chose."
 tog_quest.0222.c.good: "La nouvelle reconnaissance passe pour vraie : la dette est réglée."
 tog_quest.0222.c.bad: "L'intendant remarque que l'encre est trop fraîche. Il faudra trouver autre chose."
 tog_quest.0223.a.good: "Aedán dessangle son cheval. Il reste."
 tog_quest.0223.a.bad: "Aedán ne t'écoute pas. Il faudra trouver autre chose avant qu'il parte."
 tog_quest.0223.c.good: "Aedán a trop peur pour monter à cheval. Il ne dira rien."
 tog_quest.0223.c.bad: "Aedán te tient tête. Il faudra trouver autre chose avant qu'il parte."
 tog_offerings_modifier: "Offrandes des fidèles"
 tog_offerings_modifier_desc: "Les fidèles des anciens dieux apportent leurs dons à leur seigneur : quelques pièces, du grain, un agneau, et beaucoup de respect."
 tog_druid_heritage_decision: "Reprendre l'héritage des bosquets"
 tog_druid_heritage_decision_desc: "Les anciens dieux ont des fidèles, mais pas encore d'armée. Pour que ta maison porte leur nom au combat, il faut que les druides et les bardes la reconnaissent comme la gardienne des bosquets. Cela ne s'achète pas avec de l'or."
 tog_druid_heritage_decision_tooltip: "Ta dynastie reprend l'héritage des bosquets."
 tog_druid_heritage_decision_confirm: "Que les bosquets nous reconnaissent"
 tog_druid_heritage_decision_effect_tt: "Ta dynastie obtient le casus belli #V Rendre la terre aux anciens dieux#! : un duché de Grande-Bretagne ou d'Irlande tenu par des chrétiens pour un seigneur, un comté pour un aventurier.\n\nElle peut aussi faire forger la #V lance de Lug#!."
 tog_relic.0001.t: "Le gardien"
 tog_relic.0001.desc.mistletoe: "Au bord du détroit, une vieille femme t'attend devant sa maison comme si elle savait que tu viendrais. Elle te fait entrer et ouvre un coffre. Dedans, sur un manteau blanc, il y a une couronne de gui tressée. Les feuilles devraient être sèches depuis longtemps. Elles sont vertes.\n\n« Ma mère la gardait, dit-elle, et sa mère avant elle. Les Romains ont brûlé les chênes, pas tout le gui. »"
 tog_relic.0001.desc.sickle: "Dans un bois, à une demi-journée de Chartres, un charbonnier te fait signe de le suivre. Il s'arrête devant un vieux chêne et tire de dessous ses racines un paquet de cuir. Dedans, il y a un mince croissant d'or, gravé de chevrons.\n\n« Un colporteur d'Armorique l'a laissé à mon grand-père, dit-il. Il disait que c'était ici qu'on devait le rapporter, chez les Carnutes, là où les druides de toute la Gaule se réunissaient. »"
 tog_relic.0001.desc.carnyx: "Au pied de la colline d'Alise, un paysan te regarde passer avec tes compagnons. Il pose sa pioche et va chercher quelque chose sous un tas de pierres, au bord de son champ : une tête de sanglier en bronze, la gueule ouverte, montée sur un long tube tordu. Une trompe de guerre.\n\n« Ça sort de la terre depuis toujours, dit-il. Mon père disait que c'étaient les trompes des anciens. Tu as l'air de quelqu'un qui saurait quoi en faire. »"
 tog_relic.0001.desc.cauldron: "Sur la colline de Tara, près de la pierre de Fál, un vieil homme garde des moutons. Il t'emmène jusqu'à sa cabane. Dans un coin, sous des peaux, il y a un grand chaudron de bronze noirci, cerclé de fer, assez grand pour y cuire un veau.\n\n« Le chaudron du Dagda, dit-il. Personne n'en repartait jamais sans être rassasié. Ma famille le garde depuis que les rois ne viennent plus ici. »"
 tog_relic.0001.desc.branch: "Sur la grève, loin du monastère, une femme ramasse des algues. Quand elle voit tes compagnons, elle sort de son panier un rameau d'argent auquel pendent trois petites pommes d'argent. Le vent le remue, et il tinte doucement.\n\n« La branche de Manannán, dit-elle. Celui qui l'entend oublie ses peines. Si les moines la trouvaient, ils la fondraient pour en faire un calice. »"
 tog_relic.0001.desc.torc: "Sur le rocher de Peñalba, où l'on lit encore le nom de Lugus gravé dans la pierre, un berger t'attend. Il ouvre la main. Il y a dedans un torque d'or torsadé, terminé par deux têtes de serpent.\n\n« Les anciens le portaient au cou et l'offraient au dieu, dit-il. On l'a trouvé dans une fente du rocher. Personne ici ne sait plus à qui il appartient. »"
 tog_relic.0001.desc.outro: "\n\nLe gardien ne la donnera pas pour rien. Il est vieux, et l'hiver approche."
 tog_relic.0001.a: "Payer ce qu'il demande."
 tog_relic.0001.b: "Marchander."
 tog_relic.0001.b.success: "Le gardien accepte un prix plus bas"
 tog_relic.0001.b.failure: "Le gardien remballe la relique"
 tog_relic.0001.c: "« Garde-la. Elle est à sa place ici. »"
 tog_relic.0001.lost.tt: "La relique retourne dans sa cachette. Peut-être reparaîtra-t-elle lors d'un autre pèlerinage."
 tog_cauldron_name: "Le chaudron du Dagda"
 tog_cauldron_description: "Un grand chaudron de bronze noirci, cerclé de fer, gardé près de la pierre de Fál, à Tara. C'était l'un des quatre trésors des Tuatha Dé : personne n'en repartait sans être rassasié."
 tog_cauldron_modifier: "Chaudron du Dagda"
 tog_silver_branch_name: "La branche d'argent"
 tog_silver_branch_description: "Un rameau d'argent auquel pendent trois pommes d'argent, caché sur l'île d'Iona. On dit qu'il vient du pays de Manannán, sous la mer, et que celui qui l'entend tinter oublie ses peines."
 tog_silver_branch_modifier: "Branche d'argent"
 tog_torc_name: "Le torque de Lugus"
 tog_torc_description: "Un torque d'or torsadé, terminé par deux têtes de serpent, trouvé dans une fente du rocher de Peñalba, où les Celtibères gravaient le nom de Lugus."
 tog_torc_modifier: "Torque de Lugus"
 tog_convert_old_faith_decision: "Renouer avec les anciens dieux"
 tog_convert_old_faith_decision_desc: "Les saints n'ont pas arrêté les Saxons, ni les Norrois. Les bardes, eux, chantent encore les Enfants de Dôn, et les vieilles pierres sont toujours debout dans les landes. Il est temps de rendre à ces dieux ce que tes ancêtres leur devaient."
 tog_convert_old_faith_decision_tooltip: "Tu renies la foi des moines pour les anciens dieux."
 tog_convert_old_faith_decision_confirm: "Que les moines disent ce qu'ils veulent"
 tog_convert_old_faith_decision_effect_tt: "Comme pour toute conversion, ta famille proche et le comté de ta capitale peuvent te suivre, et tes vassaux l'apprennent."
