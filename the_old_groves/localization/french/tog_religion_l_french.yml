 # Lia Fáil (tog_religion.0010)
 tog_religion.0010.t: "La Lia Fáil"
 tog_religion.0010.desc.intro: "Sur la colline de Tara, parmi les tertres des anciens rois, se dresse la Lia Fáil, la pierre du destin. Les druides disent qu'elle crie sous le pied du roi légitime, et que son cri s'entend dans toute l'Irlande.\n\nMaintenant que tu portes la couronne de [scope:tog_lia_fail_title.GetName], tu poses le pied sur la pierre, devant la foule assemblée."
 tog_religion.0010.desc.cries: "\n\nUn long cri monte de la pierre, rauque comme une corne de guerre. La foule tombe à genoux, les druides lèvent les bras vers le ciel. Personne ne pourra plus dire que ta couronne est usurpée."
 tog_religion.0010.desc.silent: "\n\nLe vent souffle sur la colline. La pierre se tait. Les druides baissent les yeux, et dans la foule on commence déjà à murmurer."
 tog_religion.0010.a: "Les dieux ont parlé."
 tog_religion.0010.b: "Une pierre ne fait pas un roi."

