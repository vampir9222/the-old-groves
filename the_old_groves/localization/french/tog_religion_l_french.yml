l_french:
 # Religion
 tog_celtic_religion: "Celtique"
 tog_celtic_religion_adj: "celtique"
 tog_celtic_religion_adherent: "Celte"
 tog_celtic_religion_adherent_plural: "Celtes"
 tog_celtic_religion_desc: "Les anciennes croyances des peuples celtes, d'Irlande en Gaule et jusqu'en Hispanie. Elles ne survivent plus que dans les récits des moines et les pierres dressées, en attendant que quelqu'un les réveille."

 # Faith
 tog_druidism: "Druidisme"
 tog_druidism_adj: "druidique"
 tog_druidism_adherent: "druidiste"
 tog_druidism_adherent_plural: "druidistes"
 tog_druidism_desc: "Une foi neuve qui se réclame des druides. Rebâtie à partir de sagas conservées par des moines, de vestiges mal compris et de ce que ses fidèles savent du paganisme norrois, elle revendique un passé qu'elle ne restaure pas vraiment."

 # Rites
 tog_gaelic_rite: "Rite gaélique"
 tog_gaelic_rite_adj: "gaélique"
 tog_gaelic_rite_adherent: "gaélique"
 tog_gaelic_rite_adherent_plural: "gaéliques"
 tog_gaelic_rite_desc: "La tradition des Gaëls d'Irlande, de Dál Riata et de Man. Elle honore Lug et les Tuatha Dé, célèbre Samain et Beltaine, et garde la mémoire des ancêtres dans les généalogies des poètes."

 # Custom doctrine
 tog_doctrine_clerical_function_judges_name: "Juges et arbitres"
 tog_doctrine_clerical_function_judges_descriptive_name: "Fonctions judiciaires du clergé"
 tog_doctrine_clerical_function_judges_desc: "Nos [ROOT.Faith.PriestNeuterPlural] tranchent les crimes, les héritages et les querelles de bornage, et s'interposent entre les armées prêtes à s'affronter. Un châtiment prononcé par eux n'est pas l'arbitraire d'un seul homme."

