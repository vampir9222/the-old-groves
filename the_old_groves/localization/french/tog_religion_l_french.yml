 # Other rites
 tog_brythonic_rite: "Rite brythonique"
 tog_brythonic_rite_adj: "brythonique"
 tog_brythonic_rite_adherent: "brythonique"
 tog_brythonic_rite_adherent_plural: "brythoniques"
 tog_brythonic_rite_desc: "La tradition des Bretons insulaires et de leurs cousins d'Armorique : Galles, Cornouailles, Cumbrie et Pictavie. Elle honore Lleu et les Enfants de Dôn, vénère les pierres dressées et les bois sacrés, et ouvre ses druidesses et ses trônes aux femmes comme aux hommes."
 tog_gaulish_rite: "Rite gaulois"
 tog_gaulish_rite_adj: "gaulois"
 tog_gaulish_rite_adherent: "Gaulois"
 tog_gaulish_rite_adherent_plural: "Gaulois"
 tog_gaulish_rite_desc: "La tradition du continent, reconstruite sur les inscriptions et les récits des Grecs et des Romains. Elle honore Lugus et Sucellos, lit les astres comme les druides de César, brûle ses morts et garde les têtes de ses ennemis."
 tog_celtiberian_rite: "Rite celtibère"
 tog_celtiberian_rite_adj: "celtibère"
 tog_celtiberian_rite_adherent: "Celtibère"
 tog_celtiberian_rite_adherent_plural: "Celtibères"
 tog_celtiberian_rite_desc: "La tradition des Celtes d'Hispanie, de la Meseta à la Gallaecia. Elle honore Lugus, scelle l'hospitalité par des pactes gravés dans le bronze et confie ses guerriers tombés aux vautours qui emportent leur âme."

