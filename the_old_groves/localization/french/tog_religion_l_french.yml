 tog_rite_generated_gaelic_desc: "Une branche née parmi les Gaëls, autour d'une lignée de poètes ou d'un sanctuaire des tertres. Elle se réclame de la même tradition que le Druídecht, mais suit ses propres maîtres et sa propre lecture des sagas."
 tog_rite_generated_brythonic_desc: "Une branche née parmi les Bretons insulaires, nourrie des chants des bardes et des récits des Enfants de Dôn et de Llŷr. Elle partage la tradition du Plant Dôn, mais suit ses propres maîtres."
 tog_rite_generated_gaulish_desc: "Une branche née sur le continent, autour d'un dieu dont le nom n'a survécu que sur la pierre des inscriptions. Elle se réclame des druides de César, mais place ce dieu au-dessus des autres."
 tog_rite_generated_common_desc: "Une branche née loin des terres celtes, chez des convertis qui ont reçu la foi des druides de seconde main. Elle mêle les récits des sagas aux coutumes de leur peuple."
